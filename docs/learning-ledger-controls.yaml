  learning: 'when the source does not say whether two steps after A both happen or only one, the honest
    BPMN is an exclusive gateway with unlabelled branches: an exclusive gateway without conditions makes
    no claim about which branch runs'
  evidence: 'T-989 Evergreen K16: a step hands over to two processes and the source does not say both
    or either'
  source: trial
  destination: guide
  status: proposed
