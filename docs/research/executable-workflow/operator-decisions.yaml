questions:

  - id: H1
    question: >
      Do the roadmap's Arcs 4–6 supersede the standing DEFERs (T-279/280/281/282) and
      AEF's T-2669 NO-GO?
    why_operator: >
      Reversing a recorded disposition is a sovereignty act. Until answered, treat those
      arcs as not actionable, whatever they score.
    status: open
    blocks_arc_0_exit: true
    operative_state: >
      The DEFERs and the NO-GO STAND. T-587's recorded GO decided the scope of one narrow
      Arc-0 slice and explicitly declined to reverse them — its rationale names the
      absence directly: "without a superseding decision. Scheduling those would reverse
      recorded dispositions on a document's say-so." Deciding a slice's scope is not the
      same act as answering H1, so T-587 is NOT this question's source_of_truth.
    agent_recommendation: >
      Keep the DEFERs standing. Nothing has changed on the evidence side since they were
      recorded; the roadmap re-proposing the work is a document's say-so, which is the
      exact input T-587 already declined to treat as superseding.

