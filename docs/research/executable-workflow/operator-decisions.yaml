# EWCR — operator decision register (H1–H6)
#
# WHY THIS FILE EXISTS
#
# The Arc-0 exit gate (roadmap-5be23719.md:147) requires that "no unresolved
# source-of-truth ambiguity enters Arc 1". Those ambiguities are H1–H6, and until
# T-596 they existed only as a prose table at reflection-designer.md:201-208 with no
# status column and no reader. The third clause of the Arc-0 exit gate was therefore
# unevaluable by anyone. This file makes it evaluable.
#
# WHAT THIS FILE IS NOT
#
# It is not a place where decisions get made. Recording an operator decision is not
# making one. The agent writes `agent_recommendation`; only the operator's own
# artifacts move a question to `resolved`.
#
# THE SELF-CERTIFICATION RULE (PL-148)
#
# An entry may not assert its own resolution. Every `status: resolved` entry MUST name
# a `source_of_truth` — an external artifact that independently carries the decision.
# tools/_t596-arc0-exit-gate.sh resolves each one and confirms the two agree. A
# resolution with no checkable source is precisely the defect T-593 removed from the
# handoff envelope; the shape must not be reintroduced here.
#
# STATUS VALUES
#   open      — no operator decision recorded. Blocks the Arc-0 exit gate.
#   resolved  — decided, with a source_of_truth that independently carries it.
#
# `operative_state` on an open entry describes what currently holds in the ABSENCE of a
# decision. It is not an answer and does not unblock the gate; it exists so the operator
# can see what is de facto in force while the question stands open.

schema_version: 1
task: T-596
source_table: docs/research/executable-workflow/reflection-designer.md:201-208
