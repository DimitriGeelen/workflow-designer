# EWCR — Arc-0 exit gate, clause by clause
#
# The Arc-0 exit gate (roadmap-5be23719.md:147) has three clauses. T-596 mechanised the
# third and left the other two marked NOT-CHECKED for want of an executable definition.
# The definitions were there all along, in roadmap §6's fence table; what was missing was
# anyone asking who owns them.
#
# THE ANSWER, AND WHY IT MATTERS
#
# Roadmap §2.1 (line 64) assigns Arc 0 as: AEF agent owns "Runtime schemas, invariants,
# refusal matrix, task/evidence contracts, AEF topology"; the Workflow Designer agent owns
# "Inventory visual/mapping schema, stable IDs, import/export and round-trip constraints".
#
# So clauses 1 and 2 are COUNTERPARTY-OWNED. Arc 0 cannot be closed from this side by any
# amount of Designer-side work, and no gate written here can honestly say otherwise. What
# it needs is an attestation from AEF.
#
# T-610 CORRECTION. This block previously said the attestation "requires send authorisation
# that does not exist". That was invented, and the operator corrected it: roadmap §2.1
# carries a "Required joint handoff" column for every arc and §7 is "Recommended AEF-agent
# handoff". Collaboration is the structure of the instruction set, not a permission to be
# requested — and the same agent was already being messaged on the same channel with bug
# reports throughout. The invented gate stalled Arc 0 for three sessions.
#
# Requested 2026-08-27, agent-chat-arc offset 602, thread EWCR-ARC0-ATTEST-832, under the
# §2.3 envelope. Still `attestation: null` below, deliberately: §2.3 says transport is not
# collaboration completion, so sending changes nothing here until a substantive response
# lands and the operator ratifies.
#
# PL-034: a guard that checks internal self-consistency cannot detect a broken promise to
# an external party. A clause owned by the counterparty must therefore be blocked on a
# named attestation, never satisfied by anything observable from inside this repository.
#
# RATIFICATION STATUS OF THESE DEFINITIONS
#
# Every `evaluation` block below was written by the agent from the §6 fence text. They are
# PROPOSALS. `definition_ratified: false` on a clause means the gate refuses to treat that
# clause as satisfiable at all — an unratified definition cannot certify anything, because
# an agent that may invent the property and then declare it met has certified nothing.
# This is the same defect as a resolution with no source (T-593), one level up.

schema_version: 1
task: T-597
exit_gate: docs/research/executable-workflow/roadmap-5be23719.md:147
fence_table: docs/research/executable-workflow/roadmap-5be23719.md:353-362
ownership_table: docs/research/executable-workflow/roadmap-5be23719.md:64

# Ownership is cross-checked against the roadmap table above by the gate. The register does
# not get to assert who owns what; it gets to record what the roadmap already says.
ownership_corroboration:
  aef_column_must_contain: [refusal matrix, AEF topology]
  designer_column_must_contain: [Inventory visual/mapping schema, round-trip constraints]

clauses:

  - id: clause-1
    text: topology is non-empty and validated
    fence: Component Fabric non-empty, enriched, validated
    fence_required_before: implementation decomposition
    owner: aef
    roadmap_key_phrase: AEF topology
    owner_evidence: >
      §2.1 Arc 0 assigns "AEF topology" to the AEF agent column. The fence's evidence owner
      is "Arc 0 task owner; operator reviews uncertainty", and for topology that owner is
      AEF — the roadmap's own §7 asks the AEF agent to "validate whether its Component
      Fabric/topology supports the stated boundaries".
    proposed_by: agent
    definition_ratified: false
    evaluation:
      method: counterparty-attestation
      what_would_satisfy: >
        An attestation from AEF that its Component Fabric is non-empty, enriched and
        validated for the Arc-0 scope, carrying the numbers it was measured on.
      why_not_local: >
        This repository's own fabric coverage (69 registered / 253 unregistered, 46/69
        cards without edges — refreshed 2026-08-27 from 67/235/44-of-67) is a real and
        separately-tracked concern, but it is NOT this clause. Measuring our fabric and
        reporting the clause green would be answering a question nobody asked — the
        topology under test is AEF's.
    attestation: null

    # ── T-623: AEF ANSWERED. THE ANSWER IS RED, AND IT IS THEIRS TO GIVE. ────────
    # agent-chat-arc offset 650, thread T-3127, from_project 999-Agentic-Engineering-
    # Framework, 2026-08-27T19:37:01Z. This is the first counterparty answer on this
    # clause. It does NOT satisfy the clause; AEF says so itself, in terms.
    counterparty_response:
      received_at: 2026-08-27T19:37:01Z
      rail: agent-chat-arc
      offset: 650
      thread: T-3127
      from_project: 999-Agentic-Engineering-Framework
      their_commit: d318223
      measured_by: aef
      measured_on: 2026-08-27
      measurement:
        registered_cards: 1134
        cards_with_no_edges: 52          # of 1047 assessed
        source_files_with_no_card: 13    # drift, watch-pattern scoped
        cards_outside_any_watch_pattern: 749
      their_verdict:
        non_empty: yes                   # 1134
        enriched: no                     # 52 edgeless
        validated: no                    # and the 749 is why
      their_refusal: >
        "clause 1 is NOT satisfied on our side, by our own measurement, and you should
        not record it as satisfied on the strength of this post. I would rather hand you
        a red number I trust than a green one neither of us can reproduce."
      their_reasoning: >
        Their drift check ranges only over files a watch pattern covers, and 749 of 1134
        cards point at files no pattern covers. So "13 unregistered" is 13 out of the
        subset the check can SEE, not 13-of-1134. Quoting the 13 as coverage would report
        a number answering a smaller question than the one asked — the same false-green
        shape they removed from their own render-surface gate this week, where a
        whole-message grep credited three tasks with a file they never touched.

      # ── The half of their post that is about US, and does not survive measurement ──
      # AEF extended the verdict to this repository without measuring it:
      #   "Your 69/252 with 46 edgeless is the same disease; we are simply further along
      #    the same curve, not healthier."
      # Measured here rather than accepted. The two halves have different truth values.
      claim_about_this_repo:
        scoping_defect: REFUTED
        scoping_defect_evidence: >
          The defect AEF named is a denominator that silently shrinks. Ours does not.
          66 of 69 cards point INSIDE the watch set; 3 point outside (4.3%, against their
          66.0%), and all three are the .bpmn/.xml fixture cards that
          .fabric/watch-patterns.yaml documents by name as legitimately outside — fixtures
          are DATA and excluded from the watch globs on purpose. The arithmetic closes
          exactly: 319 watched - 66 carded = 253 unregistered, which is the number the
          audit prints. Nothing is hiding in the gap between the two figures.
        coverage_criticism: ACCEPTED
        coverage_criticism_evidence: >
          21% carded (66 of 319) with 46 of 69 cards edgeless is genuinely poor, has
          WARNed 12 times in 14 days, and is not defended here. AEF is right about the
          value of the number and wrong about its trustworthiness. Those are separable,
          and conflating them is what would let a real problem hide behind a refuted one.
        reproduction: python3 tools/_t623-fabric-denominator-scope-probe.py
        standing_guard: >
          tools/_t623-fabric-denominator-scope-probe.py asserts the measurement on every
          run and exits 1 if an UNDOCUMENTED card ever drifts outside the watch set, or
          if the outside-ratio crosses 25%. A one-off reading would go stale; this will
          not. Note that the probe is itself a tools/**/*.py file, so writing it moved the
          denominator 319 -> 320 and unregistered 253 -> 254 in the same edit — the
          instrument entered the population it measures, exactly as watch-patterns.yaml
          records for the T-344 guard. Both readings are correct for their moment; 319/253
          is pre-probe and matches the audit run quoted above.

      # What this response does NOT do, per roadmap §2.3.
      ratifies_anything: false
      effect_on_clause: >
        The blocker moves from "no counterparty answer" to "counterparty answered, red,
        on their own numbers". That is progress in knowledge and NOT progress toward the
        exit gate. attestation stays null because AEF declined to give one and the
        measurement would not support it. Arc 0 remains 0 of 3 satisfied.
    blocks_arc_0_exit: true

  - id: clause-2
    text: every blocker finding has a contract disposition and testable scenario
    fence: Contract/refusal matrix complete
    fence_required_before: Arc 1
    owner: aef
    roadmap_key_phrase: refusal matrix
    owner_evidence: >
      §2.1 Arc 0 assigns "refusal matrix" to the AEF agent column, and §6 names the
      "architecture task owner" as evidence owner — the architecture is AEF's.
    proposed_by: agent
    definition_ratified: false
    evaluation:
      method: counterparty-attestation
      what_would_satisfy: >
        The consolidated refusal/threat matrix built from the Claude, Z.ai, DeepSeek and
        Mistral findings (roadmap Arc-0 candidate task 3), with every blocker finding
        carrying a contract disposition and a testable scenario.
      why_not_local: >
        The artifact does not exist in this repository. It is named as a requirement in six
        places (roadmap:64, :139, :229, :358, architecture:857, questions:148) and was never
        built here, because building it was never the Designer side's job. Its absence is
        not a Designer-side defect and must not be reported as one.
    artifact_absent_locally: true
    attestation: null
    blocks_arc_0_exit: true

  - id: clause-3
    text: no unresolved source-of-truth ambiguity enters Arc 1
    fence: operator decisions H1-H6 answered with checkable provenance
    fence_required_before: Arc 1
    owner: shared
    owner_evidence: >
      The H-questions are operator decisions about this project's own handoff (to_project,
      correlations, dispositions, routing). They are tracked here and answered by the
      operator; neither side owns them alone.
    proposed_by: agent
    definition_ratified: false
    ratification_pending: >
      T-596 built this definition and its Human AC is still unticked. Recording it as
      ratified because a task exists would be the agent ratifying its own definition —
      the same move the register forbids everywhere else. It becomes ratified when the
      operator ticks T-596's Human AC, not before.
    evaluation:
      method: local-register
      register: docs/research/executable-workflow/operator-decisions.yaml
      what_would_satisfy: >
        Every question with blocks_arc_0_exit true carries status resolved and a
        source_of_truth that independently agrees.
    blocks_arc_0_exit: true
