# ── What we ask for ─────────────────────────────────────────────────────────────
# Each item is a decision AEF owns. None asks the Designer to decide anything.
request:
  - id: R1
    ask: >
      Decide the FORM of the runtime-contract extension — explicit BPMN extension vs
      referenced companion manifest — and give it a version identifier.
    we_supply: this inventory, plus the constraint that Mapping Standard Part I is unmoved
    we_need_back: a decision with a version identifier
    acceptance_evidence: a named `runtime-contract v0.x` with a compatibility statement against mapping v1.1
    source: architecture-c9070637.md §6.1, §14.1
  - id: R2
    ask: >
      Ratify Part II — the absent-value default for `tier`, and AC-seeding. Open on
      termlink thread T-175 since 2026-07-11.
    we_supply: the standard's Part II text verbatim
    we_need_back: a ruling
    acceptance_evidence: Part II graduates to Part I, or is explicitly re-deferred WITH A DATE
  - id: R3
    ask: >
      Rule, RULE BY RULE, whether the runtime contract adopts or overrides our
      defaults/inference/derivation — `horizon` -> `now`; `workflowType` inferred from
      BPMN type; `owner` derived from lane authority with no node override; O-1
      lane-wins-warn-not-refuse; O-3 inception go/no-go is a compile-time MUST.
    we_supply: designer-contract-inventory.md §3, the full table with citations
    we_need_back: accept or override, per rule
    acceptance_evidence: >
      IW-7 resolved. Without it, Arc 1's "render the canonical fixture without inventing
      semantics" gate is unpassable, because a renderer that supplies a default is
      inventing semantics unless the runtime contract declares the same default normatively.
  - id: R3a
    ask: >
      Rule on defect D-1. `workflowType`'s allowed-values column is the closed set
      build|test|refactor|decommission|specification|design|inception, and the SAME ROW's
      absent-value column infers `human-facing` for a userTask — which is not a member.
      A userTask with no explicit workflowType therefore has no conformant compiled value.
      Add a set member for a human decision gate, change the inference, or declare the
      pair legal.
    we_supply: the fixture with workflowType deliberately absent on both gates, and the reason in each node's aef:meta note
    we_need_back: one of the three rulings
    acceptance_evidence: >
      A Part I version bump plus a conformance-test update, authored on our side under a
      separate task once the ruling exists. T-590 does not move Part I.
  - id: R4
    ask: >
      Supply the diagnostic schema — stable codes, affected element IDs, failed predicate,
      severity, lawful remediation.
    we_supply: our current rule vocabulary and its parity gaps (T-317, T-320, T-321, T-325)
    we_need_back: the schema
    acceptance_evidence: T-309 (surface validator findings in the editor) becomes buildable
    source: architecture-c9070637.md §5.1 shared contract 3
  - id: R5
    ask: >
      READ BACK the pilot fixture by sha256 and return a substantive
      accepted / refused / needs-decision on correlation `ewcr-v1-designer-fixture`.
    we_supply: sha256 b6a9afd7eb03abeaba43513f45176dd439838887b588901f5a2aa2a83da1685b
    we_need_back: the exact hash echoed, plus a substantive verdict
    acceptance_evidence: Arc 1's joint gate. Delivery is NOT acceptance.
  - id: R5b
    ask: >
      Decide the fixture-pair contract for the AEF-side REVERSE RENDERER, or state
      explicitly that it is out of joint scope.
    we_supply: >
      tools/_t515-external-uid-conformance.mjs names this as the sole remaining uncovered
      gap. We can state exactly what is IN a document and have no way to know what AEF
      SHOULD produce from it — "correct" there means the records they would have produced
      from a natively-authored workflow, which is a fact about their data model.
    we_need_back: a fixture-pair contract, or an out-of-scope statement
    acceptance_evidence: the gap closes, or it is recorded as closed-by-agreement
    source: proposed at rail 11911; open by agreement, not by neglect
  - id: R6
    ask: Supply the DeepSeek and Mistral review dispositions.
    we_supply: nothing
    we_need_back: the two missing disposition tables
    acceptance_evidence: >
      Arc 0's exit gate ("every blocker finding has a contract disposition") becomes
      satisfiable. The pinned dossier carries tables for Claude (§17) and Z.ai (§18) only,
      while roadmap §4 Arc 0 task 3 and §8 require all four.
  - id: R7
    ask: Reconcile the dossier with AEF's already-ratified SD-1 (T-2663).
    we_supply: the disposition record we hold (DISPOSITION-2026-07-28.md addendum)
    we_need_back: their ruling
    acceptance_evidence: >
      No unresolved source-of-truth conflict. SD-1 ratified "corpus + conformance rails +
      overlay ARE the AEF Process layer; code is the enforced machine, maps conform"; the
      dossier proposes a ratified PROCEDURE driving a runner. These may be compatible
      (layer identity vs execution machinery), but the pinned dossier never cites or
      reconciles T-2663. Escalate rather than average — the AEF agent owns this.

