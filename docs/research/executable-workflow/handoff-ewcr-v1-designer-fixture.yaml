# ── How a reply is judged complete ──────────────────────────────────────────────
acceptance_schema:
  completion_rule: >
    Delivery is not completion. This exchange completes only on receiver READ-BACK of the
    exact artifact version and hash, plus a substantive accepted / refused / needs-decision,
    returned on correlation `ewcr-v1-designer-fixture`.
  required_fields:
    - correlation            # MUST equal ewcr-v1-designer-fixture
    - envelope_id            # MUST equal ewcr-v1-designer-fixture-r1
    - fixture_sha256_readback # MUST equal b6a9afd7eb03abeaba43513f45176dd439838887b588901f5a2aa2a83da1685b
    - source_sha256_readback  # both source hashes, echoed
    - verdict                # one of: accepted | refused | needs-decision
    - per_request_response   # one entry per id in `request:` — R1 R2 R3 R3a R4 R5 R5b R6 R7
    - responder_project
    - responder_task
    - responder_human_owner
  verdict_vocabulary:
    accepted: the artifact is admitted as Arc 0/Arc 1 contract evidence at this exact hash
    refused: admitted-and-rejected, WITH the failed predicate and the affected element IDs
    needs-decision: a named human decision is required first — say which, and who owns it
  mismatch_rule: >
    If the echoed fixture hash or either source hash does not match, this is VERSION
    MISMATCH: stop, do not reconcile by re-sending, require a new manifest revision.
    (reflection-designer.md §8, stop condition 1.)
  not_acceptance:
    - hub delivery receipt
    - file_send / inject confirmation
    - a TermLink acknowledgement
    - any reply that does not echo the hash
    - any reply on a different correlation

