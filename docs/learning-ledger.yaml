- id: L17
  learning: 'loop.sh appends the prompt as the last argument of KIT_*_CMD; with claude -p, whose --allowedTools
    is variadic (<tools...>), a command ending in that option takes the prompt as one more tool name and
    the agent starts with no prompt (Evergreen K9: COULD NOT MEASURE until the option was moved)'
  evidence: 'T-989 Evergreen offset 22 (calibration of kit 0.15.1, reviewer Claude Sonnet via claude -p)
    K9: run 1 COULD NOT MEASURE until --allowedTools was moved before a single-value flag'
  source: trial
  destination: tooling
  status: promoted
  occurrences: 1
  evidence_cmd: bash tools/_t1006-lesson-evidence.sh L17
  proposed_change: 'loop.sh header (KIT_*_CMD): the prompt is appended as the command''s LAST argument,
    so the command must end where your CLI parses one more argument as the prompt. Known case: claude''s
    --allowedTools is variadic and swallows it; put it before a fully supplied non-variadic option. Check
    your own CLI''s parser for options that take several values or await one.'
  verdicts:
  - reviewer: codex
    vendor: openai
    verdict: refine
    reason: A trailing variadic option can consume the appended prompt, but the evidence shows argument
      placement and help syntax, not actual prompt consumption. Requiring a single-value flag afterward
      is unnecessarily restrictive and should specify that its value must also be supplied.
    evidence_rc: 0
    at: '2026-10-02T22:22:09Z'
    refinement: 'loop.sh appends the prompt as the final argument of KIT_*_CMD. Configure the command
      so that argument is parsed as the prompt: avoid trailing variadic options or options awaiting a
      value. For claude --allowedTools, place a fully supplied option afterward, or use an end-of-options
      separator (--) if the CLI supports it.'
  - reviewer: glm-5.3
    vendor: zai
    verdict: agree
    reason: Claude CLI's --allowedTools is a commander-style variadic option (<tools...>) that consumes
      all following arguments until the next flag, so a prompt appended after it is swallowed as another
      tool value, exactly matching the T-989 failure and the evidence output; the proposed header wording
      correctly states that KIT_*_CMD must end where one more appended argument is read as the positional
      prompt, with variadic options followed by another flag.
    evidence_rc: 0
    at: '2026-10-02T22:22:24Z'
  - reviewer: codex
    vendor: openai
    verdict: refine
    revision: 1
    reason: A trailing variadic option can consume the appended prompt, but an option awaiting a value
      may instead reject it or cause a parse error; starting with no prompt is not guaranteed. A following
