# Learning ledger (T-984, T-982 GO slice B2).
#
# Every correction and disagreement the mapping loop produces, from the review loop, a reviewer,
# a human edit, or a partner trial, lands here with a destination. A single observation only
# PROPOSES. It becomes `confirmed` only when its evidence_cmd re-runs green AND reviewers from at
# least two vendors other than the author's agree (T-1006); a disagree escalates. The operator is not
# asked whether a lesson is true, only for value/priority rulings (`rule`). Only a confirmed learning is
# `promoted` into the guide, the rubric, the validator, or a report to the source's owner.
# `tools/learning-ledger.py check` refuses a promotion whose file does not contain its marker.
#
# status:      proposed -> confirmed -> promoted      (or escalated / rejected, with a reason)
# source:      loop | reviewer | human | trial
# destination: guide | rubric | validator | source-owner | tooling (the kit's own scripts)
# promoted:    {where: <repo file>, marker: <text that must appear in it>}
#              or {where: "sidecar:<client_msg_id>"} for a report to another project
# legacy_until: entries up to this id were confirmed by operator assent before T-1006 and stay valid.

