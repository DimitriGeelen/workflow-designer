# policy/value-drivers.yaml
#
# Business Value Point (BVP) drivers for AEF task & arc prioritisation.
#
# Two layers:
#   - protected drivers (D1-D4) == the Constitutional Directives. Fixed meaning,
#     mutable weight, NEVER removable. They are the chassis.
#   - free drivers          == temporary, focus-setting axes. Add/drop deliberately.
#     They are the steering wheel: you add one BECAUSE it is the focus this period,
#     and retire it once the focus passes. Cap of 5 free (9 total); add-one-drop-one
#     when full. The cap is a forcing function for focus, not a budget to ration.
#
# Distinction that earns a free driver its slot:
#   Re-WEIGHTING a directive changes how LOUD a fixed meaning is.
#   ADDING a free driver introduces a NEW meaning the directives don't carry.
#   A free driver is only justified when the current focus is an axis D1-D4
#   do not *mean* -- not merely an axis you want louder.
#
# Source of truth for BVP scoring. Read by:
#   - lib/bvp.sh                   (T-1919 read-only, T-1920 mutating)
#   - lib/bvp.sh auto-promote      (T-1931 logic, T-1932 enabling)
#   - lib/arc.sh approve-driver    (T-1926 arc-scoped drivers)
#   - web/blueprints/bvp.py        (T-1928/T-1929)
#   - web/blueprints/arcs.py       (T-1930)
#
# Filing history:
#   v1 filed:    T-1917 (BVP T-NEW-2), 2026-05-15
#   v3 inception: T-2157 (proposal review, Decision: GO 2026-06-01T09:51:22Z)
#   v3 evidence: T-2165 (consumer-code blast radius walk; Recommendation flipped
#                DEFER -> GO with refinements; see docs/reports/T-2157-...md)
#   v3 build:    T-2166 (this schema rename; zero consumer-code changes needed
#                per T-2165 walk -- all readers forward-compatible via dict.get()
#                and list-membership semantics)
#
# Auto-promote
# ============
#   When enabled, tasks with bvp_norm >= bvp_norm_min AND cost <= cost_max are
#   promoted captured -> started-work without per-event human approval. The
#   sovereignty boundary is the enabling itself (D8): flipping auto_promote
#   .enabled to true is §ACD-gated (T-1932). Default ships OFF.

version: 3

# ---------------------------------------------------------------------------
# PROTECTED DRIVERS  (D1-D4) -- the Constitutional Directives. Not removable.
# Protection lives in two surfaces: (1) the `protected_drivers:` section name
# (web/blueprints/bvp.py reads list-membership to extract weights/names);
# (2) lib/bvp.sh:837 refuses removal of any id matching ^D pattern.
# The per-entry `protected: true` boolean was removed in v3 (no reader consumed
# it as a field value -- confirmed by T-2165 consumer-code walk).
# Rubric for D1-D4 lives in policy/bvp-scoring-rubric.md (T-1921) -- canonical.
# ---------------------------------------------------------------------------
protected_drivers:
  - id: D1
    name: Antifragility
    weight: 9
    note: >
      Gets stronger from stress/failure. The healing loop is its mechanical
      expression. Failure-driven by nature -- it cannot reward positive
      accumulation (that gap is what the Recall Leverage free driver covers).

  - id: D2
    name: Reliability
    weight: 7
    note: >
      Fewer repeated mistakes, fewer relitigated decisions. Session continuity
      and episodic memory are reliability-through-not-forgetting.

  - id: D3
    name: Usability
    weight: 5
    note: Human-in-the-loop ergonomics; not having to repeat yourself.

  - id: D4
    name: Portability
    weight: 3
    note: >
      File-based, source-controlled memory & policy. Any free driver must
      preserve this -- learning that lives somewhere non-committed violates D4.

# ---------------------------------------------------------------------------
# FREE DRIVERS  -- focus-setting. Cap 5. Weight range 0-9.
# Each entry SHOULD carry a `rationale` (why this is the focus now) and a
# `retire_when` (the condition that ends its relevance). retire_when is a
# free-text reminder, NOT auto-enforced -- it stops a driver quietly outliving
# its focus and skewing rankings toward work that is already done.
#
# v3 activates two: F-RECALL (positive-accumulation gap left by D1's failure-
# driven loop) and F-ORCH (routable-surface expansion the orchestrator
# substrate T-1643 makes possible). F-AUTONOMY ACTIVATED 2026-06-13 alongside
# arc-012 continuous-run landing — see §CANDIDATE block below for the activation
# trail and retirement gate (now: L5/L6 autonomy criteria green, not arc landing).
# ---------------------------------------------------------------------------
free_drivers:

  - id: F-RECALL
    name: Recall Leverage
    weight: 6                       # below D2(7); near-top but must not rival D1
    rationale: >
      D1 is failure-driven and structurally cannot reward POSITIVE accumulation
      -- work that builds durable, retrievable knowledge so future sessions stop
      rediscovering what already worked. This is the dominant remaining axis for
      the L3 -> L4 maturity jump (preference index, positive-signal capture,
      CLAUDE.md auto-sync, durable reflection log are all absent today).
    polarity: positive
    rubric:
      0: No durable artifact; knowledge dies with the session.
      1: Captures something but session-scoped only (episodic, not promoted).
      2: Captured + lightly promoted, but not retrievable by future sessions.
      3: Writes a reusable artifact future sessions can find via `fw recall`.
      4: Closes a loop -- capture -> encode -> synced into instruction files 
        agents read.
      5: Improves the retrieval/synthesis layer itself (selective recall, 
        condensation), so EVERY future task benefits, not just ones touching the
        same area.
    guardrails: >
      Reward better RETRIEVAL & SYNTHESIS, not raw capture. Naive accumulation
      competes for the 90% context budget and trades against D2/D3.
    retire_when: >
      L4 Reflect criteria (positive reinforcement capture, preference index,
      CLAUDE.md auto-sync, durable reflection log) are green.

  # -------------------------------------------------------------------------
  # RETIRED 2026-07-07 (T-2511) -- retire_when condition MET: orchestrator
  # substrate (T-1643) landed in production. T-1643 is in .tasks/completed/;
  # the orchestrator is live (fw resolver run/pick dispatches real workers,
  # litellm :4000 + systemd -- T-2484). Orchestration Leverage is now baseline
  # capability, no longer a differentiating scoring axis vs D1-D4.
  # Retirement authorized by operator (re-issued "remediate audit warns", Tier-2).
  # REVERSIBLE: to reactivate, uncomment the block below and re-add under
  # free_drivers: with a weight. Definition preserved verbatim.
  #
  # - id: F-ORCH
  #   name: Orchestration Leverage
  #   weight: 5                       # strategic/forward bet; sits below Recall by design
  #   rationale: >
  #     Rewards expanding the surface that can be routed to a NON-primary executor
  #     -- how much a piece of work raises the framework's capacity to dispatch,
  #     fan out, and run unattended rather than serially through the primary agent.
  #     Maps onto the Initiative axis (L4->L5->L6) and the in-flight orchestrator
  #     substrate (T-1643). No other driver scores work by how much it raises that
  #     ceiling.
  #   polarity: positive
  #   rubric:
  #     0: Inherently primary-agent-only and serial; no routable surface added.
  #     1: Runs only via hand-wired dispatch; no reusable routing artifact.
  #     2: Minor routing improvement, single-use.
  #     3: Adds a clean typed I/O contract or decision gate so the framework can
  #       refuse-or-dispatch the step mechanically.
  #     4: Converts interpretive primary work into rubric-scored work a TermLink
  #       worker can run, OR adds an explicit router decision tree (closes the
  #       open router-skills gap).
  #     5: Expands the orchestration substrate itself -- new worker class,
  #       parallel/multi-perspective dispatch, or advances the orchestrator.
  #   guardrails: >
  #     Score CAPABILITY UPLIFT (does this expand what the framework can orchestrate?),
  #     NOT ease-of-delegating-this-task (that is a cost-side property -- keep it off
  #     the value side or you double-count). Anchor on genuine routable-surface
  #     expansion to avoid manufactured I/O-block busywork.
  #   retire_when: >
  #     Multi-agent orchestration criterion goes green / orchestrator substrate
  #     (T-1643) lands in production.

  # -------------------------------------------------------------------------
  # CANDIDATE (INACTIVE) -- not consuming a slot. Documented so the carve is
  # recorded. Flip to active by moving under free_drivers: and assigning weight.
  #
  # Autonomy is carved as HUMAN-GATE REDUCTION (distinct from Orchestration's
  # executor-surface expansion): the count of human checkpoints work must pass.
  # You can orchestrate a whole fleet that still reports to a human at every
  # decision (high orchestration, zero autonomy), or run one agent end-to-end
  # with no gates (low orchestration, high autonomy). Different axes.
  #
  # It is in DIRECT TENSION with Sovereignty (F7) -- which is why agent-gates,
  # Tier 0 blocks, and `auto_promote.enabled: false` exist on purpose. The rubric
  # rewards EARNING autonomy, never removing oversight.
  #
  # NOTE: F-AUTONOMY ACTIVATED 2026-06-13 — continuous-run arc (arc-012) landed
  # GO via T-2158. Carved gate text named this arc by name; arc creation IS the
  # activation trigger. T-2362 ships this uncarve in the same commit per the
  # T-2158 §S4 finding (build slice S0).
  #
  # Retirement gate stays: retire when L5/L6 autonomy criteria (auto-issue gen,
  # auto-merge, closed production-feedback loop) are green.
  # -------------------------------------------------------------------------
  - id: F2
    name: V_COMPONENT_FABRIC
    weight: 6
    protected: false
    rationale: 'Discriminates topology-layer work (Component Fabric: dependency mapping,
      blast-radius, drift detection) from work elsewhere. Load-bearing for BVP cost
      composite and audit. Source: docs/reports/T-2305-bvp-drivers-batch-2026-06-10.md'
    polarity: positive
    rubric:
      0: No fabric/topology touched.
      1: Registers one component card without edges.
      2: Registers component with `depends_on` / `depended_by` populated but no 
        blast-radius hook or audit detector.
      3: Adds fabric drift detection or enrichment for a subsystem.
      4: Closes a fabric loop -- auto-enrichment cron, drift FAIL gate, 
        post-commit blast-radius surface, audit detector wired to fabric.
      5: Extends the fabric substrate itself -- new edge type, new drift class, 
        cross-fabric correlation, fabric-fed audit dimension.
    guardrails: >
      Score TOPOLOGY UPLIFT, not "I touched a file". A card without edges is
      L1; the value is in the edges, retrieval surface, and audit signal.
    retire_when: >
      Fabric substrate (edges, drift, blast-radius, audit integration) is
      pervasive across the codebase and incremental registration no longer
      surfaces meaningful signal.
  - id: F4
    name: V_WORKFLOW_ROUTING
    weight: 9
    protected: false
    rationale: 'operator directive 2026-08-16: anything improving workflow routing
      / clean workflows'
    # ── scorer added T-864, operator-directed 2026-09-26 ──────────────────────
    # Filed 2026-08-16 with weight 9 and a rationale only: no rubric, no scorer.
    # The estimator therefore emitted `unscored ... not counted` and T-3427 drops
    # it from the denominator, so this axis has contributed NOTHING to any ranking
    # since it was created while reading as a live 9-weight driver.
    #
    # SIGNAL DESIGN NOTE. The obvious keyword — "workflow" — is useless here: the
    # repository is a workflow designer and every task body and frontmatter
    # (`workflow_type:`) contains it, so an L1 on that word scores the entire
    # corpus and inflates a 9-weight axis to noise. Signals below discriminate on
    # ROUTING vocabulary (how a token moves between nodes, lanes, participants)
    # and on the corpus that holds it.
    polarity: positive
    rubric:
      0: No routing or workflow-shape concern touched.
      1: Mentions routing structure (lane, pool, gateway, sequence flow) incidentally.
      2: Changes how one workflow routes or renders, single map or single rule.
      3: Fixes or adds a routing RULE that applies corpus-wide -- validator check,
        layout rule, lane/pool resolution.
      4: Closes a routing loop -- unroutable input is detected and refused rather
        than silently reassigned, or clean-layout is enforced rather than nudged.
      5: Extends the routing substrate itself -- new node/edge semantics, a new
        routing dimension, or cross-workflow dependency routing.
    guardrails: >
      Score ROUTING UPLIFT, not "this file happens to be a workflow". Editing a
      map's content is L0-L1; the value is in rules that hold across the corpus.
    scoring:
      kind: signals
      strip_template: true
      levels:
        1:
          keywords: ["lane", "pool", "gateway", "sequence flow", "flownoderef"]
        2:
          keywords: ["cleanlayout", "clean layout", "mapmessiness", "routing",
                     "lane band", "swimlane"]
          paths: ["examples/aef-processes/*.workflow.yaml",
                  "examples/app-processes/*"]
        3:
          keywords: ["workflow validator", "validator rule", "layout rule",
                     "lane resolution", "pool resolution", "dialect-relative"]
        4:
          keywords: ["silently reassigns", "unresolvable flownoderef",
                     "refuses to route", "routing gate"]
        5:
          keywords: ["workflow fabric", "process-dependency graph",
                     "new node type", "callactivity", "routing substrate"]
  - id: F3
    name: V_AEF_INTEGRATION
    weight: 9
    protected: false
    rationale: 'operator directive 2026-08-16: anything improving integration into
      AEF'
    # ── scorer added T-864, operator-directed 2026-09-26 ──────────────────────
    # SIGNAL DESIGN NOTE. "integration INTO AEF" is the SEAM between this project
    # and 999-AEF -- the wire, the shared standard, the rendered corpus AEF pins
    # against. It is NOT maintenance of the vendored .agentic-framework/ tree:
    # fixing handover.sh is framework upkeep and already scores on D1/D2, and
    # letting it score here too would double-count the remediation work that
    # already dominates the queue. So `.agentic-framework/*` is deliberately NOT
    # a signal, despite being the most obvious path match.
    polarity: positive
    rubric:
      0: No AEF seam touched.
      1: References AEF or the counterparty without changing the seam.
      2: Consumes something across the seam (reads a standard, a rendered artifact).
      3: Changes a seam artifact both sides depend on -- rendered corpus, mapping
        standard conformance, a posted contract.
      4: Closes a seam loop -- round-trip proven, or a divergence between the two
        sides is detected mechanically rather than by inspection.
      5: Extends the seam itself -- new shared contract, new transport, or a
        conformance dimension neither side previously had.
    guardrails: >
      Score SEAM UPLIFT. Maintaining the vendored framework in-tree is D1/D2 work,
      not integration; scoring it here double-counts remediation against product.
    scoring:
      kind: signals
      strip_template: true
      levels:
        1:
          keywords: ["999-aef", "aef agent", "counterparty", "framework agent"]
        2:
          keywords: ["termlink", "aef-bpmn", "forward-compile", "mapping standard"]
          paths: ["docs/standards/aef-*.md"]
        3:
          keywords: ["rendered corpus", "seam artifact", "producer contract",
                     "conformance key", "arc-0 exit"]
          paths: ["examples/aef-processes/rendered/*", "examples/aef-processes/*"]
        4:
          keywords: ["round-trip", "reverse discovery", "divergence detect",
                     "upstream drift", "seam divergence"]
        5:
          keywords: ["new shared contract", "seam substrate", "new transport",
                     "conformance dimension"]
  - id: F1
    name: V_SDLC_ENABLEMENT
    weight: 9
    protected: false
    rationale: 'operator directive 2026-08-16: anything enhancing workflow capability
      to support a software development process built on the workflows'
    # ── scorer added T-864, operator-directed 2026-09-26 ──────────────────────
    # SIGNAL DESIGN NOTE. This is the yardstick driver: "iterate from the workflow
    # to actual working applications". It scores the DESIGNER and the path from a
    # drawn workflow to something that runs -- authoring surface, compilation,
    # execution. Deliberately NOT keyed on "workflow" or "task" (universal in this
    # corpus) nor on `.tasks/*` (every task touches those, which would make the
    # highest-weighted driver a constant and therefore invisible in the ranking).
    polarity: positive
    rubric:
      0: Nothing touching the authoring-to-running path.
      1: Mentions the designer or BPMN authoring incidentally.
      2: Improves the authoring surface -- editor behaviour, import/export,
        validation feedback a human author sees.
      3: Adds or repairs a capability an SDLC step depends on -- compile, promote,
        create, or a producer/consumer contract between them.
      4: Closes a loop from workflow to running software -- a drawn workflow
        reaches an executable or deployed artifact, or a break in that chain is
        detected mechanically.
      5: Extends the enablement substrate -- a new stage in the workflow-to-app
        chain, or collaboration/tenancy that lets more than one author drive it.
    guardrails: >
      Score PATH-TO-RUNNING-SOFTWARE. Framework governance work is D1/D2/F-RECALL;
      scoring it here would make the yardstick driver reward everything equally.
    scoring:
      kind: signals
      strip_template: true
      levels:
        1:
          keywords: ["designer", "bpmn", "authoring surface", "workflow designer"]
        2:
          keywords: ["import", "export", "editor", "canvas", "palette",
                     "validation feedback", "ghost card"]
          paths: ["src/aef-workflow-designer.html", "src/*"]
        3:
          keywords: ["compile", "promote", "producer contract", "codegen",
                     "forward compile", "executable workflow"]
          paths: ["examples/app-processes/*"]
        4:
          keywords: ["workflow to application", "running application",
                     "deployed artifact", "end-to-end chain"]
        5:
          keywords: ["hosting and tenancy", "collaboration and concurrency",
                     "multi-tenant", "new sdlc stage"]
auto_promote:
  enabled: false
  bvp_norm_min: 0.85    # only top-band value
  cost_max: 1           # only lowest-cost band
  max_concurrent: 1     # at most one auto-promoted item in flight

# ---------------------------------------------------------------------------
# Inception scoring exception (T-2189 / T-2186 slice 3)
# ---------------------------------------------------------------------------
# Inceptions break the standard scoring model in two specific ways. They are
# evaluated by the VALUE OF INFORMATION their resolution provides, NOT by
# the build-shaped traits the D-handlers measure. The exception is mechanical,
# not semantic — D1-D4 still apply ONCE the inception ships build slices;
# this only changes how the ESTIMATOR ranks `workflow_type: inception` tasks.
#
# Source of truth for the lifecycle and the human-facing semantics:
# 050-Inceptions.md §Scoring Exception.
#
# Cost-side substitution (target_blast_radius)
# --------------------------------------------
# F8 = 0.6 × blast_radius + 0.3 × tier + 0.1 × effort
# An inception's `components:` is empty by definition — the build doesn't
# exist yet. blast_radius → 0 makes the inception look artificially cheap.
# The estimator (`score_blast_radius()`) substitutes the inception's
# `target_blast_radius` (T-2188 schema, int 0..9) — the anticipated
# component count of the build work the inception authorises on GO.
# Missing/malformed → falls back to the components-count path (returns 0).
#
# Value-side substitution (voi_score → all drivers)
# -------------------------------------------------
# Inceptions' value is captured by a single field, `voi_score` (T-2188
# schema, float 0..1). The estimator (`_score_inception_voi()`) maps this
# to the 0..5 BVP scale (round(voi × 5)) and returns the SAME score for
# every requested driver — D1-D4 and free drivers alike. Rank between
# inceptions is therefore determined by voi alone; rank between an
# inception and a build is determined by the cost-substitution above
# plus the voi-derived value contribution.
#
# Build-task scoring is unchanged. The exception is gated by
# `workflow_type == "inception"` and never fires for any other type.
#
# Grandfathering
# --------------
# Inceptions filed before T-2188 (no `voi_score` field) return a neutral
# mid-score (2) with evidence string `→2 (voi-absent-grandfathered)`.
# T-2193 backfilled historic inceptions with `voi_score: 0.5` /
# `target_blast_radius: 3` defaults so they rank rather than null out.
inception_scoring_exception:
  enabled: true
  cost_substitution:
    field: target_blast_radius
    range: [0, 9]
    fallback: components-count
  value_substitution:
    field: voi_score
    range: [0.0, 1.0]
    scale_to: [0, 5]
    fallback_score: 2
  source_of_truth: 050-Inceptions.md#scoring-exception
  estimator_ref: "agents/termlink/bvp-estimator/estimator.py::_score_inception_voi"
