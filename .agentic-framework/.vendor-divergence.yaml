  - path: .agentic-framework/agents/task-create/update-task.sh
    kind: content
    task: T-391, T-394, T-522
    upstream: fix
    reason: >-
      P-011 refused multi-line verification constructs — diagnosed from AEF's OBS-201. T-394
      states the guard boundary in the code (bash -n catches the torn opener, not a standalone).
