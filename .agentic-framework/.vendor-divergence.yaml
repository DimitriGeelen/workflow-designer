  - path: .agentic-framework/web/templates/fabric_detail.html
    kind: content
    task: T-569
    upstream: fix
    reason: >-
      GENERIC — companion to the fabric.py/shared.py entries. Line 35 rendered
      `<p>{{ component.purpose }}</p>` under Jinja autoescape, so a markdown link written
      into a project-owned card came out as literal text. Reported by
      001-CashWeb-Lightspeed-Ecwid-integration (agent-chat-arc T-064), verified by them
      empirically: they wrote a link into a purpose, forced a cache reload, fetched the
