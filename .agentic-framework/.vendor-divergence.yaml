# Vendored-framework divergence manifest (832 T-517)
#
# WHAT THIS IS. Every path under .agentic-framework/ that differs from the vendor baseline —
# the last pristine re-vendor. G-008 permits fixing vendored code in-tree AND upstreaming it.
# The tree records that a fix happened (a commit). Nothing recorded that the fix was LOCAL.
# That gap is not theoretical: email-archive re-pinged G-AUDIT-EXCLUDE-NOT-HONORED three times
# over four months while T-374 sat here as a tested implementation of their proposed remedy.
#
# WHAT IT IS FOR, TWO THINGS:
#   1. RE-VENDOR SAFETY. `fw upgrade` overwrites this tree. This is the re-apply list.
#      T-276's own follow-up commit reads "post-vendor repair — restore exec bits demoted by
#      old do_vendor copy (5 files) + chmod secret-scan" — the last re-vendor DID clobber, and
#      it was caught by hand. Eight entries below carry NO content change at all, only an exec
#      bit, so a reviewer diffing content would report them clean.
#   2. UPSTREAM DEBT. `upstream: fix` marks a local fix that upstream does not have.
#
# HOW IT IS CHECKED. tools/_t517-vendor-divergence.py asserts the ACTUAL diverged set equals
# the declared set, both directions. Set equality, not a count: a count rises with every
# legitimate G-008 fix, so a count ratchet would fire on correct work and train its reader to
# re-baseline reflexively (the G-015 class tools/verification-hygiene.py catalogues, 832 T-508).
#
# WHEN YOU PATCH VENDORED CODE. Add an entry. The bridge suite goes red until you do — that is
# the point, not an obstacle.
#
# `upstream:` taxonomy — exactly ONE value per entry, and only `fix` is owed to framework-agent:
#   fix              a real code fix made here that upstream lacks. THIS is the upstream debt.
#   superseded       upstream has an equivalent or better fix ALREADY, arrived at independently.
#                    Ours is overwritten at the next re-vendor and that is the correct outcome.
#                    Distinct from vendoring-repair: that one is about loss in TRANSIT, this one
#                    is about CONVERGENCE — two trees fixing the same defect without coordinating.
#   vendoring-repair upstream HAS it; our vendor copy lost it in transit (exec bits demoted by
#                    the old do_vendor copy, a file the copy skipped). Nothing to upstream —
#                    though a vendoring process that drops exec bits is itself worth reporting.
#   local-config     project-specific by nature, never travels upstream.
#   unknown          not yet classified. An honest to-do, not a default.
#
# `superseded` exists because of what happened on 2026-08-15, one day after this file was
# written. AEF answered at rail 11895 that two of the concerns we had recorded as upstream debt
# were already fixed on their side (T-2735, T-3015). Nothing here was wrong when written and
# nothing here changed — THEIR tree moved. `upstream:` is the only field in this manifest that
# makes a claim about a repository we cannot see, so it is the only one that can go stale
# without a local edit, and no instrument on this side can ever detect that. The remedy is not
# a better check, it is periodic triage BY THEM: post the `fix` list and let the side that can
# read upstream rule on it. Treat every `fix` verdict as provisional and dated accordingly.
#
# A path bundling several tasks cannot carry one verdict for all of them. When upstream
# supersedes SOME of an entry's changes, keep `upstream:` as the verdict for what REMAINS owed
# and record the rest under `superseded_changes:`. See agents/audit/audit.sh below.

