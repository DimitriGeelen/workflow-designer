  - path: .agentic-framework/web/app.py
    kind: content
    task: T-544
    upstream: fix
    reason: >-
      GENERIC upstream debt — AEF's own Watchtower carries this bug identically and is in
      fact one of the two colliding instances. app.py sets SESSION_COOKIE_NAME =
      f"fw_session_{Config.PORT}" (T-2278) precisely because RFC 6265 does not scope cookies
      by port, so two Watchtowers on one host otherwise share a cookie slot and overwrite
      each other's session. But Config.PORT reads FW_PORT or falls back to 3000 and is never
      updated by `--port`, which moves only the listening socket; create_app() additionally
      runs at MODULE level, before argparse exists. So the guard names the DEFAULT port, not
      the bound one. Measured on this host: AEF's instance on :3000 and this project's on
      :3012 both emitted `fw_session_3000`, and because each signs with its own
      .context/working/.fw-secret-key neither could decode the other's cookie — session came
      back empty, session.get("_csrf_token") was None, and every state-changing POST 403'd.
      Operator hit it clicking Approve on /approvals, on a freshly loaded page, with
      Watchtower up 2d03h and no restart — which is why "Session expired" was actively
      misleading: nothing had expired. A guard that names the wrong port is worse than no
      guard; it reads as protection in review AND in its own comment, and the failure it
      permits surfaces as session expiry rather than as a collision.
      Fixed in main(), where the bound port is first known, rather than by assigning
      Config.PORT: other call sites read Config.PORT as "the configured port", and having the
      CLI mutate shared config to correct a cookie name trades one action-at-a-distance for
      another. Only the cookie name must follow the socket.
      SECOND DEFECT FOUND IN THE SAME REPRODUCTION, NOT PATCHED UNDER T-544 — one bug, one
      task. Filed and fixed as T-545; see the entry below. The mechanism recorded here
      when T-544 landed was WRONG IN A WAY THAT WOULD HAVE MISDIRECTED THE FIX and is
      corrected there: the browser never rendered that document. htmx 2.0.4 ships
      responseHandling {code:"[45]..",swap:false,error:true} and does not swap a 4xx at
      all. The lines identified were right; the reason they reached the operator was not.

  - path: .agentic-framework/web/app.py
    kind: content
    task: T-545
    upstream: fix
    reason: >-
      GENERIC upstream debt — same file, second defect, and AEF's Watchtower has it too.
      The 403 handler chose its body by WHY the request failed (T-2309 split CSRF from
      generic) and never by WHO was asking. An hx-post to /api/* therefore received the
      full T-2309 "Session expired" PAGE: 66456 bytes of document delivered to a control
      whose target is a <div>.
      MEASURED MECHANISM, replacing the one asserted under T-544. htmx 2.0.4's default
      responseHandling is [{code:"204",swap:false},{code:"[23]..",swap:true},
      {code:"[45]..",swap:false,error:true}] — a 4xx is NEVER swapped, so nothing rendered
      that page. It reached only web/static/htmx-toast.js, whose error listener extracts a
      message with .replace(/<[^>]*>/g,'').trim().substring(0,100). That is a TAG stripper,
      not a text extractor: it removes <title> and <script> TAGS and keeps the text INSIDE
      them. Reproduced exactly, byte for byte with what the operator pasted:
      "Session expired — Workflow designer\n    \n        (function(){var
      t=localStorage.getItem('wt-theme');". The page title followed by the theme
      bootstrap's JavaScript source, truncated at 100 characters.
      Fix: _is_spliced_request() -> a fragment carrying HX-Error-Kind: csrf|forbidden, so
      the T-2309 distinction survives for machines without the caller parsing prose.
      103 bytes where 66456 stood.
      THE FIRST DRAFT OF THIS FIX WAS WRONG AND THE CORPUS IS WHAT SHOWED IT. It exempted
      HX-Boosted requests, reasoning that base.html sets hx-boost="true" on <body> so
      ordinary navigation also carries HX-Request and would otherwise lose T-2309's
      full-page Reload UI. But five routes post a plain <form method="post"> under that
      boost (/arcs/*/close, /assumptions/*/resolve, /inception/*/decide,
      /inception/*/add-assumption, /review/*/pause/*/resolve) — boosted POSTs, which the
      exemption would have left carrying the defect this task exists to remove. The
      library's own default settled it: since htmx never swaps a 4xx, the full page is
      never DISPLAYED for any htmx request, only scraped. T-2309's page stays reachable by
      the one thing that does display it — a genuine non-htmx navigation.
      NOT PATCHED, REPORTED: htmx-toast.js's tag-stripping regex is a separate defect with
      its own root cause. It is latent for any HTML body from any endpoint — a 500 on a
      non-API route still feeds it a document — and using a tag stripper as a text
      extractor will keep leaking element content. Left for AEF to decide, since the
      remedy (textContent extraction, or trusting a structured error header) is a choice
      about their client contract, not ours.

