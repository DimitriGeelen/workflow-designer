  - path: .agentic-framework/agents/context/check-inception-schema.py
    kind: content
    task: T-624, T-625
    upstream: fix
    reason: >-
      The gate's own error message offered `voi_score: 0.5` as its worked example while the
      line above it promised the estimator could rank the task. For an inception voi_score IS
      the whole BVP composite, so the midpoint does not rank it — it abstains, and abstentions
      are indistinguishable from real scores in `fw bvp --quadrant`. Measured 2026-08-29: the
      same 38 of 41 inceptions carried the template default on BOTH axes and shared one
      identical BVP of 126. The message now gives ranges rather than a plantable literal and
      names why the midpoint is not a safe default. UPSTREAM because the defect is in the
