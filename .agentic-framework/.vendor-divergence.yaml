      The shape is this week's, for the fifth time: a DEGRADATION PATH THAT RENDERS AS
      HEALTH. The page still loads, the text still appears, and nothing in the output says
      the renderer fell back — the only observable difference is that escaping quietly
      stopped happening. Fixed at the helper rather than at the call site (PL-214): the
