# Vendored-framework divergence manifest (832 T-517)
#
# WHAT THIS IS. Every path under .agentic-framework/ that differs from the vendor baseline —
# the last pristine re-vendor. G-008 permits fixing vendored code in-tree AND upstreaming it.
# The tree records that a fix happened (a commit). Nothing recorded that the fix was LOCAL.
# That gap is not theoretical: email-archive re-pinged G-AUDIT-EXCLUDE-NOT-HONORED three times
# over four months while T-374 sat here as a tested implementation of their proposed remedy.
#
# WHAT IT IS FOR, TWO THINGS:
#   1. RE-VENDOR SAFETY. `fw upgrade` overwrites this tree. This is the re-apply list.
#      T-276's own follow-up commit reads "post-vendor repair — restore exec bits demoted by
#      old do_vendor copy (5 files) + chmod secret-scan" — the last re-vendor DID clobber, and
#      it was caught by hand. Eight entries below carry NO content change at all, only an exec
#      bit, so a reviewer diffing content would report them clean.
#   2. UPSTREAM DEBT. `upstream: fix` marks a local fix that upstream does not have.
#
# HOW IT IS CHECKED. tools/_t517-vendor-divergence.py asserts the ACTUAL diverged set equals
# the declared set, both directions. Set equality, not a count: a count rises with every
# legitimate G-008 fix, so a count ratchet would fire on correct work and train its reader to
# re-baseline reflexively (the G-015 class tools/verification-hygiene.py catalogues, 832 T-508).
#
# WHEN YOU PATCH VENDORED CODE. Add an entry. The bridge suite goes red until you do — that is
# the point, not an obstacle.
#
# `upstream:` taxonomy — exactly ONE value per entry, and only `fix` is owed to framework-agent:
#   fix              a real code fix made here that upstream lacks. THIS is the upstream debt.
#   superseded       upstream has an equivalent or better fix ALREADY, arrived at independently.
#                    Ours is overwritten at the next re-vendor and that is the correct outcome.
#                    Distinct from vendoring-repair: that one is about loss in TRANSIT, this one
#                    is about CONVERGENCE — two trees fixing the same defect without coordinating.
#   vendoring-repair upstream HAS it; our vendor copy lost it in transit (exec bits demoted by
#                    the old do_vendor copy, a file the copy skipped). Nothing to upstream —
#                    though a vendoring process that drops exec bits is itself worth reporting.
#   local-config     project-specific by nature, never travels upstream.
#   unknown          not yet classified. An honest to-do, not a default.
#
# `superseded` exists because of what happened on 2026-08-15, one day after this file was
# written. AEF answered at rail 11895 that two of the concerns we had recorded as upstream debt
# were already fixed on their side (T-2735, T-3015). Nothing here was wrong when written and
# nothing here changed — THEIR tree moved. `upstream:` is the only field in this manifest that
# makes a claim about a repository we cannot see, so it is the only one that can go stale
# without a local edit, and no instrument on this side can ever detect that. The remedy is not
# a better check, it is periodic triage BY THEM: post the `fix` list and let the side that can
# read upstream rule on it. Treat every `fix` verdict as provisional and dated accordingly.
#
# A path bundling several tasks cannot carry one verdict for all of them. When upstream
# supersedes SOME of an entry's changes, keep `upstream:` as the verdict for what REMAINS owed
# and record the rest under `superseded_changes:`. See agents/audit/audit.sh below.

baseline_commit: ebf0c721a94dbe9c5ed056b54de741a4c05bf336
baseline_note: >-
  T-276 — re-vendor of framework v1.6.763 (28c7a1bd3, GitHub mirror). The last point at which
  this tree matched upstream. Chosen as the baseline rather than the two T-276 follow-up commits
  (70627849, a69b5324) precisely BECAUSE those follow-ups are the post-vendor repair: measuring
  from after them would hide the exec-bit demotion class that this manifest exists to make
  visible.

entries:

  - path: .agentic-framework/agents/observe/observe.sh
    kind: content
    task: T-557
    upstream: fix
    reason: >-
      `fw note` silently destroyed eleven observations between 2026-08-09 and 2026-08-17.
      do_dispatch routes any unrecognised FIRST WORD to do_capture (the `*)` arm of the case
      at ~line 305), and do_capture takes `$1` as the observation TEXT while the flag loop's
      `*) shift ;;` discards everything after it. So `fw note add "<900 chars>"` — where no
      `add` subcommand exists — files the word "add" and drops the payload, at exit 0, with
      "OBS-NNN captured". Eleven husks: OBS-006/011/022/028/032/035/044/241/262/274/285, ten
      "add" and one "inbox". OBS-274 was the flagship finding of T-556 and sat pending+urgent
      for nine hours as one word while every artifact that counts urgents counted it.

      THE GUARD IS SHAPE-BASED, NOT A WORD LIST. `_note_positional_count()` counts positional
      arguments, skipping flags and their values; `fw note` takes exactly one positional, so
      ">1 positional" is the general statement of "your payload is about to vanish". A word
      list ("add", "inbox", ...) would have caught all eleven husks and missed the twelfth,
      and would not catch unquoted prose (`fw note this is a finding` captured only "this").
      Refusal happens BEFORE ensure_inbox, so a refused call touches no state.

      SECOND FIX IN THE SAME FILE, the exact mirror of the first: do_capture ended with
      `[ -n "$task" ] && echo ...` as its LAST statement, so an empty task context returned 1
      under set -e — a successful capture reporting failure, where the other reports success
      while failing. Invisible in this project because focus.yaml is always set; found only by
      running against an isolated PROJECT_ROOT.

      WHY THIS IS UPSTREAM DEBT AND NOT LOCAL POLICY: the defect is in the vendored dispatch
      itself and AEF's register runs the same code. Note the guard that already existed sits on
      the branch that CANNOT lose data — the `-*)` arm rejects an unrecognised FLAG loudly with
      exit 1 — so input validation was considered and applied to the harmless case while the
      subcommand typo, which eats the payload, fell through to the catch-all.

      A related defect in the same file is NOT fixed here and is filed separately as OBS-289:
      do_dismiss parses `--reason`, defaults it, ECHOES it, and never persists it, so a
      register cannot distinguish "the tool ate this row" from "this row was not actionable".
      Pinned by tests/test_note_capture_refuses_lost_payload.py (6 legs, 4 mutants), wired into
      tests/run-bridge-tests.sh.

  - path: .agentic-framework/agents/termlink/bvp-estimator/estimator.py
    kind: content
    task: T-541
    upstream: fix
    reason: >-
      Adds three project-specific BVP driver handlers — score_v_workflow_routing,
      score_v_aef_integration, score_v_sdlc_enablement — plus the _score_by_ladder helper they
      share, and wires all three into estimate_task's dispatch table. Operator requested the
      drivers on 2026-08-16 (weight 9 each); T-540 filed them to the proposal queue and measured
      that without handlers they score 0 on all 55 non-inception tasks, because score_free_driver
      substring-matches the driver's own id in the task body. The handlers are LATENT until the
      operator approves proposals P-bced1426 / P-0b1db872 / P-86588453 — policy/value-drivers.yaml
      is deliberately untouched — which is the same shape score_f_autonomy shipped in under
      T-2329.

      TWO PARTS OF THIS ARE GENERIC AND ARE THE ACTUAL UPSTREAM DEBT, not the three
      project-specific handlers (which AEF has no use for):

      1. _score_by_ladder DERIVES THE ENTRY GATE FROM THE LADDER. Every hand-written handler in
      this file keeps a `touch` gate listing "does this driver apply at all", then a ladder of
      level patterns beneath it, with nothing making the gate a superset. Where it is not, the
      omitted level triggers are dead code — no input can return that level. Hit here for real:
      `port-indicator` was a level-2 trigger with "port" absent from the gate, so T-294 scored 0
      and level 2 was unreachable across the whole corpus. Same class as PL-203. Worth AEF's
      attention as a shape their existing handlers may also carry.

      2. parse_task() DOES NOT STRIP HTML COMMENTS, and handlers therefore score the task
      TEMPLATE. Task bodies here are 33.6% HTML comment on average (max 64%) — the Human-AC
      guidance block, the Verification errexit essay, the RCA/Evolution/Decisions templates — and
      that text is byte-identical in every task. Measured consequence in AEF's own code:
      score_d3_usability's "default tuned" pattern matches the template's own instruction prose,
      giving 37 of 58 non-completed tasks a flat D3=2 they never earned (52/58 non-zero collapses
      to 15/58 once comments are stripped). NOT patched here — it is their scoring calibration and
      changing it silently would move every D3 score in the register. Reported instead. The three
      new handlers strip comments themselves so they cannot join it. PL-239 — measure the consumed
      corpus, not the existing one.

      T-542 EXTENDS THIS ENTRY, same file, and ALL OF IT IS GENERIC UPSTREAM DEBT:

      3. score_blast_radius RETURNED 0 FOR A BLIND READ, AND 0 IS THE CHEAPEST VALUE ON THE
      SCALE. It derived blast radius from `components:` alone; `components:` is empty on 59 of
      59 non-completed tasks here, so all 46 non-inceptions scored 0 via `no-components` and
      the F8 cost axis — where blast_radius carries weight 0.6, the dominant term — collapsed
      to `inception ? 3.6 : 1.4`, with 29 of 59 tied at the modal value. That is not a tie in
      cost; it is the absence of a fabric registration wearing the most attractive number an
      HV/LC filter can promote on. AEF ALREADY NAMED THIS EXACT SHAPE one population earlier:
      T-2189's own docstring says the count "always returns 0, making inceptions look
      artificially cheap" — and repaired inceptions only, via target_blast_radius. The same
      sentence was true of 100% of the non-inception corpus. Fixed here by (a) a third evidence
      source, source paths named in the body AND PRESENT IN THE TREE, and (b) returning None
      when nothing is knowable, which propagates to an OMITTED blast_radius key that
      compute_cost already reads as source:'absent' → quadrant '-' → excluded. Declining to
      rank is honest; ranking cheapest is not. Result: blast_radius 2 distinct values → 5, F8
      10 distinct → 13, largest tie 29 → 15, 14 tasks honestly excluded.

      4. THE BODY-PATH SIGNAL HAD TO SUBTRACT THE TASK TEMPLATES, which is finding 2 above
      recurring in a second handler. `.tasks/templates/default.md` cites
      tools/_t352-p011-errexit-probe.sh and tools/validate-workflow.py in its errexit warning;
      path-c-deep-dive.md cites .context/handovers/LATEST.md. The first `estimate-cost all` run
      scored T-542 ITSELF at blast_radius=5 with two of the four cited paths being the
      template's. 7 of 59 tasks had no signal except the template. Note these are SHELL-comment
      lines, not HTML comments, so stripping HTML comments would not have caught them —
      finding 2's remedy is necessary but not sufficient, and the general rule is subtract what
      every member of the corpus shares.

      5. PROJECT_ROOT'S FALLBACK IS WRONG UNDER VENDORING — reported, deliberately NOT patched.
      Line 73 falls back to Path(__file__).resolve().parents[3]. In AEF's own repo the estimator
      sits at agents/termlink/bvp-estimator/, so parents[3] is the repo root and it is correct.
      Vendored it sits at .agentic-framework/agents/termlink/bvp-estimator/, so parents[3] is
      `.agentic-framework` — off by one, and it lands on a directory that EXISTS and contains a
      plausible policy/ and .tasks/, so nothing errors and RUBRIC_PATH/POLICY_PATH silently read
      the framework's copies instead of the project's. `fw bvp` always exports PROJECT_ROOT so
      the CLI path masks it entirely; direct invocation — which lib/bvp.sh's own dispatcher
      docstring says must work, "the script must also be invokable directly via TermLink
      convention" — does not. Found by a probe leg going red for the wrong reason: 5 real
      fixture paths scored as 3, because policy/value-drivers.yaml exists under BOTH roots.
      Not patched because the fallback is correct in AEF's layout and only wrong in ours;
      choosing the detection rule is theirs. Adjacent to the audit's existing T-2648/OBS-097
      check, which covers web/ and lib/ Python but not agents/.

  - path: .agentic-framework/lib/arc.sh
    kind: content
    task: T-467
    upstream: fix
    reason: >-
      `fw arc tag` wrote the T-1851-DEPRECATED `tags: [arc:<slug>]` form and never the
      T-1849 source-of-truth field `arc_id:`. Upstream's own T-1850 migrated 162 tasks off
      the tag form, and upstream's own `arc_help` says "Source-of-truth is task-side arc_id:"
      while naming this verb as the way to record membership — so the documented command was
      re-creating, one task at a time, what the migration had just cleaned up. Nothing in the
      framework wrote `arc_id:` anywhere; `arc_show` told the user to edit frontmatter by hand.

      IT NEVER LOOKED BROKEN, and that is the finding rather than an aside. Every reader
      (lib/arc_membership.py) takes the UNION of `arc_id:` and the legacy tag, so an arc whose
      membership is split across two representations renders identically to one recorded
      canonically. 832's T-466 caught it only because a verification leg asserted the field BY
      NAME instead of asserting that `fw arc show` looked right — an instrument checking the
      render passes this every time.

      FIXED HERE: `arc_tag()` now writes `arc_id: <slug>` into the frontmatter, is idempotent,
      and REFUSES to reassign a task that already carries a different arc_id (the old code
      accepted it silently, producing dual membership — found by the fence, not by the report).
      The deprecated tag is no longer written; legacy tags already on tasks are left in place
      and readers keep unioning them. The write is bounded to the frontmatter region: the
      replaced writer ran `^tags:` over the WHOLE document and could rewrite body prose that
      quotes the field name. `arc_migrate` step 3 feeds legacy-tagged task ids back into this
      function, so it now UPGRADES them instead of re-confirming their tags.

      Fenced by 832's tools/_t467-arc-tag-source-of-truth.py — six arms, all six failing
      against the pre-fix copy, run against a throwaway project root.

  - path: .agentic-framework/lib/bvp.sh
    kind: content
    task: T-542
    upstream: fix
    reason: >-
      Adds `fw bvp estimate-cost` to `fw bvp --help`. GENERIC upstream debt, one line of
      substance: the verb was fully implemented under T-1935 and correctly dispatched at
      lib/bvp.sh:1553, with its own `--help`, but it was never listed in the top-level usage
      block — which lists `estimate` and its four subverbs. So the only route a reader has to
      the cost half of the model was to already know it existed. Measured consequence: T-540
      concluded "driver --init bootstraps the value half and silently not the cost half" and
      filed the missing cost half as a defect. The cost half was there. A capability nobody can
      find is indistinguishable from a capability nobody built, and the register recorded the
      wrong one. The added text also states the coupling the omission hid — `--quadrant` is
      inert without a cost estimate, because compute_cost returns source:'absent' and every
      quadrant renders '-', so all four filters print "No tasks match" with no hint why.

  - path: .agentic-framework/web/app.py
    kind: content
    task: T-544
    upstream: fix
    reason: >-
      GENERIC upstream debt — AEF's own Watchtower carries this bug identically and is in
      fact one of the two colliding instances. app.py sets SESSION_COOKIE_NAME =
      f"fw_session_{Config.PORT}" (T-2278) precisely because RFC 6265 does not scope cookies
      by port, so two Watchtowers on one host otherwise share a cookie slot and overwrite
      each other's session. But Config.PORT reads FW_PORT or falls back to 3000 and is never
      updated by `--port`, which moves only the listening socket; create_app() additionally
      runs at MODULE level, before argparse exists. So the guard names the DEFAULT port, not
      the bound one. Measured on this host: AEF's instance on :3000 and this project's on
      :3012 both emitted `fw_session_3000`, and because each signs with its own
      .context/working/.fw-secret-key neither could decode the other's cookie — session came
      back empty, session.get("_csrf_token") was None, and every state-changing POST 403'd.
      Operator hit it clicking Approve on /approvals, on a freshly loaded page, with
      Watchtower up 2d03h and no restart — which is why "Session expired" was actively
      misleading: nothing had expired. A guard that names the wrong port is worse than no
      guard; it reads as protection in review AND in its own comment, and the failure it
      permits surfaces as session expiry rather than as a collision.
      Fixed in main(), where the bound port is first known, rather than by assigning
      Config.PORT: other call sites read Config.PORT as "the configured port", and having the
      CLI mutate shared config to correct a cookie name trades one action-at-a-distance for
      another. Only the cookie name must follow the socket.
      SECOND DEFECT FOUND IN THE SAME REPRODUCTION, NOT PATCHED UNDER T-544 — one bug, one
      task. Filed and fixed as T-545; see the entry below. The mechanism recorded here
      when T-544 landed was WRONG IN A WAY THAT WOULD HAVE MISDIRECTED THE FIX and is
      corrected there: the browser never rendered that document. htmx 2.0.4 ships
      responseHandling {code:"[45]..",swap:false,error:true} and does not swap a 4xx at
      all. The lines identified were right; the reason they reached the operator was not.

  - path: .agentic-framework/web/app.py
    kind: content
    task: T-545
    upstream: fix
    reason: >-
      GENERIC upstream debt — same file, second defect, and AEF's Watchtower has it too.
      The 403 handler chose its body by WHY the request failed (T-2309 split CSRF from
      generic) and never by WHO was asking. An hx-post to /api/* therefore received the
      full T-2309 "Session expired" PAGE: 66456 bytes of document delivered to a control
      whose target is a <div>.
      MEASURED MECHANISM, replacing the one asserted under T-544. htmx 2.0.4's default
      responseHandling is [{code:"204",swap:false},{code:"[23]..",swap:true},
      {code:"[45]..",swap:false,error:true}] — a 4xx is NEVER swapped, so nothing rendered
      that page. It reached only web/static/htmx-toast.js, whose error listener extracts a
      message with .replace(/<[^>]*>/g,'').trim().substring(0,100). That is a TAG stripper,
      not a text extractor: it removes <title> and <script> TAGS and keeps the text INSIDE
      them. Reproduced exactly, byte for byte with what the operator pasted:
      "Session expired — Workflow designer\n    \n        (function(){var
      t=localStorage.getItem('wt-theme');". The page title followed by the theme
      bootstrap's JavaScript source, truncated at 100 characters.
      Fix: _is_spliced_request() -> a fragment carrying HX-Error-Kind: csrf|forbidden, so
      the T-2309 distinction survives for machines without the caller parsing prose.
      103 bytes where 66456 stood.
      THE FIRST DRAFT OF THIS FIX WAS WRONG AND THE CORPUS IS WHAT SHOWED IT. It exempted
      HX-Boosted requests, reasoning that base.html sets hx-boost="true" on <body> so
      ordinary navigation also carries HX-Request and would otherwise lose T-2309's
      full-page Reload UI. But five routes post a plain <form method="post"> under that
      boost (/arcs/*/close, /assumptions/*/resolve, /inception/*/decide,
      /inception/*/add-assumption, /review/*/pause/*/resolve) — boosted POSTs, which the
      exemption would have left carrying the defect this task exists to remove. The
      library's own default settled it: since htmx never swaps a 4xx, the full page is
      never DISPLAYED for any htmx request, only scraped. T-2309's page stays reachable by
      the one thing that does display it — a genuine non-htmx navigation.
      NOT PATCHED, REPORTED: htmx-toast.js's tag-stripping regex is a separate defect with
      its own root cause. It is latent for any HTML body from any endpoint — a 500 on a
      non-API route still feeds it a document — and using a tag stripper as a text
      extractor will keep leaking element content. Left for AEF to decide, since the
      remedy (textContent extraction, or trusting a structured error header) is a choice
      about their client contract, not ours.

