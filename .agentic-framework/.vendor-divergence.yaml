  - path: .agentic-framework/web/blueprints/bvp.py
    kind: content
    task: T-547
    upstream: fix
    reason: >-
      GENERIC upstream debt — AEF's own Watchtower serves these routes. Two endpoints take an
      operator's policy-decision rationale from the browser through htmx's `hx-prompt` and file
      it as the audit record: bvp_driver_remove (SOVEREIGN — the rationale IS the record of a
      policy edit) and bvp_driver_reject. Both read the `HX-Prompt` header raw.
      MEASURED, not inferred. XHR forbids non-ASCII header values, so htmx (web/static/
      htmx.min.js, function `Cn`) retries a rejected setRequestHeader with encodeURIComponent
      AND sets a companion `<header>-URI-AutoEncoded: true` declaring that it did:
      `try{t.setRequestHeader(n,r)}catch(e){t.setRequestHeader(n,encodeURIComponent(r));
      t.setRequestHeader(n+"-URI-AutoEncoded","true")}`. htmx behaves correctly and announces
      itself; the server never looked. Evidence on the live ledger — three rejections in
      .context/bvp-driver-proposals.jsonl carry
      "Reject%20rationale%20(%E2%89%A530%20chars%20%E2%80%94%20why%20is..." as the operator's
      stated reason. One em-dash, curly apostrophe, arrow or accented letter is enough; a
      pure-ASCII rationale round-trips cleanly, which is exactly why this went unnoticed since
      T-2079 introduced the pattern.
      Fix: _hx_prompt() decodes only when htmx declares an encoding. The condition is the
      point, not incidental — an unconditional unquote() silently turns a rationale a human
      typed as "covers 50%20 of cases" into "covers 50  of cases", and trusting htmx's own
      declaration is the only way to tell an encoding from a percent sign. Applied at both
      call sites, ahead of the ≥30-character R6 floor so the floor measures the real rationale
      rather than its inflated encoded form (pre-fix, a 26-character rationale encoded to 44
      and cleared the gate).
      NOT DONE, DELIBERATELY: the three already-mangled rows are left as they are.
      bvp-driver-proposals.jsonl is an append-only audit ledger, and rewriting history to make
      a past record look better than it was is the wrong repair.
      Teeth: tools/_t547-hx-prompt-decode-teeth.py, wired into tests/run-bridge-tests.sh.
      Hermetic — the ledger writer and the fw CLI are captured rather than run, so the probe
      appends no row and touches no driver register. Leg 6 pins the POPULATION and not merely
      the two sites known today — exactly one raw read of the header may exist, the one inside
      the helper — because a fix granted only to the cases that prompted it is T-509's shape,
      met here for the fourth time. Mutation-verified against four mutants (never-decode,
      always-decode, remove-route-only, third-route-reads-raw); each is caught by exactly the
      leg that owns it and the single-route mutant localises to the SOVEREIGN endpoint by name.

  - path: .agentic-framework/agents/task-create/update-task.sh
    kind: content
    task: T-561
    upstream: fix
    reason: >-
      GENERIC upstream debt — this crashes every inception completion in any project, AEF's
      own included. The `inception_decisions` reachability gate runs its helper as
      `python3 - <<'PYEOF'` and set sys.path with
      `os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))`.
      That expression is correct for a script living at <framework>/agents/task-create/ and
      wrong for this one, because code read from stdin has `__file__` set to the literal
      string `<stdin>`. MEASURED, not inferred: abspath('<stdin>') resolves against the CWD,
      so from /opt/832-Workflow-designer the three dirname calls yield '/'. The framework root
      was never added, and the very next statement — `from lib.inception_decisions import ...`
      — raised ModuleNotFoundError. The gates all PASSED first (verification 5/5, disposition
      ✓, decision ✓) and the traceback landed after them, so the operator saw a task that had
      cleared every check and still did not complete.
      Fix: pass FRAMEWORK_ROOT in through the environment. The shell computes it one line
      above to stat lib/inception_decisions.py, so the value was already in hand and was being
      re-derived from a `__file__` that does not exist. The env channel is required rather
      than stylistic — the heredoc is quoted (<<'PYEOF'), so no shell expansion reaches it.
      WHY IT SURVIVED: the block is only reached by an inception task whose gates have all
      passed AND whose frontmatter carries a populated `inception_decisions:` field. T-501 is
      the first task in this project to satisfy both. A grandfather guard immediately above
      (`[ -f "$lib_py" ] || return 0`) means a project WITHOUT the helper skips silently — so
      the failure needs the library to be present, which is to say it fires only where the
      feature is fully installed.
      POPULATION CHECKED rather than assumed unique: one other `abspath(__file__)` derivation
      of a root exists in the vendored tree, agents/audit/audit.sh:5624, and it is GUARDED —
      `os.environ.get("PROJECT_ROOT", <derivation>)` — so the broken expression is a fallback
      that PROJECT_ROOT normally pre-empts. Latent, not firing, deliberately left alone: it is
      a second bug in a second file and gets its own task if it ever bites.

  - path: .agentic-framework/agents/context/lib/episodic.sh
    kind: content
    task: T-567
    upstream: fix
    reason: >-
      GENERIC — this corrupts episodic memory in ANY project whose commit messages contain a
      backslash, which is routine for a project whose messages quote regexes or paths.
      mine_git_timeline's subjects were emitted at :367-369 into a DOUBLE-quoted YAML scalar
      escaping only `"` (sed 's/"/\\"/g'). A double-quoted YAML scalar interprets a fixed
      escape set, so any backslash before a non-escape character makes the whole file
      unparseable. T-562's message quoted /[^a-z0-9_\-]/g and produced `\-`; T-431's quoted an
      alternation and produced `\|`.
      MEASURED, not assumed: 2 of 488 episodics in this project were unparseable, and T-431
      had been dead since 2026-08-11 — nine days — because the ScannerError is raised at
      GENERATION time and the file is never parsed again. The task still completes, the file
      is still written, and the episodic memory of a finished task is simply gone.
      THE FIX WAS ALREADY IN THE SAME FILE, two blocks away: the `challenges` and `artifacts`
      emitters mine the SAME `git log --format=%s` subjects and have always used
      single-quoted YAML with `''` doubling. T-562's own episodic held the offending message
      SAFELY at line 37 in the challenges block while line 61 killed the file — the same bytes,
      two quoting styles, one of them wrong. The change makes the timeline block match its
      siblings; it does not invent an escaping scheme.
      Both broken episodics were REGENERATED through the fixed generator rather than
      hand-edited, per the framework's own error text ("do not edit the output by hand").
      Reported upstream on framework:pickup as msg_type=pickup-bug-report.

  - path: .agentic-framework/web/blueprints/fabric.py
    kind: content
    task: T-568
    upstream: fix
    reason: >-
      GENERIC — every consumer project ships this file and every one of them has this bug.
      _load_components() cached the parsed component cards under os.stat(COMP_DIR).st_mtime
      at :33 — the mtime of the DIRECTORY, not of the cards it holds. POSIX bumps a
      directory's mtime when an entry is created, deleted or renamed and NOT when a file
      already inside it is written, so the two fabric verbs split: `fw fabric register`
      creates a card file and invalidated correctly, while `fw fabric enrich` rewrites cards
      IN PLACE and never did. The page then served the pre-enrichment card for the entire
      life of the server process at HTTP 200 with no warning and no log line.
      NOT A THEORETICAL PATH. AEF's own audit emits `[WARN] Fabric: N/M cards have no edges —
      Mitigation: Run: fw fabric enrich` on every run; an operator who obeys the framework's
      own priority action lands exactly on the invisible half. Reported by
      001-CashWeb-Lightspeed-Ecwid-integration, who lost a diagnosis to it — they concluded
      Watchtower was serving a different checkout and found the real cause only on a second
      pass. Their reproduction takes ten seconds: edit a card, fetch the page (stale),
      `touch .fabric/components` (the directory), fetch again (correct), nothing else changed.
      THE FIX IS NOT THE SUGGESTED (count, max-mtime) PAIR, and the reason is measured rather
      than argued: on this filesystem five back-to-back writes produced st_mtime_ns deltas of
      exactly 0, so any mtime-derived key has an aliasing window — and a key that never
      changes again is never re-read, making that window permanent rather than brief. The key
      is now a sha256 over each card's NAME and BYTES. Cost measured before it was chosen:
      65 cards / 61,598 bytes — read+sha256 1.36 ms against yaml.safe_load 98.58 ms, so the
      digest costs 1.4% of the parse it avoids and the cache keeps its point. The name is in
      the digest because a rename moves neither mtime nor bytes, and rename is the one case
      the directory key did get right. The bytes are read ONCE and used for both the digest
      and the parse: hashing and then re-opening leaves a window where a write between the two
      lands parsed content under the pre-write digest, which is the same defect in a smaller
      costume.
      Sibling caches were checked rather than assumed: web/shared.py:498 (mtime_cached_get)
      and web/blueprints/costs.py:141 key a FILE's cache on THAT FILE's own stat, which is
      correct in kind. fabric.py was the only site keying a collection on a directory.
      Reported upstream on framework:pickup as msg_type=pickup-bug-report.

  - path: .agentic-framework/web/shared.py
    kind: content
    task: T-569
    upstream: fix
    reason: >-
      GENERIC — render_markdown_safe's ImportError branch returned the RAW text. Its own
      docstring three lines above says "Caller must mark returned string `| safe` in
      templates", and every caller does (arcs.py:600, review.py:179, tasks.py:831, and now
      fabric.py). So on any host where markdown2 is not importable, the helper handed
      unescaped content straight into the page while the call sites kept marking it safe.
      Latent rather than firing — markdown2 2.5.4 is present here — but the branch exists
      precisely for the host where it is not, and that host is the one that gets the
      injection. Now returns markupsafe.escape(text).
      The shape is this week's, for the fifth time: a DEGRADATION PATH THAT RENDERS AS
      HEALTH. The page still loads, the text still appears, and nothing in the output says
      the renderer fell back — the only observable difference is that escaping quietly
      stopped happening. Fixed at the helper rather than at the call site (PL-214): the
      caller cannot know whether the string it is about to mark safe was escaped.
      Found while wiring the fabric card purpose through this helper (T-569), which is the
      change that converts the branch from latent to reachable-with-consequences.
      SEPARATE AND NOT FIXED HERE, filed as OBS-305: _auto_link_files at :650 gates on
      (PROJECT_ROOT / path).exists(), and in a CONSUMER project PROJECT_ROOT is the
      .agentic-framework directory — so no project-owned artefact path (docs/reports/*,
      docs/standards/*, .tasks/*) ever resolves, on any Markdown surface in Watchtower.
      Measured: an EXISTING docs/standards path renders as plain text while a bare T-NNN
      ref in the same string renders as an anchor. fabric.py:18-21 already carries the
      compensating idiom and is the model for the fix. Reported, not patched — it is one
      bug and deserves one task.

  - path: .agentic-framework/web/templates/fabric_detail.html
    kind: content
    task: T-569
    upstream: fix
    reason: >-
      GENERIC — companion to the fabric.py/shared.py entries. Line 35 rendered
      `<p>{{ component.purpose }}</p>` under Jinja autoescape, so a markdown link written
      into a project-owned card came out as literal text. Reported by
      001-CashWeb-Lightspeed-Ecwid-integration (agent-chat-arc T-064), verified by them
      empirically: they wrote a link into a purpose, forced a cache reload, fetched the
      page and got no anchor and a literal "[the index](...)".
      Why it matters beyond cosmetics, in their framing: a consumer project has NO
      project-owned nav seam. NAV_GROUPS (web/shared.py:136) is a hardcoded list of Flask
      blueprint endpoints, /file/<dir>/ has no index, /search does not index docs/reports.
      The fabric card is the only project-owned surface the nav already reaches, so an
      autoescaped purpose is why AEF's own Carrier Discipline rule — an artefact must be
      "reachable without instructions" — is currently unsatisfiable by any consumer project.
      Now renders `purpose_html` (produced blueprint-side by render_markdown_safe, the
      established *_html + `| safe` pattern) with NO wrapping <p>, because markdown2 emits
      its own block-level <p> and nesting them is invalid HTML.
      The nav design itself — NAV_GROUPS merging, a nav: block in .framework.yaml, a
      /file/<dir>/ directory index — is deliberately NOT proposed here. That is AEF's call
      and was relayed as a finding rather than a shape.

  - path: .agentic-framework/agents/task-create/update-task.sh
    kind: content
    task: T-574
    upstream: fix
    reason: >-
      GENERIC — the P-011 completion gate could report success on a task whose every
      verification leg was UNRUN, and printed nothing to say so. run_verification_commands
      located its block with `sed -n '/^## Verification/,/^## /p'` and then
      `[ -z "$verify_cmds" ] && return 0`. That early return is a SILENT pass: its output is
      byte-identical to a run that executed every leg and found no fault.
      MEASURED, not theorised — T-572 completed this way in this repo on 2026-08-20 with all
      TEN of its legs unrun, and was caught only because its acceptance-criteria count was a
      number the author happened to expect differently. The completion record said the task
      was verified. Nothing in the output was false; the true statement "no verification
      command failed" was simply doing duty for "the verification ran".
      `^## Verification` is a PREFIX match and it fails in two OPPOSITE ways, both observed
      here one day apart. T-572: a backticked mention of the heading inside an acceptance
      criterion glued the real heading onto the end of that line, so the pattern never
      matched, sed returned zero lines, and the gate passed silently. T-542: a heading
      reading `## Verification of the probe itself` sat ABOVE the real one, so the prefix
      match opened the range early and handed the shell a markdown table — which the T-391
      multi-line guard then refused, LOUDLY. One fragile regex, two shapes, and only one of
      them announces itself.
      THE FIX IS NOT "PRINT THE COUNT". A count can still be read past. COULD-NOT-LOOK now
      gets its OWN failure line, printed separately from any finding about the task, because
      "no verification command failed" and "no verification command ran" are different facts
      and only one of them is about the task. That framing was arrived at independently by
      001-CashWeb-Lightspeed-Ecwid-integration on their own checker (agent-chat-arc offset
      193) while fixing a PASS whose printed node count exceeded the nodes it had compared;
      adopted verbatim because it is better than the counting remedy this task started with.
      Changes: the block is located by an EXACT heading match (`^## Verification$`), the
      extraction is an anchored awk range from that line, and four states are now
      distinguished — absent (documented pass-through, and it SAYS zero), well-formed-empty
      (pass-through, says zero), well-formed (runs and reports N), unreadable (REFUSES).
      Unreadable covers: heading present only mid-line, a prefix heading preceding the real
      one, and more than one exact heading.
      Incidental defect removed in the same rewrite, found by the probe's own first red run:
      the old extraction ended `| sed '$d'` to trim the range terminator, but when
      `## Verification` is the FINAL section there is no terminator, so `$d` ate a real
      command. The old gate ran N-1 legs and reported N-1 as if that were the whole block —
      the same class of miscount, in the same function.
      Teeth: tools/_t574-p011-block-locator-teeth.py — 10 legs, control run first (T-560),
      five fixtures including the REAL T-572 and T-542 shapes, and a mutant that reverts the
      locator and must redden only the legs it owns. Wired into tests/run-bridge-tests.sh in
      the same commit (T-568). Caveat recorded at the wiring site: that suite has no
      scheduled caller.
      Population swept, not assumed unique: 12 distinct `sed -n '/^## .../,/^## /p'` heading
      ranges exist in this vendored tree. Four carry a real prefix collision — `## Decisions`
      (episodic.sh) against `## Decisions Made This Session`, `## Gotchas`
      (post-compact-resume.sh) against `## Gotchas / Warnings for Next Session`, and
      `## Open Questions` (audit.sh and resume.sh) against `## Open Questions / Blockers`.
      All four RESOLVE CORRECTLY against the live handover today, verified by running the
      ranges, because each prefix currently has exactly one match. They are latent, not
      broken, and are reported as such rather than fixed here — widening this task to twelve
      call sites is how a bounded fix becomes an unbounded one.

  - path: .agentic-framework/web/blueprints/tasks.py
    kind: content
    task: T-606
    upstream: fix
    reason: |
      /approvals rendered 205 escaped `&lt;code&gt;` sequences to the operator for as long
      as that page had existed. `_render_markdown` and its AC-body sibling returned plain
      `str` under the contract "the caller must mark returned strings safe" — correctness
      living in every template author's memory rather than in the function. Two of the
      four consumers forgot. The fix moves the decision into the function: both now return
      `markupsafe.Markup`, so Jinja stops escaping already-safe HTML a second time.
      markdown2's `safe_mode='escape'` still neutralises raw HTML arriving from the task
      file, so this widens no injection surface — it stops double-escaping our own output.

      WHY THIS ENTRY EXISTS AND THE FIX DOES NOT: the change landed at 10a537c1 and was
      never declared here, so `_t517-vendor-divergence.py` has been FAILING in the bridge
      suite ever since — "1 unrecorded". The guard was right and nobody read it, because
      the bridge suite takes ~13 minutes and nothing runs it on a schedule. Declared
      2026-08-29 after the suite was run to completion for the first time in weeks.

      UPSTREAM because the defect is in vendored rendering shared with AEF's register,
      not local policy: any project rendering an AC body through this blueprint shows its
      operator escaped markup. Same class as T-557 — a vendored function whose contract
      delegated correctness to its callers.

  - path: .agentic-framework/agents/task-create/update-task.sh
    kind: content
    task: T-654
    upstream: fix
    reason: |
      A task archived through the PARTIAL-COMPLETE RECHECK branch reached
      .tasks/completed/ still storing `horizon: now`. update-task.sh has two branches that
      move a file into completed/, and only one of them nulled the horizon:

        Trigger 2 (~line 2064)  ordinary started-work -> work-completed. Nulls (T-2163).
        The recheck (~line 1541) OLD_STATUS == NEW_STATUS == work-completed, file still in
                                 active/. Moves, generates the episodic, left horizon alone.

      Their entry conditions are exact COMPLEMENTS -- `OLD_STATUS != work-completed` versus
      `OLD_STATUS == work-completed` -- so no widening of the first site can ever reach the
      second. T-2300 had already widened it once, for the re-close path, after eight CTL-030
      instances; that widening was aimed at the site where the symptom showed rather than at
      the invariant, which is one line long: A FILE THAT ARRIVES IN completed/ HAS NO HORIZON.

      UPSTREAM because `fw task archive-eligible` (bin/fw:3403) re-invokes
      `--status work-completed` and therefore drives EXCLUSIVELY through the unfixed branch.
      Any project that runs the sweep `fw audit` recommends manufactures the CTL-030 FAILs
      the same audit then reports -- the tool and its own remedy in a closed loop.

      Witness: tools/_t654-archiving-a-partial-complete-task-must-null-its-horizon.sh, 7 legs,
      driving the real script against a throwaway PROJECT_ROOT. Its leg 3 exists because leg 2
      went green through the OTHER branch: a partial-complete run leaves `status:
      started-work`, so the obvious fixture never enters the recheck branch at all. The leg
      asserts WHICH branch archived the file, not only that the field ended up right.

  - path: .agentic-framework/agents/audit/audit.sh
