  - path: .agentic-framework/bin/fw
    kind: content
    task: T-643, T-645
    upstream: fix
    reason: >-
      Two vendored-path defects on one file. (1) `sys.path.insert(0, PROJECT_ROOT)` assumes
      the framework-repo layout; in a vendored install web/ is not under PROJECT_ROOT, so the
      import raised and `except ImportError` substituted the inline fallback SILENTLY on every
