  - path: .agentic-framework/agents/task-create/update-task.sh
    kind: content
    task: T-658
    upstream: fix
    reason: >-
      The P-011 verification runner rendered every non-zero exit as `FAIL: <cmd> (exit N)`.
      A command that RAN and returned a verdict of "wrong" and a command that was killed
      before producing one read in identical words, so the operator was told "your check is
      wrong" when the truth was "your check did not finish". Observed on T-651 (OBS-332): an
      `fw audit` verification line returned on its first invocation, hung on an immediate
      second against the lock FDs the transition itself holds, and was killed externally at
      five minutes — reported as a plain FAIL.

      The exit code already carried the distinction and the runner discarded it: timeout(1)
      exits 124, a process killed by signal N exits 128+N. Now classified into a third
      outcome, DID NOT FINISH, carried through to the summary block the operator actually
      reads on a blocked completion — a per-line label that the summary flattened back into
      "N failed" would not have fixed the reported defect. A kill with no captured output
      says so rather than printing an empty evidence block, which is what made the original
      incident unreadable. The timeout branch names the whole-audit hazard and points at
      `fw audit --section <name>`.

      Deliberately NOT a new timeout: this classifies how commands already die and does not
      add a way to die. Imposing one would kill legitimately long verifications (builds,
      suites) and needs its own decision.

      Both kinds still increment verify_fail, so completion stays blocked and the T-630
      reconciliation (verify_pass + verify_fail == verify_total) still holds — peeling
      did-not-finish into its own bucket INSTEAD would make the runner report a defect in
      itself. The distinction is in what it SAYS, not in whether it counts.

      UPSTREAM because the gate is framework-wide: every project running this framework gets
      told "your check is wrong" when its check was killed.

      Witness: tools/_t658-p011-must-distinguish-killed-from-failed.sh, 11 legs, extracting
      the real runner region from update-task.sh and giving it a function context so
      `return`/`exit` behave as in situ. Boundary legs assert 128 is NOT read as a signal
      death (it is not 128+N for any N>=1).

  - path: .agentic-framework/agents/git/lib/hooks.sh
    kind: content
    task: T-659
    upstream: fix
    reason: >-
      Adds a pre-commit guard refusing staged DELETIONS under .context/audits/cron/ when
      running under agent control ($CLAUDECODE=1). A retention cron prunes that directory and
      leaves the deletions pending in the working tree; committing them is the operator's
      housekeeping decision, not a byproduct of whatever task the agent is on.

      Why it is a mechanism and not a resolution: three sessions held this line by staging
      explicit paths every time, and it broke the moment a single `git add .context/` — run
      to pick up one episodic file — swept 338 deletions into the index. The rule lived in
      the agent's head; the index does not consult it. The block message names the actual
      cause (directory-wide add) and prints the unstage command, because the failure mode to
      avoid is an agent discarding its real work alongside the mistake.

      `--diff-filter=D` is load-bearing: a cron audit being ADDED or MODIFIED is not a sweep,
      and without the filter the daily audit could not commit its own output. The operator is
      never blocked, and FW_ALLOW_RETENTION_SWEEP=1 is the documented deliberate-sweep path.

      UPSTREAM because the retention cron and .context/audits/cron/ are framework structures,
      so every project running this framework accumulates the same pending deletions and the
      same chance of sweeping them in.

      Witness: tools/_t659-retention-sweep-must-not-be-agent-staged.sh, 6 legs, all on
      throwaway repos — it never touches this repository's index. Includes a leg asserting
      the printed remedy leaves a still-committable index with the legitimate file intact.

  - path: .agentic-framework/agents/task-create/create-task.sh
    kind: content
    task: T-660
    upstream: fix
    reason: >-
      Substituted the task id in exactly two places — `id: T-XXX` in the frontmatter and the
      H1 heading — and nowhere else in the instantiated template. The inception template's
      Human AC reads `Run: fw task review T-XXX`, so every inception ever created shipped
      that literal placeholder as the operator's FIRST STEP. Measured 2026-08-31: nine of the
      ten unruled inceptions on this project's queue carry it, and 010-termlink reported the
      identical string in their tree at rail @891 — which is how a shared template announces
      itself rather than ten authors making the same typo. Now substitutes throughout, on
      both the inception and default template paths.

      UPSTREAM because the templates and the substitution are both framework-owned, so every
      project on this framework has been handing its operator an unrunnable first step.

      T-767 (2026-09-21) adds a SECOND divergence to this file. `--owner human` now requires
      `--human-ac "<criterion>"` and is refused without it; the criterion is seeded into the
      created file's `### Human` section. Operator ruling on SQ-2: an agent-produced task
      must never be born on a human with zero Human ACs — the agent is structurally forbidden
      to finish it and the human has nothing to verify, so it parks forever. Measured here
      2026-09-21: 34 of 107 active owner:human tasks carry zero Human AC checkboxes, two of
      them with every criterion already ticked. The gate REFUSES rather than rewriting the
      owner, because ownership is the operator's call and a silent flip would take it.
      Exempt by policy, not oversight: bpmn-promote and designer-ghost origins (T-2543/T-2577
      make those human-owned regardless), and `--type inception` (its template already ships
      a real go/no-go Human AC). Witness: tools/_t767-ownership-correspondence.sh, 4 legs,
      proven RED against the unpatched generator before being trusted green.

      UPSTREAM because the default is framework-owned: any project on this framework can mint
      a human-owned task nobody can finish, and nothing tells it that it did.

  - path: .agentic-framework/agents/context/check-active-task.sh
    kind: content
    task: T-662
    upstream: fix
    reason: >
      Second divergence in this file, same family as T-386's: the gate refused without
      saying which rule it applied. Under NULL focus (the state --status work-completed
      leaves behind) the post-completion commit IS permitted — git add via
      is_bash_safe_command, git commit via the T-2054 exemption — but a $(...) substitution
      sharing the commit's line defeats the exemption, because T-638 judges each clause of
      the quote-stripped command and the substitution's contents become a clause that is
      not commit-only. The block message named neither the cause nor the way through, so
      the deadlock was inferred rather than measured and written into our gap register as
      "jointly unsatisfiable" (G-047), where it justified proposals to make work-completed
      non-terminal. It never needed to be.

      The diff adds a conditional advisory to the existing null-focus block, printed only
      when the refused command contains `git commit`. No admission logic is touched — the
      same commands are allowed and refused before and after; only the refusal explains
      itself. Owed upstream because the misdiagnosis is a property of the message, and any
      consumer reading that message will reach the same wrong conclusion we did.

      Measured, all under null focus: `echo hi; fw git commit` -> allowed;
      `git add x; fw git commit` -> allowed; `echo "n=$(wc -l < f)"; fw git commit` ->
      BLOCKED; `echo "n=$(wc -l < f)"; git add y` -> allowed (control — the substitution
      alone is not the cause; the pairing is).

      Witness: tools/_t662-null-focus-commit-path-must-be-discoverable.sh, 9 legs, driving
      the real hook via its stdin JSON envelope against a null-focus fixture root. The
      first draft asserted "add and commit cannot share a line" and FAILED — the claim was
      wrong, not the gate; both directions are now pinned so the message cannot drift back
      to the wrong explanation.

  - path: .agentic-framework/web/templates/approvals.html
    kind: content
    task: T-772
    upstream: fix
    reason: >-
      GENERIC upstream debt — the 10s htmx poll silently reverts the operator's own
      disclosure choice, so a feature upstream deliberately shipped cannot be used.
      T-2406 added `?expand=verifications` as the opt-in that opens the Verifications
      overflow, because the closed default is T-2103's page-height cap. The polling
      container at approvals.html:238 requests `/approvals/content` with NO query string,
      and `_read_expand_overflow()` (approvals.py:520) reads the param off that request.
      So every 10 seconds the expanded fragment is replaced by a collapsed one.

      The opt-in therefore survives first paint and nothing else. Worse, and this is what
      the operator actually hit: opening the disclosure BY HAND has the same fate, because
      the poll swaps the whole container. Measured in a real browser, not with curl —
      manually setting details.open = true on /approvals, then waiting one poll cycle,
      returns open === false. With the param and this fix, open === true after the same
      wait, with the page title advancing to "(77 pending)" to prove the poll fired.

      The reason this survived is that a single GET never polls. The route was verified by
      fetch, reported to the operator as working, and the operator found 57 top-priority
      rulings unreachable by any route in the UI (G-055, T-771).

      The diff is one line: the poll URL carries `?expand=verifications` only when
      expand_overflow is already set. The default is unchanged — /approvals with no param
      still renders and still polls without it, so T-2103's height cap is untouched. Owed
      upstream because the defect is in the template every consumer vendors, and any
      consumer whose operator uses the opt-in will lose it the same way.

  - path: .agentic-framework/agents/task-create/create-task.sh
    kind: content
    task: T-774
    upstream: fix
    reason: >-
      GENERIC upstream debt — the task generator corrupts tasks whose NAME contains one of
      its own frontmatter keys, and silently empties the field it failed to fill.

      Every frontmatter substitution was an unanchored first-match replace over a document
      into which the user-supplied name had ALREADY been injected two lines earlier, so the
      match could land inside the name. Reported as OBS-363 against the ownership field
      alone; measured under T-774 to reach at least seven keys, in two severities. For the
      count=1 keys (owner, workflow_type, created, last_update, description) the name is
      corrupted AND THE FIELD IS LEFT EMPTY, because the single substitution was spent
      inside the name and never reached its own line — an empty ownership field breaks
      ownership resolution and the audit's compliance checks. For the unbounded keys
      (status, horizon, tags, related_tasks) the name is corrupted but the field survives,
      because every occurrence is replaced including its own.

      Reproduced against the shipped script, not a transcription of its logic:
      --name 'SQ-9 upstream: report the owner:human-with-zero-ACs fault' --owner agent
      produced name '...report the owner: agenthuman-with-zero-ACs fault' and owner: empty.

      The fix replaces the first FRONTMATTER LINE THAT STARTS WITH the key, so a key
      appearing mid-line inside a value can no longer capture the substitution. Applied to
      BOTH template branches — the inception and default blocks are near-duplicates and
      fixing one would have left every inception task exposed.

      Owed upstream because the defect is in the generator every consumer vendors, and it
      is self-concealing in a specific way: PL-164 — prose about a string-matching
      mechanism contains the string it matches, so the tasks most likely to trip it are the
      ones filed to describe it.

      Known limits, filed rather than buried: a newline inside --name defeats the anchoring
      entirely and yields unparseable frontmatter (OBS-364), and a name containing the id
      placeholder is still rewritten by the body-wide pass T-660 added (OBS-365). Neither
      is introduced by this change and neither is fixed by it.

      Probe: tools/_t774-create-task-substitution-probe.sh — 13 legs across both branches,
      with a negative control that rebuilds the pre-fix substitution in a throwaway copy
      and REQUIRES the defect to reappear.

  - path: .agentic-framework/agents/task-create/create-task.sh
    kind: content
    task: T-775
    upstream: fix
    reason: >-
      GENERIC upstream debt — the generator emits frontmatter that YAML refuses to parse
      when a name or description contains a line break, and reports the task as created.

      Two mechanisms, one root cause: user input is injected into YAML without regard for
      line structure. Both reproduced against the shipped script, both confirmed by
      yaml.safe_load raising a different exception:

        --name with a break      -> `name: "line one` on one line and the remainder on the
                                    next. That injected line STARTS WITH a frontmatter key,
                                    so it captures the substitution T-774 anchored and
                                    leaves the real field empty. ParserError.
                                    This is the ONE input that defeats T-774's fix — the
                                    anchor honours lines, so an input that manufactures a
                                    line wins.
        --description multi-line -> `description: >` is a folded block scalar and only the
                                    first line carried the block indent, so the block
                                    terminated and the continuation parsed as a top-level
                                    key. ScannerError.

      The two halves are fixed differently on purpose. A line break in the NAME is REFUSED
      at the input boundary with a message naming the field and the alternative: a name
      becomes a YAML scalar, an H1 and a filename slug, and it is none of those with a
      break in it. Refused rather than silently stripped — quietly rewriting the operator's
      input is the same class of defect as the substitution bug next to it. A multi-line
      DESCRIPTION is EMITTED CORRECTLY, every line carrying the block indent, because the
      description is the one field with a real reason to span lines and refusing it would
      be fixing the bug by deleting the feature.

      Probe: tools/_t775-create-task-linebreak-probe.sh — 6 legs. Its negative controls run
      the GENUINE pre-fix script, retrieved with `git show <commit>:<path>`, rather than a
      reconstruction of what it used to do; a reconstruction only proves the reconstruction
      behaves as written. Both controls reproduce the original exceptions. One leg is a
      control on the guard itself — an ordinary single-line name must still be accepted, so
      a guard that refused everything could not score green.

      NOT fixed here, and registered as G-061 rather than left implied: nothing parses the
      frontmatter the generator has just written. Three defects of this family landed in
      this one creation path within two days (OBS-363, OBS-364, OBS-365) and not one was
      caught by a check — the first was noticed by a human reading a task file. A read-back
      would have caught two of the three at the moment of creation.

  - path: .agentic-framework/agents/task-create/create-task.sh
    kind: content
    task: T-776
    upstream: fix
    reason: >-
      GENERIC upstream debt — the generator rewrote the operator's own task NAME when that
      name contained the id placeholder token, on both template branches.

      T-660 added a body-wide substitution of the placeholder by the allocated id for a
      real reason, and that reason still holds: without it every inception shipped
      `Run: fw task review <placeholder>` as the operator's literal first step, and an AC
      whose first step cannot be pasted costs a reconstruction before the operator can even
      begin. Nine of ten unruled inceptions carried it, and a peer reported the identical
      string in their own tree — which is how a shared template announces itself.

      The defect was ORDER, not intent. That pass ran at the END, after the user-supplied
      name had been injected into the document, so it hit the name too. Measured on both
      branches: a task named 'build tasks ship the literal <placeholder> placeholder' came
      out as '... T-996 ...'.

      Fix: the substitution now runs ONCE, immediately after the template is read and
      before any user text enters the document, and the H1 anchors carry the real id
      because that pass has already run. The late second pass is removed. T-660's behaviour
      is unchanged from the consumer's point of view.

      Probe: tools/_t776-create-task-placeholder-probe.sh — 5 legs, negative control from
      the genuine pre-fix script via `git show <commit>:<path>`. Two legs exist
      specifically to stop the WRONG fix: asserting only that the name survives would pass
      just as well if the substitution had been DELETED, silently restoring the defect
      T-660 was built to fix. So one leg asserts the review command still carries the real
      id, and another asserts an ordinary task comes out with zero literal placeholders
      anywhere in the file.

      Third of three in this family (OBS-363, OBS-364, OBS-365). G-061 — nothing parses the
      frontmatter the generator has just written — is NOT closed by any of them.
  - path: .agentic-framework/lib/inception.sh
