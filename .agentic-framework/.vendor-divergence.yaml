  - path: .agentic-framework/web/test_app.py
    kind: content
    task: T-645, T-648
    upstream: fix
    reason: >-
      The fragment tests asserted `"<!DOCTYPE" not in html` — a CHARACTER SCAN standing in for
      a STRUCTURAL property. HTML tag names are case-insensitive and Python's `in` is not, and
      a substring cannot tell whether it sits in a comment, a script body, or an attribute
      value. Measured, it was wrong in both directions: `<HTML><BODY>x</BODY></HTML>`,
      `<!doctype html><p>x</p>`, `<body><p>x</p></body>` and `<Html lang="en">` all PASSED a
      test meant to reject document shells, while `<!-- <html> -->` and a `<script>` string
      containing "<html>" FAILED on text that is not markup. Four ways to ship a whole
      document past the test, two ways to be failed by prose. Now asks html.parser, which
      lowercases tag names and treats script bodies as CDATA. The detector gets its own
      parametrised tests — it is the new instrument, so it is not trusted for being short.

  - path: .agentic-framework/web/test_costs.py
    kind: content
    task: T-648
    upstream: fix
    reason: >-
      Third call site of the same substring scan described under test_app.py, converted to the
      shared `document_shell` fixture. Found by grepping for the SHAPE of the original
      instance rather than waiting for it to fail — the assertion also now names which
