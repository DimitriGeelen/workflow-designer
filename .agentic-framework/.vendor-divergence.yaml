      install it points somewhere with no web/ at all. Measured on the real entry point:
      `fw ask "what is a task"` -> ModuleNotFoundError: No module named 'web'. Both roots are
      now inserted, PROJECT_ROOT still first-searched so a project may deliberately shadow a
      module. UPSTREAM: `fw ask` is unrunnable in every vendored install without this.

  - path: .agentic-framework/web/conftest.py
    kind: content
    task: T-648
    upstream: fix
    reason: >-
      Adds the shared `document_shell` fixture. It lives in conftest rather than test_app.py
      because test_costs.py importing from a sibling test module would make one suite's
      collection depend on another's. Three call sites, one definition. See test_app.py below
