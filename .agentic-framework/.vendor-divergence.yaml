    upstream: fix
    reason: >-
      `fw inception decide` refused the HUMAN at the moment of deciding with "Task review
      required before decision" (15 hits in 832 transcripts, 2 in runme logs). The marker it
      checks (.context/working/.reviewed-<id>) is a side effect of the AGENT-side `fw task
