purpose: "Derives Component Fabric edges for the Arc-0 component set by extracting
  references from each file's own non-comment bytes, in both directions (forward from
  the 28 members, inbound from every tracked code file). Recognises full paths, Python
  imports, and unique basenames; refuses ambiguous bare names. Language-aware comment
  stripping keeps mentions from becoming edges (T-669: mention is not invocation)."

