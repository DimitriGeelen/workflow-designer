purpose: 'T-320 — rule-form parity guard. `tools/validate-workflow.py` carries two validators: `Validator` (canonical YAML
  form) and `XmlValidator` (BPMN form). A rule present on one form and absent on the other means files on the unguarded form
  can sit in `fixtures/valid/` asserting a cleanliness nothing ever evaluated. T-317 found that the expensive way. This guard
  keeps the class from growing silently...'
