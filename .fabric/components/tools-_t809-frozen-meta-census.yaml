purpose: "Opens every rendered corpus document and counts, per task-like node, which of the
  four FROZEN v1 governance meta-keys (horizon, workflowType, tier, agentType) are actually
  emitted — the assertion the frozen standard's §2 MUST requires and that nothing in tests/
  performs. test_mapping_standard_conformance.py exits 0 comparing two Python lists and never
  opens a document; this parses the XML. Ratchets coverage against
  _t809-frozen-meta-baseline.txt: coverage may rise, may not fall. Deliberately NOT a
  conformance gate — whether the corpus gains the keys or the standard changes is an open
  sovereign question (value review §12 Q3), so this prevents regression without pre-empting
  the ruling."
purpose_source: "authored at creation by T-809"

