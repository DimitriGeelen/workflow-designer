purpose: "Writes one Component Fabric card per member of the Arc-0 component set,
  consuming the derived-edge TSV. Purposes are sourced from each file's own docstring
  or header rather than invented; edges come from the TSV rather than from hand. Cards
  outside the Arc-0 set are never touched. Purpose overrides live in the generator, not
  in the cards, so regeneration stays idempotent."

