purpose: 'T-544 teeth — the session cookie must be named for the port actually bound. `web/app.py` scopes the Flask session
  cookie by port on purpose. Its own comment (T-2278) says why: RFC 6265 does not scope cookies by port, so two Watchtowers
  on one host share `SESSION_COOKIE_NAME` and each overwrites the other''s session, breaking CSRF on every cross-instance
  POST. The defence was reading the wrong po...'
