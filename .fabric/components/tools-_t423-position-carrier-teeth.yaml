id: tools/_t423-position-carrier-teeth.py
name: _t423-position-carrier-teeth
type: script
subsystem: verification
location: tools/_t423-position-carrier-teeth.py
tags: [teeth, guard-proof, bpmn, t-423, arc-designer-authoring-surface, hermetic]

purpose: >
  Proves tools/_t423-position-carrier-guard.py FIRES (PL-070: a guard whose teeth never run
  is a guard nobody has checked). Six legs, all against copies built under mkdtemp and
  pointed at with T423_CORPUS — the real corpus is opened read-only and never written, which
  matters here because _t350's header records an earlier mutation harness in this repo whose
  safety stub silently failed and deleted the repository. Legs: (1) control, unmutated copy
  green; (2) one aef:position deleted -> red, naming the node — AEF's exact shape; (3) a whole
  map stripped -> red; (4) a stray position added under a NON-node's extensionElements -> red
  on location while every node still carries its own, which is what proves the location
  assertion is separate from the count one; (5) empty corpus -> REFUSAL not a pass, without
  which deleting the corpus would satisfy the guard; (6) anti-overfit — coordinates changed
  but every carrier present -> still GREEN, which separates this from a guard that reddens on
  any diff. Has no hand-wired caller by design: T-509's instrument sweep discovers every
  tools/*teeth* by name, and that is the standing caller the sweep was built to provide.

depends_on:
  - target: tools/_t423-position-carrier-guard.py
    type: calls
  - target: examples/aef-processes/rendered
    type: reads

depended_by:
  - target: tools/_t509-instrument-sweep.sh
    type: calls

