purpose: >
  Measures the priority composition of what the /approvals overflow disclosure hides, and
  prints the operator route that bypasses it. The page's summary calls everything behind it
  "lower priority"; that text is generated from list position, never from the hidden set, so
  the claim cannot be wrong in any way the page can detect. Measured 2026-09-21: 53 of 57
  hidden items sat in the same top-priority group as the 10 shown. Detection only — nothing
  schedules it and the label is unchanged (G-055).

