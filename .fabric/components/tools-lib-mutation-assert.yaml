id: tools/lib/mutation-assert.sh
name: mutation-assert
type: script
subsystem: verification-probes
location: tools/lib/mutation-assert.sh
tags: [prober, mutation-testing, shared-lib, T-661]

purpose: >
  Single writer for "did this mutation actually land?" in the tools/_t*.sh prober
  family. Asserts the PRE-mutation form is gone (before >= 1, after == 0) rather than
  counting the substituted marker, so N correct call sites stay green and a rotted sed
  anchor is named (STALE ANCHOR) apart from a half-applied one (MUTATION INCOMPLETE).
  Exists because PL-061 named this defect a month before seven probers committed it:
  the fix for a known-but-unapplied rule is a callable, not a better-worded learning.

