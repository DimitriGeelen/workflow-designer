# inception-review — AEF inception review-ready → decision flow, dogfood corpus (T-039).
#
# Ground truth: lib/review.sh (emit_review) + lib/inception.sh (decide) + the
# T-973 review-marker gate. Generated by the Workflow Designer product side
# (authoring + validation only) — NOT executed.
#
# This is the flow the operator lives every time an inception is presented:
# `fw task review T-XXX` produces a Watchtower link + QR + artifacts list and
# writes a `.reviewed-T-XXX` marker; the human then records
# `fw inception decide T-XXX go|no-go|defer`.
#
# Lanes = AEF authority model:
#   agent     = initiative   (REQUESTS review; fills recommendation/criteria)
#   framework = authority    (gates readiness, validates link, emits URL/QR/marker,
#                             records the decision)
#   human     = sovereignty  (reviews artifacts; decides go/no-go/defer)
#
# It carries the two universal frictions: F3 (determinism — fw-verb steps are
# deterministic, the agent's recommendation authoring is stochastic, the review
# is human) and F1 (the human go/no-go/defer decision → outgoing edges). A
# readiness LOOP (placeholder recommendation → agent fixes → re-request) makes it
# a small cyclic state machine, not a straight line.
#
# Layout note (T-042): node y-coords are placed inside each lane's rendered band.
# The editor stacks bands by cumulative `height` from POOL_Y+POOL_HEADER=62 and
# honours aef:position verbatim, so coords must respect band boundaries:
#   agent      [62, 262]   center 162
#   framework  [262, 522]  center 392
#   human      [522, 722]  center 622
# The go/no-go/defer and end-event fans are centred in the framework band with a
# 92px pitch (28px gaps between 64px boxes). tools/check-lane-bands.py gates this.
workflowMeta:
  id: inception-review
  version: 1
  schemaVersion: 2
  source: lib/review.sh + lib/inception.sh
  tier_default: 1

pool:
  id: Pool_inception_review
  name: inception-review

lanes:
  - id: agent
    name: "Agent · Initiative"
    abbr: agt
    authority: initiative
    height: 200
  - id: framework
    name: "Framework · Authority"
    abbr: frw
    authority: authority
    height: 260
  - id: human
    name: "Human · Sovereignty"
    abbr: hum
    authority: sovereignty
    height: 200

nodes:
  - uid: n_request
    type: startEvent
    name: Agent runs `fw task review`
    slug: request
    lane: agent
    x: 120
    y: 144
    aef:
      determinism: deterministic   # fw verb
      endpoint: fw task review T-XXX

  - uid: n_readiness
    type: scriptTask
    name: Audit recommendation + go/no-go criteria (placeholder detector)
    slug: readiness
    lane: framework
    x: 340
    y: 360
    aef:
      determinism: deterministic
      # emit_review → audit_inception_recommendation: blocks on placeholder
      sideEffect: none (read-only gate)

  - uid: n_ready_gate
    type: exclusiveGateway
    name: Recommendation ready?
    slug: ready-gate
    lane: framework
    x: 560
    y: 368
    aef:
      decisionInput: ${ready}
      decisionOwner: framework       # data-condition, not human → no F1

  - uid: n_fix
    type: scriptTask
    name: Agent fills recommendation + go/no-go criteria
    slug: fix
    lane: agent
    x: 340
    y: 130
    aef:
      determinism: stochastic        # agent authors rationale/criteria

  - uid: n_linkcheck
    type: scriptTask
    name: Validate review link resolves (review_link_validator --enforce)
    slug: linkcheck
    lane: framework
    x: 760
    y: 360
    aef:
      determinism: deterministic

  - uid: n_emit
    type: scriptTask
    name: Emit Watchtower URL + QR + artifacts; write `.reviewed-` marker
    slug: emit
    lane: framework
    x: 980
    y: 360
    aef:
      determinism: deterministic
      # T-973: the marker is what unblocks `fw inception decide`
      sideEffect: write .context/working/.reviewed-T-XXX

  - uid: n_review
    type: userTask
    name: Human opens link — reviews recommendation, artifacts, criteria
    slug: review
    lane: human
    x: 1200
    y: 590
    aef:
      determinism: human
      authority: sovereignty
      # 3-way human decision; no first-class decision->edge (F1)
      decisionOutputs: go, no-go, defer
      endpoint: Watchtower /inception/T-XXX  |  fw inception decide

  - uid: n_decide
    type: exclusiveGateway
    name: Decision?
    slug: decide
    lane: human
    x: 1420
    y: 598
    aef:
      decisionInput: ${decision}
      decisionOwner: human

  - uid: n_go
    type: scriptTask
    name: Record GO — complete inception, unlock build tasks
    slug: go
    lane: framework
    x: 1640
    y: 268
    aef:
      determinism: deterministic
      endpoint: fw inception decide T-XXX go

  - uid: n_nogo
    type: scriptTask
    name: Record NO-GO — close inception, no build
    slug: nogo
    lane: framework
    x: 1640
    y: 360
    aef:
      determinism: deterministic
      endpoint: fw inception decide T-XXX no-go

  - uid: n_defer
    type: scriptTask
    name: Record DEFER — set revisit_at (G-053 daily scan)
    slug: defer
    lane: framework
    x: 1640
    y: 452
    aef:
      determinism: deterministic
      endpoint: fw inception decide T-XXX defer

  - uid: n_end_go
    type: endEvent
    name: Inception decided — build authorised
    slug: end-go
    lane: framework
    x: 1860
    y: 282

  - uid: n_end_nogo
    type: endEvent
    name: Inception closed — no build
    slug: end-nogo
    lane: framework
    x: 1860
    y: 374

  - uid: n_end_defer
    type: endEvent
    name: Inception parked — revisit scheduled
    slug: end-defer
    lane: framework
    x: 1860
    y: 466

edges:
  - uid: e_01
    source: n_request
    target: n_readiness
  - uid: e_02
    source: n_readiness
    target: n_ready_gate
  - uid: e_03
    source: n_ready_gate
    target: n_fix
    name: placeholder / not ready
    condition: ${ready == false}
  - uid: e_04
    source: n_ready_gate
    target: n_linkcheck
    name: ready
    condition: ${ready == true}
  - uid: e_05
    source: n_fix
    target: n_request
    name: re-request review
  - uid: e_06
    source: n_linkcheck
    target: n_emit
  - uid: e_07
    source: n_emit
    target: n_review
  - uid: e_08
    source: n_review
    target: n_decide
  - uid: e_09
    source: n_decide
    target: n_go
    name: go
    condition: ${decision == 'go'}
  - uid: e_10
    source: n_decide
    target: n_nogo
    name: no-go
    condition: ${decision == 'no-go'}
  - uid: e_11
    source: n_decide
    target: n_defer
    name: defer
    condition: ${decision == 'defer'}
  - uid: e_12
    source: n_go
    target: n_end_go
  - uid: e_13
    source: n_nogo
    target: n_end_nogo
  - uid: e_14
    source: n_defer
    target: n_end_defer
