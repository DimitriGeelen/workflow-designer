# resume-status — the AEF post-compaction recovery flow: "fw resume status"
# synthesizes current state from independent persisted sources after context
# loss (CLAUDE.md §Session Start Protocol, "After context compaction"). Dogfood
# corpus (T-066). Read-side counterpart of the mapped session-handover flow.
#
# Ground truth: .agentic-framework/agents/resume/resume.sh
#   cmd_status 90-276        — the status synthesis (this map)
#   get_session 81 / get_focus 72   — working memory reads
#   get_git_state 61         — git status/log/branch
#   get_active_tasks 30      — task census (actionable vs awaiting-human)
# Generated by the Workflow Designer product side (authoring + validation only) —
# NOT executed.
#
# Lanes = AEF authority model (human absent: mechanical, read-only, advisory):
#   agent     = initiative  — runs resume after compaction / when lost.
#   framework = authority   — reads the persisted memory surfaces, synthesizes.
#
# FIDELITY NOTES (see docs/reports/T-066-resume-status-friction.md):
#  1. The seven gathers are INDEPENDENT reads executed SEQUENTIALLY by bash.
#     Drawn sequentially (control-flow fidelity). The dependency truth ("order
#     doesn't matter, any subset may be absent") is unexpressible: the schema
#     has no parallelGateway — audit-process stashed fork/join in
#     aef.gatewayKind for the same reason (FC recurrence).
#  2. n_intel collapses THREE optional intelligence sources (discoveries, scan,
#     recent research) into one node — FC-11 collapse, constituents declared
#     via aef.x-sources (the T-062 channel, per git-commit-flow precedent).
#  3. The BVP focus-scoring side quest (resume.sh 104-116, advisory, timeout-
#     guarded) is omitted as out-of-frame — noted, not drawn.
workflowMeta:
  id: resume-status
  version: 1
  schemaVersion: 2
  source: agents/resume/resume.sh
  tier_default: 1

pool:
  id: Pool_resume_status
  name: resume-status

lanes:
  - id: agent
    name: "Agent · Initiative"
    abbr: agt
    authority: initiative
    height: 140
  - id: framework
    name: "Framework · Authority"
    abbr: frw
    authority: authority
    height: 400

nodes:
  - uid: n_start
    type: startEvent
    name: "fw resume status"
    slug: start
    lane: agent
    x: 90
    y: 140
    aef:
      determinism: deterministic
      triggeredBy: "agent — after compaction, returning from break, or feeling lost (agents/resume/AGENT.md)"

  - uid: n_wm
    type: scriptTask
    name: "read working memory: session + focus"
    slug: wm
    lane: framework
    x: 170
    y: 280
    aef:
      tier: 1
      determinism: deterministic
      endpoint: "resume.sh:95-99 (get_session:81, get_focus:72)"
      contextReads: ".context/working/session.yaml, .context/working/focus.yaml"
      note: "may be STALE after compaction — that is why resume exists; cmd_sync repairs it"

  - uid: n_git
    type: scriptTask
    name: "read git state: uncommitted, last commit, branch"
    slug: git
    lane: framework
    x: 310
    y: 280
    aef:
      tier: 1
      determinism: deterministic
      endpoint: "resume.sh:119-127 (get_git_state:61-70)"
      contextReads: "git status --short, git log -1 --oneline, current branch"

  - uid: n_tasks
    type: scriptTask
    name: "census active tasks: actionable vs awaiting-human"
    slug: tasks
    lane: framework
    x: 450
    y: 280
    aef:
      tier: 1
      determinism: deterministic
      endpoint: "resume.sh:130-144 (get_active_tasks:30-59)"
      contextReads: ".tasks/active/*.md frontmatter (status, owner)"

  - uid: g_ho
    type: exclusiveGateway
    name: "handover LATEST.md exists?"
    slug: ho
    lane: framework
    x: 590
    y: 288
    aef:
      determinism: deterministic
      endpoint: resume.sh:147
      decisionInput: "${-f .context/handovers/LATEST.md}"
      decisionOwner: framework
      decisionOutputs: found, missing

  - uid: n_ho
    type: scriptTask
    name: "parse handover: staleness, Where-We-Are, Suggested Action, Open Qs"
    slug: parse-ho
    lane: framework
    x: 670
    y: 250
    aef:
      tier: 1
      determinism: deterministic
      endpoint: "resume.sh:148-186 ([TODO] count -> stale WARN; sed section extracts)"
      contextReads: ".context/handovers/LATEST.md"
      softFail: advisory
      guard: "[TODO] count > 0 -> 'handover has unfilled sections' WARN (does not abort)"

  - uid: n_noho
    type: scriptTask
    name: "degrade: 'No handover found'"
    slug: no-ho
    lane: framework
    x: 670
    y: 370
    aef:
      determinism: deterministic
      endpoint: resume.sh:187-188
      softFail: advisory
      note: "synthesis proceeds from the remaining sources — every source is optional"

  - uid: n_intel
    type: scriptTask
    name: "gather optional intelligence: discoveries, scan, recent research"
    slug: intel
    lane: framework
    x: 810
    y: 280
    aef:
      tier: 1
      determinism: deterministic
      endpoint: "resume.sh:192-257 (three independent if-exists blocks)"
      x-sources: ".context/audits/discoveries/LATEST.yaml (WARN/FAIL only); .context/scans/LATEST.yaml (work queue, needs-decision); docs/reports/*.md mtime<7d"
      note: "FC-11 collapse — three optional sources, one node; each skipped silently if absent"

  - uid: n_synth
    type: scriptTask
    name: "rule cascade → Recommendations"
    slug: synth
    lane: framework
    x: 950
    y: 280
    aef:
      determinism: deterministic
      endpoint: resume.sh:259-272
      guard: "no tasks -> create/review; focus set -> continue focus; else -> set focus; plus: uncommitted>0 -> commit with task ref"
      decisionOwner: framework

  - uid: n_report
    type: endEvent
    name: "state synthesized (advisory)"
    slug: report
    lane: framework
    x: 1090
    y: 294
    aef:
      terminalKind: success
      state: reported
      exitCode: 0
      advisory: true
      note: "informs the agent's next action; resume sync exists to repair stale memory"

edges:
  - { uid: e1, source: n_start, target: n_wm }
  - { uid: e2, source: n_wm, target: n_git }
  - { uid: e3, source: n_git, target: n_tasks }
  - { uid: e4, source: n_tasks, target: g_ho }
  - { uid: e5, source: g_ho, target: n_ho, name: "found", condition: "latest_exists" }
  - { uid: e6, source: g_ho, target: n_noho, name: "missing", condition: "!latest_exists" }
  - { uid: e7, source: n_ho, target: n_intel }
  - { uid: e8, source: n_noho, target: n_intel }
  - { uid: e9, source: n_intel, target: n_synth }
  - { uid: e10, source: n_synth, target: n_report }
