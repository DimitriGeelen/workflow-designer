# assumption-validation — AEF assumption lifecycle, dogfood corpus (T-028).
#
# Ground truth: lib/assumption.sh (add/validate/invalidate; lifecycle
# untested -> validated | invalidated, :59-61). Generated by the Workflow
# Designer product side (authoring + validation only) — NOT executed.
#
# Lanes = AEF authority model: human = sovereignty (may adjudicate evidence),
# framework = authority (records status + spawns gaps/risks), agent = initiative
# (registers assumptions, gathers + supplies evidence).
#
# Friction-dry probe: this simple evidence-gated state machine surfaces only
# RECURRING friction (F3,F5,F7,F8,F10) and NO new gap — the convergence signal.
# See docs/reports/T-028-assumption-validation-friction.md.
workflowMeta:
  id: assumption-validation
  version: 1
  schemaVersion: 2
  source: lib/assumption.sh
  tier_default: 1

pool:
  id: Pool_assumption_validation
  name: assumption-validation

lanes:
  - id: human
    name: "Human · Sovereignty"
    abbr: hum
    authority: sovereignty
    height: 140
  - id: framework
    name: "Framework · Authority"
    abbr: frw
    authority: authority
    height: 220
  - id: agent
    name: "Agent · Initiative"
    abbr: agt
    authority: initiative
    height: 200

nodes:
  - uid: n_req
    type: startEvent
    name: Assumption identified (linked to a task)
    slug: identified
    lane: agent
    x: 120
    y: 300
    aef:
      triggeredBy: fw assumption add '<statement>' --task T-XXX
    io:
      outputs:
        - { name: statement, type: string }
        - { name: task_id, type: task_id }

  - uid: n_add
    type: scriptTask
    name: Register assumption (A-NNN, status untested)
    slug: register
    lane: framework
    x: 320
    y: 300
    aef:
      state: untested
      tier: 1
      determinism: deterministic
      endpoint: lib/assumption.sh:do_assumption_add
      artifactsWrites: assumptions.yaml     # datastore write (F10)
    io:
      outputs:
        - { name: assumption_id, type: string }

  - uid: n_gather
    type: serviceTask
    name: Gather evidence (research / test)
    slug: gather
    lane: agent
    x: 520
    y: 480
    aef:
      tier: 2
      agentType: primary
      determinism: stochastic               # evidence-gathering is open-ended (F3)
    io:
      outputs:
        - { name: evidence, type: string }

  - uid: n_assess
    type: exclusiveGateway
    name: Evidence supports the assumption?
    slug: assess
    lane: agent
    x: 720
    y: 300
    aef:
      # data-condition branch (NOT a human decision) — expressible cleanly in v2;
      # this is why the slice yields no new friction here
      decisionInput: ${evidence_supports}
      decisionOwner: agent

  - uid: n_validate
    type: scriptTask
    name: Mark validated (evidence required)
    slug: validate
    lane: framework
    x: 920
    y: 180
    aef:
      state: validated
      tier: 1
      determinism: deterministic
      endpoint: fw assumption validate ${assumption_id} --evidence '...'
      guard: evidence required (F8)

  - uid: n_invalidate
    type: scriptTask
    name: Mark invalidated (evidence required)
    slug: invalidate
    lane: framework
    x: 920
    y: 420
    aef:
      state: invalidated
      tier: 1
      determinism: deterministic
      endpoint: fw assumption invalidate ${assumption_id} --evidence '...'
      guard: evidence required (F8)

  - uid: n_gap
    type: scriptTask
    name: Invalidated → register as gap / risk
    slug: to-gap
    lane: framework
    x: 1120
    y: 420
    aef:
      tier: 1
      determinism: deterministic
      # invalidated assumptions become gaps/risks — cross-process handoff, a
      # sub-process with no callActivity (F5); writes the gaps register (F10)
      autoTrigger: gaps register entry
      autoTriggerKind: sub-process

  - uid: n_end_validated
    type: endEvent
    name: Assumption validated
    slug: end-validated
    lane: framework
    x: 1120
    y: 180
    aef:
      emits: event:assumption.validated

  - uid: n_end_gap
    type: endEvent
    name: Invalidated → gap/risk registered
    slug: end-gap
    lane: framework
    x: 1320
    y: 420
    aef:
      emits: event:assumption.invalidated

edges:
  - uid: e_01
    source: n_req
    target: n_add
  - uid: e_02
    source: n_add
    target: n_gather
  - uid: e_03
    source: n_gather
    target: n_assess
  - uid: e_04
    source: n_assess
    target: n_validate
    name: supported
    condition: ${evidence_supports == true}
  - uid: e_05
    source: n_assess
    target: n_invalidate
    name: refuted
    condition: ${evidence_supports == false}
  - uid: e_06
    source: n_validate
    target: n_end_validated
  - uid: e_07
    source: n_invalidate
    target: n_gap
  - uid: e_08
    source: n_gap
    target: n_end_gap
