# release-pipeline — AEF release tagging + GitHub Release (fw release), dogfood corpus (T-047).
#
# Ground truth: .agentic-framework/lib/release.sh — release_tag_and_release (L.69-146)
#   parse flags (L.75-83) · latest v* tag (L.85-90) · commits-since count + idempotent
#   no-op (L.92-98) · bump version (L.100-101) · dry-run short-circuit (L.103-106) ·
#   create annotated tag (L.108-113) · push tag to EVERY remote in a loop (L.116-127) ·
#   best-effort GitHub Release if gh present (L.129-143) · return $failed (L.145).
# Generated by the Workflow Designer product side (authoring + validation only) — NOT executed.
#
# What this map surfaces (see docs/reports/T-047-release-friction.md):
#   - FC-5 (NEW headline): a LOOP over a runtime collection — "push tag to every remote".
#     BPMN models this as a multi-instance activity; the schema has no marker, so it is
#     carried on n_push via aef.multiInstance + aef.collection. Unrollable only at run time.
#   - FC-1 sharpens into TWO soft-fail flavors: n_gh is purely advisory (WARN never changes
#     exit); the per-remote push is an ACCUMULATING soft-fail (WARN, continue loop, set
#     failed=1 → the final exit code carries it).
#   - FC-6 (NEW): a data-dependent terminal — n_done returns exit 0 OR 1 depending on the
#     `failed` accumulator. One end node, variable exit status.
#   - Three SUCCESS terminals (no-op, dry-run, released) + one ERROR terminal (no tag). The
#     schema draws all endEvents alike; success-vs-error is semantic (aef.terminalKind).
#   - F3: entirely deterministic — NO human, NO stochastic (third consecutive
#     autonomous-automation map after cross-host-dispatch; cron-class flows are human-free).
#
# Authority model:
#   agent     = initiative   (invokes `fw release`, or cron fires it on a weekly schedule)
#   framework = authority    (tag math, gates, annotated-tag creation, loop control, exit code)
#   external  = external      (git remotes receiving the pushed tag; GitHub creating the Release)
#
# Layout (T-042/T-043; labels kept short after T-046 fit-to-view clipping):
#   agent [62,182] · framework [182,542] · external [542,682]. Spine row y=300 (tasks) /
#   y=308 (gateways); terminals in a lower framework row y=430; external nodes y=590.
#   check-lane-bands clean.
workflowMeta:
  id: release-pipeline
  version: 1
  schemaVersion: 2
  source: lib/release.sh
  tier_default: 1

pool:
  id: Pool_release_pipeline
  name: release-pipeline

lanes:
  - id: agent
    name: "Agent / cron · Initiative"
    abbr: agt
    authority: initiative
    height: 120
  - id: framework
    name: "Framework · Authority"
    abbr: frw
    authority: authority
    height: 360
  - id: external
    name: "Remotes + GitHub · External"
    abbr: ext
    authority: external
    height: 140

nodes:
  - uid: n_start
    type: startEvent
    name: Trigger — `fw release` or weekly cron
    slug: start
    lane: agent
    x: 100
    y: 110
    aef:
      determinism: deterministic
      endpoint: fw release

  - uid: n_parse
    type: scriptTask
    name: Parse flags (--dry-run/--bump/--repo)
    slug: parse
    lane: framework
    x: 250
    y: 300
    aef:
      determinism: deterministic
      # L.75-83

  - uid: n_latest
    type: scriptTask
    name: Latest v* tag (git describe)
    slug: latest
    lane: framework
    x: 400
    y: 300
    aef:
      determinism: deterministic
      # L.86 release_latest_tag

  - uid: n_tag_gate
    type: exclusiveGateway
    name: "Any v* tag?"
    slug: tag-gate
    lane: framework
    x: 550
    y: 308
    aef:
      decisionInput: ${latest != ""}
      decisionOwner: framework       # L.87

  - uid: n_no_tag
    type: endEvent
    name: ERROR — no tags, bootstrap first
    slug: no-tag
    lane: framework
    x: 550
    y: 430
    aef:
      terminalKind: error            # L.88-89, return 1

  - uid: n_count
    type: scriptTask
    name: Count commits since tag
    slug: count
    lane: framework
    x: 680
    y: 300
    aef:
      determinism: deterministic
      # L.93 release_commits_since

  - uid: n_commits_gate
    type: exclusiveGateway
    name: "Commits since tag > 0?"
    slug: commits-gate
    lane: framework
    x: 820
    y: 308
    aef:
      decisionInput: ${commits > 0}
      decisionOwner: framework       # L.94

  - uid: n_noop
    type: endEvent
    name: No-op — nothing to release (idempotent)
    slug: noop
    lane: framework
    x: 820
    y: 430
    aef:
      terminalKind: success          # L.95-97, return 0 — success, not error

  - uid: n_bump
    type: scriptTask
    name: Compute next version (bump)
    slug: bump
    lane: framework
    x: 960
    y: 300
    aef:
      determinism: deterministic
      # L.101 release_bump_version — patch/minor/major

  - uid: n_dry_gate
    type: exclusiveGateway
    name: "--dry-run?"
    slug: dry-gate
    lane: framework
    x: 1110
    y: 308
    aef:
      decisionInput: ${dry_run}
      decisionOwner: framework       # L.103

  - uid: n_dryrun
    type: endEvent
    name: Dry-run — would tag, no side effects
    slug: dryrun
    lane: framework
    x: 1110
    y: 430
    aef:
      terminalKind: success          # L.104-105, return 0

  - uid: n_tag
    type: scriptTask
    name: Create annotated tag
    slug: tag
    lane: framework
    x: 1250
    y: 300
    aef:
      determinism: deterministic
      # L.109-113 — git tag -a; failure → error return (inline)
      sideEffect: creates a local annotated git tag

  - uid: n_push
    type: scriptTask
    name: Push tag → every remote (loop)
    slug: push
    lane: framework
    x: 1400
    y: 300
    aef:
      determinism: deterministic
      # L.116-127 — for each remote: git push; WARN + failed=1 on failure, continue
      multiInstance: true            # FC-5: loop over the `remotes` collection
      x-collection: git remotes (runtime set)
      softFail: accumulating         # per-remote WARN does not abort; sets failed=1
      sideEffect: pushes the tag across the host boundary to each remote

  - uid: n_remote
    type: serviceTask
    name: "Remotes receive the pushed tag"
    slug: remote
    lane: external
    x: 1400
    y: 590
    aef:
      determinism: deterministic
      external: true                 # each remote is a separate participant (see FC-3, T-046)
      sideEffect: remote ref updated on each push target

  - uid: n_gh_gate
    type: exclusiveGateway
    name: "gh CLI available?"
    slug: gh-gate
    lane: framework
    x: 1560
    y: 308
    aef:
      decisionInput: ${command -v gh}
      decisionOwner: framework       # L.130

  - uid: n_gh
    type: serviceTask
    name: Create GitHub Release (best-effort)
    slug: gh
    lane: external
    x: 1560
    y: 590
    aef:
      determinism: deterministic
      external: true                 # GitHub — external participant
      softFail: advisory             # L.136-140 — WARN on failure, NEVER changes exit code
      sideEffect: creates a GitHub Release (--generate-notes --latest)

  - uid: n_done
    type: endEvent
    name: Released ✓ (exit = failed)
    slug: done
    lane: framework
    x: 1720
    y: 314
    aef:
      terminalKind: success          # L.145 return $failed — FC-6: exit 0 all-ok / 1 if any push warned

edges:
  - uid: e_01
    source: n_start
    target: n_parse
  - uid: e_02
    source: n_parse
    target: n_latest
  - uid: e_03
    source: n_latest
    target: n_tag_gate
  - uid: e_04
    source: n_tag_gate
    target: n_no_tag
    name: no tags
    condition: ${latest == ""}
  - uid: e_05
    source: n_tag_gate
    target: n_count
    name: has tag
    condition: ${latest != ""}
  - uid: e_06
    source: n_count
    target: n_commits_gate
  - uid: e_07
    source: n_commits_gate
    target: n_noop
    name: "0 commits"
    condition: ${commits == 0}
  - uid: e_08
    source: n_commits_gate
    target: n_bump
    name: "> 0"
    condition: ${commits > 0}
  - uid: e_09
    source: n_bump
    target: n_dry_gate
  - uid: e_10
    source: n_dry_gate
    target: n_dryrun
    name: dry-run
    condition: ${dry_run}
  - uid: e_11
    source: n_dry_gate
    target: n_tag
    name: real run
    condition: ${!dry_run}
  - uid: e_12
    source: n_tag
    target: n_push
  - uid: e_13
    source: n_push
    target: n_remote
    name: push (each remote)
  - uid: e_14
    source: n_remote
    target: n_gh_gate
  - uid: e_15
    source: n_gh_gate
    target: n_gh
    name: gh present
    condition: ${gh_available}
  - uid: e_16
    source: n_gh_gate
    target: n_done
    name: no gh (skip)
    condition: ${!gh_available}
  - uid: e_17
    source: n_gh
    target: n_done
