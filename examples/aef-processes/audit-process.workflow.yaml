# audit-process — AEF compliance audit, dogfood corpus (T-031).
#
# Ground truth: agents/audit/audit.sh. Generated by the Workflow Designer product
# side (authoring + validation only) — NOT executed.
#
# Lanes = AEF authority model: agent = initiative (triggers `fw audit`), framework
# = authority (runs every check section, aggregates the verdict, writes the audit
# record, notifies on failure), human = sovereignty (reads the report + acts on
# priority actions — outside this flow).
#
# FIRST fan-out / scatter-gather shape in the corpus (T-031): `fw audit` forks into
# ~20 logically-independent check sections (should_run_section gates each), every
# section emits pass/warn/fail into shared counters + a FINDINGS[] array, then a
# JOIN reconverges and an AGGREGATE folds all findings into one verdict
# (FAIL>0 → exit 2; WARN>0 → exit 1; else exit 0). Modeled here with a
# representative FIVE of the real ~20 sections. This is the first workflow to use
# `parallelGateway` (fork + AND-join) — the previously-unexercised node type.
#
# New friction this slice: F14 (fan-in AGGREGATION / reduction — folding N branch
# findings into one severity-max verdict has no first-class home; the join only
# reconverges control, it does not combine data). See
# docs/reports/T-031-audit-process-friction.md.
workflowMeta:
  id: audit-process
  version: 1
  schemaVersion: 2
  source: agents/audit/audit.sh
  tier_default: 1

pool:
  id: Pool_audit_process
  name: audit-process

lanes:
  - id: human
    name: "Human · Sovereignty"
    abbr: hum
    authority: sovereignty
    height: 120
  - id: framework
    name: "Framework · Authority"
    abbr: frw
    authority: authority
    height: 420
  - id: agent
    name: "Agent · Initiative"
    abbr: agt
    authority: initiative
    height: 120

nodes:
  - uid: n_trigger
    type: startEvent
    name: Audit requested
    slug: trigger
    lane: agent
    x: 120
    y: 620
    aef:
      triggeredBy: fw audit [--sections ...] | cron

  - uid: n_fork
    type: parallelGateway
    name: Fan out to check sections
    slug: fork
    lane: framework
    x: 320
    y: 360
    aef:
      # AND-fork: all enabled sections run (order-independent, no data dependency
      # between them). should_run_section() may prune branches by the --sections
      # filter — a per-branch activation guard (F8, section-filter variant).
      gatewayKind: fork
      branchesModeledOf: "5 of ~20 real sections"

  - uid: n_compliance
    type: scriptTask
    name: Compliance checks (task refs, gates, structure)
    slug: compliance
    lane: framework
    x: 560
    y: 120
    aef:
      section: compliance
      determinism: deterministic
      emits: [pass, warn, fail]          # into shared PASS/WARN/FAIL_COUNT + FINDINGS[]

  - uid: n_traceability
    type: scriptTask
    name: Traceability checks (commit ↔ task P-002)
    slug: traceability
    lane: framework
    x: 560
    y: 250
    aef:
      section: traceability
      determinism: deterministic
      emits: [pass, warn, fail]

  - uid: n_enforcement
    type: scriptTask
    name: Enforcement checks (hooks, baseline, bypass log)
    slug: enforcement
    lane: framework
    x: 560
    y: 380
    aef:
      section: enforcement
      determinism: deterministic
      emits: [pass, warn, fail]

  - uid: n_learning
    type: scriptTask
    name: Learning / episodic completeness checks
    slug: learning
    lane: framework
    x: 560
    y: 510
    aef:
      section: learning
      determinism: deterministic
      emits: [pass, warn, fail]

  - uid: n_discovery
    type: scriptTask
    name: Discovery checks (D1–D9 trend scans)
    slug: discovery
    lane: framework
    x: 560
    y: 640
    aef:
      section: discovery
      determinism: deterministic
      emits: [pass, warn, fail]

  - uid: n_join
    type: parallelGateway
    name: Join — all sections complete
    slug: join
    lane: framework
    x: 820
    y: 360
    aef:
      # AND-join: waits for every forked branch before the verdict is computable.
      gatewayKind: join

  - uid: n_aggregate
    type: scriptTask
    name: Aggregate findings → tally + audit record
    slug: aggregate
    lane: framework
    x: 1020
    y: 360
    aef:
      determinism: deterministic
      # F14 — FAN-IN AGGREGATION / reduction. The verdict is a fold over the
      # FINDINGS[] collected across all branches: severity-max (any FAIL → fail,
      # else any WARN → warn, else pass). v2's parallel join only reconverges
      # CONTROL flow; it has no construct to COMBINE the branch data. Also writes
      # the durable audit record (F10 datastore).
      aggregation:
        over: FINDINGS[]                 # accumulated across every branch
        reduce: severity-max
        outputs: [PASS_COUNT, WARN_COUNT, FAIL_COUNT]
      artifactsWrites: [".context/audits/${date}.yaml", "LATEST-CRON.yaml"]

  - uid: n_verdict
    type: exclusiveGateway
    name: Worst finding level?
    slug: verdict
    lane: framework
    x: 1220
    y: 360
    aef:
      decisionInput: ${max_severity}     # data-condition (not a human decision → no F1)
      decisionOwner: framework

  - uid: n_notify
    type: scriptTask
    name: Push failure notification (T-709)
    slug: notify
    lane: framework
    x: 1420
    y: 130
    aef:
      determinism: deterministic
      endpoint: lib/notify.sh:fw_notify
      # side-effect on the fail branch only; a sub-process handoff (F5)
      autoTriggerKind: sub-process

  - uid: n_end_fail
    type: endEvent
    name: Audit FAIL (exit 2)
    slug: end-fail
    lane: framework
    x: 1620
    y: 130
    aef:
      exitCode: 2
      emits: event:audit.failed

  - uid: n_end_warn
    type: endEvent
    name: Audit WARN (exit 1)
    slug: end-warn
    lane: framework
    x: 1420
    y: 360
    aef:
      exitCode: 1
      emits: event:audit.warned

  - uid: n_end_pass
    type: endEvent
    name: Audit PASS (exit 0)
    slug: end-pass
    lane: framework
    x: 1420
    y: 590
    aef:
      exitCode: 0
      emits: event:audit.passed

edges:
  - uid: e_trigger_fork
    source: n_trigger
    target: n_fork

  # fork → the five representative branches
  - uid: e_fork_compliance
    source: n_fork
    target: n_compliance
  - uid: e_fork_traceability
    source: n_fork
    target: n_traceability
  - uid: e_fork_enforcement
    source: n_fork
    target: n_enforcement
  - uid: e_fork_learning
    source: n_fork
    target: n_learning
  - uid: e_fork_discovery
    source: n_fork
    target: n_discovery

  # branches → join
  - uid: e_compliance_join
    source: n_compliance
    target: n_join
  - uid: e_traceability_join
    source: n_traceability
    target: n_join
  - uid: e_enforcement_join
    source: n_enforcement
    target: n_join
  - uid: e_learning_join
    source: n_learning
    target: n_join
  - uid: e_discovery_join
    source: n_discovery
    target: n_join

  - uid: e_join_aggregate
    source: n_join
    target: n_aggregate
  - uid: e_aggregate_verdict
    source: n_aggregate
    target: n_verdict

  # verdict → three severity outcomes (fail path routes through notify)
  - uid: e_verdict_fail
    source: n_verdict
    target: n_notify
    name: any FAIL
    condition: ${fail_count > 0}
  - uid: e_verdict_warn
    source: n_verdict
    target: n_end_warn
    name: any WARN (no FAIL)
    condition: ${fail_count == 0 && warn_count > 0}
  - uid: e_verdict_pass
    source: n_verdict
    target: n_end_pass
    name: clean
    condition: ${fail_count == 0 && warn_count == 0}

  - uid: e_notify_end
    source: n_notify
    target: n_end_fail
