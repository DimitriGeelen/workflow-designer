# arc-lifecycle — AEF grouped-work process, dogfood corpus (T-027).
#
# Ground truth: lib/arc.sh, lib/arc_membership.{sh,py}, agents/context/
# check-arc-id.py, lib/evolution_log.sh. Generated by the Workflow Designer
# product side (authoring + validation only) — NOT executed.
#
# Lanes = AEF authority model: human = sovereignty (close/abandon/driver
# approval are human-only, §ACD/G-062), framework = authority (enforces arc_id
# resolution + evolution audit + immutability), agent = initiative (create/
# start/tag/rescore/review).
#
# KEY FINDING: an arc is a TAG-SET / label container, not a graph or a
# sequenced sub-workflow. Membership (arc_id frontmatter / arc: tag) is computed
# on demand, unordered, never stored authoritatively. v2 has no grouping
# construct, so the member set is approximated by a single representative node
# carrying `aef.grouping`. Friction [F1,F4,F6,F7,F8,F9,F11,F13] in
# docs/reports/T-027-arc-lifecycle-friction.md — F13 new (grouping container);
# the rest recur.
workflowMeta:
  id: arc-lifecycle
  version: 1
  schemaVersion: 2
  source: lib/arc.sh
  tier_default: 1

pool:
  id: Pool_arc_lifecycle
  name: arc-lifecycle

lanes:
  - id: human
    name: "Human · Sovereignty"
    abbr: hum
    authority: sovereignty
    height: 160
  - id: framework
    name: "Framework · Authority"
    abbr: frw
    authority: authority
    height: 220
  - id: agent
    name: "Agent · Initiative"
    abbr: agt
    authority: initiative
    height: 220

nodes:
  - uid: n_req
    type: startEvent
    name: Arc proposed (headline mechanic identified)
    slug: proposed
    lane: agent
    x: 120
    y: 560
    aef:
      triggeredBy: fw arc create <id> --name --headline-mechanic
    io:
      outputs:
        - { name: headline_mechanic, type: string }

  - uid: n_create
    type: scriptTask
    name: Create arc (status draft, immutable arc-NNN)
    slug: create
    lane: agent
    x: 300
    y: 560
    aef:
      state: draft
      tier: 1
      determinism: deterministic
      endpoint: lib/arc.sh:344
      # G-062 gate: --headline-mechanic REQUIRED; arc-NNN never reused (F6 immutability)
      artifactsWrites: .context/arcs/<slug>.yaml
    io:
      outputs:
        - { name: arc_id, type: string }

  - uid: n_start
    type: scriptTask
    name: Start arc (draft → in-progress)
    slug: start
    lane: agent
    x: 480
    y: 560
    aef:
      state: in-progress
      tier: 1
      determinism: deterministic
      endpoint: fw arc start ${arc_id}

  - uid: n_tag
    type: serviceTask
    name: "Tag member tasks (arc_id / arc: tag)"
    slug: tag
    lane: agent
    x: 660
    y: 560
    aef:
      tier: 1
      determinism: deterministic
      endpoint: fw arc tag ${arc_id} T-XXXX
      # GROUPING: by-reference, unordered, computed-on-demand membership (F13).
      # v2 has no group/container construct — the member set is a query, not a list.
      x-grouping: "kind=tag-set; membership=computed; ordered=false"
      # ambient membership guard on task writes, group-scoped (F11)
      gate: check-arc-id.py (arc_id must resolve; else block exit 2)
    io:
      outputs:
        - { name: members, type: computed-set }

  - uid: n_bvp
    type: serviceTask
    name: BVP rescore (writes PROPOSED scores only)
    slug: bvp
    lane: agent
    x: 840
    y: 560
    aef:
      tier: 1
      determinism: stochastic       # estimator over member tasks
      advisory: true                # proposes; does not bind scores (F9)
      endpoint: fw arc rescore ${arc_id}

  - uid: n_approve_driver
    type: userTask
    name: Approve value drivers (human-only)
    slug: approve-driver
    lane: human
    x: 1040
    y: 110
    aef:
      tier: 0
      determinism: human
      authority: sovereignty        # binds the advisory BVP proposal (F9); §ACD/G-062
      endpoint: fw arc approve-driver ${arc_id} --i-am-human

  - uid: n_work
    type: serviceTask
    name: Work member tasks (each = own task-lifecycle + Evolution log)
    slug: work-members
    lane: agent
    x: 1240
    y: 560
    aef:
      tier: 2
      determinism: stochastic
      # members are each a full task-lifecycle sub-process (F5), unordered (F13);
      # every arc-member build task must carry a substantive Evolution log —
      # a group-scoped ambient requirement audited by the framework (F11)
      x-subProcessPerMember: task-lifecycle
      x-groupConstraint: evolution-log required on every member (evolution_log.sh:86)

  - uid: n_review
    type: scriptTask
    name: Emit close review surface (Watchtower URL + QR)
    slug: review
    lane: agent
    x: 1420
    y: 560
    aef:
      tier: 1
      determinism: deterministic
      endpoint: fw arc review ${arc_id}     # agent-safe: emits surface only

  - uid: n_close_decide
    type: userTask
    name: Close or abandon? (human-only)
    slug: close-decide
    lane: human
    x: 1600
    y: 110
    aef:
      tier: 0
      determinism: human
      authority: sovereignty
      # human decision → branch (F1); close requires wire-level demo evidence (F8)
      decisionOutputs: close, abandon
      endpoint: watchtower:/arcs/${arc_id}/close  |  fw arc close --i-am-human
      x-requiresForClose: demo_evidence (path|url)

  - uid: n_route
    type: exclusiveGateway
    name: Close or abandon?
    slug: route
    lane: human
    x: 1780
    y: 110
    aef:
      decisionInput: ${decision}
      decisionOwner: human

  - uid: n_close
    type: scriptTask
    name: Close arc (in-progress → closed) + record demo_evidence
    slug: close
    lane: framework
    x: 1960
    y: 300
    aef:
      state: closed
      tier: 1
      determinism: deterministic
      endpoint: lib/arc.sh:643
      note: immutable — arc YAML never moved/deleted (F6)

  - uid: n_abandon
    type: scriptTask
    name: Abandon arc (reason ≥30 chars)
    slug: abandon
    lane: framework
    x: 1960
    y: 370
    aef:
      state: abandoned
      tier: 1
      determinism: deterministic
      endpoint: lib/arc.sh:770
      note: side exit reachable from draft or in-progress too

  - uid: n_end_closed
    type: endEvent
    name: Arc closed (immutable)
    slug: end-closed
    lane: framework
    x: 2160
    y: 300
    aef:
      emits: event:arc.closed

  - uid: n_end_abandoned
    type: endEvent
    name: Arc abandoned (immutable)
    slug: end-abandoned
    lane: framework
    x: 2160
    y: 398
    aef:
      emits: event:arc.abandoned

edges:
  - uid: e_01
    source: n_req
    target: n_create
  - uid: e_02
    source: n_create
    target: n_start
  - uid: e_03
    source: n_start
    target: n_tag
  - uid: e_04
    source: n_tag
    target: n_bvp
  - uid: e_05
    source: n_bvp
    target: n_approve_driver
  - uid: e_06
    source: n_approve_driver
    target: n_work
  - uid: e_07
    source: n_work
    target: n_review
  - uid: e_08
    source: n_review
    target: n_close_decide
  - uid: e_09
    source: n_close_decide
    target: n_route
  - uid: e_10
    source: n_route
    target: n_close
    name: close (demo evidence)
    condition: ${decision == 'close'}
  - uid: e_11
    source: n_route
    target: n_abandon
    name: abandon
    condition: ${decision == 'abandon'}
  - uid: e_12
    source: n_close
    target: n_end_closed
  - uid: e_13
    source: n_abandon
    target: n_end_abandoned
