# cross-host-dispatch — AEF SSH result hand-off (fw dispatch send), dogfood corpus (T-046).
#
# Ground truth: .agentic-framework/lib/dispatch.sh — do_dispatch_send (L.54)
#   arg parse (L.57-70) · required-field validation (L.72-88) · JSON envelope build
#   with json-escaped summary/payload (L.90-107) · SSH connectivity probe
#   (BatchMode, ConnectTimeout=5, L.110-114) · pipe envelope to remote `fw bus receive`
#   (L.117) · exit-code branch → report or error (L.120-128).
# Generated by the Workflow Designer product side (authoring + validation only) — NOT executed.
#
# What makes this map notable (see docs/reports/T-046-dispatch-friction.md):
#   - FIRST corpus member to cross a real host boundary. The remote host is modelled
#     as an `external` authority lane — the first use of AUTHORITIES.external.
#   - FIRST corpus member with NO human/sovereignty node at all (mirror of
#     promotion-pipeline's "no stochastic node" negative case). Purely agent-initiated,
#     framework-executed, with one external participant.
#
# Authority model:
#   agent     = initiative   (invokes `fw dispatch send` to hand off a bus result)
#   framework = authority    (validates flags, builds+escapes the envelope, probes SSH,
#                             pipes over the wire, interprets the remote exit code)
#   external  = external      (the remote host's `fw bus receive` — outside this system's
#                             authority; we can send to it and read its exit code, no more)
#
# Layout (T-042/T-043): lane bands from POOL_Y+POOL_HEADER=62 —
#   agent [62,202] · framework [202,542] · external [542,682]. Spine row y=300 (tasks) /
#   y=308 (gateways); the 3 error exits sit in a lower framework row y=430 (≥64px clear of
#   the spine). The SSH hand-off dips into the external lane (n_receive y=590) and returns.
#   check-lane-bands clean.
workflowMeta:
  id: cross-host-dispatch
  version: 1
  schemaVersion: 2
  source: lib/dispatch.sh
  tier_default: 1

pool:
  id: Pool_cross_host_dispatch
  name: cross-host-dispatch

lanes:
  - id: agent
    name: "Agent · Initiative"
    abbr: agt
    authority: initiative
    height: 140
  - id: framework
    name: "Framework · Authority"
    abbr: frw
    authority: authority
    height: 340
  - id: external
    name: "Remote host · External"
    abbr: ext
    authority: external
    height: 140

nodes:
  - uid: n_send
    type: startEvent
    name: Agent runs `fw dispatch send`
    slug: send
    lane: agent
    x: 120
    y: 114
    aef:
      determinism: deterministic
      endpoint: fw dispatch send

  - uid: n_parse
    type: scriptTask
    name: Parse flags (--host/--task/--agent/--summary/--result)
    slug: parse
    lane: framework
    x: 280
    y: 297.5
    aef:
      determinism: deterministic
      # L.57-70 — while-loop over $@; unknown flag → error exit

  - uid: n_valid_gate
    type: exclusiveGateway
    name: "All required flags present? (host, task, agent, summary)"
    slug: valid-gate
    lane: framework
    x: 457
    y: 305.5
    aef:
      decisionInput: ${host && task && agent && summary}
      decisionOwner: framework       # L.72-88 — data condition, not human → no F1

  - uid: n_missing
    type: endEvent
    name: ERROR — missing required flag (exit 1)
    slug: missing
    lane: framework
    x: 463
    y: 396.5

  - uid: n_envelope
    type: scriptTask
    name: Build JSON envelope (timestamp, source host, json-escaped summary + payload)
    slug: envelope
    lane: framework
    x: 620
    y: 297.5
    aef:
      determinism: deterministic
      # L.90-107 — python3 json.dumps escapes summary/payload; JSON chosen over YAML for SSH-pipe safety
      sideEffect: none (in-memory string)

  - uid: n_conn_gate
    type: exclusiveGateway
    name: "SSH reachable? (BatchMode, ConnectTimeout=5)"
    slug: conn-gate
    lane: framework
    x: 797
    y: 305.5
    aef:
      decisionInput: ${ssh -o BatchMode=yes -o ConnectTimeout=5 host 'echo ok'}
      decisionOwner: framework       # L.110-114 — fail-fast connectivity probe before sending

  - uid: n_unreach
    type: endEvent
    name: ERROR — cannot connect to host (exit 1)
    slug: unreach
    lane: framework
    x: 803
    y: 396.5

  - uid: n_pipe
    type: serviceTask
    name: Pipe envelope over SSH → remote `fw bus receive`
    slug: pipe
    lane: framework
    x: 960
    y: 297.5
    aef:
      determinism: deterministic
      # L.117 — echo "$envelope" | ssh "$remote_host" "fw bus receive"
      sideEffect: network — sends result envelope across host boundary

  - uid: n_receive
    type: serviceTask
    name: "Remote host: `fw bus receive` ingests the envelope"
    slug: receive
    lane: external
    x: 1140
    y: 580
    aef:
      determinism: deterministic
      # Runs on the REMOTE host under its own framework install (L.117 target).
      external: true                 # outside this system's authority — we own the send, not the receive
      sideEffect: writes remote .context/bus/ on the target host

  - uid: n_exit_gate
    type: exclusiveGateway
    name: "Remote exit 0?"
    slug: exit-gate
    lane: framework
    x: 1317
    y: 305.5
    aef:
      decisionInput: ${remote_exit_code == 0}
      decisionOwner: framework       # L.120 — interpret the SSH command's exit status locally

  - uid: n_fail
    type: endEvent
    name: ERROR — dispatch failed (propagate remote exit code)
    slug: fail
    lane: framework
    x: 1323
    y: 396.5

  - uid: n_done
    type: endEvent
    name: Dispatched ✓
    slug: done
    lane: framework
    x: 1480
    y: 311.5

edges:
  - uid: e_01
    source: n_send
    target: n_parse
  - uid: e_02
    source: n_parse
    target: n_valid_gate
  - uid: e_03
    source: n_valid_gate
    target: n_missing
    name: missing flag
    condition: ${!(host && task && agent && summary)}
  - uid: e_04
    source: n_valid_gate
    target: n_envelope
    name: all present
    condition: ${host && task && agent && summary}
  - uid: e_05
    source: n_envelope
    target: n_conn_gate
  - uid: e_06
    source: n_conn_gate
    target: n_unreach
    name: unreachable
    condition: ${!ssh_ok}
  - uid: e_07
    source: n_conn_gate
    target: n_pipe
    name: reachable
    condition: ${ssh_ok}
  - uid: e_08
    source: n_pipe
    target: n_receive
    name: SSH pipe
  - uid: e_09
    source: n_receive
    target: n_exit_gate
    name: exit code
  - uid: e_10
    source: n_exit_gate
    target: n_fail
    name: "!= 0"
    condition: ${remote_exit_code != 0}
  - uid: e_11
    source: n_exit_gate
    target: n_done
    name: "== 0"
    condition: ${remote_exit_code == 0}
