# harvest-pipeline — AEF cross-project learning harvest (fw harvest), dogfood corpus (T-048).
#
# Ground truth: .agentic-framework/lib/harvest.sh — do_harvest (L.12-149)
#   parse flags (L.17-53) · default+resolve project dir (L.55-64) · guard: not framework
#   itself (L.66-71) · guard: .context/project/ present (L.79-84) · six category harvesters
#   run in sequence (L.102-124): patterns/learnings/decisions/episodics/practices/CLAUDE.md ·
#   tally summary (L.126-134) · outcome: dry-run / logged-and-written / nothing-new (L.136-148).
# Generated by the Workflow Designer product side (authoring + validation only) — NOT executed.
#
# What this map surfaces (see docs/reports/T-048-harvest-friction.md):
#   - FIRST corpus use of parallelGateway (split + join). The 6 harvesters are
#     DATA-INDEPENDENT (each compares one project memory file to the framework's and appends
#     new items) — no ordering constraint. BPMN sequence edges would falsely imply order;
#     a parallel split/join is the truthful model of the dependency graph. NOTE: the code
#     runs them sequentially (L.102-124) — see the friction report's code-vs-model finding.
#   - Third `external`-lane use: the source project (a different project dir) is read-only,
#     outside the framework's authority (reinforces FC-3).
#   - A 3-way exclusive outcome (dry-run / nothing-new / logged+written) from one gateway.
#   - F3: entirely deterministic — no human, no stochastic (fourth autonomous map).
#
# Authority model:
#   agent     = initiative   (invokes `fw harvest [project]`)
#   framework = authority    (resolves dir, enforces the 3 guards, runs the harvesters,
#                             dedups+appends into its OWN .context/project/ files, logs)
#   external  = external      (the SOURCE project's .context/project/*.yaml — read-only source)
#
# Layout (T-042/T-043; short labels per T-046): agent [62,182] · framework [182,702] ·
#   external [702,842]. Spine y=300 / gates y=308; guard terminals y=430; the 6-way parallel
#   fan stacks at x=1160 (y=200..600, 80px pitch) between fork (x=1010) and join (x=1330);
#   the source read dips into the external lane (y=760). check-lane-bands clean.
workflowMeta:
  id: harvest-pipeline
  version: 1
  schemaVersion: 2
  source: lib/harvest.sh
  tier_default: 1

pool:
  id: Pool_harvest_pipeline
  name: harvest-pipeline

lanes:
  - id: agent
    name: "Agent · Initiative"
    abbr: agt
    authority: initiative
    height: 120
  - id: framework
    name: "Framework · Authority"
    abbr: frw
    authority: authority
    height: 520
  - id: external
    name: "Source project · External"
    abbr: ext
    authority: external
    height: 140

nodes:
  - uid: n_start
    type: startEvent
    name: Trigger — `fw harvest [project]`
    slug: start
    lane: agent
    x: 100
    y: 104
    aef:
      determinism: deterministic
      endpoint: fw harvest

  - uid: n_parse
    type: scriptTask
    name: Parse args (--dry-run/--verbose/dir)
    slug: parse
    lane: framework
    x: 240
    y: 306
    aef:
      determinism: deterministic
      # L.17-53

  - uid: n_resolve
    type: scriptTask
    name: Resolve project dir → absolute
    slug: resolve
    lane: framework
    x: 380
    y: 306
    aef:
      determinism: deterministic
      # L.55-64; default to PROJECT_ROOT

  - uid: n_exists_gate
    type: exclusiveGateway
    name: "Dir exists?"
    slug: exists-gate
    lane: framework
    x: 520
    y: 314
    aef:
      decisionInput: ${cd project_dir}
      decisionOwner: framework       # L.61

  - uid: n_no_dir
    type: endEvent
    name: No such dir
    slug: no-dir
    lane: framework
    x: 520
    y: 424
    aef:
      terminalKind: error            # L.62-63

  - uid: n_self_gate
    type: exclusiveGateway
    name: "Is framework itself?"
    slug: self-gate
    lane: framework
    x: 650
    y: 314
    aef:
      decisionInput: ${project_dir == FRAMEWORK_ROOT}
      decisionOwner: framework       # L.67

  - uid: n_self
    type: endEvent
    name: Refused (framework)
    slug: self
    lane: framework
    x: 650
    y: 424
    aef:
      terminalKind: error            # L.68-70, return 1

  - uid: n_ctx_gate
    type: exclusiveGateway
    name: ".context/project/ present?"
    slug: ctx-gate
    lane: framework
    x: 790
    y: 314
    aef:
      decisionInput: ${-d project/.context/project}
      decisionOwner: framework       # L.80

  - uid: n_no_ctx
    type: endEvent
    name: No .context — init first
    slug: no-ctx
    lane: framework
    x: 790
    y: 424
    aef:
      terminalKind: error            # L.81-83

  - uid: n_source
    type: serviceTask
    name: Read source project memory (read-only)
    slug: source
    lane: external
    x: 900
    y: 740
    aef:
      determinism: deterministic
      external: true                 # the harvested project — outside framework authority
      sideEffect: none (read-only source)

  - uid: n_fork
    type: parallelGateway
    name: "Fan out — 6 memory categories"
    slug: fork
    lane: framework
    x: 1010
    y: 418

  - uid: n_h_patterns
    type: scriptTask
    name: Harvest patterns (dedup + append)
    slug: h-patterns
    lane: framework
    x: 1160
    y: 200
    aef:
      determinism: deterministic
      # L.152 harvest_patterns — project patterns.yaml vs framework's
      sideEffect: appends new patterns to framework patterns.yaml

  - uid: n_h_learnings
    type: scriptTask
    name: Harvest learnings (dedup + append)
    slug: h-learnings
    lane: framework
    x: 1160
    y: 280
    aef:
      determinism: deterministic
      # L.263 harvest_learnings
      sideEffect: appends new learnings to framework learnings.yaml

  - uid: n_h_decisions
    type: scriptTask
    name: Harvest decisions (dedup + append)
    slug: h-decisions
    lane: framework
    x: 1160
    y: 360
    aef:
      determinism: deterministic
      # L.317 harvest_decisions
      sideEffect: appends new decisions to framework decisions.yaml

  - uid: n_h_episodics
    type: scriptTask
    name: Harvest episodics
    slug: h-episodics
    lane: framework
    x: 1160
    y: 440
    aef:
      determinism: deterministic
      # L.361 harvest_episodics
      sideEffect: appends new episodics to framework store

  - uid: n_h_practices
    type: scriptTask
    name: Harvest practices (dedup + append)
    slug: h-practices
    lane: framework
    x: 1160
    y: 520
    aef:
      determinism: deterministic
      # L.410 harvest_practices
      sideEffect: appends new practices to framework practices.yaml

  - uid: n_h_claude
    type: scriptTask
    name: Harvest CLAUDE.md additions
    slug: h-claude
    lane: framework
    x: 1160
    y: 600
    aef:
      determinism: deterministic
      # L.466 harvest_claude_additions
      sideEffect: proposes CLAUDE.md additions

  - uid: n_join
    type: parallelGateway
    name: "Join — all categories scanned"
    slug: join
    lane: framework
    x: 1330
    y: 418

  - uid: n_summary
    type: scriptTask
    name: Tally counts (new vs duplicates)
    slug: summary
    lane: framework
    x: 1470
    y: 306
    aef:
      determinism: deterministic
      # L.126-134

  - uid: n_mode_gate
    type: exclusiveGateway
    name: "dry-run? new items?"
    slug: mode-gate
    lane: framework
    x: 1620
    y: 314
    aef:
      decisionInput: "${dry_run -> dry; new_total>0 -> write; else nothing}"
      decisionOwner: framework       # L.136-148 — 3-way outcome

  - uid: n_dry
    type: endEvent
    name: Dry-run — no changes
    slug: dry
    lane: framework
    x: 1620
    y: 430
    aef:
      terminalKind: success          # L.136-138

  - uid: n_nothing
    type: endEvent
    name: Nothing new to harvest
    slug: nothing
    lane: framework
    x: 1620
    y: 530
    aef:
      terminalKind: success          # L.145-147

  - uid: n_log
    type: scriptTask
    name: Log harvest + write framework files
    slug: log
    lane: framework
    x: 1760
    y: 306
    aef:
      determinism: deterministic
      # L.139-144 — append harvest.log; framework .context/project already appended by harvesters
      sideEffect: appends harvest.log

  - uid: n_done
    type: endEvent
    name: Harvested ✓
    slug: done
    lane: framework
    x: 1910
    y: 320
    aef:
      terminalKind: success

edges:
  - uid: e_01
    source: n_start
    target: n_parse
  - uid: e_02
    source: n_parse
    target: n_resolve
  - uid: e_03
    source: n_resolve
    target: n_exists_gate
  - uid: e_04
    source: n_exists_gate
    target: n_no_dir
    name: missing
    condition: ${!exists}
  - uid: e_05
    source: n_exists_gate
    target: n_self_gate
    name: exists
    condition: ${exists}
  - uid: e_06
    source: n_self_gate
    target: n_self
    name: is framework
    condition: ${project_dir == FRAMEWORK_ROOT}
  - uid: e_07
    source: n_self_gate
    target: n_ctx_gate
    name: other project
    condition: ${project_dir != FRAMEWORK_ROOT}
  - uid: e_08
    source: n_ctx_gate
    target: n_no_ctx
    name: no context
    condition: ${!has_context}
  - uid: e_09
    source: n_ctx_gate
    target: n_source
    name: has context
    condition: ${has_context}
  - uid: e_10
    source: n_source
    target: n_fork
  - uid: e_11
    source: n_fork
    target: n_h_patterns
  - uid: e_12
    source: n_fork
    target: n_h_learnings
  - uid: e_13
    source: n_fork
    target: n_h_decisions
  - uid: e_14
    source: n_fork
    target: n_h_episodics
  - uid: e_15
    source: n_fork
    target: n_h_practices
  - uid: e_16
    source: n_fork
    target: n_h_claude
  - uid: e_17
    source: n_h_patterns
    target: n_join
  - uid: e_18
    source: n_h_learnings
    target: n_join
  - uid: e_19
    source: n_h_decisions
    target: n_join
  - uid: e_20
    source: n_h_episodics
    target: n_join
  - uid: e_21
    source: n_h_practices
    target: n_join
  - uid: e_22
    source: n_h_claude
    target: n_join
  - uid: e_23
    source: n_join
    target: n_summary
  - uid: e_24
    source: n_summary
    target: n_mode_gate
  - uid: e_25
    source: n_mode_gate
    target: n_dry
    name: dry-run
    condition: ${dry_run}
  - uid: e_26
    source: n_mode_gate
    target: n_nothing
    name: no new items
    condition: ${!dry_run && new_total == 0}
  - uid: e_27
    source: n_mode_gate
    target: n_log
    name: new items
    condition: ${!dry_run && new_total > 0}
  - uid: e_28
    source: n_log
    target: n_done
