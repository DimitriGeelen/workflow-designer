# fabric-blast-radius — the Component Fabric impact-analysis flow behind
# "before committing: fw fabric blast-radius" (CLAUDE.md §Component Fabric).
# Dogfood corpus (T-065). First corpus map exercising the T-063 structured
# multiInstance/aggregation keys in anger, and the first to map an iteration
# whose body carries an internal decision (card vs no-card).
#
# Ground truth: .agentic-framework/agents/fabric/
#   fabric.sh:113-117        — dispatch (blast-radius → lib/traverse.sh do_blast_radius)
#   lib/traverse.sh:153-214  — do_blast_radius: diff-tree → per-file card scan →
#                              quick writes-lookup → total; ALWAYS exit 0 (advisory)
#   lib/traverse.sh:5-151    — do_impact: the DEEP recursive traversal (visited set,
#                              max_depth) — a SEPARATE command (`fw fabric impact`),
#                              deliberately NOT drawn here (see x-seeAlso on n_writes).
# Generated by the Workflow Designer product side (authoring + validation only) —
# NOT executed.
#
# Lanes = AEF authority model (human lane absent: fully mechanical, advisory tool):
#   agent     = initiative  — invokes the check before committing (P-009 practice).
#   framework = authority   — reads git + fabric cards, reports; never blocks.
#
# FIDELITY NOTES (see docs/reports/T-065-fabric-blast-radius-friction.md):
#  1. The per-file iteration is carried by the T-063 structured `multiInstance`
#     marker on n_scan (revisit-due-scan precedent); the body nodes (g_card,
#     n_writes, n_nocard) are drawn ONCE-THROUGH for a single iteration — the
#     schema has no subProcess/scope construct to bound an iteration body (FC-15).
#  2. The inner card scan (for card in components/*.yaml, grep location) is a
#     NESTED loop inside the per-file loop — collapsed into g_card's decisionInput;
#     nesting is inexpressible without a scope construct (same FC-15).
workflowMeta:
  id: fabric-blast-radius
  version: 1
  schemaVersion: 2
  source: agents/fabric/lib/traverse.sh
  tier_default: 1

pool:
  id: Pool_fabric_blast_radius
  name: fabric-blast-radius

lanes:
  - id: agent
    name: "Agent · Initiative"
    abbr: agt
    authority: initiative
    height: 140
  - id: framework
    name: "Framework · Authority"
    abbr: frw
    authority: authority
    height: 400

nodes:
  - uid: n_start
    type: startEvent
    name: "fw fabric blast-radius [ref]"
    slug: start
    lane: agent
    x: 90
    y: 114
    aef:
      determinism: deterministic
      triggeredBy: "agent, before committing (CLAUDE.md Component Fabric practice) or post-commit review"
    io:
      outputs:
        - { name: ref, type: string }

  - uid: n_diff
    type: scriptTask
    name: "git diff-tree → changed files; commit msg header"
    slug: diff
    lane: framework
    x: 180
    y: 320
    aef:
      tier: 1
      determinism: deterministic
      endpoint: "traverse.sh:159-173 (diff-tree --name-only -r ref; log -1 %s)"
      contextReads: "git object store (diff-tree, log)"

  - uid: g_changed
    type: exclusiveGateway
    name: "any files changed?"
    slug: changed
    lane: framework
    x: 332
    y: 328
    aef:
      determinism: deterministic
      endpoint: traverse.sh:162-165
      decisionInput: ${changed_files != ""}
      decisionOwner: framework
      decisionOutputs: changed, empty

  - uid: n_none
    type: endEvent
    name: "no files changed (exit 0)"
    slug: none
    lane: framework
    x: 338
    y: 434
    aef:
      terminalKind: success
      state: no-op
      exitCode: 0

  - uid: n_scan
    type: scriptTask
    name: "for each changed file: skip non-source, find fabric card"
    slug: scan
    lane: framework
    x: 420
    y: 320
    aef:
      tier: 1
      determinism: deterministic
      endpoint: "traverse.sh:175-210 (while read file; case skip; card grep)"
      multiInstance:
        over: "${changed_files} (git diff-tree output)"
        mode: sequential
        predicate: "file not under .context/ .fabric/ .tasks/ (case skip, traverse.sh:178-180)"
        collects: impacted[]
      note: "body below drawn for ONE iteration — no scope construct bounds it (FC-15)"

  - uid: g_card
    type: exclusiveGateway
    name: "fabric card exists for file?"
    slug: card
    lane: framework
    x: 570
    y: 328
    aef:
      determinism: deterministic
      endpoint: "traverse.sh:183-187 (inner scan of components/*.yaml, grep ^location)"
      decisionInput: "${any card with location == file}"
      decisionOwner: framework
      decisionOutputs: has-card, no-card
      note: "the inner card scan is a NESTED loop, collapsed into this decision (FC-15)"

  - uid: n_writes
    type: scriptTask
    name: "quick impact: card writes → targets; count component"
    slug: writes
    lane: framework
    x: 660
    y: 250
    aef:
      tier: 1
      determinism: deterministic
      endpoint: "traverse.sh:191-201 (depends_on type==writes → print targets)"
      contextReads: ".fabric/components/*.yaml (matched card)"
      x-seeAlso: "deep transitive walk = fw fabric impact (traverse.sh:5-151 do_impact, recursive, visited set) — separate command, not drawn here"

  - uid: n_nocard
    type: scriptTask
    name: "report '(no fabric card)' — advisory gap"
    slug: nocard
    lane: framework
    x: 660
    y: 370
    aef:
      determinism: deterministic
      endpoint: traverse.sh:206-208
      softFail: advisory
      note: "unregistered file — drift signal (fw fabric drift finds these); never blocks"

  - uid: n_total
    type: scriptTask
    name: "report: N registered component(s) changed"
    slug: total
    lane: framework
    x: 810
    y: 320
    aef:
      determinism: deterministic
      endpoint: traverse.sh:212-213
      aggregation:
        over: impacted[]
        reduce: count
        outputs: [total_impact]

  - uid: n_done
    type: endEvent
    name: "impact reported (advisory — exit 0 always)"
    slug: done
    lane: framework
    x: 960
    y: 334
    aef:
      terminalKind: success
      state: reported
      exitCode: 0
      advisory: true
      note: "blast-radius never blocks — it informs the agent's commit decision"

edges:
  - { uid: e1, source: n_start, target: n_diff }
  - { uid: e2, source: n_diff, target: g_changed }
  - { uid: e3, source: g_changed, target: n_none, name: "empty", condition: "changed_files == ''" }
  - { uid: e4, source: g_changed, target: n_scan, name: "changed", condition: "changed_files != ''" }
  - { uid: e5, source: n_scan, target: g_card }
  - { uid: e6, source: g_card, target: n_writes, name: "has card", condition: "card_found" }
  - { uid: e7, source: g_card, target: n_nocard, name: "no card", condition: "!card_found" }
  - { uid: e8, source: n_writes, target: n_total }
  - { uid: e9, source: n_nocard, target: n_total }
  - { uid: e10, source: n_total, target: n_done }
