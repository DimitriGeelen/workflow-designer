# tier0-escalation — AEF ambient enforcement guard, dogfood corpus (T-025).
#
# Ground truth: agents/context/check-tier0.sh (PreToolUse hook). Generated by
# the Workflow Designer product side (authoring + validation only) — NOT executed.
#
# Lanes = AEF authority model: human = sovereignty (only the human may approve a
# Tier-0 command), framework = authority (intercepts, matches, consumes, logs),
# agent = initiative (proposes + executes the command).
#
# Tier-0 is an AMBIENT guard: it fires on *every* Bash command, not just steps
# in one authored workflow. Rendering it as an explicit flow is itself the
# friction (F11). Full catalogue [F1,F3,F4,F8,F11,F12] in
# docs/reports/T-025-tier0-escalation-friction.md — F11/F12 new; F1/F3/F4/F8
# recur (F3 and F1 now 4/4 across all slices).
workflowMeta:
  id: tier0-escalation
  version: 1
  schemaVersion: 2
  source: agents/context/check-tier0.sh
  tier_default: 0

pool:
  id: Pool_tier0_escalation
  name: tier0-escalation

lanes:
  - id: human
    name: "Human · Sovereignty"
    abbr: hum
    authority: sovereignty
    height: 160
  - id: framework
    name: "Framework · Authority"
    abbr: frw
    authority: authority
    height: 240
  - id: agent
    name: "Agent · Initiative"
    abbr: agt
    authority: initiative
    height: 200

nodes:
  - uid: n_propose
    type: startEvent
    name: Agent issues a Bash command
    slug: propose
    lane: agent
    x: 120
    y: 520
    aef:
      determinism: stochastic
    io:
      outputs:
        - { name: command, type: string }

  - uid: n_intercept
    type: scriptTask
    name: PreToolUse hook intercepts (check-tier0.sh)
    slug: intercept
    lane: framework
    x: 320
    y: 320
    aef:
      tier: 0
      determinism: deterministic
      # AMBIENT guard — fires on every command, not an authored step (F11)
      trigger: PreToolUse:Bash (every command)
      endpoint: agents/context/check-tier0.sh
    io:
      inputs:
        - { name: command, type: string, required: true }
      outputs:
        - { name: command_hash, type: string }

  - uid: n_match
    type: exclusiveGateway
    name: Matches a destructive pattern?
    slug: match
    lane: framework
    x: 520
    y: 320
    aef:
      decisionInput: ${match}
      decisionOwner: framework
      note: high-confidence PATTERNS (force push, rm -rf /, DROP TABLE, hard reset)

  - uid: n_check_approval
    type: exclusiveGateway
    name: Valid single-use approval token?
    slug: check-approval
    lane: framework
    x: 720
    y: 320
    aef:
      decisionInput: ${approved}
      decisionOwner: framework
      # single-use, hash-bound, expiring capability token (F12)
      sources:
        - .context/working/.tier0-approval (hash-matched, T-1500)
        - .context/approvals/ (Watchtower, T-612)

  - uid: n_block
    type: scriptTask
    name: BLOCK (exit 2) with explanation
    slug: block
    lane: framework
    x: 720
    y: 222
    aef:
      tier: 0
      determinism: deterministic
      advisory: false          # binding: the command is refused (F9 counterpoint)
      emits: "BLOCKED|<description>"

  - uid: n_human_decide
    type: userTask
    name: Human reviews — approve or abandon
    slug: human-decide
    lane: human
    x: 920
    y: 110
    aef:
      tier: 0
      determinism: human
      authority: sovereignty
      # 2-way human authorization; no first-class decision->edge (F1)
      decisionOutputs: approve, abandon
      endpoint: fw tier0 approve  |  Watchtower approval surface

  - uid: n_route
    type: exclusiveGateway
    name: Approve or abandon?
    slug: route
    lane: human
    x: 1120
    y: 130
    aef:
      decisionInput: ${decision}
      decisionOwner: human

  - uid: n_consume
    type: scriptTask
    name: Consume token (single-use) + log approval
    slug: consume
    lane: framework
    x: 720
    y: 398
    aef:
      tier: 0
      determinism: deterministic
      # single-use: rm -f token, write .consumed sentinel (5s dup-fire window)
      sideEffect: consume .tier0-approval; append tier0 approval log

  - uid: n_run
    type: serviceTask
    name: Command executes
    slug: run
    lane: agent
    x: 960
    y: 520
    aef:
      determinism: stochastic

  - uid: n_end_run
    type: endEvent
    name: Executed (logged)
    slug: end-run
    lane: framework
    x: 1200
    y: 426
    aef:
      emits: event:tier0.executed

  - uid: n_end_abandoned
    type: endEvent
    name: Abandoned (not executed)
    slug: end-abandoned
    lane: human
    x: 1320
    y: 130
    aef:
      emits: event:tier0.abandoned

edges:
  - uid: e_01
    source: n_propose
    target: n_intercept
  - uid: e_02
    source: n_intercept
    target: n_match
  - uid: e_03
    source: n_match
    target: n_run
    name: no match (not consequential)
    condition: ${match == false}
  - uid: e_04
    source: n_match
    target: n_check_approval
    name: destructive match
    condition: ${match == true}
  - uid: e_05
    source: n_check_approval
    target: n_consume
    name: valid token
    condition: ${approved == true}
  - uid: e_06
    source: n_check_approval
    target: n_block
    name: no approval
    condition: ${approved == false}
  - uid: e_07
    source: n_block
    target: n_human_decide
  - uid: e_08
    source: n_human_decide
    target: n_route
  - uid: e_09
    source: n_route
    target: n_intercept
    name: approve (fw tier0 approve) + re-issue
    condition: ${decision == 'approve'}
  - uid: e_10
    source: n_route
    target: n_end_abandoned
    name: abandon
    condition: ${decision == 'abandon'}
  - uid: e_11
    source: n_consume
    target: n_run
  - uid: e_12
    source: n_run
    target: n_end_run
