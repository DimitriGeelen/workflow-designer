# session-handover — AEF session-close process, dogfood corpus (T-029).
#
# Ground truth: agents/handover/handover.sh. Generated by the Workflow Designer
# product side (authoring + validation only) — NOT executed.
#
# Lanes = AEF authority model: agent = initiative (triggers handover), framework
# = authority (gathers state, gates episodic completeness, writes/commits/pushes),
# human = sovereignty (reads the handover next session — outside this flow).
#
# Second friction-dry confirmation (after T-028): recurrences only
# (F3,F5,F8,F10), no new gap. See docs/reports/T-029-session-handover-friction.md.
workflowMeta:
  id: session-handover
  version: 1
  schemaVersion: 2
  source: agents/handover/handover.sh
  tier_default: 1

pool:
  id: Pool_session_handover
  name: session-handover

lanes:
  - id: human
    name: "Human · Sovereignty"
    abbr: hum
    authority: sovereignty
    height: 120
  - id: framework
    name: "Framework · Authority"
    abbr: frw
    authority: authority
    height: 260
  - id: agent
    name: "Agent · Initiative"
    abbr: agt
    authority: initiative
    height: 140

nodes:
  - uid: n_trigger
    type: startEvent
    name: Session end / checkpoint requested
    slug: trigger
    lane: agent
    x: 120
    y: 500
    aef:
      triggeredBy: fw handover [--commit] | PreCompact hook

  - uid: n_gather
    type: scriptTask
    name: Gather state (git, tasks, focus, session)
    slug: gather
    lane: framework
    x: 320
    y: 320
    aef:
      tier: 1
      determinism: deterministic
      reads: [git status, .tasks/, focus.yaml]   # datastore reads (F10)

  - uid: n_episodic_gate
    type: exclusiveGateway
    name: All completed tasks have enriched episodics?
    slug: episodic-gate
    lane: framework
    x: 520
    y: 320
    aef:
      # SOFT gate — warns + backfills, does not block (F8, advisory variant)
      decisionInput: ${episodics_complete}
      decisionOwner: framework

  - uid: n_enrich
    type: scriptTask
    name: Backfill missing episodics (warn)
    slug: enrich
    lane: framework
    x: 520
    y: 190
    aef:
      tier: 1
      determinism: deterministic
      # episodic generation is a sub-process invoked here (F5)
      endpoint: context.sh generate-episodic
      autoTriggerKind: sub-process

  - uid: n_metrics
    type: scriptTask
    name: Extract session metrics
    slug: metrics
    lane: framework
    x: 720
    y: 320
    aef:
      tier: 1
      determinism: deterministic

  - uid: n_write
    type: scriptTask
    name: Write handover doc + LATEST.md (Where We Are, Suggested Action)
    slug: write
    lane: framework
    x: 920
    y: 320
    aef:
      tier: 1
      determinism: deterministic
      artifactsWrites: [".context/handovers/${session}.md", "LATEST.md"]  # (F10)

  - uid: n_commit
    type: scriptTask
    name: Auto-commit via git agent
    slug: commit
    lane: framework
    x: 1120
    y: 320
    aef:
      tier: 1
      determinism: deterministic
      endpoint: 'git agent commit -m "<task>: Checkpoint handover"'

  - uid: n_audit
    type: scriptTask
    name: Pre-push audit check
    slug: audit
    lane: framework
    x: 1320
    y: 320
    aef:
      tier: 1
      determinism: deterministic

  - uid: n_push
    type: scriptTask
    name: Push to remotes
    slug: push
    lane: framework
    x: 1520
    y: 320
    aef:
      tier: 1
      determinism: deterministic

  - uid: n_end
    type: endEvent
    name: Handover published (next session can resume)
    slug: end
    lane: framework
    x: 1720
    y: 320
    aef:
      emits: event:session.handover-published

edges:
  - uid: e_01
    source: n_trigger
    target: n_gather
  - uid: e_02
    source: n_gather
    target: n_episodic_gate
  - uid: e_03
    source: n_episodic_gate
    target: n_enrich
    name: missing episodics
    condition: ${episodics_complete == false}
  - uid: e_04
    source: n_episodic_gate
    target: n_metrics
    name: complete
    condition: ${episodics_complete == true}
  - uid: e_05
    source: n_enrich
    target: n_metrics
  - uid: e_06
    source: n_metrics
    target: n_write
  - uid: e_07
    source: n_write
    target: n_commit
  - uid: e_08
    source: n_commit
    target: n_audit
  - uid: e_09
    source: n_audit
    target: n_push
  - uid: e_10
    source: n_push
    target: n_end
