# verification-gate — the AEF task-completion gate chain, the structural
# enforcement behind "a task is done only when its checks pass". Dogfood corpus
# (T-056). Second of the four "constitutional gate" maps from the T-054 audit
# (after task-gate / T-055).
#
# Ground truth: agents/task-create/update-task.sh — the `--status work-completed`
# dispatch block (lines 1405-1492) runs an ORDERED chain of gates, each of which
# `exit 1`s on block; the status write (1494) and finalize (Trigger 2, 1704-2043)
# run only if every gate passes. Generated by the Workflow Designer product side
# (authoring + validation only) — NOT executed.
#
# Lanes = AEF authority model:
#   agent     = initiative  — issues `fw task update --status work-completed`;
#                             remediates (checks ACs, fixes failing verify cmds)
#                             when a gate blocks, then re-runs.
#   framework = authority   — the gate chain: sovereignty -> P-010 acceptance
#                             criteria -> P-011 verification -> RCA/evolution/
#                             inception gates -> write status -> finalize
#                             (date_finished, git mv active->completed, episodic).
#   human     = sovereignty — the only actor who may authorise a bypass
#                             (--force / --skip-* + reason), logged Tier-2.
#
# FIDELITY NOTE (see docs/reports/T-056-verification-gate-friction.md): the real
# chain has ~11 blocking gates (sovereignty R-033, P-010, P-011, recommendation,
# RCA G-019, disposition, render-review P-013, inception-decision, inception-
# scope-trace, evolution T-1718, task-pair P-012) plus a non-blocking reviewer.
# This map renders the SPINE at readable granularity: it keeps sovereignty, P-010
# and P-011 (the focus) as distinct nodes and COLLAPSES the six bug/arc/inception-
# conditional gates into one `g_gates` node. The collapse is a recorded modelling
# decision, not a silent omission.
workflowMeta:
  id: verification-gate
  version: 1
  schemaVersion: 2
  source: agents/task-create/update-task.sh
  tier_default: 1

pool:
  id: Pool_verification_gate
  name: verification-gate

lanes:
  - id: human
    name: "Human · Sovereignty"
    abbr: hum
    authority: sovereignty
    height: 140
  - id: framework
    name: "Framework · Authority"
    abbr: frw
    authority: authority
    height: 320
  - id: agent
    name: "Agent · Initiative"
    abbr: agt
    authority: initiative
    height: 150

nodes:
  - uid: n_request
    type: startEvent
    name: "fw task update --status work-completed"
    slug: request
    lane: agent
    x: 120
    y: 560
    aef:
      determinism: stochastic
      triggeredBy: agent completes work, checks ACs + Verification section
    io:
      outputs:
        - { name: task_id, type: string }
        - { name: skip_flags, type: string }

  - uid: g_sovereign
    type: exclusiveGateway
    name: "owner == human? (R-033)"
    slug: sovereign
    lane: framework
    x: 250
    y: 300
    aef:
      determinism: deterministic
      endpoint: update-task.sh:1406-1408 (fn 58-75)
      decisionInput: ${task.owner}
      decisionOwner: framework
      decisionOutputs: agent-owned, human-owned

  - uid: g_ac
    type: exclusiveGateway
    name: "Agent ACs all checked? (P-010)"
    slug: ac
    lane: framework
    x: 380
    y: 300
    aef:
      determinism: deterministic
      endpoint: update-task.sh:1412-1413 (fn 80-190)
      decisionInput: ${agent_ac_unchecked == 0 && !placeholder_acs}
      decisionOwner: framework
      decisionOutputs: agent-acs-ok, agent-acs-unchecked, human-acs-remain

  - uid: n_verify
    type: scriptTask
    name: "P-011: extract ## Verification, eval each cmd"
    slug: verify
    lane: framework
    x: 470
    y: 290
    aef:
      tier: 1
      determinism: deterministic
      endpoint: update-task.sh:949-1027
      sideEffect: "runs each cmd via eval in subshell (cd PROJECT_ROOT, set -euo pipefail inherited from L14), stdout+stderr to temp, head -5 on fail"
      contextReads: .tasks/active/${task_id}.md (## Verification section, sed 953-954)

  - uid: g_verify
    type: exclusiveGateway
    name: "every verify cmd exit 0?"
    slug: verifygate
    lane: framework
    x: 620
    y: 300
    aef:
      determinism: deterministic
      endpoint: update-task.sh:1010-1026
      decisionInput: ${verify_fail == 0}
      decisionOwner: framework
      decisionOutputs: all-pass, some-nonzero

  - uid: g_gates
    type: exclusiveGateway
    name: "RCA / evolution / inception gates pass?"
    slug: gates
    lane: framework
    x: 720
    y: 300
    aef:
      determinism: deterministic
      endpoint: "update-task.sh: RCA 1430-1431/319-398, evolution 1465-1466/681-734, inception 1450-1458 (collapsed)"
      decisionInput: ${rca_ok && evolution_ok && inception_ok}
      decisionOwner: framework
      decisionOutputs: gates-ok, gates-block

  - uid: n_write
    type: scriptTask
    name: "Write status: work-completed + date_finished"
    slug: write
    lane: framework
    x: 810
    y: 290
    aef:
      determinism: deterministic
      endpoint: update-task.sh:1494,1706
      sideEffect: sets status + date_finished on task file

  - uid: n_finalize
    type: scriptTask
    name: "git mv active -> completed/, horizon -> null"
    slug: finalize
    lane: framework
    x: 960
    y: 290
    aef:
      determinism: deterministic
      endpoint: update-task.sh:1742-1782
      sideEffect: "git mv (fallback mv); post-move orphan check exit 1 (T-1863)"
      artifactsWrites: .tasks/completed/${task_id}.md

  - uid: n_episodic
    type: serviceTask
    name: "Generate episodic + capture decisions"
    slug: episodic
    lane: framework
    x: 1110
    y: 290
    aef:
      determinism: deterministic
      endpoint: update-task.sh:1907-1996 (context.sh generate-episodic)
      artifactsWrites: .context/episodic/${task_id}.yaml

  - uid: n_done
    type: endEvent
    name: "Completed"
    slug: done
    lane: framework
    x: 1260
    y: 302
    aef:
      determinism: deterministic
      emits: task work-completed (moved to completed/)

  - uid: n_block
    type: endEvent
    name: "Block — exit 1 (completion refused)"
    slug: block
    lane: framework
    x: 620
    y: 430
    aef:
      determinism: deterministic
      emits: completion refused (exit 1)

  - uid: n_partial
    type: endEvent
    name: "Partial-complete: stays active/, owner -> human"
    slug: partial
    lane: framework
    x: 380
    y: 430
    aef:
      determinism: deterministic
      emits: partial-complete (human ACs remain, T-193)

  - uid: n_logbypass
    type: scriptTask
    name: "log_gate_bypass -> .gate-bypass-log.yaml"
    slug: logbypass
    lane: framework
    x: 250
    y: 388
    aef:
      tier: 2
      determinism: deterministic
      endpoint: update-task.sh:35-54
      sideEffect: appends {timestamp, task, flag, caller, reason} (Tier-2 audit sink)
      artifactsWrites: .context/working/.gate-bypass-log.yaml

  - uid: n_authorise
    type: userTask
    name: "Authorise bypass: --force / --skip-* (+ reason)"
    slug: authorise
    lane: human
    x: 250
    y: 100
    aef:
      determinism: stochastic
      endpoint: "update-task.sh:1104-1117 (--force sets all SKIP_* flags)"
      decisionOwner: human

  - uid: n_remediate
    type: serviceTask
    name: "Fix unchecked ACs / failing verify cmds, re-run"
    slug: remediate
    lane: agent
    x: 470
    y: 545
    aef:
      determinism: stochastic
      agentType: coder
      endpoint: check AC boxes / repair ## Verification commands

edges:
  - uid: e_01
    source: n_request
    target: g_sovereign
  - uid: e_02
    source: g_sovereign
    target: g_ac
    name: agent-owned
    condition: ${owner != 'human'}
  - uid: e_03
    source: g_sovereign
    target: n_authorise
    name: human-owned (R-033)
    condition: ${owner == 'human'}
  - uid: e_04
    source: n_authorise
    target: n_logbypass
    name: human authorises
  - uid: e_05
    source: n_logbypass
    target: g_ac
    name: sovereignty bypassed (Tier-2)
  - uid: e_06
    source: g_ac
    target: n_verify
    name: agent ACs checked
    condition: ${agent_ac_unchecked == 0}
  - uid: e_07
    source: g_ac
    target: n_block
    name: agent ACs unchecked (P-010)
    condition: ${agent_ac_unchecked > 0}
  - uid: e_08
    source: g_ac
    target: n_partial
    name: only human ACs remain (T-193)
    condition: ${human_ac_unchecked > 0}
  - uid: e_09
    source: n_verify
    target: g_verify
  - uid: e_10
    source: g_verify
    target: g_gates
    name: all verify cmds exit 0
    condition: ${verify_fail == 0}
  - uid: e_11
    source: g_verify
    target: n_block
    name: a verify cmd exit != 0 (P-011)
    condition: ${verify_fail > 0}
  - uid: e_12
    source: g_gates
    target: n_write
    name: RCA/evolution/inception ok
    condition: ${gates_ok == true}
  - uid: e_13
    source: g_gates
    target: n_block
    name: bug-class RCA empty / evolution stub (G-019)
    condition: ${gates_ok == false}
  - uid: e_14
    source: n_write
    target: n_finalize
  - uid: e_15
    source: n_finalize
    target: n_episodic
  - uid: e_16
    source: n_episodic
    target: n_done
  - uid: e_17
    source: n_block
    target: n_remediate
    name: agent remediates
  - uid: e_18
    source: n_remediate
    target: n_request
    name: re-run
