# revisit-due-scan — AEF daily deferral scan (G-053), dogfood corpus (T-033).
#
# Ground truth: agents/context/revisit-due-scan.sh. Generated by the Workflow
# Designer product side (authoring + validation only) — NOT executed.
#
# Lanes = AEF authority model: framework = authority (the cron/timer + scan +
# surface are all framework-owned), agent = initiative (reads .revisits-due.txt
# next session and proposes promoting the ripe task), human = sovereignty
# (decides whether to act on a surfaced revisit — outside this flow).
#
# Closes the family sweep (T-033): the two remaining untouched control-flow
# families in ONE process —
#   * TIMER START (F16): the scan is triggered by a DAILY cron, not an agent
#     command. v2 has only a plain `startEvent`; there is no timer/scheduled
#     event type.
#   * MULTI-INSTANCE (F17): `for f in .tasks/active/*.md` applies one predicate
#     (revisit_at <= today) to every active task independently. v2 has no
#     multi-instance / for-each-over-collection marker — a backward edge can only
#     *simulate* a while-loop, not express an instance-per-item fan.
# See docs/reports/T-033-revisit-due-scan-friction.md.
workflowMeta:
  id: revisit-due-scan
  version: 1
  schemaVersion: 2
  source: agents/context/revisit-due-scan.sh
  tier_default: 3          # pre-approved category (scheduled health scan)

pool:
  id: Pool_revisit_due_scan
  name: revisit-due-scan

lanes:
  - id: human
    name: "Human · Sovereignty"
    abbr: hum
    authority: sovereignty
    height: 120
  - id: framework
    name: "Framework · Authority"
    abbr: frw
    authority: authority
    height: 320
  - id: agent
    name: "Agent · Initiative"
    abbr: agt
    authority: initiative
    height: 120

nodes:
  - uid: n_timer
    type: startEvent
    name: Daily revisit scan due (cron)
    slug: timer
    lane: framework
    x: 120
    y: 324
    aef:
      # F16 — TIMER / SCHEDULED start. In BPMN this is a timerStartEvent with a
      # cron/cycle expression; v2 has only a bare startEvent, so the schedule
      # lives in the aef bag with no first-class event-definition.
      timer:
        kind: cron
        cycle: daily
        anchor: G-053 / T-1452
      triggeredBy: cron (daily) — NOT an agent command

  - uid: n_resolve
    type: scriptTask
    name: Resolve PROJECT_ROOT + TASKS_DIR
    slug: resolve
    lane: framework
    x: 320
    y: 310
    aef:
      determinism: deterministic
      contextReads: ".framework.yaml, FRAMEWORK.md marker"     # datastore read (F10)

  - uid: n_scan
    type: scriptTask
    name: For each active task — ripe if revisit_at ≤ today
    slug: scan
    lane: framework
    x: 540
    y: 310
    aef:
      determinism: deterministic
      # F17 — MULTI-INSTANCE / for-each. One predicate applied per item over a
      # dynamic collection (all active task files); order-independent. v2 has no
      # multiInstance marker — this is stashed here, not structural.
      multiInstance:
        over: .tasks/active/*.md
        mode: sequential          # (could be parallel; items are independent)
        predicate: "revisit_at =~ /^\\d{4}-\\d{2}-\\d{2}$/ && revisit_at <= today"
        collects: ripe[]          # id fires revisit_at: name
      contextReads: ".tasks/active/*.md frontmatter"

  - uid: n_any
    type: exclusiveGateway
    name: Any ripe revisits?
    slug: any
    lane: framework
    x: 760
    y: 318
    aef:
      decisionInput: ${ripe_count}      # data-condition (not human) → no F1
      decisionOwner: framework

  - uid: n_surface
    type: scriptTask
    name: Write .revisits-due.txt (surface ripe tasks)
    slug: surface
    lane: framework
    x: 980
    y: 180
    aef:
      determinism: deterministic
      artifactsWrites: [".context/working/.revisits-due.txt"]   # datastore write (F10)

  - uid: n_end_surfaced
    type: endEvent
    name: Ripe revisits surfaced (agent picks up next session)
    slug: end-surfaced
    lane: framework
    x: 1200
    y: 217.333
    aef:
      emits: event:revisits.due

  - uid: n_end_quiet
    type: endEvent
    name: Nothing due (no file / empty = same signal)
    slug: end-quiet
    lane: framework
    x: 980
    y: 420
    aef:
      emits: event:revisits.none

edges:
  - uid: e_timer_resolve
    source: n_timer
    target: n_resolve
  - uid: e_resolve_scan
    source: n_resolve
    target: n_scan
  - uid: e_scan_any
    source: n_scan
    target: n_any

  - uid: e_any_surface
    source: n_any
    target: n_surface
    name: ripe found
    condition: ${ripe_count > 0}
  - uid: e_any_quiet
    source: n_any
    target: n_end_quiet
    name: none
    condition: ${ripe_count == 0}

  - uid: e_surface_end
    source: n_surface
    target: n_end_surfaced
