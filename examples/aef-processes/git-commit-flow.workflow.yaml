# git-commit-flow — the AEF git agent commit path: the structural enforcement
# behind "every commit connects to a task (T-XXX)" (P-002). Dogfood corpus
# (T-064). Complements the T-054 constitutional-gate series (task-gate,
# verification-gate, context-memory, error-ladder) with the GIT enforcement gate.
#
# Ground truth: .agentic-framework/agents/git/
#   git.sh                 — dispatcher (case commit → lib/commit.sh do_commit)
#   lib/commit.sh          — do_commit: arg parse, task-ref gate, bypass branch
#   lib/hooks.sh           — the installed pre-commit + commit-msg hooks
#   lib/{secret-scan,large-file-scan,dup-task-scan}.sh — the pre-commit scanners
#   lib/bypass.sh          — log_bypass_entry → .context/bypass-log.yaml
# Generated by the Workflow Designer product side (authoring + validation only) —
# NOT executed.
#
# Lanes = AEF authority model:
#   agent     = initiative  — runs `git.sh commit`, must carry a T-XXX ref;
#                             chooses the (Tier-2) --bypass path when unavoidable.
#   framework = authority   — performs the commit, runs the pre-commit + commit-msg
#                             hook gates, writes the bypass log, stamps the task.
#   human     = sovereignty — the only actor who may authorise a bypass (a required
#                             --reason, logged Tier-2) and owns the retroactive task.
#
# FIDELITY NOTES (see docs/reports/T-064-git-commit-friction.md):
#  1. The task-ref rule is enforced TWICE — once at the agent level
#     (commit.sh extract_task_id, g_taskref here) and again by the commit-msg git
#     hook (hooks.sh VERSION=1.9). g_hooks collapses that hook plus the three
#     pre-commit scanners (secret/dup-task/large-file) into ONE gate node — a
#     recorded FC-11 collapse declared first-class via aef.constituents (T-081;
#     the x-checks workaround is retired).
#  2. The coded --bypass path calls `git commit` WITHOUT --no-verify, so it still
#     fires the hook gates; the map draws the bypass spine as coded and flags the
#     discrepancy in the friction report rather than inventing a hook-skip edge.
workflowMeta:
  id: git-commit-flow
  version: 1
  schemaVersion: 2
  source: agents/git/lib/commit.sh
  tier_default: 1

pool:
  id: Pool_git_commit_flow
  name: git-commit-flow

lanes:
  - id: human
    name: "Human · Sovereignty"
    abbr: hum
    authority: sovereignty
    height: 140
  - id: framework
    name: "Framework · Authority"
    abbr: frw
    authority: authority
    height: 340
  - id: agent
    name: "Agent · Initiative"
    abbr: agt
    authority: initiative
    height: 150

nodes:
  - uid: n_start
    type: startEvent
    name: "git.sh commit -m \"T-XXX: …\""
    slug: start
    lane: agent
    x: 90
    y: 636.5
    aef:
      determinism: deterministic
      triggeredBy: "agent (or fw git commit) — commit.sh:do_commit"
    io:
      outputs:
        - { name: message, type: string }
        - { name: task_id, type: string }
        - { name: bypass, type: boolean }

  - uid: n_parse
    type: scriptTask
    name: "parse args; check_git_repo; require -m"
    slug: parse
    lane: agent
    x: 150
    y: 622.5
    aef:
      tier: 1
      determinism: deterministic
      endpoint: commit.sh:8-64 (arg loop + check_git_repo + message-required)
      guard: "empty message → ERROR exit 1 (blocks before any branch)"

  - uid: g_bypass
    type: exclusiveGateway
    name: "--bypass?"
    slug: bypass
    lane: agent
    x: 300
    y: 630.5
    aef:
      determinism: deterministic
      endpoint: commit.sh:66 ($bypass == true)
      decisionInput: ${bypass}
      decisionOwner: agent
      decisionOutputs: bypass, enforce

  - uid: g_taskref
    type: exclusiveGateway
    name: "T-XXX in message? (P-002, agent-level)"
    slug: taskref
    lane: agent
    x: 410
    y: 630.5
    aef:
      determinism: deterministic
      endpoint: commit.sh:96-110 (found_task=extract_task_id "$message")
      decisionInput: ${extract_task_id(message) != ""}
      decisionOwner: framework
      decisionOutputs: has-ref, no-ref

  - uid: n_reason
    type: userTask
    name: "authorise bypass — reason required (Tier-2)"
    slug: reason
    lane: human
    x: 300
    y: 100
    aef:
      tier: 2
      determinism: stochastic
      endpoint: commit.sh:67-76 (prompt if empty; empty → ERROR exit 1)
      guard: "no reason → ERROR exit 1 (bypass needs a reason)"
      note: single-use situational authorisation; the human owns the reason

  - uid: n_reminder
    type: userTask
    name: "reminder: create retroactive task"
    slug: reminder
    lane: human
    x: 760
    y: 100
    aef:
      determinism: deterministic
      endpoint: "commit.sh:83-85 (REMINDER: create-task.sh)"
      note: advisory nudge — not structurally enforced (bypass leaves a task-debt)

  - uid: n_commit_bypass
    type: serviceTask
    name: "git commit (bypass) — still fires hooks"
    slug: commit-bypass
    lane: framework
    x: 440
    y: 297.5
    aef:
      tier: 1
      determinism: deterministic
      endpoint: commit.sh:78-79 (git commit -m … ; NO --no-verify)
      sideEffect: "creates a commit object; the installed hooks still run (see friction)"

  - uid: n_logbypass
    type: serviceTask
    name: "log_bypass_entry → .context/bypass-log.yaml"
    slug: logbypass
    lane: framework
    x: 600
    y: 297.5
    aef:
      tier: 1
      determinism: deterministic
      endpoint: bypass.sh:76-113 (log_bypass_entry)
      sideEffect: "appends a YAML bypass record; reviewed by fw audit"

  - uid: n_commit
    type: serviceTask
    name: "git commit (triggers hooks)"
    slug: commit
    lane: framework
    x: 520
    y: 467.5
    aef:
      tier: 1
      determinism: deterministic
      endpoint: commit.sh:113 (git commit -m … "${git_args[@]}")
      sideEffect: "creates a commit object; on success stamps the active task (update_task_timestamp, commit.sh:118-125)"

  - uid: g_hooks
    type: exclusiveGateway
    name: "pre-commit + commit-msg hooks pass?"
    slug: hooks
    lane: framework
    x: 680
    y: 475.5
    aef:
      determinism: deterministic
      endpoint: hooks.sh:271-358 (pre-commit) + hooks.sh:55-88 (commit-msg)
      decisionInput: ${all_hook_gates_pass}
      decisionOwner: framework
      decisionOutputs: pass, blocked
      constituents:
        - { id: c_secret,    name: "secret-scan",                 ref: "T-1844" }
        - { id: c_duptask,   name: "dup-task-scan",               ref: "G-052" }
        - { id: c_largefile, name: "large-file scan",             ref: "T-1845" }
        - { id: c_taskref,   name: "commit-msg task-ref check",   ref: "hooks.sh v1.9" }

  - uid: n_done
    type: endEvent
    name: "commit recorded (task stamped)"
    slug: done
    lane: framework
    x: 830
    y: 481.5
    aef:
      terminalKind: success
      state: committed

  - uid: n_block
    type: endEvent
    name: "BLOCKED — no ref / hook hit / no reason"
    slug: block
    lane: framework
    x: 400
    y: 481.5
    aef:
      terminalKind: error
      state: blocked
      exitCode: 1
      note: "sources — g_taskref no-ref (P-002), g_hooks blocked (secret/dup/large/msg), n_reason no-reason"

edges:
  - { uid: e1, source: n_start, target: n_parse }
  - { uid: e2, source: n_parse, target: g_bypass }
  - { uid: e3, source: g_bypass, target: n_reason, name: "--bypass", condition: "bypass == true" }
  - { uid: e4, source: g_bypass, target: g_taskref, name: "enforce", condition: "bypass == false" }
  - { uid: e5, source: n_reason, target: n_commit_bypass, name: "reason given" }
  - { uid: e6, source: n_commit_bypass, target: n_logbypass }
  - { uid: e7, source: n_logbypass, target: n_reminder }
  - { uid: e8, source: n_reminder, target: n_done }
  - { uid: e9, source: g_taskref, target: n_commit, name: "has ref", condition: "found_task != ''" }
  - { uid: e10, source: g_taskref, target: n_block, name: "no ref (P-002 block)", condition: "found_task == ''" }
  - { uid: e11, source: n_commit, target: g_hooks }
  - { uid: e12, source: g_hooks, target: n_done, name: "pass", condition: "all_hook_gates_pass" }
  - { uid: e13, source: g_hooks, target: n_block, name: "blocked", condition: "!all_hook_gates_pass" }
