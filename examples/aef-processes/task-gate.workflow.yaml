# task-gate — AEF Tier-1 task gate, the structural enforcement of the Core
# Principle "Nothing gets done without a task". Dogfood corpus (T-055).
#
# Ground truth: agents/context/check-active-task.sh (PreToolUse hook on
# Write/Edit/Bash). Generated by the Workflow Designer product side (authoring +
# validation only) — NOT executed.
#
# Lanes = AEF authority model:
#   agent     = initiative  — issues the tool call; remediates when blocked.
#   framework = authority   — the hook: intercepts, checks focus + readiness,
#                             allows (exit 0) or blocks (exit 2), logs bypass.
#   human     = sovereignty — the only actor who may authorise a Tier-2 bypass
#                             (FW_SWITCH_FOCUS=1 / FW_SAFE_MODE=1).
#
# The full hook has more branches (stale-session, onboarding, inception,
# B-005 settings-protection, fabric advisory); this map renders the governance
# SPINE at readable granularity. Friction catalogue in
# docs/reports/T-055-task-gate-friction.md.
workflowMeta:
  id: task-gate
  version: 1
  schemaVersion: 2
  source: agents/context/check-active-task.sh
  tier_default: 1

pool:
  id: Pool_task_gate
  name: task-gate

lanes:
  - id: human
    name: "Human · Sovereignty"
    abbr: hum
    authority: sovereignty
    height: 160
  - id: framework
    name: "Framework · Authority"
    abbr: frw
    authority: authority
    height: 260
  - id: agent
    name: "Agent · Initiative"
    abbr: agt
    authority: initiative
    height: 200

nodes:
  - uid: n_attempt
    type: startEvent
    name: Agent attempts Write/Edit/Bash
    slug: attempt
    lane: agent
    x: 120
    y: 514
    aef:
      determinism: stochastic
    io:
      outputs:
        - { name: tool, type: string }
        - { name: file_path, type: string }

  - uid: n_intercept
    type: scriptTask
    name: PreToolUse hook intercepts (check-active-task.sh)
    slug: intercept
    lane: framework
    x: 250
    y: 320
    aef:
      tier: 1
      determinism: deterministic
      trigger: PreToolUse (Write/Edit/Bash)
      endpoint: agents/context/check-active-task.sh
      contextReads: .context/working/focus.yaml, .context/working/session.yaml

  - uid: g_exempt
    type: exclusiveGateway
    name: Exempt path or safe command?
    slug: exempt
    lane: framework
    x: 430
    y: 328
    aef:
      determinism: deterministic
      decisionInput: ${path in [.context,.tasks,.claude,.git] || safe_bash_cmd}
      decisionOwner: framework
      decisionOutputs: exempt, modifies-source

  - uid: g_active
    type: exclusiveGateway
    name: Active task in focus?
    slug: active
    lane: framework
    x: 560
    y: 328
    aef:
      determinism: deterministic
      decisionInput: ${focus.current_task != null && focus_session == session}
      decisionOwner: framework
      decisionOutputs: none, drift, active

  - uid: g_ready
    type: exclusiveGateway
    name: Started-work + real ACs?
    slug: ready
    lane: framework
    x: 760
    y: 328
    aef:
      determinism: deterministic
      decisionInput: ${status in [started-work,issues] && acs_are_real}
      decisionOwner: framework
      decisionOutputs: ready, not-ready

  - uid: n_allow
    type: endEvent
    name: Allow — exit 0
    slug: allow
    lane: framework
    x: 980
    y: 334
    aef:
      determinism: deterministic
      emits: PreToolUse allow (exit 0)

  - uid: n_block
    type: endEvent
    name: Block — exit 2
    slug: block
    lane: framework
    x: 660
    y: 420.667
    aef:
      determinism: deterministic
      emits: PreToolUse block (exit 2)

  - uid: n_log
    type: scriptTask
    name: Log Tier-2 bypass
    slug: log
    lane: framework
    x: 800
    y: 406.667
    aef:
      tier: 2
      determinism: deterministic
      endpoint: .context/working/.gate-bypass-log.yaml
      sideEffect: appends bypass entry (T-1890)
      artifactsWrites: .context/working/.gate-bypass-log.yaml

  - uid: n_override
    type: userTask
    name: Authorise Tier-2 bypass
    slug: override
    lane: human
    x: 560
    y: 150
    aef:
      determinism: stochastic
      endpoint: FW_SWITCH_FOCUS=1 / FW_SAFE_MODE=1
      decisionOwner: human

  - uid: n_create
    type: serviceTask
    name: Create task + set focus
    slug: create
    lane: agent
    x: 470
    y: 500
    aef:
      determinism: stochastic
      endpoint: fw work-on "name" --type build
      sideEffect: sets focus.yaml current_task

  - uid: n_scope
    type: serviceTask
    name: Write real acceptance criteria
    slug: scope
    lane: agent
    x: 680
    y: 500
    aef:
      determinism: stochastic
      endpoint: edit .tasks/active/T-XXX (replace placeholder ACs)
      artifactsWrites: .tasks/active/${task_id}.md

edges:
  - uid: e_01
    source: n_attempt
    target: n_intercept
  - uid: e_02
    source: n_intercept
    target: g_exempt
  - uid: e_03
    source: g_exempt
    target: n_allow
    name: exempt path / safe cmd
    condition: ${exempt == true}
  - uid: e_04
    source: g_exempt
    target: g_active
    name: modifies source
    condition: ${exempt == false}
  - uid: e_05
    source: g_active
    target: n_block
    name: no active task (P-002)
    condition: ${task == 'none'}
  - uid: e_06
    source: g_active
    target: n_override
    name: stale / focus-drift (T-560/T-1730)
    condition: ${task == 'drift'}
  - uid: e_07
    source: g_active
    target: g_ready
    name: active task in focus
    condition: ${task == 'active'}
  - uid: e_08
    source: g_ready
    target: n_block
    name: captured / completed / placeholder ACs (G-020)
    condition: ${ready == false}
  - uid: e_09
    source: g_ready
    target: n_allow
    name: started-work + real ACs
    condition: ${ready == true}
  - uid: e_10
    source: n_override
    target: n_log
    name: human authorises
  - uid: e_11
    source: n_log
    target: n_allow
  - uid: e_12
    source: n_block
    target: n_create
    name: agent remediates
  - uid: e_13
    source: n_create
    target: n_scope
  - uid: e_14
    source: n_scope
    target: n_attempt
    name: re-issue
