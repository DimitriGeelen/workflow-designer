# context-memory — the AEF Context Fabric, the three-tier persistent memory that
# lets sessions accrete knowledge instead of restarting cold. Dogfood corpus
# (T-057). Third of the four "constitutional gate" maps from the T-054 audit
# (after task-gate / T-055, verification-gate / T-056).
#
# Ground truth: agents/context/context.sh (dispatcher, 62-96) + lib/{init,focus,
# learning,pattern,decision,episodic,promote}.sh. Generated by the Workflow
# Designer product side (authoring + validation only) — NOT executed.
#
# LANE-AXIS DECISION (headline friction, see docs/reports/T-057-context-memory-
# friction.md): every prior corpus map partitions lanes by the AEF AUTHORITY axis
# (initiative/authority/sovereignty). This process is a DATA FABRIC — its natural
# partition is the three MEMORY TIERS, not authority. The schema offers exactly
# one lane axis, and its `authority` attribute assumes that axis IS authority. So
# here the lanes carry `authority: none` (they are data partitions) and the real
# actor (agent-explicit vs framework-automatic) migrates into per-node aef
# metadata (agentType / triggeredBy / determinism). This is a recorded modelling
# decision, not an oversight — and the strongest schema-expressivity finding yet.
#
#   working  = session-local: seeded by `init`, updated by `focus`; never promoted.
#   project  = durable cross-task: learnings / patterns / decisions, appended by
#              agent `add-*` commands (provenance-tagged --task).
#   episodic = condensed completed-task histories, generated AUTOMATICALLY on
#              work-completed (framework), sourced from task file + git log.
workflowMeta:
  id: context-memory
  version: 1
  schemaVersion: 2
  source: agents/context/context.sh
  tier_default: 1

pool:
  id: Pool_context_memory
  name: context-memory

lanes:
  - id: working
    name: "Working Memory · session-local"
    abbr: wrk
    authority: none
    height: 150
  - id: project
    name: "Project Memory · durable cross-task"
    abbr: prj
    authority: none
    height: 250
  - id: episodic
    name: "Episodic Memory · completed histories"
    abbr: epi
    authority: none
    height: 160

nodes:
  - uid: n_start
    type: startEvent
    name: "Session start"
    slug: start
    lane: working
    x: 100
    y: 81.5
    aef:
      determinism: stochastic
      triggeredBy: fw context init (session start)

  - uid: n_init
    type: serviceTask
    name: "context init — seed session + focus + counters"
    slug: init
    lane: working
    x: 200
    y: 67.5
    aef:
      determinism: deterministic
      agentType: framework
      endpoint: lib/init.sh:26-77
      sideEffect: "writes session.yaml, focus.yaml, .tool-counter (reads active tasks + latest handover)"
      artifactsWrites: .context/working/session.yaml, .context/working/focus.yaml

  - uid: n_focus
    type: serviceTask
    name: "context focus T-XXX — set current_task + recall briefing"
    slug: focus
    lane: working
    x: 380
    y: 67.5
    aef:
      determinism: deterministic
      endpoint: lib/focus.sh:49-127
      sideEffect: "writes focus.yaml current_task + focus_session; reads Project memory via memory-recall.py for briefing"
      contextReads: .context/project/learnings.yaml, .context/project/patterns.yaml

  - uid: g_capture
    type: exclusiveGateway
    name: "capture what? (agent judgement)"
    slug: capture
    lane: project
    x: 250
    y: 313
    aef:
      determinism: stochastic
      decisionInput: ${knowledge_kind}
      decisionOwner: agent
      decisionOutputs: learning, pattern, decision

  - uid: n_learning
    type: serviceTask
    name: "add-learning -> learnings.yaml"
    slug: learning
    lane: project
    x: 360
    y: 305
    aef:
      determinism: stochastic
      agentType: any
      endpoint: lib/learning.sh:91-126
      artifactsWrites: .context/project/learnings.yaml

  - uid: n_pattern
    type: serviceTask
    name: "add-pattern <failure|success|workflow> -> patterns.yaml"
    slug: pattern
    lane: project
    x: 516.5
    y: 305
    aef:
      determinism: stochastic
      agentType: any
      endpoint: lib/pattern.sh:124-157
      artifactsWrites: .context/project/patterns.yaml

  - uid: n_decision
    type: serviceTask
    name: "add-decision -> decisions.yaml"
    slug: decision
    lane: project
    x: 660
    y: 305
    aef:
      determinism: stochastic
      agentType: any
      endpoint: lib/decision.sh:103-147
      artifactsWrites: .context/project/decisions.yaml

  - uid: n_promote
    type: serviceTask
    name: "promote L->practice->directive (3+ applications)"
    slug: promote
    lane: project
    x: 360
    y: 388.333
    aef:
      determinism: deterministic
      endpoint: lib/promote.sh:4-5 (fw promote); cross-project lib/harvest.sh
      sideEffect: graduates a recurring learning into a durable practice/directive

  - uid: n_persisted
    type: endEvent
    name: "project memory durable (survives session)"
    slug: persisted
    lane: project
    x: 553.5
    y: 402.333
    aef:
      determinism: deterministic
      emits: learnings/patterns/decisions committed to .context/project/

  - uid: n_complete
    type: startEvent
    name: "task work-completed (P-011 passed)"
    slug: complete
    lane: episodic
    x: 380
    y: 484
    aef:
      determinism: deterministic
      triggeredBy: update-task.sh:1254 / 1980 (auto on --status work-completed)

  - uid: n_episodic
    type: scriptTask
    name: "generate-episodic — task file + git log -> episodic/T-XXX.yaml"
    slug: episodic
    lane: episodic
    x: 500
    y: 470
    aef:
      determinism: deterministic
      agentType: framework
      endpoint: lib/episodic.sh:242-441
      contextReads: ".tasks/completed/${task_id}.md, git log --grep ^${task_id}"
      artifactsWrites: .context/episodic/${task_id}.yaml

  - uid: n_stored
    type: endEvent
    name: "episodic stored — feeds future recall"
    slug: stored
    lane: episodic
    x: 680
    y: 484
    aef:
      determinism: deterministic
      emits: episodic/${task_id}.yaml written (D-023 hybrid)

edges:
  - uid: e_01
    source: n_start
    target: n_init
  - uid: e_02
    source: n_init
    target: n_focus
  - uid: e_03
    source: n_focus
    target: g_capture
    name: agent captures knowledge during work
  - uid: e_04
    source: g_capture
    target: n_learning
    name: learning
    condition: ${kind == 'learning'}
  - uid: e_05
    source: g_capture
    target: n_pattern
    name: pattern (failure/success/workflow)
    condition: ${kind == 'pattern'}
  - uid: e_06
    source: g_capture
    target: n_decision
    name: decision
    condition: ${kind == 'decision'}
  - uid: e_07
    source: n_learning
    target: n_promote
    name: 3+ applications -> graduate
  - uid: e_08
    source: n_pattern
    target: n_persisted
  - uid: e_09
    source: n_decision
    target: n_persisted
  - uid: e_10
    source: n_promote
    target: n_persisted
  - uid: e_11
    source: n_complete
    target: n_episodic
    name: framework auto-fires
  - uid: e_12
    source: n_episodic
    target: n_stored
