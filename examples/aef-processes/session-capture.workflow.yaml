# session-capture — the P-007 session-end capture gate: "do not close a session
# without confirming all discussed work is captured". Dogfood corpus (T-067).
# Completes the session-lifecycle trio: session-handover (write state down),
# resume-status (rebuild from it), session-capture (nothing lost before either).
#
# Ground truth: .agentic-framework/agents/session-capture/AGENT.md — the WHOLE
# ground truth. This is a DOCTRINE-ONLY agent: no script exists (the capture.sh
# referenced at AGENT.md:52 is absent from the vendored tree — an instance of the
# agent's own "Gaps: things referenced but don't exist" category; see friction
# report). Every endpoint below cites AGENT.md, not executable code.
# Generated by the Workflow Designer product side (authoring + validation only) —
# NOT executed.
#
# Lanes = AEF authority model (human absent: the agent self-administers the
# checklist; framework surfaces receive the captures):
#   agent     = initiative  — scans its own conversation, judges what is
#                             uncaptured (stochastic — semantic work).
#   framework = authority   — the capture surfaces written to (.tasks/,
#                             practices, learnings, observation inbox).
#
# FIDELITY NOTES (see docs/reports/T-067-session-capture-friction.md):
#  1. First 100%-doctrine map: `endpoint` values are doc citations (AGENT.md:NN),
#     not script lines — the key stretches but holds (error-ladder precedent
#     mixed [CODE]/[DOCTRINE]; this map is all doctrine).
#  2. n_capture collapses four capture actions (create tasks / update tasks /
#     record practices / log questions) — FC-11 4th recurrence; the recurrence
#     drove T-068 GO. Migrated to a first-class subProcess node with
#     aef.constituents (T-081); the x-captures workaround is retired.
workflowMeta:
  id: session-capture
  version: 1
  schemaVersion: 2
  source: agents/session-capture/AGENT.md
  tier_default: 1

pool:
  id: Pool_session_capture
  name: session-capture

lanes:
  - id: agent
    name: "Agent · Initiative"
    abbr: agt
    authority: initiative
    height: 200
  - id: framework
    name: "Framework · Authority"
    abbr: frw
    authority: authority
    height: 200

nodes:
  - uid: n_start
    type: startEvent
    name: "session end / context transition"
    slug: start
    lane: agent
    x: 90
    y: 140
    aef:
      determinism: deterministic
      triggeredBy: "MANDATORY before: ending session, switching task/topic, significant milestone (AGENT.md:11-15)"

  - uid: n_scan
    type: serviceTask
    name: "scan conversation per category for uncaptured items"
    slug: scan
    lane: agent
    x: 170
    y: 130
    aef:
      tier: 1
      determinism: stochastic
      endpoint: "AGENT.md:17-37 (category table + checklist scan lines)"
      multiInstance:
        over: "categories: work-items, decisions, learnings, questions, gaps"
        mode: sequential
        predicate: "signal phrases — should/need-to/TODO/will; choices made; pivots/surprises; open questions; referenced-but-missing"
        collects: uncaptured[]
      note: "semantic self-scan of the agent's own conversation — inherently stochastic"

  - uid: g_found
    type: exclusiveGateway
    name: "uncaptured items found?"
    slug: found
    lane: agent
    x: 340
    y: 138
    aef:
      determinism: stochastic
      endpoint: AGENT.md:33-37
      decisionInput: "${uncaptured[] not empty}"
      decisionOwner: agent
      decisionOutputs: items-found, nothing-uncaptured

  - uid: n_capture
    type: subProcess
    name: "capture: tasks, updates, practices, questions"
    slug: capture
    lane: framework
    x: 440
    y: 330
    aef:
      tier: 1
      determinism: deterministic
      endpoint: "AGENT.md:38-40 (checklist capture lines)"
      artifactsWrites: ".tasks/active/*.md (new + updated), practices, learnings, vision doc"
      constituents:
        - { id: c_tasks,     name: "create task per work item" }
        - { id: c_updates,   name: "update tasks with new context" }
        - { id: c_practices, name: "capture learnings as practices" }
        - { id: c_questions, name: "log open questions" }
      note: "FC-11 composite — four capture actions, one collapsed subProcess (first-class since T-081)"

  - uid: n_inbox
    type: serviceTask
    name: "triage observation inbox (fw note list)"
    slug: inbox
    lane: framework
    x: 610
    y: 330
    aef:
      tier: 1
      determinism: deterministic
      endpoint: "AGENT.md:41-42 (fw note list — promote or dismiss; fw note for new observations)"
      contextReads: "observation inbox (fw note list)"
      note: "runs regardless of scan outcome — the inbox may hold pre-existing pending notes"

  - uid: n_report
    type: serviceTask
    name: "emit capture report (created/updated/practices/questions/gaps)"
    slug: report
    lane: agent
    x: 760
    y: 130
    aef:
      determinism: deterministic
      endpoint: "AGENT.md:54-61 (Output section)"

  - uid: n_done
    type: endEvent
    name: "capture complete — session may close"
    slug: done
    lane: agent
    x: 930
    y: 144
    aef:
      terminalKind: success
      state: capture-complete
      note: "precondition for session end — 'Do not close without confirming' (AGENT.md:49)"

edges:
  - { uid: e1, source: n_start, target: n_scan }
  - { uid: e2, source: n_scan, target: g_found }
  - { uid: e3, source: g_found, target: n_capture, name: "items found", condition: "uncaptured not empty" }
  - { uid: e4, source: g_found, target: n_inbox, name: "nothing uncaptured", condition: "uncaptured empty" }
  - { uid: e5, source: n_capture, target: n_inbox }
  - { uid: e6, source: n_inbox, target: n_report }
  - { uid: e7, source: n_report, target: n_done }
