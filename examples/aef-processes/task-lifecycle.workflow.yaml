# task-lifecycle — AEF core process, generated as a dogfood corpus (T-022).
#
# Ground truth: agents/task-create/update-task.sh (transition dispatch + gates),
# lib/enums.sh (status enum + valid transitions), agents/healing/healing.sh
# (issues auto-trigger). Generated by the Workflow Designer product side
# (authoring + validation only) — NOT executed against the vendored framework.
#
# Lanes = AEF authority model: human = sovereignty (owns completion of
# human-owned tasks), framework = authority (enforces gates + transitions),
# agent = initiative (does the work, requests transitions).
#
# This process is a CYCLIC state machine (captured -> started-work <-> issues
# -> work-completed) with backward edges. Where the v2 BPMN-subset schema
# cannot express it cleanly, the friction is catalogued [F1,F3,F5,F7,F8] in
# docs/reports/T-022-task-lifecycle-friction.md (F1/F3/F5 recur from T-021 =
# systemic gaps; F7/F8 are new). Free-form detail carried under `aef:` is
# itself friction evidence — it has no first-class home in v2.
workflowMeta:
  id: task-lifecycle
  version: 1
  schemaVersion: 2
  source: agents/task-create/update-task.sh
  tier_default: 1

pool:
  id: Pool_task_lifecycle
  name: task-lifecycle

lanes:
  - id: human
    name: "Human · Sovereignty"
    abbr: hum
    authority: sovereignty
    height: 160
  - id: framework
    name: "Framework · Authority"
    abbr: frw
    authority: authority
    height: 260
  - id: agent
    name: "Agent · Initiative"
    abbr: agt
    authority: initiative
    height: 200

nodes:
  - uid: n_file
    type: startEvent
    name: Task captured (filed)
    slug: captured
    lane: framework
    x: 120
    y: 360
    aef:
      state: captured
      triggeredBy: fw task create --type <type> --owner <agent|human>
      endpoint: agents/task-create/create-task.sh
    io:
      outputs:
        - { name: task_id, type: task_id }
        - { name: owner, type: string }

  - uid: n_ready
    type: exclusiveGateway
    name: Build-ready? (G-020 entry guard)
    slug: ready-guard
    lane: framework
    x: 320
    y: 360
    aef:
      # G-020 is an ENTRY guard on captured->started-work, enforced in
      # agents/context/check-active-task.sh (pickup time), NOT a completion gate.
      gate: G-020
      rule: real ACs required to start build; placeholder ACs block

  - uid: n_authoring
    type: serviceTask
    name: Write real acceptance criteria
    slug: author-acs
    lane: agent
    x: 320
    y: 560
    aef:
      tier: 1
      agentType: primary
      determinism: stochastic

  - uid: n_start
    type: scriptTask
    name: Start work (captured -> started-work)
    slug: start-work
    lane: framework
    x: 520
    y: 360
    aef:
      state: started-work
      tier: 1
      determinism: deterministic
      endpoint: fw work-on ${task_id}
      sideEffect: sets focus.yaml
    io:
      inputs:
        - { name: task_id, type: task_id, required: true }

  - uid: n_work
    type: serviceTask
    name: Perform the work
    slug: work
    lane: agent
    x: 720
    y: 560
    aef:
      state: started-work
      tier: 2
      agentType: primary
      determinism: stochastic
      contextReads: .tasks/active/${task_id}.md

  - uid: n_progress
    type: exclusiveGateway
    name: Outcome?
    slug: outcome
    lane: framework
    x: 920
    y: 360
    aef:
      decisionInput: ${outcome}
      decisionOwner: agent

  - uid: n_issues
    type: scriptTask
    name: Enter issues (auto → healing diagnose)
    slug: issues
    lane: framework
    x: 920
    y: 230
    aef:
      state: issues
      tier: 1
      determinism: deterministic
      endpoint: fw task update ${task_id} --status issues
      # AUTO-TRIGGER on arrival — a sub-process invoked as a transition side
      # effect; v2 has no callActivity / onTransition hook (F5).
      autoTrigger: agents/healing/healing.sh diagnose ${task_id}
      autoTriggerKind: sub-process

  - uid: n_complete_req
    type: scriptTask
    name: Request completion (fw done)
    slug: request-complete
    lane: agent
    x: 1120
    y: 560
    aef:
      tier: 1
      determinism: deterministic
      endpoint: fw task update ${task_id} --status work-completed

  - uid: n_gates
    type: scriptTask
    name: Run completion gate battery
    slug: completion-gates
    lane: framework
    x: 1320
    y: 360
    aef:
      tier: 1
      determinism: deterministic
      # AND-composed gate SET, each independently bypassable (Tier-2, logged).
      # v2 has no first-class transition guard / gate-set (F8).
      gates:
        - { id: R-033, rule: "owner=human blocks completion", bypass: "--skip-sovereignty" }
        - { id: P-010, rule: "agent ACs all [x], no placeholders", bypass: "--skip-acceptance-criteria" }
        - { id: P-011, rule: "## Verification commands all exit 0", bypass: "--skip-verification" }
        - { id: G-019, rule: "bug-class tasks need substantive RCA", bypass: "--skip-rca" }
        - { id: T-1718, rule: "arc build tasks fill ## Evolution", bypass: "--skip-evolution" }
      umbrellaBypass: "--force (deprecated)"

  - uid: n_gate_result
    type: exclusiveGateway
    name: All gates pass?
    slug: gate-result
    lane: framework
    x: 1520
    y: 360
    aef:
      decisionInput: ${gates}
      decisionOwner: framework

  - uid: n_partial_check
    type: exclusiveGateway
    name: Human-owned with unchecked Human ACs?
    slug: partial-check
    lane: framework
    x: 1720
    y: 360
    aef:
      # The partial-complete branch is selected by a HUMAN-ownership condition
      # whose outcome routes edges — same human-decision->edge gap as T-021 (F1).
      decisionInput: ${owner == 'human' && human_acs_unchecked}
      decisionOwner: framework

  - uid: n_partial
    type: scriptTask
    name: Partial-complete (stays active, owner→human, emit review)
    slug: partial-complete
    lane: framework
    x: 1720
    y: 230
    aef:
      state: work-completed
      tier: 1
      determinism: deterministic
      note: file stays in active/; episodic deliberately deferred (T-634/T-679)
      emits: review-surface (URL + QR + artifacts)

  - uid: n_human_finalize
    type: userTask
    name: Human checks ### Human ACs, re-runs fw done
    slug: human-finalize
    lane: human
    x: 1920
    y: 110
    aef:
      tier: 0
      determinism: human
      authority: sovereignty
      note: human-only by R-033 + convention (agent must never check Human ACs)

  - uid: n_finalize
    type: scriptTask
    name: Finalize (date_finished, move to completed/, episodic, clear focus)
    slug: finalize
    lane: framework
    x: 1920
    y: 360
    aef:
      state: work-completed
      tier: 1
      determinism: deterministic
      autoTrigger: episodic generation (context.sh generate-episodic)
      autoTriggerKind: sub-process
      sideEffect: moves .tasks/active/${task_id}.md -> .tasks/completed/

  - uid: n_end
    type: endEvent
    name: Task completed (in completed/)
    slug: end-completed
    lane: framework
    x: 2120
    y: 360
    aef:
      emits: event:task.work-completed

edges:
  - uid: e_01
    source: n_file
    target: n_ready
  - uid: e_02
    source: n_ready
    target: n_authoring
    name: placeholder ACs
    condition: ${acs_real == false}
  - uid: e_03
    source: n_ready
    target: n_start
    name: build-ready
    condition: ${acs_real == true}
  - uid: e_04
    source: n_authoring
    target: n_ready
    name: re-check
  - uid: e_05
    source: n_start
    target: n_work
  - uid: e_06
    source: n_work
    target: n_progress
  - uid: e_07
    source: n_progress
    target: n_issues
    name: blocked / failing
    condition: ${outcome == 'issues'}
  - uid: e_08
    source: n_progress
    target: n_complete_req
    name: work done
    condition: ${outcome == 'done'}
  - uid: e_09
    source: n_issues
    target: n_work
    name: resume after healing (issues -> started-work)
  - uid: e_10
    source: n_complete_req
    target: n_gates
  - uid: e_11
    source: n_gates
    target: n_gate_result
  - uid: e_12
    source: n_gate_result
    target: n_work
    name: gate failed — rework
    condition: ${gates == 'fail'}
  - uid: e_13
    source: n_gate_result
    target: n_partial_check
    name: gates pass
    condition: ${gates == 'pass'}
  - uid: e_14
    source: n_partial_check
    target: n_partial
    name: human-owned, Human ACs open
    condition: ${partial == true}
  - uid: e_15
    source: n_partial_check
    target: n_finalize
    name: fully complete
    condition: ${partial == false}
  - uid: e_16
    source: n_partial
    target: n_human_finalize
  - uid: e_17
    source: n_human_finalize
    target: n_finalize
    name: Human ACs checked
  - uid: e_18
    source: n_finalize
    target: n_end
