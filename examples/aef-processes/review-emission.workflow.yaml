# review-emission — AEF human-review handoff (fw review / emit_review), dogfood corpus (T-049).
#
# Ground truth: .agentic-framework/lib/review.sh — emit_review (L.77-272)
#   resolve task file: hint arg or discover in active/ then completed/ (L.85-100) ·
#   arc-parent 3-question check, advisory (L.102-103) · detect workflow_type + build
#   Watchtower URL, /inception vs /review (L.105-119) · count Human ACs (L.121-136) ·
#   inception-only: WARN if no ## Recommendation (L.149-162) · HARD review-link homework
#   gate, --enforce, return 2, env-bypass logged Tier-2 (L.164-179) · print card + URL + QR +
#   artifacts, best-effort (L.181-256) · mark reviewed: touch .reviewed-<id> (L.258-267).
# Generated by the Workflow Designer product side (authoring + validation only) — NOT executed.
#
# What this map surfaces (see docs/reports/T-049-review-friction.md):
#   - FC-7 (NEW headline): a HANDOFF-EMITTER process. emit_review's whole purpose is to present
#     a task for HUMAN SOVEREIGNTY review (Human AC approval or inception decision) — but that
#     review happens out-of-band on Watchtower, OUTSIDE this script's control flow. The process
#     terminates at "handoff emitted"; the sovereignty act it exists to enable is not a node
#     here. The schema (single pool, sequence flow) has no way to say "this terminal is a
#     message to a participant whose response is a separate process."
#   - Marker-as-inter-process-signal: the `.reviewed-<id>` touch is a side effect that UNBLOCKS
#     a different process (`fw inception decide`, the T-973 gate). A filesystem signal across
#     process boundaries — a side effect with downstream control meaning.
#   - Tier-2-bypassable hard gate: the T-2139 link-homework gate BLOCKS (return 2) but a human
#     may override via env var (logged Tier-2). A gate whose "off" branch is human-authorized.
#   - FC-1 recurrence: three advisory steps (arc-parent check, recommendation WARN, QR) that
#     warn-but-continue.
#
# Authority model:
#   agent     = initiative   (runs `fw review` / triggers emit_review for a task)
#   framework = authority    (resolves the file, enforces the found + link-homework gates,
#                             prints the card, writes the .reviewed marker)
#   (human sovereignty is the OUT-OF-BAND recipient — see FC-7; not in this control flow)
#
# Layout (T-042/T-043; short labels per T-046): agent [62,182] · framework [182,542].
#   Spine y=300 / gates y=308; the inception-only recommendation check sits above the spine
#   (y=190) and rejoins; the two error terminals (not-found, homework) sit below (y=430).
#   check-lane-bands clean.
workflowMeta:
  id: review-emission
  version: 1
  schemaVersion: 2
  source: lib/review.sh
  tier_default: 1

pool:
  id: Pool_review_emission
  name: review-emission

lanes:
  - id: agent
    name: "Agent · Initiative"
    abbr: agt
    authority: initiative
    height: 120
  - id: framework
    name: "Framework · Authority"
    abbr: frw
    authority: authority
    height: 360

nodes:
  - uid: n_start
    type: startEvent
    name: "`fw review` — emit_review(task)"
    slug: start
    lane: agent
    x: 100
    y: 110
    aef:
      determinism: deterministic
      endpoint: fw review

  - uid: n_resolve
    type: scriptTask
    name: Resolve task file (hint → discover)
    slug: resolve
    lane: framework
    x: 250
    y: 300
    aef:
      determinism: deterministic
      # L.85-100 — hint arg, else scan active/ then completed/

  - uid: n_found_gate
    type: exclusiveGateway
    name: "Task file found?"
    slug: found-gate
    lane: framework
    x: 400
    y: 308
    aef:
      decisionInput: ${task_file != ""}
      decisionOwner: framework       # L.98-100

  - uid: n_not_found
    type: endEvent
    name: return 1 — no task file
    slug: not-found
    lane: framework
    x: 400
    y: 430
    aef:
      terminalKind: error

  - uid: n_arc
    type: scriptTask
    name: Arc-parent 3-question check
    slug: arc
    lane: framework
    x: 540
    y: 300
    aef:
      determinism: deterministic
      softFail: advisory             # L.102-103 — `|| true`, never blocks
      # _arc_parent_gate prints a completion-discipline reminder for arc parents

  - uid: n_type_gate
    type: exclusiveGateway
    name: "inception?"
    slug: type-gate
    lane: framework
    x: 700
    y: 308
    aef:
      decisionInput: ${workflow_type == inception}
      decisionOwner: framework       # L.108-119 — routes URL /inception vs /review

  - uid: n_rec
    type: scriptTask
    name: Check ## Recommendation (WARN)
    slug: rec
    lane: framework
    x: 700
    y: 190
    aef:
      determinism: deterministic
      softFail: advisory             # L.149-162 — inception-only; WARN if missing, continue

  - uid: n_link_validate
    type: scriptTask
    name: Validate review links (--enforce)
    slug: link-validate
    lane: framework
    x: 860
    y: 300
    aef:
      determinism: deterministic
      # L.164-179 — review_link_validator.py --enforce (T-2139)

  - uid: n_link_gate
    type: exclusiveGateway
    name: "Links resolve? (no homework)"
    slug: link-gate
    lane: framework
    x: 1010
    y: 308
    aef:
      decisionInput: ${links_ok || FW_ALLOW_REVIEW_LINK_HOMEWORK}
      decisionOwner: framework       # hard gate; human may bypass via env var → Tier-2

  - uid: n_homework
    type: endEvent
    name: BLOCKED — link homework (return 2)
    slug: homework
    lane: framework
    x: 1010
    y: 430
    aef:
      terminalKind: error            # L.171-177; bypass FW_ALLOW_REVIEW_LINK_HOMEWORK=1 (Tier-2, logged)

  - uid: n_card
    type: scriptTask
    name: Print review card + URL
    slug: card
    lane: framework
    x: 1150
    y: 300
    aef:
      determinism: deterministic
      # L.181-187 — label, Human-AC count, Watchtower URL

  - uid: n_qr
    type: scriptTask
    name: QR + artifacts (best-effort)
    slug: qr
    lane: framework
    x: 1300
    y: 300
    aef:
      determinism: deterministic
      softFail: advisory             # L.189-225 — QR if qrcode present; list docs/reports artifacts

  - uid: n_mark
    type: scriptTask
    name: Mark reviewed — touch .reviewed-<id>
    slug: mark
    lane: framework
    x: 1450
    y: 300
    aef:
      determinism: deterministic
      # L.258-267 — inter-process signal
      sideEffect: touch .context/working/.reviewed-<id> (unblocks fw inception decide, T-973)

  - uid: n_done
    type: endEvent
    name: Handoff emitted ✓
    slug: done
    lane: framework
    x: 1600
    y: 314
    aef:
      terminalKind: success
      x-handoffTo: human sovereignty (Watchtower, out-of-band — see FC-7)

edges:
  - uid: e_01
    source: n_start
    target: n_resolve
  - uid: e_02
    source: n_resolve
    target: n_found_gate
  - uid: e_03
    source: n_found_gate
    target: n_not_found
    name: not found
    condition: ${task_file == ""}
  - uid: e_04
    source: n_found_gate
    target: n_arc
    name: found
    condition: ${task_file != ""}
  - uid: e_05
    source: n_arc
    target: n_type_gate
  - uid: e_06
    source: n_type_gate
    target: n_rec
    name: inception
    condition: ${workflow_type == inception}
  - uid: e_07
    source: n_type_gate
    target: n_link_validate
    name: standard
    condition: ${workflow_type != inception}
  - uid: e_08
    source: n_rec
    target: n_link_validate
    name: rejoin
  - uid: e_09
    source: n_link_validate
    target: n_link_gate
  - uid: e_10
    source: n_link_gate
    target: n_homework
    name: homework
    condition: ${!links_ok && !bypass}
  - uid: e_11
    source: n_link_gate
    target: n_card
    name: links ok
    condition: ${links_ok || bypass}
  - uid: e_12
    source: n_card
    target: n_qr
  - uid: e_13
    source: n_qr
    target: n_mark
  - uid: e_14
    source: n_mark
    target: n_done
