# healing-loop — AEF antifragile recovery process, dogfood corpus (T-023).
#
# Ground truth: agents/healing/healing.sh (dispatch), lib/diagnose.sh
# (classify + lookup + ladder), lib/resolve.sh (log pattern + learning),
# auto-trigger in agents/task-create/update-task.sh. Generated by the Workflow
# Designer product side (authoring + validation only) — NOT executed.
#
# Lanes = AEF authority model: human = sovereignty (decides which ladder rung,
# applies fix), framework = authority (records patterns/learnings, resumes),
# agent = initiative (classifies/looks up/suggests — ADVISORY, binds nothing).
#
# This process is invoked as a best-effort sub-process on task->issues (the
# other side of T-022 F5). Its defining trait: the diagnose stages are ADVISORY
# (emit recommendations, no authority to change state). Friction catalogued
# [F1,F3,F5,F7,F9,F10] in docs/reports/T-023-healing-loop-friction.md — F9/F10
# new; F1/F3/F5/F7 recur (F3/F5 now 3/3 = strongly systemic).
workflowMeta:
  id: healing-loop
  version: 1
  schemaVersion: 2
  source: agents/healing/healing.sh
  tier_default: 2
  # advisory best-effort sub-process; entry is non-blocking (|| true). v2 has no
  # workflow-level advisory/enforced mode (relates F9 / T-021 F2).

pool:
  id: Pool_healing_loop
  name: healing-loop

lanes:
  - id: human
    name: "Human · Sovereignty"
    abbr: hum
    authority: sovereignty
    height: 160
  - id: framework
    name: "Framework · Authority"
    abbr: frw
    authority: authority
    height: 220
  - id: agent
    name: "Agent · Initiative"
    abbr: agt
    authority: initiative
    height: 200

nodes:
  - uid: n_trigger
    type: startEvent
    name: Auto-trigger — task entered issues/blocked
    slug: trigger
    lane: framework
    x: 120
    y: 340
    aef:
      triggeredBy: task status -> issues|blocked (update-task.sh:1687)
      advisory: true          # best-effort, wrapped in `|| true`; non-blocking (F9)
    io:
      outputs:
        - { name: task_id, type: task_id }
        - { name: issue_text, type: string }

  - uid: n_classify
    type: serviceTask
    name: Classify failure (keyword scoring)
    slug: classify
    lane: agent
    x: 300
    y: 540
    aef:
      tier: 2
      agentType: primary
      determinism: stochastic        # keyword-scoring classifier (F3)
      advisory: true                 # emits a type, binds nothing (F9)
      endpoint: lib/diagnose.sh:classify_failure
    io:
      inputs:
        - { name: issue_text, type: string, required: true }
      outputs:
        # 6-valued classification: {code, dependency, environment, design, external, unknown}
        - { name: failure_type, type: enum }

  - uid: n_lookup
    type: serviceTask
    name: Lookup similar patterns (RAG)
    slug: lookup
    lane: agent
    x: 480
    y: 540
    aef:
      tier: 2
      agentType: primary
      determinism: stochastic        # semantic RAG over the knowledge base (F3)
      advisory: true
      endpoint: lib/diagnose.sh:find_similar_patterns (python3 lib/ask.py)
      # READS a persistent knowledge store — no first-class datastore resource (F10)
      contextReads: "patterns.yaml, episodic/"
    io:
      inputs:
        - { name: failure_type, type: enum, required: true }
      outputs:
        - { name: matching_patterns, type: list }

  - uid: n_suggest
    type: serviceTask
    name: Suggest recovery — Error Escalation Ladder A/B/C/D
    slug: suggest
    lane: agent
    x: 680
    y: 540
    aef:
      tier: 2
      agentType: primary
      determinism: deterministic     # renders the ladder; type-specific B tips
      advisory: true                 # prints all 4 rungs; selects none (F9)
      endpoint: lib/diagnose.sh:157-204
      # T-062: flattened from a structured list to a scalar x-* note (FC-11 —
      # a collapsed node cannot declare structured constituents; the bridge has
      # no constituent channel, so the rung set survives as readable text).
      x-ladder: "A Don't repeat: check patterns + episodic; B Improve technique: type-specific fix; C Improve tooling: add automated check / audit rule; D Change ways of working: new practice / CLAUDE.md (sovereignty)"
    io:
      inputs:
        - { name: matching_patterns, type: list }
      outputs:
        - { name: recommendation, type: string }

  - uid: n_acted
    type: exclusiveGateway
    name: Human acts on the advice?
    slug: acted
    lane: human
    x: 880
    y: 130
    aef:
      # advisory output => acting is optional; the loop may exit unrecorded (F9)
      decisionInput: ${act}
      decisionOwner: human

  - uid: n_end_advisory
    type: endEvent
    name: Advisory only — no pattern recorded
    slug: end-advisory
    lane: framework
    x: 880
    y: 340
    aef:
      emits: event:healing.advisory-only
      note: diagnose fired but no resolve; memory NOT strengthened

  - uid: n_choose
    type: userTask
    name: Choose ladder rung + direct the recovery
    slug: choose
    lane: human
    x: 1080
    y: 110
    aef:
      tier: 0
      determinism: human
      authority: sovereignty
      # 4-way human choice drives the recovery; no first-class decision->edge (F1)
      decisionOutputs: A, B, C, D
    io:
      inputs:
        - { name: recommendation, type: string, required: true }
      outputs:
        - { name: chosen_rung, type: enum }
        - { name: mitigation, type: string }

  - uid: n_apply
    type: serviceTask
    name: Apply the chosen recovery
    slug: apply
    lane: agent
    x: 1280
    y: 540
    aef:
      tier: 2
      agentType: primary
      determinism: stochastic
      note: fix code (B) / add check (C) / draft practice (D), under human direction
    io:
      inputs:
        - { name: chosen_rung, type: enum, required: true }

  - uid: n_resolve
    type: scriptTask
    name: Log resolution — append pattern + learning + task note
    slug: resolve
    lane: framework
    x: 1480
    y: 340
    aef:
      tier: 1
      determinism: deterministic
      endpoint: fw healing resolve ${task_id} --mitigation "..."
      # WRITES the knowledge base — the antifragile "strengthen from failure"
      # step; no first-class datastore/knowledge resource in v2 (F10)
      artifactsWrites: "patterns.yaml (FP-NNN), learnings.yaml (L-NNN), task Updates note"
    io:
      inputs:
        - { name: mitigation, type: string, required: true }

  - uid: n_resume
    type: scriptTask
    name: Resume task (→ started-work)
    slug: resume
    lane: framework
    x: 1680
    y: 340
    aef:
      tier: 1
      determinism: deterministic
      endpoint: fw task update ${task_id} --status started-work
      # returns control to the task lifecycle (T-022) — cross-process handoff,
      # a sub-process boundary with no callActivity (F5)

  - uid: n_end_resolved
    type: endEvent
    name: Resolved & recorded (antifragile)
    slug: end-resolved
    lane: framework
    x: 1880
    y: 340
    aef:
      emits: event:healing.resolved

edges:
  - uid: e_01
    source: n_trigger
    target: n_classify
  - uid: e_02
    source: n_classify
    target: n_lookup
  - uid: e_03
    source: n_lookup
    target: n_suggest
  - uid: e_04
    source: n_suggest
    target: n_acted
  - uid: e_05
    source: n_acted
    target: n_choose
    name: acts on advice
    condition: ${act == true}
  - uid: e_06
    source: n_acted
    target: n_end_advisory
    name: advisory only
    condition: ${act == false}
  - uid: e_07
    source: n_choose
    target: n_apply
  - uid: e_08
    source: n_apply
    target: n_resolve
  - uid: e_09
    source: n_resolve
    target: n_resume
  - uid: e_10
    source: n_resume
    target: n_end_resolved
