# promotion-pipeline — AEF knowledge-graduation flow (fw promote), dogfood corpus (T-045).
#
# Ground truth: .agentic-framework/lib/promote.sh
#   do_promote (L.17) · count_applications (L.81) · suggest ready-count (L.213)
#   promote L-XXX branch (L.219) · already-promoted gate (L.255) · early-promote warn (L.260)
#   practice-id gen (L.285) · append to practices.yaml (L.310-313)
# Generated by the Workflow Designer product side (authoring + validation only) — NOT executed.
#
# The graduation ladder: Learning (2+ tasks) → Practice (3+ applications) → Directive.
# Authority model:
#   agent     = initiative   (runs `fw promote suggest`; evidence accrued by applying learnings)
#   framework = authority    (counts applications, enforces the ≥3 + not-already-promoted gates,
#                             generates the practice id, writes practices.yaml)
#   human     = sovereignty  (decides WHICH learning graduates; supplies --name + --directive)
#
# Frictions carried (see docs/reports/T-045-promotion-friction.md): F3 (determinism — every
# fw step is deterministic, the promote decision is human; notably NO stochastic node — no
# agent authoring step, unlike inception-review). F1 (human decision) appears here as a
# PROCEED-gate (userTask precondition), not a multi-way decision→edge fan — a sharpening.
#
# Layout (T-042/T-043): lane bands from POOL_Y+POOL_HEADER=62 —
#   agent [62,222] · framework [222,542] · human [542,682]. Branch exits sit in a lower
#   framework row (y=460-470) with ≥50px clearance from the spine (y=350). check-lane-bands clean.
workflowMeta:
  id: promotion-pipeline
  version: 1
  schemaVersion: 2
  source: lib/promote.sh
  tier_default: 1

pool:
  id: Pool_promotion_pipeline
  name: promotion-pipeline

lanes:
  - id: agent
    name: "Agent · Initiative"
    abbr: agt
    authority: initiative
    height: 160
  - id: framework
    name: "Framework · Authority"
    abbr: frw
    authority: authority
    height: 320
  - id: human
    name: "Human · Sovereignty"
    abbr: hum
    authority: sovereignty
    height: 140

nodes:
  - uid: n_suggest
    type: startEvent
    name: Agent runs `fw promote suggest`
    slug: suggest
    lane: agent
    x: 120
    y: 84
    aef:
      determinism: deterministic
      endpoint: fw promote suggest

  - uid: n_load
    type: scriptTask
    name: Load learnings.yaml + practices.yaml
    slug: load
    lane: framework
    x: 280
    y: 350
    aef:
      determinism: deterministic
      # promote.sh L.50-59
      sideEffect: none (read-only)

  - uid: n_count
    type: scriptTask
    name: Count applications per learning (scan episodics/tasks)
    slug: count
    lane: framework
    x: 440
    y: 350
    aef:
      determinism: deterministic
      # count_applications L.81 — distinct tasks/episodics referencing the learning

  - uid: n_ready_gate
    type: exclusiveGateway
    name: "≥3 apps & not already promoted?"
    slug: ready-gate
    lane: framework
    x: 600
    y: 358
    aef:
      decisionInput: ${apps >= 3 && !promoted}
      decisionOwner: framework       # data-condition, not human → no F1

  - uid: n_not_ready
    type: endEvent
    name: Not ready — keep accruing evidence
    slug: not-ready
    lane: framework
    x: 600
    y: 470.667

  - uid: n_present
    type: scriptTask
    name: Present promotion candidates (fw promote suggest output)
    slug: present
    lane: framework
    x: 760
    y: 350
    aef:
      determinism: deterministic
      # L.213-215: prints learnings with app-counts, flags those ready

  - uid: n_promote
    type: userTask
    name: Human promotes a learning — supplies --name + --directive
    slug: promote
    lane: human
    x: 900
    y: 580
    aef:
      determinism: human
      authority: sovereignty
      # Sovereignty decision: WHICH learning graduates, and to which directive.
      # Modelled as a proceed-gate userTask, not a decision->multi-edge (see friction F1).
      decisionOutputs: promote
      endpoint: fw promote L-XXX --name "..." --directive D1

  - uid: n_locate
    type: scriptTask
    name: "`fw promote L-XXX` — locate learning"
    slug: locate
    lane: framework
    x: 1080
    y: 350
    aef:
      determinism: deterministic
      # L.219-252: parse --name/--directive, find learning (error if not found)

  - uid: n_dup_gate
    type: exclusiveGateway
    name: Already promoted?
    slug: dup-gate
    lane: framework
    x: 1240
    y: 358
    aef:
      decisionInput: ${learning_id in promoted_ids}
      decisionOwner: framework       # L.255 — dedup guard (promoted_from + derived_from)

  - uid: n_dup
    type: endEvent
    name: Rejected — duplicate practice avoided
    slug: dup
    lane: framework
    x: 1240
    y: 470.667

  - uid: n_apps_gate
    type: exclusiveGateway
    name: "≥3 applications?"
    slug: apps-gate
    lane: framework
    x: 1400
    y: 358
    aef:
      decisionInput: ${apps >= 3}
      decisionOwner: framework       # L.260 — warn-but-allow early promotion

  - uid: n_warn
    type: scriptTask
    name: Warn "early promotion" — proceed anyway
    slug: warn
    lane: framework
    x: 1400
    y: 456.667
    aef:
      determinism: deterministic
      advisory: true                 # L.261-263: non-blocking warning, both branches rejoin

  - uid: n_genid
    type: scriptTask
    name: Generate practice id (P-/PP-NNN); resolve name + directive
    slug: genid
    lane: framework
    x: 1560
    y: 350
    aef:
      determinism: deterministic
      # L.265-292: auto-infer name/directive if omitted; PP- prefix in consumer projects

  - uid: n_append
    type: scriptTask
    name: Append new practice → practices.yaml
    slug: append
    lane: framework
    x: 1720
    y: 350
    aef:
      determinism: deterministic
      # L.310-313: the graduation side effect
      sideEffect: write .context/project/practices.yaml

  - uid: n_done
    type: endEvent
    name: Promoted — L-XXX → P-XXX
    slug: done
    lane: framework
    x: 1880
    y: 364

edges:
  - uid: e_01
    source: n_suggest
    target: n_load
  - uid: e_02
    source: n_load
    target: n_count
  - uid: e_03
    source: n_count
    target: n_ready_gate
  - uid: e_04
    source: n_ready_gate
    target: n_not_ready
    name: not ready
    condition: ${apps < 3 || promoted}
  - uid: e_05
    source: n_ready_gate
    target: n_present
    name: ready
    condition: ${apps >= 3 && !promoted}
  - uid: e_06
    source: n_present
    target: n_promote
  - uid: e_07
    source: n_promote
    target: n_locate
    name: fw promote L-XXX
  - uid: e_08
    source: n_locate
    target: n_dup_gate
  - uid: e_09
    source: n_dup_gate
    target: n_dup
    name: already promoted
    condition: ${promoted}
  - uid: e_10
    source: n_dup_gate
    target: n_apps_gate
    name: new
    condition: ${!promoted}
  - uid: e_11
    source: n_apps_gate
    target: n_warn
    name: "< 3 (early)"
    condition: ${apps < 3}
  - uid: e_12
    source: n_apps_gate
    target: n_genid
    name: "≥ 3"
    condition: ${apps >= 3}
  - uid: e_13
    source: n_warn
    target: n_genid
  - uid: e_14
    source: n_genid
    target: n_append
  - uid: e_15
    source: n_append
    target: n_done
