# upgrade-process — AEF framework upgrade, dogfood corpus (T-032).
#
# Ground truth: lib/upgrade.sh. Generated by the Workflow Designer product side
# (authoring + validation only) — NOT executed.
#
# Lanes = AEF authority model: agent = initiative (triggers `fw upgrade`),
# framework = authority (snapshots, applies, verifies, rolls back), human =
# sovereignty (reviews the .bak / re-applies customisations — outside this flow).
#
# FIRST compensation / rollback (saga) shape in the corpus (T-032):
#   dry-run? ─preview─► report (no mutation)
#             └apply─► BACKUP (timestamped .bak snapshot, the compensation asset)
#                       → apply steps (settings / hooks / commands+scripts, each
#                         drift-gated) → VERIFY → ok? ─► cleanup → done
#                                                    └fail─► ROLLBACK (restore .bak)
# The rollback restores the pre-mutation snapshot; a trap on EXIT/INT/TERM makes
# it fire on interrupt too. No prior slice has backup→apply→verify→rollback, a
# compensation handler, or a dry-run-mode gateway.
#
# New friction this slice: F15 (compensation / rollback — a step failure must
# restore a pre-step snapshot; v2 has no boundary/compensation event and no
# snapshot↔restore association). See docs/reports/T-032-upgrade-process-friction.md.
workflowMeta:
  id: upgrade-process
  version: 1
  schemaVersion: 2
  source: lib/upgrade.sh
  tier_default: 1

pool:
  id: Pool_upgrade_process
  name: upgrade-process

lanes:
  - id: human
    name: "Human · Sovereignty"
    abbr: hum
    authority: sovereignty
    height: 120
  - id: framework
    name: "Framework · Authority"
    abbr: frw
    authority: authority
    height: 440
  - id: agent
    name: "Agent · Initiative"
    abbr: agt
    authority: initiative
    height: 120

nodes:
  - uid: n_trigger
    type: startEvent
    name: Upgrade requested
    slug: trigger
    lane: agent
    x: 120
    y: 640
    aef:
      triggeredBy: fw upgrade [--dry-run]

  - uid: n_mode
    type: exclusiveGateway
    name: Dry-run mode?
    slug: mode
    lane: framework
    x: 320
    y: 380
    aef:
      # --dry-run makes the whole workflow a no-op PREVIEW (F2 execution.mode
      # recurrence: advisory|guided|strict — dry-run is the advisory mode).
      decisionInput: ${dry_run}
      decisionOwner: framework

  - uid: n_preview
    type: scriptTask
    name: Report planned changes (no mutation)
    slug: preview
    lane: framework
    x: 520
    y: 182
    aef:
      determinism: deterministic
      sideEffect: none          # dry-run: preview only

  - uid: n_backup
    type: scriptTask
    name: Snapshot — timestamped .bak of settings/CLAUDE.md/hooks
    slug: backup
    lane: framework
    x: 520
    y: 400
    aef:
      determinism: deterministic
      # the compensation ASSET — everything mutated below is restorable from here
      endpoint: "cp <target> <target>.bak-$(date +%s)"
      artifactsWrites: ["*.bak-<ts>"]     # datastore write (F10)
      compensationSnapshot: true          # F15 anchor: restore point

  - uid: n_apply_settings
    type: scriptTask
    name: Apply — merge settings.json (drift-gated)
    slug: apply-settings
    lane: framework
    x: 720
    y: 400
    aef:
      determinism: deterministic
      guard: apply only on drift (per-file compare)   # F8 recurrence
      compensatedBy: n_rollback                        # F15

  - uid: n_apply_hooks
    type: scriptTask
    name: Apply — install git hooks + commands/scripts (drift-gated)
    slug: apply-hooks
    lane: framework
    x: 920
    y: 400
    aef:
      determinism: deterministic
      guard: apply only on drift (per-file compare)   # F8 recurrence
      compensatedBy: n_rollback                        # F15

  - uid: n_verify
    type: scriptTask
    name: Verify — version + drift check
    slug: verify
    lane: framework
    x: 1120
    y: 400
    aef:
      determinism: deterministic
      # guards against silent downgrade (T-1828 VERSION rollback family)

  - uid: n_ok
    type: exclusiveGateway
    name: Upgrade verified OK?
    slug: ok
    lane: framework
    x: 1320
    y: 400
    aef:
      decisionInput: ${verify_ok}        # data-condition (not human) → no F1
      decisionOwner: framework

  - uid: n_rollback
    type: scriptTask
    name: Rollback — restore from .bak snapshot
    slug: rollback
    lane: framework
    x: 1520
    y: 558
    aef:
      determinism: deterministic
      # F15 — COMPENSATION handler. Restores the pre-mutation snapshot taken at
      # n_backup. In BPMN this is a compensation activity bound to the mutating
      # steps via a boundary/compensation event; v2 has neither, so the
      # snapshot↔restore relationship lives only in aef: cross-references
      # (compensationSnapshot / compensatedBy / compensates). Also fires from the
      # trap on EXIT/INT/TERM (event-boundary compensation) — not expressible.
      compensates: [n_apply_settings, n_apply_hooks]
      restoresFrom: n_backup
      endpoint: "restore <target> from <target>.bak-<ts>"

  - uid: n_cleanup
    type: scriptTask
    name: Cleanup — drop stale .bak, record new VERSION
    slug: cleanup
    lane: framework
    x: 1520
    y: 300
    aef:
      determinism: deterministic

  - uid: n_end_done
    type: endEvent
    name: Upgrade applied
    slug: end-done
    lane: framework
    x: 1720
    y: 300
    aef:
      emits: event:framework.upgraded

  - uid: n_end_rolledback
    type: endEvent
    name: Upgrade rolled back (restored)
    slug: end-rolledback
    lane: framework
    x: 1720
    y: 586
    aef:
      emits: event:framework.upgrade-rolledback

  - uid: n_end_preview
    type: endEvent
    name: Preview reported (no changes)
    slug: end-preview
    lane: framework
    x: 720
    y: 182
    aef:
      emits: event:framework.upgrade-previewed

edges:
  - uid: e_trigger_mode
    source: n_trigger
    target: n_mode

  - uid: e_mode_preview
    source: n_mode
    target: n_preview
    name: dry-run
    condition: ${dry_run == true}
  - uid: e_mode_apply
    source: n_mode
    target: n_backup
    name: apply
    condition: ${dry_run == false}

  - uid: e_preview_end
    source: n_preview
    target: n_end_preview

  - uid: e_backup_settings
    source: n_backup
    target: n_apply_settings
  - uid: e_settings_hooks
    source: n_apply_settings
    target: n_apply_hooks
  - uid: e_hooks_verify
    source: n_apply_hooks
    target: n_verify
  - uid: e_verify_ok
    source: n_verify
    target: n_ok

  - uid: e_ok_cleanup
    source: n_ok
    target: n_cleanup
    name: verified
    condition: ${verify_ok == true}
  - uid: e_ok_rollback
    source: n_ok
    target: n_rollback
    name: failed → compensate
    condition: ${verify_ok == false}

  - uid: e_cleanup_end
    source: n_cleanup
    target: n_end_done
  - uid: e_rollback_end
    source: n_rollback
    target: n_end_rolledback
