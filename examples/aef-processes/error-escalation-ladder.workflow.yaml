# error-escalation-ladder — the AEF graduated response to failure: A (don't
# repeat) -> B (technique) -> C (tooling) -> D (ways of working), plus the
# Proactive Level-D operational-reflection branch. Dogfood corpus (T-058). LAST
# of the four "constitutional gate" maps from the T-054 audit (after task-gate /
# T-055, verification-gate / T-056, context-memory / T-057) — closes the series.
#
# Ground truth — SPLIT between code and doctrine (marked per node [CODE]/[DOCTRINE]):
#   CODE     : agents/healing/lib/diagnose.sh — classify_failure (L23),
#              find_similar_patterns (L55), and the A/B/C/D suggestion MENU it
#              prints (L156-204); agents/healing/lib/resolve.sh logs
#              pattern+learning; FRAMEWORK lib/promote.sh + lib/harvest.sh
#              (not healing lib/) graduate a practice/directive at 3+ applications.
#   DOCTRINE : CLAUDE.md §Error Escalation Ladder + §Proactive Level D. The
#              ESCALATION DECISION (which rung, when to climb — "same class 2+
#              times") and the ENTIRE proactive-D reflection are agent judgement;
#              no script fires them. The healing agent only SUGGESTS the menu.
# Generated by the Workflow Designer product side (authoring + validation) — NOT executed.
#
# REPRESENTATION FRICTION (see docs/reports/T-058-error-ladder-friction.md): the
# code-vs-doctrine axis has no first-class schema marker — a new `aef.enforcement`
# field would be silently dropped by the bridge (the T-059/T-060 coverage class),
# so it is carried in node NAMES ([CODE]/[DOCTRINE]) + `determinism` (deterministic
# = code-enforced, stochastic = agent judgement). Lanes = authority axis.
workflowMeta:
  id: error-escalation-ladder
  version: 2
  schemaVersion: 2
  source: agents/healing/lib/diagnose.sh + CLAUDE.md
  tier_default: 1
  # v2 (T-298, AEF T-2665 pair round, ladder leg): code-truth corrections against
  # the vendored v1.6.763 framework — classify_failure L113→L23 and
  # find_similar_patterns L147→L55 (older-vendor line drift; per-rung pointers
  # 164-195/197-199/201-203 verified CORRECT); promote/harvest path disambiguated
  # (framework lib/, not agents/healing/lib/); n_diagnose endpoint span 113-204→23-204;
  # n_resolve gained x-advisory-reachability (agent-initiated, never auto-invoked —
  # same G-016 leak class as healing-loop v2); n_done emits corrected: resume to
  # started-work is a PRINTED next-step (resolve.sh:155), not an automatic transition.

pool:
  id: Pool_error_escalation_ladder
  name: error-escalation-ladder

lanes:
  - id: agent
    name: "Agent · Initiative (judgement + action)"
    abbr: agt
    authority: initiative
    height: 380
  - id: framework
    name: "Framework · Authority (healing agent, code)"
    abbr: frw
    authority: authority
    height: 180

nodes:
  - uid: n_failure
    type: startEvent
    name: "Error / unexpected behavior"
    slug: failure
    lane: agent
    x: 90
    y: 91.5
    aef:
      determinism: stochastic
      triggeredBy: agent hits error or human reports it

  - uid: n_issues
    type: serviceTask
    name: "[DOCTRINE] set status=issues (auto-triggers diagnose)"
    slug: issues
    lane: agent
    x: 180
    y: 77.5
    aef:
      determinism: stochastic
      endpoint: fw task update T-XXX --status issues
      sideEffect: update-task.sh auto-fires healing diagnose on issues

  - uid: g_ladder
    type: exclusiveGateway
    name: "[DOCTRINE] which rung? escalate on recurrence"
    slug: ladder
    lane: agent
    x: 340
    y: 85.5
    aef:
      determinism: stochastic
      decisionInput: ${same_class_hits}  # 1st -> A/B; 2+ -> C; systemic -> D
      decisionOwner: agent
      decisionOutputs: A-dont-repeat, B-technique, C-tooling, D-ways-of-working

  - uid: n_a
    type: serviceTask
    name: "[DOCTRINE] A: don't repeat — apply known mitigation"
    slug: rung_a
    lane: agent
    x: 440
    y: 70
    aef:
      determinism: stochastic
      contextReads: .context/project/patterns.yaml

  - uid: n_b
    type: serviceTask
    name: "[DOCTRINE] B: improve technique"
    slug: rung_b
    lane: agent
    x: 440
    y: 150
    aef:
      determinism: stochastic
      endpoint: type-specific suggestions (diagnose.sh:164-195)

  - uid: n_c
    type: serviceTask
    name: "[DOCTRINE] C: improve tooling (add check / audit rule)"
    slug: rung_c
    lane: agent
    x: 440
    y: 230
    aef:
      determinism: stochastic
      endpoint: add automated check; update audit agent (diagnose.sh:197-199)

  - uid: n_d
    type: serviceTask
    name: "[DOCTRINE] D: change ways of working / codify"
    slug: rung_d
    lane: agent
    x: 440
    y: 310
    aef:
      determinism: stochastic
      endpoint: new practice / protocol in CLAUDE.md (diagnose.sh:201-203)

  - uid: n_resolve
    type: serviceTask
    name: "healing resolve --mitigation"
    slug: resolve
    lane: agent
    x: 610
    y: 172.5
    aef:
      determinism: stochastic
      endpoint: fw healing resolve T-XXX --mitigation "what fixed it"
      # v2 (T-298): same leak class as healing-loop v2 — nothing auto-invokes
      # resolve after a rung is applied; diagnose only PRINTS "3. Run: healing.sh
      # resolve" (diagnose.sh:209). AEF G-016: 72% of bugfix tasks record zero learnings.
      x-advisory-reachability: "leaky — agent-initiated, not auto-invoked after rung applied (G-016 72%)"

  - uid: n_done
    type: endEvent
    name: "resolved + pattern learned"
    slug: done
    lane: agent
    x: 770
    y: 186.5
    aef:
      determinism: deterministic
      # v2 (T-298): resume is NOT automatic — both the diagnose menu
      # (diagnose.sh:208) and resolve.sh (:155) only PRINT the started-work
      # step; the agent/human must run the transition themselves.
      emits: pattern+learning captured on resolve; return to started-work is a printed next-step (diagnose.sh:208, resolve.sh:155), not an automatic transition

  - uid: n_reflect
    type: startEvent
    name: "Proactive: practice repeats 3+ tasks (no failure)"
    slug: reflect
    lane: agent
    x: 90
    y: 281.5
    aef:
      determinism: stochastic
      triggeredBy: organic "how do we do X?" + 3+ episodic instances (CLAUDE.md)

  - uid: g_assess
    type: exclusiveGateway
    name: "[DOCTRINE] mine episodic -> codification value?"
    slug: assess
    lane: agent
    x: 197
    y: 275.5
    aef:
      determinism: stochastic
      decisionInput: ${inception_go_no_go_criteria}
      decisionOwner: agent
      decisionOutputs: worth-codifying, defer

  - uid: n_defer
    type: endEvent
    name: "[DOCTRINE] defer — not yet worth codifying"
    slug: defer
    lane: agent
    x: 203
    y: 376.5
    aef:
      determinism: stochastic
      emits: no codification (recorded, revisit later)

  - uid: n_diagnose
    type: scriptTask
    name: "[CODE] diagnose: classify + lookup + A/B/C/D menu"
    slug: diagnose
    lane: framework
    x: 180
    y: 455
    aef:
      tier: 1
      determinism: deterministic
      agentType: framework
      endpoint: agents/healing/lib/diagnose.sh:23-204   # v2: classify L23 + lookup L55 + menu 156-204 (was 113-204, older-vendor drift)
      contextReads: .context/project/patterns.yaml
      emits: classification + similar patterns + A/B/C/D suggestion menu

  - uid: n_capture
    type: scriptTask
    name: "[CODE] resolve + promote: log pattern/learning, graduate"
    slug: capture
    lane: framework
    x: 610
    y: 455
    aef:
      tier: 1
      determinism: deterministic
      agentType: framework
      # v2 (T-298): paths disambiguated — resolve.sh lives in agents/healing/lib/,
      # promote.sh + harvest.sh in the FRAMEWORK lib/ (threshold verified:
      # learning → practice at 3+ applications, promote.sh:147; 3+ projects, harvest.sh:10)
      endpoint: agents/healing/lib/resolve.sh (log) + lib/promote.sh / lib/harvest.sh (graduate 3+ apps)
      artifactsWrites: .context/project/patterns.yaml, .context/project/learnings.yaml

edges:
  - uid: e_01
    source: n_failure
    target: n_issues
  - uid: e_02
    source: n_issues
    target: n_diagnose
    name: auto-trigger diagnose
  - uid: e_03
    source: n_diagnose
    target: g_ladder
    name: suggestion menu -> agent decides
  - uid: e_04
    source: g_ladder
    target: n_a
    name: 1st occurrence
    condition: ${same_class_hits <= 1}
  - uid: e_05
    source: g_ladder
    target: n_b
    name: technique gap
    condition: ${technique_fixable}
  - uid: e_06
    source: g_ladder
    target: n_c
    name: same class 2+ times
    condition: ${same_class_hits >= 2}
  - uid: e_07
    source: g_ladder
    target: n_d
    name: systemic
    condition: ${systemic}
  - uid: e_08
    source: n_a
    target: n_resolve
  - uid: e_09
    source: n_b
    target: n_resolve
  - uid: e_10
    source: n_c
    target: n_resolve
  - uid: e_11
    source: n_d
    target: n_resolve
  - uid: e_12
    source: n_resolve
    target: n_capture
    name: log resolution
  - uid: e_13
    source: n_capture
    target: n_done
  - uid: e_14
    source: n_reflect
    target: g_assess
  - uid: e_15
    source: g_assess
    target: n_d
    name: worth codifying -> Level D
    condition: ${worth_codifying}
  - uid: e_16
    source: g_assess
    target: n_defer
    name: defer
    condition: ${!worth_codifying}
