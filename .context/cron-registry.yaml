# Cron Registry — Structured source of truth for scheduled jobs (T-448)
# Read by web/blueprints/cron.py and fw cron generate.
# Editable by humans, controllable via Watchtower web UI.
#
# Each job has: id, name, schedule, command, source_file, origin_task, status, description

jobs:
  - id: structural-30m
    name: "Structural audits (30 min)"
    schedule: "*/30 * * * *"
    command: "flock -n /var/lock/agentic-cron-structural-30m-832.lock -c 'fw audit --section structure,compliance,quality,discovery --cron'"
    source_file: agentic-audit.crontab
    origin_task: T-001
    status: active
    description: "Checks task quality, project structure integrity, compliance, and discovery patterns every 30 minutes."

  - id: oe-fast-30m
    name: "OE fast checks (30 min)"
    schedule: "15,45 * * * *"
    command: "flock -n /var/lock/agentic-cron-oe-fast-30m-832.lock -c 'fw audit --section oe-fast,oe-research --cron'"
    source_file: agentic-audit.crontab
    origin_task: T-001
    status: active
    description: "Operational effectiveness fast checks and research controls every 30 minutes."

  - id: oe-hourly
    name: "OE hourly checks"
    schedule: "30 * * * *"
    command: "flock -n /var/lock/agentic-cron-oe-hourly-832.lock -c 'fw audit --section oe-hourly --cron'"
    source_file: agentic-audit.crontab
    origin_task: T-001
    status: active
    description: "Operational effectiveness hourly control checks (CTL-008, CTL-020)."

  - id: oe-daily
    name: "OE daily checks"
    schedule: "0 7 * * *"
    command: "flock -n /var/lock/agentic-cron-oe-daily-832.lock -c 'fw audit --section oe-daily --cron'"
    source_file: agentic-audit.crontab
    origin_task: T-001
    status: active
    description: "Daily operational effectiveness audit covering most controls at 7am."

  - id: full-daily
    name: "Full audit (daily)"
    schedule: "0 8 * * *"
    command: "flock -n /var/lock/agentic-cron-full-daily-832.lock -c 'fw audit --cron'"
    source_file: agentic-audit.crontab
    origin_task: T-001
    status: active
    description: "Complete audit of all sections, runs daily at 8am."

  - id: retention-daily
    name: "Cron audit file retention (daily)"
    schedule: "0 9 * * *"
    command: "python3 -c \"import os,datetime; cutoff=str(datetime.date.today()-datetime.timedelta(days=7)); d='.context/audits/cron'; [os.remove(os.path.join(d,f)) for f in os.listdir(d) if f.endswith('.yaml') and len(f)>=15 and f[4]=='-' and f[:10]<cutoff]\""
    source_file: agentic-audit.crontab
    origin_task: T-001
    status: active
    description: "Prunes cron audit files older than 7 days."

  - id: bridge-suite-age-daily
    name: "Bridge-suite staleness and redness (daily)"
    schedule: "0 6 * * *"
    command: "flock -n /var/lock/agentic-cron-bridge-suite-age-832.lock -c 'python3 tools/_t813-suite-age.py'"
    source_file: agentic-audit.crontab
    origin_task: T-917
    status: active
    description: "Reports how old the bridge suite's last run is and how long it has been red, from tests/.run-history.tsv. Exits 3 when there is NO history, which is the F-03 condition and is deliberately not reported as zero failures. Reads only; it does not run the suite. T-917 chose the MONITOR over the suite itself: the suite takes 650-1045s, spawns a browser per CDP probe, has been red for all 12 recorded runs, gets SIGTERMed near 600s, and has twice exited 0 while reporting 9 failures (OBS-430). Scheduling that would manufacture either a permanently-red rail or a false green; scheduling this surfaces the same fact in milliseconds, deterministically."

  # T-981: the consumer sweep job from AEF lib/cron-seed.sh (T-3673), added by hand with this
  # registry's indentation: cron_seed_ensure_jobs appends at column 0 and refuses an indented
  # jobs list (it printed ADDED, then failed its own parse check and wrote nothing).
  - id: sidecar-sweep-5m
    name: Sidecar ack-ledger sweep (5 min)
    schedule: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
    command: flock -n /var/lock/agentic-cron-sidecar-sweep-5m-832-workflow-designer.lock -c 'fw sidecar sweep'
    source_file: agentic-audit.crontab
    origin_task: T-3673
    status: active
    description: "Walks the peer-consult ack ledger and escalates unacked consults (T-3418, T-3673). Without this job unacked consults never escalate."
