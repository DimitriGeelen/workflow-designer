headline_mechanic: "An operator opens task-lifecycle in the designer, sees it marked as a template rather\
  \ than an actionable work-plan, creates an instance of it bound to a real task number,\
  \ and watches that instance advance node by node as the task moves \u2014 with an\
  \ out-of-order advance refused and written to the audit log."
