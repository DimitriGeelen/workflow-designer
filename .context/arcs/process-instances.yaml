id: arc-005
slug: process-instances
name: "Modelled processes you can instantiate and watch"
description: "Class and instance for processes. A workflow is modelled once as a template and instantiated\
  \ many times; an instance binds the template to real governed work (a task number,\
  \ an inception, a sprint item) and can be watched as it advances. Delivers project\
  \ goals G2 (class distinguishable from instance), G3 (an instance knows its class)\
  \ and G4 (execution observable and guarded), per docs/832-project-purpose-and-goals.md.\
  \ Revives the still-open half of the July 2026 process-layer package: SD-8 enforcement\
  \ ladder, SD-10 instance state and caged advance, and success criterion V7 \u2014\
  \ all marked STILL OPEN in DISPOSITION-2026-07-28.md and none started since."
status: draft
