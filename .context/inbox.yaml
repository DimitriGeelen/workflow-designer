  text: "CANDIDATE MECHANISM for the standalone-green / sweep-red class registered as OBS-265, offered as a hypothesis with a population and NOT as a demonstrated cause. Third instance seen today: leg 2 of tools/_t344-watch-set-denominator.sh went red once with 'src/aef-workflow-designer.html is NOT watched', then passed on every subsequent attempt - the guard is 8/8 green twice over, the expander returns the file 3 times out of 3, and the exact pipeline returns 0 eight times out of eight. What makes this instance more useful than the earlier two is that the leg uses a shape with a KNOWN load-sensitive failure mode rather than an unexplained one: python3 EXPANDER | grep -qx PATTERN under set -o pipefail. L-387 already records that grep -q exits the moment it matches and closes the pipe, so a producer still writing takes SIGPIPE and the pipeline reports 141 - which pipefail then makes the verdict, and the leg reads as a failed assertion rather than as a killed producer. It is load-sensitive by construction, because whether the producer has finished flushing when grep exits depends on scheduling, which is exactly the green-alone-red-in-company signature. Note the ~10KB of expander output fits inside a 64KB pipe buffer, so the producer normally completes and this should be rare - consistent with three sightings and no reproduction. Population measured, not estimated: 26 files under tools/ and tests/ set pipefail AND contain at least one '| grep -q' pipeline, roughly 100 pipelines in total, the heaviest being _t408-hygiene-teeth.sh at 16 and _t386/_t411 at 9 each. What would settle it: have the sweep capture each probe's rc AND stderr rather than discarding both, since a SIGPIPE death is distinguishable from an assertion failure by which leg reports and how fast. Cheap and it converts a three-sighting mystery into a measurement. Deliberately not fixed here - the remedy is either the documented capture form or dropping pipefail for those lines, and choosing across roughly 100 sites is a task, not an aside."
