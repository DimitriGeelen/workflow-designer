- id: OBS-013
  text: "fw note silently mis-captures when given a subcommand-like first argument: 'fw note add \"real text\"' stores the literal string 'add' as the observation and discards the rest, exit 0, success message. The verbs list (list/count/triage/promote/dismiss) makes 'add' the natural guess, and free-text capture means any typo'd verb becomes a valid one-word observation. Silent wrong-capture, not a refusal — the operator sees success and the content is gone. Suggested fix: reject a bare first argument that looks like a verb but is not one, or require --text. Vendored framework (G-008 in-tree fix + upstream)."
