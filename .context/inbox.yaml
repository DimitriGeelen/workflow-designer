- id: OBS-272
  text: "An instrument gave two different readings of the SAME tree four days apart, and the tree cannot explain the difference. tools/bake-clean-layout.py --check reported all 24 maps at moved=0 on 2026-08-13 (recorded in T-448's diagnosis and in a code comment); today it reports audit-process at moved=5 and error-escalation-ladder at moved=9, deterministically across seven consecutive runs. examples/ has no commits since before T-448 was filed, the driver tools/_clean-layout-cdp.mjs has not changed since T-300, and a git worktree checked out at c6b02d7c - the very commit whose message records the 24/24 moved=0 reading - reproduces today's answer, not its own. So the five src commits that landed since are ruled out as the cause. Two explanations remain and I cannot separate them: the 2026-08-13 reading was simply wrong and unnoticed, or the metric depends on something outside the repository. The second is not far-fetched - moved is computed by running the real editor headless in Chrome via CDP, so viewport, font metrics, device pixel ratio and browser version are all inputs that no commit records, and the earlier reading came from a different session on a machine that has since had other work on it. The filing of 2026-08-12 said 22 of 24 at moved=0, which agrees with today and disagrees with the middle reading, so the outlier is the one in the middle and it is mine. WHY THIS MATTERS BEYOND THE ONE NUMBER: the same headless driver produces the BYTES that a re-bake would commit to the corpus, so if its output is environment-dependent then the corpus is too, and two operators baking on two machines would produce two different corpora while both gates report a fixpoint. Not established, and deliberately not asserted - what is established is that a metric this gate reported for four days changed with nothing in the repo changing. Cheap next step before anyone wires this gate or runs the re-bake: capture the driver's browser version, viewport and DPR alongside its results, so the next disagreement is diagnosable rather than a second mystery. Related but distinct from T-448's fixed defect, which was the VERDICT reading that counter; this observation is about the counter itself."
