- id: OBS-271
  text: "T-551 AC2 is literally satisfied and its stated benefit is not yet realised, recorded here rather than ticked quietly. The AC reads 'Output is captured for passing probes too and discarded only after the verdict is known, so that a probe which passes while printing something alarming is not invisible by construction.' The sweep now does exactly that - the run loop writes every probe including passing ones to a capture file and the pass branch is '0) pass=$((pass + 1)); rm -f \"$cap\";;' - so the capture happens and the discard happens after the verdict. But nothing reads a passing probe's capture, so for a green probe the behaviour is currently indistinguishable from the /dev/null it replaced, minus the write. What the uniform path buys is real but structural: no branch decides in advance whose output matters using the exit code, which is the assumption the whole task is about, and a future keep-everything mode is a deleted rm rather than new plumbing. The gap is only the CONTENT dimension - the TIME dimension of 'passed but alarming' is already covered by T-548's HEADROOM WARNING, which names any probe at or above 75 percent of its timeout budget while it is still passing, and that warning has already fired usefully once (_t525 at 81s of 90s on a green sweep). Deliberately not closed under T-551: the obvious closure is a heuristic scanning green output for alarming shapes, which invents a classifier nobody asked for and whose false positives would relabel green runs; the honest alternative is an opt-in T509_KEEP_ALL that skips the rm and names the directory, which conflicts with AC6's 'removed on every exit path' unless the opt-in is explicit and is new scope. Registering it so the residual outlives the task, since a completed task archives and stops being read."
