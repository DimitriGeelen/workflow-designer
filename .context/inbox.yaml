  text: "Completing a task BEFORE committing its work makes the commit unreachable without a Tier 2 bypass, and the gate says so itself: 'NOT AVAILABLE - T-549 is completed, and fw context focus accepts active tasks only (T-381) ... This is the normal path for a follow-up commit on a task that has already closed.' Sequence that produces it, hit twice today: run fw task update --status work-completed, which moves the file to completed/ and clears focus; then discover the deliverable is still uncommitted; then find that no non-bypass path exists to commit it under its own task id, because focus cannot be set to a completed task and any other focus trips the focus-drift gate on the commit message. Reopening with --status started-work is blocked too - the no-active-task hook refuses every Bash call including the fw command that would reopen it, so the state is self-locking. Consequences are two and both were observed today rather than reasoned about: the earlier instance is why T-543's completion metadata sat uncommitted on master while its content was committed, and an agent operating under a no-bypass instruction simply cannot land its own finished work. Candidate remedies, none chosen here because this is a framework-behaviour change and not mine to make: let fw context focus accept a task completed within the current session; or have the completion step refuse when the task's own files are dirty, which turns a self-locking end state into an ordinary pre-flight error; or exempt a commit whose staged paths are exactly the completed task's own files. The middle one is the cheapest and fails in the safe direction."
