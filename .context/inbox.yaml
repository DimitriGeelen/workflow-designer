  text: "HERMETICITY LEGS THAT COMPARE WHOLE-TREE `git status` ARE NON-DETERMINISTIC WITH RESPECT TO EVERYTHING ELSE TOUCHING THE REPO, AND ONE OF THEM IS THE FLAKE. Measured 2026-08-15 under T-527. tools/_t525-fabric-coverage-teeth.py leg 7 asserts 'the working tree is byte-identical after the run' by snapshotting `git status` before and after ITS OWN 61-second window. That is not a property of its subject (the audit's fabric coverage check); it is a property of the entire repository, so any writer anywhere in the tree during those 61 seconds turns the leg red. DEMONSTRATED, NOT INFERRED, and the first attempt to demonstrate it FAILED IN AN INSTRUCTIVE WAY: a marker file created and deleted mid-run left leg 7 GREEN, because a transient perturbation is invisible to a before/after comparison. That was a stimulus built so it could not fail — PL-206, committed while testing for PL-206. Second probe, marker left in place until after the run: rc=1, leg 7 red, failure text naming '?? _t527-probe-marker.tmp'. THE DISCRIMINATING PROPERTY IS PERSISTENCE, NOT OCCURRENCE. CONSEQUENCE FOR AN EARLIER CONCLUSION, and this is the part worth keeping: T-526's report REFUTED the cron-contention hypothesis on the grounds that the 21:30 and 21:45 cron writes both landed inside GREEN runs. That refutation is VOID. It tested whether a write during a RUN reddens the RUN, but the exposure window is per-leg and tens of seconds, and what matters is whether the write persists. A cron write inside a green run refutes nothing. The correct statement is not 'cron is the cause' but 'the hypothesis I published as killed was never tested'. Every NUMBER in T-526 remains correct; the reasoning on top of them shared the prior that made it wrong, which is why vigilance had no purchase. HOW IT SURFACED, which is the transferable part: not by an investigation aimed at it. T-527 replaced `> /dev/null` with a captured file on 23 legs for unrelated reasons, and the very next clean run printed the offending script's NAME instead of a bare [FAIL] line. Instrumentation that merely stops destroying evidence is independent of the investigator's priors for free, and it is retroactive — it reopened a conclusion already published to a peer project (rail 11929) and closed. That is a weaker claim than 'build the real thing to check it' and costs about an hour. SCOPE, and the reason this is an observation rather than a fix: the defect is in a teeth script, not in the suite T-527 changed, so it is a different bug with a different root cause and gets its own task (one bug = one task). It is also probably a POPULATION rather than an instance — the sweep runs 26 teeth scripts and the 'hermetic' leg shape was copied between them, which is the same fix-did-not-reach-the-population shape recorded three times already (T-508, T-509, T-526). Nobody has counted how many assert whole-tree state versus their own subject's paths; that count is the first thing the fixing task should produce. WHAT AN AGENT CANNOT DECIDE: the remedy is a real choice — scope each leg to the paths its subject writes, or snapshot only tracked-and-modified state, or have the suite serialise against a lock so nothing else writes during a run — and the third of those touches cron and the handover agent, which are operator territory. Reported to AEF at rail 11939 because the leg shape came with the shared framework, not with this tree."
