- id: OBS-270
  text: "T-551's capture is defeated by the CALLER's own redirect, and I did it to myself within four minutes of landing it. Timing the sweep with 'bash tools/_t509-instrument-sweep.sh > /dev/null 2>&1' returned rc=1 - a live reproduction of the standalone-green / sweep-red class registered as OBS-265 and OBS-269, the fourth sighting and the first since the capture existed - and the capture worked exactly as built while my redirect threw the entire report away. The next run was green, so that reproduction is gone and unrecoverable. The mechanism generalises: _t509 now writes each probe's output into its own report, but the report is stdout and stderr of the sweep process, so any caller that discards them discards the capture too. There is exactly one standing caller that preserves it (the bridge suite writes each leg to TMP/leg-*.out and prints it on failure via show_output). Every ad-hoc invocation - a timing measurement, a quick 'does it still pass', a cron line - is a place where the evidence can still be lost, and the ad-hoc invocations are precisely the ones run while hunting an intermittent. Candidate remedies, none chosen under T-551 because they are a design change to the sweep's contract rather than the capture it was scoped to add: have the sweep detect a non-tty stdout and name the file it would have written; or accept an explicit T509_REPORT=path that duplicates the report; or leave it and treat 'never redirect the sweep' as a documented operating rule. The first is the only one that helps the person who did not know to ask. What this instance is really evidence for: a diagnostic that survives only when the caller cooperates is not yet a diagnostic, and the person least likely to cooperate is the one in a hurry, which is everyone hunting a flake."
