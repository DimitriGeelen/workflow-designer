- id: OBS-037
  text: 'check-human-ac-tick (T-1731) is symmetric: it blocks [x] -> [ ] as well as [ ] -> [x] under ###
    Human. Consequence: an agent that wrongly ticks a Human-AC-shaped line cannot restore the invariant
    the guard protects without FW_ALLOW_HUMAN_AC_TICK=1 - the same Tier-2 override as violating it. Hit
    in T-466 after a blanket tick caught two [REVIEW] EXAMPLE lines inside the ### Human template comment.
    Not bypassed; left ticked and reported. Two sub-findings: (1) the guard matches example text inside
