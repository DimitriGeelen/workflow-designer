- id: OBS-033
  text: 'P-002 makes a partial-complete task unable to commit its own state change under its own id. Reproduced
    on T-449: ''fw task update T-449 --status work-completed'' writes the frontmatter, the Recommendation
    block and .context/working/.reviewed-T-449, then P-002 blocks ''fw git commit -a -m T-449:...'' with
    ''Task T-449 has status work-completed''. Plain ''fw git commit'' passes the gate but stages nothing,
    and ''git add'' is blocked too. The focus-drift gate (T-1730) simultaneously refuses the commit under
    any other task''s focus, so the only remaining paths are a Tier 2 bypass or letting the handover sweep
    it up under T-005 - both weakening the traceability P-002 exists to protect, since the artefacts of
    completing T-449 land in a commit whose subject says T-005. This is the ordinary end-state of EVERY
    partial-complete task, not an edge case.'
