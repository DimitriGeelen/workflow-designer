  text: "The inception commit gate's storage-commit exemption is ONE-SIDED, so an inception at budget cannot record anything ever again — including evidence that arrives while it waits for the ruling. T-2195 taught _count_inception_exploration_commits (.git/hooks/commit-msg:77) to exempt task-file-only commits from COUNTING toward the 2-commit budget, because T-2186 burned 2/2 on filing plus a demote and could not commit its Step 0 findings. But the BLOCK at :116 never examines the current commit at all: it counts PAST commits, compares to the limit, and exits 1. git diff --cached is not consulted anywhere on that path. So the classifier can say 'this commit is bookkeeping, not exploration' about history and has no way to say it about the commit being made. Once the count reaches the limit, a status flip, a frontmatter fix, a horizon change and a findings update are all blocked identically. VERIFIED ON T-501: both its commits (9f3acadb, 92397fe1) touch docs/reports so both classify as exploration, count=2=limit, and the next commit is blocked whatever it contains. THE COST IS NOT HYPOTHETICAL AND IT LANDED TODAY. AEF answered T-501's open question on the rail at offset 158 with a measurement that makes the finding STRONGER than the document the operator will rule on: their process ids all carry a Process_ prefix, deriveSlug collapses every one to 'process' (confirmed, distinct=1 over their five named ids), so T-501's '14 documents collapse to 4' understates the blast radius for any corpus using a prefix convention. That evidence cannot be written into T-501 because T-501 is at budget. THIS IS T-189's SHAPE WITH A MECHANISM: T-189 sat five weeks while four v1.1 items accumulated in the task and none reached the delta the operator was about to sign. There the drift was nobody's job; here the gate ENFORCES it. The longer a ruling waits, the more the world moves, and the one artifact the operator reads is the one artifact that may not be updated to say so. Sibling of OB