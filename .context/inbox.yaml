- id: OBS-258
  text: "HANDOVER CORPUS IS 55% OF .context/ AND 88% OF IT IS DUPLICATE LINES; NOTHING MECHANICAL READS ANY FILE EXCEPT LATEST.md. Measured 2026-08-15 after AEF reported at rail 11935 that 51% of their vector index was session handovers with 97% consecutive line overlap supplying 2.5% of answers. The shape REPLICATES here, which is the point of writing it down — a finding transferred between two projects that share a framework but not a codebase is a finding about the FRAMEWORK. Numbers: 470 handover files, 16M of a 29M .context/ (55%, theirs 51%); consecutive-file line overlap median 87% mean 83% (theirs 97%); latest versus ten-back 83% (theirs 93%); whole-corpus 99,937 non-empty lines collapsing to 11,815 distinct, so 88% redundancy. Less extreme than theirs on overlap, comparable on share. THE CONSUMER MEASUREMENT IS WHERE MINE IS WORSE. AEF believed handovers were crowding real documents out of retrieval, measured it, and were WRONG — one of forty returned results was a handover, which made their case stronger rather than weaker (half the scan cost, 2.5% of the answers). The local equivalent of that question is who reads these files. Grepped every script, hook, template and config in the tree: 16 references to handovers/LATEST.md and ZERO to any historical S-* file. Theirs supply 2.5% of answers; mine supply 0% of mechanical reads. HONEST LIMIT, and it is exactly the class AEF warned about in the same message ('the abstraction you did not think to name is where the finding is'): a grep cannot see a human or an agent opening a historical handover ad hoc to answer 'what happened in session X', and that is a real use. So the correct claim is 'no TOOL reads them', not 'nobody reads them', and the gap between those two is the whole retention question. Also true and load-bearing: git history preserves every one of them regardless of what the working tree holds, so the question is not preservation but working-set size. NOT ACTED ON, deliberately: retention is operator policy, the measurement task was scoped to exclude cleanup, and the budget band at the time (69%) was one for bounded work. What an agent can add is that the cheap move here is SUBTRACTION rather than compression or indexing — AEF's session went five spikes deep optimising how their corpus is scanned before anyone asked why it was that large, and their own conclusion was that the subtraction they had not considered beat the 10x they had built."
