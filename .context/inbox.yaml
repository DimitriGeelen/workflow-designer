- id: OBS-033
  text: 'P-002 makes a partial-complete task unable to commit its own state change under its own id. Reproduced
    on T-449: ''fw task update T-449 --status work-completed'' writes the frontmatter, the Recommendation
    block and .context/working/.reviewed-T-449, then P-002 blocks ''fw git commit -a -m T-449:...'' with
