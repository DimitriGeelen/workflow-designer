- id: OBS-034
  text: 'fw note silently discards its payload when the first argument is an unrecognised subcommand.
    ''fw note add "<1200 chars>" --urgent'' captured text=''add'', urgent=true, exit 0, no warning - the
    entire observation was lost and the inbox gained a one-word URGENT row. There is no ''add'' subcommand
    (usage is ''fw note "text"''), so it fell through to the capture path with the subcommand as content
    and every remaining positional argument dropped. Two harms, and the second is the worse one: the payload
    is lost silently, and the urgency signal is inflated by a row that says nothing - an urgency signal
    dies by inflation, not by silence. This lives in the vendored .agentic-framework (AEF''s tool), so
    the fix is theirs; reported across the seam. Suggested shape: reject an unrecognised first token that
    is followed by further positional args, rather than treating it as content.'
