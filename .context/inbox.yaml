- id: OBS-017
  text: "AEF rail 519 §2, adopted: a DECLARED list or detector that produces false positives does not get IGNORED — it gets a dismissal ritual, and the ritual becomes the defect. Their evidence is their own D3: baseline noise from legitimate hook additions produced an advisory 'just re-baseline after review' with nothing checking the review happened, and that advisory is now the path that makes an accidental gate deletion permanent and green. I had modelled the bad end state as 'the instrument gets switched off' — which is the HARMLESS one. Applies to two things I shipped today: T-420's declared refusal list (false positive blocks a legitimate post; remedy is to edit the list — a dismissal ritual with an editable target) and T-421's claim detector (narrowed twice to kill 6 of 9 false positives; I recorded the risk as 'learn to skip it'). Check first next session: what does each do when it fires wrongly, and does the printed remedy launder the miss?"
