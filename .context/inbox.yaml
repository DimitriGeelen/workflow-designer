- id: OBS-273
  text: "_t525-fabric-coverage-teeth.py leg 7 CANNOT PASS on the first audit run of any calendar day, and it went red at 00:36 tonight for exactly that reason. The leg asserts the audit's write-set is byte-identical across a run, scoped to .context/audits (excluding cron/). The audit writes one report per day at .context/audits/YYYY-MM-DD.yaml, so the first run after midnight CREATES a file that did not exist when the leg took its before-snapshot: before shows two modified files, after shows the same two plus '?? .context/audits/2026-08-17.yaml'. Re-running the probe immediately afterwards returns 8/8, because by then the day's file exists and is merely rewritten. So the leg is guaranteed to report a hermeticity violation once per day, at most once, and to pass every other time - which is the worst possible duty cycle for a signal, because it is rare enough to look like an intermittent and regular enough to be dismissed as one. Not a defect in what the leg guards: the audit really did create a file, and a leg asserting the write-set is unchanged is right to notice. The defect is that a NEW dated report is a normal product of the subject and not a leak, so the leg's write-set predicate needs to treat today's report file as expected rather than as dirt - the same distinction the sweep learned at T-548 between 'it broke' and 'this is what it does'. Candidate fixes, none applied here because this is a different subject from the task in hand and one bug is one task: exclude .context/audits/<today>.yaml from the scoped comparison by name; or warm up by running the audit once before taking the before-snapshot, which costs a full audit and is the expensive option; or compare the write-set as a SET OF PATHS THAT EXISTED BEFORE rather than as a git-status string, which also fixes the symmetric case of a file being deleted by retention. The third is the one I would build. WORTH RECORDING SEPARATELY: this is the first red the T-551 sweep capture has explained. The sweep printed the probe's own eight leg lines, the named failing leg, and its before/after snapshots, so the diagnosis took one reading instead of a re-hunt - and the re-hunt would have failed, because the second run of the day passes."
