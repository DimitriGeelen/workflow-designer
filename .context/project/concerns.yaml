  - id: G-017
    type: gap
    status: watching
    severity: medium
    title: "The audit's fabric coverage verdict is computed from an EMPTY denominator and its prescribed remedy is a structural no-op — 13 consecutive audits recommended an action that cannot move the metric it reports"
    detected: 2026-08-02
    origin_task: T-342
    decision_trigger: >
      All three of the following hold: (1) the fabric coverage checks range over a
      non-empty, project-appropriate denominator AND a guard FAILS when the watch-pattern
      expansion is empty — an empty denominator must be red, not green; (2) the two
      coverage checks in audit.sh are reconciled — either they agree on a widened
      population or the broken duplicate is removed, with a leg that goes red if they
      diverge; (3) `fw fabric enrich` reports the count and identity of edges it discards
      for want of a registered target, so a zero in its summary is distinguishable from a
      silent drop. Closing because "we tailored the watch patterns" is NOT closure —
      `fw context init` regenerates the inert default into any project at any time, so
      the instance returns without the guard in (1).
    detail: >
      THE MEASUREMENT. Every audit for 14 days printed one PRIORITY ACTION:
      "Run: fw fabric enrich", against "[WARN] Fabric: 11/15 cards have no edges".
      Running it reports 0 enriched, 0 forward edges, 0 reverse edges. Three independent
      causes, any one of which alone is sufficient:

      (A) enrich.py:655 discards edges whose target has no component card on a bare
      `continue`, with no counter and no report — so enrichment can only ever draw edges
      INSIDE the already-registered set. Measured by wrapping enrich's own resolve_edges:
      17 edges detected, 2 kept, 15 discarded silently. Every discarded target exists on
      disk (the detectors are existence-guarded BEFORE resolution runs) and includes
      tools/validate-workflow.py, tools/yaml-to-bpmn.py and src/aef-workflow-designer.html.
      A dict.get miss is being used to mean "not a dependency" when it means "not yet
      registered".

      (B) .fabric/watch-patterns.yaml is the untailored `fw context init` default and
      expands to ZERO files here — it watches web/, agents/, bin/, crates/ (absent),
      src/**/*.py (our src is one .html) and lib/ (empty), while tools/ (53 files) and
      tests/ (47) are unwatched. So the coverage checks compare an empty set against the
      registry and report complete coverage over a repo that is 15/115 carded — 13%
      reported as 100%. Occupancy, not construction: the same expander returns 17 files
      for tools/**/*.py + src/**/*.html.

      (C) audit.sh's first fabric block is a strictly-broken duplicate of its own sibling
      at :1499 — bare glob.glob(p['glob']) with no PROJECT_ROOT join and no
      recursive=True (in Python ** does not recurse without it, and every shipped pattern
      uses **), plus pass() on BOTH arms of its verdict. Measured in one real audit run
      with widened patterns: "[PASS] Fabric: 15 registered, 0 unregistered" printed beside
      "[WARN] Fabric drift: 49 source file(s) have no fabric card".

      WHY THIS IS A GAP AND NOT A CHORE. The three defects are individually repairable
      (T-343/T-344/T-345) but the CLASS is that a verdict surface the operator consults
      was reporting a fiction, and the two checks covering it agreed at zero because
      neither was measuring anything — redundancy read as corroboration when the
      redundant instrument was inert and both zeros shared an upstream cause. The failure
      direction is green throughout, so no moment of attention was ever created (L-534);
      the only reason it surfaced is that someone tried to CLEAR the warning rather than
      carry it. Note also the ordering trap: repairing (B) alone makes the good check warn
      while the broken one keeps printing a contradicting PASS beside it, which is exactly
      what the reproduction produced — (C) must land before or with (B).

      CONTRAST WORTH KEEPING. The pre-commit fabric hook is CORRECT and fired immediately
      on a new unregistered file. Same framework, same question: a working per-commit
      check and a blind standing audit, and the blind one is the one that reports a
      verdict and accumulates a backlog figure.

      TRIGGER CLAUSE (3) COVERED 2026-08-02 (T-343) — status deliberately NOT flipped;
      clauses (1) and (2) are untouched and the flip is the operator's. `fw fabric enrich`
      now emits "Edges discarded: N (target has no component card; M distinct targets)"
      unconditionally, and names every target under --verbose. The audit still prints
      "Run: fw fabric enrich" as its PRIORITY ACTION, and that is still not a working
      remedy — what changed is that running it is no longer a dead end: it now reports
      why it added nothing, and which targets to register. Self-explaining, not fixed.

      TWO THINGS LEARNED IN COVERING IT, both worth more than the fix. First, T-342's
      "15 discarded for want of a card" was a difference (len(raw) - len(resolved)) across
      resolve_edges' THREE drop arms — unregistered, self-edge, duplicate. Decomposed
      before writing the counter: 17 / 0 / 0. The attribution was right in kind only
      because the other two arms are empty HERE, an occupancy zero; the counter collects
      the unregistered arm alone. Second, the count read 15 at filing, 17 a day later, and
      20 after one more card was registered — three values, no regression among them. The
      acceptance criterion I wrote at filing pinned the literal 15, i.e. it was a G-015
      subject error committed inside the window that registered G-015. Amended to assert
      the property; no literal count appears in T-343's teeth or verification block.
    related_tasks:
      - T-342
      - T-343
      - T-344
      - T-345

  - id: G-018
    type: gap
    status: watching
    severity: high
    title: "Tier 0 enforcement reads the Bash tool's command STRING, so a destructive command reached from inside an invoked script is unguarded — an agent test harness deleted this repository through that hole"
    detected: 2026-08-02
    origin_task: T-350
    decision_trigger: >
      Either (a) destructive-command enforcement moves to a layer that sees what invoked
      scripts actually do (a sandbox, a filesystem policy, or a wrapper the framework
      controls), or (b) it is explicitly recorded as string-level ONLY, with the residual
      accepted in writing, AND the working practice compensates: any agent-authored
      harness that constructs, mutates or executes a script capable of recursive deletion
      must assert its own safety precondition before executing, with that assertion itself
      proven by a mutation leg. Closing because "the harness was fixed" is not closure —
      the next harness is written by someone who has not read this entry.
    detail: >
      2026-08-02, T-350. The Bash tool call was `bash <path>/teeth350.sh`. Three levels
      down, a mutated copy of tools/serve-gallery.sh ran `rm -rf "$OUT"` with
      GALLERY_DIR=/opt/832-Workflow-designer. The working tree, .git, .agentic-framework,
      .tasks and .context were destroyed. Recovered by re-clone from origin at 041765c
      with zero committed work lost; only the in-flight uncommitted T-350 artifacts were
      lost and those were reconstructible from session context.

      WHY THE FRAMEWORK DID NOT STOP IT. check-tier0.sh (agents/context/) matches a regex
      including `rm\s+-` against the Bash tool's command string, and separately names
      RECURSIVE DELETE patterns for /, ~, . and *. Every one of those inspects the string
      the agent typed. The string the agent typed was `bash …/teeth350.sh`, which contains
      no delete at all. Enforcement is at the wrong layer for anything an agent authors
      and then runs: the moment a command becomes a file, the gate stops seeing it. This
      is not a bug in check-tier0.sh — it is a scope boundary that was never written down,
      and its absence reads as coverage.

      SEVERITY IS HIGH, NOT MEDIUM, FOR A REASON THAT IS NOT THE DAMAGE. The damage was
      recoverable and cheap (P-009's commit cadence is why). What earns high is that the
      hole is invisible from inside: an agent running `bash script.sh` has no signal that
      it just left the enforced region, and the region's edge is not documented anywhere
      an agent reads. Every prior Tier 0 block on this project has come from a typed
      command, so the gate's apparent reliability is evidence about agent habits, not
      about coverage.

      THE HARNESS-SIDE DEFECT, RECORDED SEPARATELY BECAUSE IT GENERALISES. The teeth leg
      deliberately stubbed the delete before removing the guard that stops it — correct
      design. The stub was a replace-first-occurrence, and the first occurrence was a
      COMMENT quoting the command, three lines above the guard, written to explain what
      the guard protects. The comment was stubbed; the live command survived; nothing
      asserted the stub had applied. This whole arc has catalogued CHECKS that cannot
      fail (T-335, T-336, T-346, T-348 controls); this is the first SAFEGUARD that was
      never confirmed to have landed. A safety measure that is not verified to have
      applied is not a safety measure. Prose about code shares a byte-space with code —
      serve-gallery.sh's guard comment no longer quotes the command it guards, and the
      harness's precondition excludes comment lines so prose can neither satisfy nor trip
      it.

      NOT APPLIED: no change to check-tier0.sh. Widening it to trace invoked scripts is a
      framework-wide decision with a real false-positive cost, and .agentic-framework is
      vendored (G-008 upstream territory). Reported with the measurement so the operator
      can rule.
    related_tasks:
      - T-350
      - T-351

  - id: G-021
    type: gap
    status: watching
    severity: high
    title: "Exported artifacts carry unverified CLAIMS ABOUT ANOTHER SYSTEM — the DI trailer has asserted 'AEF generates it from node coordinates' in every export for 59 days, across 10 releases, inside bytes AEF pins by sha, and nothing has ever checked whether it is true"
    detected: 2026-08-03
    origin_task: T-357
    decision_trigger: >
      Either (i) AEF confirms or denies the delegation (asked on the rail at
      offset 418, tracked as A-020) AND the trailer is corrected or removed to
      match reality, AND some check exists that a claim about a peer system
      embedded in shipped bytes has a named owner and a way to go stale
      loudly; or (ii) the operator rules that unowned cross-project claims in
      exported artifacts are acceptable and the gap closes as accepted-risk.
      Closing on the answer ALONE is not enough — that fixes the instance and
      leaves the class. Mitigation is not prevention.
    description: |
      src:9406-9407 defines, and src:9582 emits into EVERY exported .bpmn:

        <!-- BPMN DI (visual layout) omitted in this demo; AEF generates it
             from node coordinates -->

      Three separate problems, in increasing order of structural interest.

      (1) THE INSTANCE. The sentence asserts a behaviour of a PEER PROJECT.
      Nobody on this side has ever verified it, and under the T-559 boundary
      nobody on this side can. It has shipped since 61242508 (T-012,
      2026-06-05) in dist/ 0.1.0 through 0.8.0, and it sits inside bytes AEF
      pins by source_bpmn_sha. If the delegation was never collected, the
      designer's export path has been documenting a pipeline stage that does
      not exist.

      (2) THE WORD "demo". This is seed-stage scaffolding that was promoted
      wholesale into the canonical tree and never revisited. A deferral with a
      named downstream owner is a debt; this one had no ticket, no expiry and
      no owner on either side of the seam. It survived promotion to canonical
      (T-012), ten releases, and a two-party incident.

      (3) WHY THE FRAMEWORK WAS BLIND — the part that generalises (G-019).
      This exact string ALREADY caused a cross-project incident: AEF's reader
      promoted it to document rationale, poisoning their corpus; they fixed the
      reader (T-2682) and restored two maps (T-2683), and src:9409-9421 is our
      half, a guard refusing to read our own trailer as a doc block. So the
      comment has been under direct scrutiny on BOTH sides with an incident
      report each — and both investigations asked WHERE THE COMMENT APPEARS.
      Neither asked WHETHER ITS SENTENCE IS TRUE.

      An incident DIRECTS attention rather than DISTRIBUTING it. The property
      that drew the attention gets fixed, and the artifact's central claim can
      walk out of a two-party review still unexamined — with the review itself
      now standing as evidence the artifact was checked.

      Related in shape but distinct from the arc's existing catalogue: G-015 is
      an assertion that silently expires; this is an assertion that was never
      true-or-false-tested at all, about a system its author could not observe.
      The catalogued failures so far are checks that cannot fail. This is a
      claim nobody thought to make a check OF.

      NOT FIXED. The trailer is left in place deliberately: removing it now
      would erase the evidence before AEF answers, and correcting it before
      knowing which way the answer goes would be guessing. The instance waits
      on A-020; the class is the operator's.
