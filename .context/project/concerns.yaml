- id: G-015
  type: gap
  status: watching
  severity: medium
  title: 75 verification blocks assert a GLOBAL, always-moving property — `diff src/aef-workflow-designer.html
    build/gallery/designer.html` — and all of them are red right now
  detected: 2026-08-02
  origin_task: T-309
  decision_trigger: 'Either the line is narrowed to assert what its task actually delivered (e.g. `grep
    -q "set-branch-pitch" build/gallery/designer.html` — the serve root carries THIS feature), or the
    convention is dropped in favour of a single tree-level freshness check that is not copied into per-task
    gates, AND tools/serve-gallery.sh grows a build-only path so the remedy does not require binding
    a port. Closing because "we rebuilt the gallery" is not closure — the line goes red again on the
    next edit to src, which is the property being reported.

    '
  evidence_2026_08_02_T339: 'A second, independent carrier of the same shape, found while answering
    AEF rail-396. Full scan of every ## Verification block (341 task files, 1292 non-comment command
    lines): 18 lines reach the network, only 4 resolve the port from the watchtower triple file, and
    11 HARD-CODE a literal port — 8 at :8834 (the gallery port retired by T-253 behind ufw; connection
    refused today, exit 7) and 3 at :3000 (our own Watchtower, live and correct). All 11 sit in completed
    tasks, so nothing re-runs them, but every one is a gate pinned to a host-level fact rather than
    to what the task delivered — the same subject error as the diff line, with a different global. WHY
    THE POPULATION IS SMALL, STATED HONESTLY: AEF measured 371 lines of the mirror defect (literal localhost:3000,
    which on this host is OUR server, so their gates were passing against our pages — their T-165 was
    satisfied by our T-152 page). Ours number 11 because the port we happened to hard-code is either
    our own (passes correctly) or dead (fails red). Neither direction yields a silent false green. That
    is OCCUPANCY, not construction: nothing in the tree stops the next author writing :3001, and CLAUDE.md''s
    ban on hard-coded ports is prose, read by nothing — exactly the status of AEF''s own T-1376 ban.
    Measured: 0 verification command lines here reference :3001, so our gates have never been hitting
    AEF''s server.

    '
  detail: 'Found while re-running T-093''s verification during T-309 (9/10, line 8 red). The line is
    `diff -q src/aef-workflow-designer.html build/gallery/designer.html`. Scanned the class before concluding
    anything: 334 verification blocks, 1261 non-comment lines, and this exact assertion (diff/cmp variants)
    appears in **75 tasks** — 72 completed, 3 active (T-093, T-102, T-105). It is red right now for
    all of them: build/gallery/designer.html is a Jul-28 snapshot, src was last edited Jul-31, 402 diff
    lines.

    WHAT IS WRONG IS THE SUBJECT, NOT THE PREDICATE. The intent is good and has history behind it —
    T-231 and T-252 both cost real time to "committed is not serving" (PL-046), and this line is the
    scar. But it asserts a property of the WHOLE TREE AT THIS MOMENT (serve root in sync with source),
    not a property of the task that carries it. It was true when written and decays the instant anyone
    else edits src. For a completed task that is harmless — the gate already passed and the file is
    archived. For a task sitting in the human review queue it converts "the human has not got to it
    yet" into "permanently red", which is exactly the T-178 shape (rail 384) in a reachable costume.
    T-093 has been partial-complete for 28 days with this line red for reasons that have nothing to
    do with T-093.

    THE REMEDY IS NOT FREE, WHICH IS THE PART THAT MAKES IT A GAP. The only tool that legitimately produces
    the artifact is tools/serve-gallery.sh, and it has NO build-only path: it does `rm -rf $OUT`, reassembles,
    then binds a port, starts gallery-serve.py and refuses to report success unless the running server
    answers /api/health (the T-231 behaviour probe, itself correct). Its default port is :8834, which
    is retired — ufw has no allow rule for it (T-253) and the firewall is the operator''s boundary,
    not the agent''s to change. So "just rebuild it" couples a per-task verification line to starting
    a server. Hand-copying only designer.html would green all 75 lines while leaving build/gallery/rendered/
    stale — a green that asserts less than it says, which is the class of defect this register exists
    for.

    NOT APPLIED. T-093/T-102/T-105 gates belong to their owners, and narrowing 75 lines is a convention
    change, not a fix. Reported with the measurement so the operator can rule.

    '
