  decision_trigger: 'A convention/guard ensures agent browser automation uses an ISOLATED headless context
    (or verifies the target page is disposable) before any navigate/adoptImportedXml. Captured as a
    learning and, ideally, a pre-flight check. Then close G-006.

    '
