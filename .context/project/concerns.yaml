  - id: G-005
    type: gap
    status: watching
    severity: high
    title: "Editor has no document autosave — an authoring tool loses all unsaved work on any reload/navigation/crash"
    detected: 2026-07-06
    origin_task: T-126
    decision_trigger: >
      Editor (src/aef-workflow-designer.html) autosaves the current document
      (debounced) to localStorage on mutation and offers recover-on-load; a
      reload mid-edit restores the in-progress document. Then close G-005.
    description: |
      The editor persists only PREFERENCES to localStorage
      (aefViewPrefs/aefRoutingPrefs/aefSnapPrefs). The DOCUMENT itself lives
      solely in volatile browser memory until an explicit Save (which merely
      DOWNLOADS a .bpmn). Any reload, navigation, or crash loses all unsaved
      work with no recovery point — a Reliability-directive violation for an
      authoring tool. On 2026-07-06 this destroyed ~1 hour of operator layout
      work when agent Playwright automation navigated the live browser (see
      G-006). Full RCA: docs/reports/T-126-editor-workloss-rca.md.
    evidence:
      - "browser_evaluate: sessionStorage empty, indexedDB.databases()=[], no undo stack; localStorage held only *Prefs keys."
      - "src/aef-workflow-designer.html: localStorage.setItem only for aefRoutingPrefs/aefSnapPrefs/aefLabelPrefs/aefViewPrefs; btn-save downloads `${id}.v${v}.bpmn` (no persistence)."
    related:
      - T-126
      - G-006
