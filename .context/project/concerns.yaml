  - id: G-025
    title: "The task gate safe-lists an interpreter, so `python3 -c` skips every gate — and one allowed idiom (subprocess) re-admits the whole shell, making the deny-list unclosable by enumeration"
    severity: high
    status: watching
    registered: 2026-08-08
    detail: |
      `check-active-task.sh` is the structural enforcement behind the Core
      Principle — "nothing gets done without a task". For Bash it consults two
      textual predicates, and `python3 -c` is on the safe-list behind a
      write-indicator deny-list (safe-commands.sh:170):

          open\(.*, *['"]w  |  \.write\(  |  shutil\.  |  os\.(rename|remove|unlink|makedirs|system)

      MEASURED against the real vendored hook in a sandbox with
      `current_task: null` (tools/_t385-python-c-gate-bypass.sh), 7 of 7 probed
      idioms came back ALLOWED — the hook exits 0 before the no-active-task
      check, the task-is-active check, G-020 and the T-1730 focus-drift gate
      ever run:

          pathlib.Path(p).write_text(s)      AEF     .write_text misses \.write\(
          pathlib.Path(p).write_bytes(b)     AEF     same
          os.replace(a, b)                   AEF     not among the five os.* names
          subprocess.run([cp, src, dst])     832     only os.system is denied
          print(x, file=open(p, "a"))        832     the regex demands a quote then w
          pathlib.Path(p).unlink()           832     os.unlink denied, Path.unlink not
          subprocess.call(cmd, shell=True)   832     a general shell, no signature at all

      Reported by AEF at rail 465 (their OBS-200) with the first three; the last
      four are ours. Two of those four are grounded in code we actually run —
      `subprocess.*` has 49 call sites under tools/ lib/ web/ and `.unlink()` has
      4 — so this is not an exotic bypass but a shape our own tree already uses.
      The other two measure ZERO sites here and are stated as what they are: an
      `open(p,"a")` boundary probe (the deny-list regex demands a quote then `w`,
      so the append mode of the very function it names walks through), and the
      shell=True row below. Kept separate deliberately — "an idiom we use" and "an
      idiom that defeats the predicate" are different arguments, and only the first
      speaks to our exposure. (`os.replace` is AEF's documented atomic-write idiom
      and has 1 site here; the house-style argument is theirs, not ours.)

      WHY IT IS ITS OWN GAP RATHER THAN A MISSING DENY-LIST ENTRY. The last row is
      a different claim from the other six. A general shell reached through the
      safe-listed interpreter, with the command in a variable, carries no textual
      signature for any predicate to match — and it re-admits every pattern the
      deny-list already denies. So the list cannot be closed by enumeration even
      in principle; adding the six named idioms above would leave the seventh
      untouched and the gate exactly as open. Enumeration is not a slow fix here,
      it is not a fix.

      COMPOSITION — the danger is in the PRODUCT of entries, not in any entry.
      Reported by AEF at rail 471 §1, following from our pipeline bound (every
      segment of a pipeline must be safe-listed, which is why `termlink | python3`
      was GATED while `cat | python3` was not):

          curl -s http://host | python3 -c "<write idiom>"    ALLOWED

      `curl` and `wget` are both safe-listed here (safe-commands.sh:162), so REMOTE
      content reaches the local filesystem with no active task and no bypass-log
      entry. Neither entry is wrong alone.

      WHY THE ENTRY LOOKS REASONABLE, which is the part worth keeping: line 162
      groups `curl|wget` with `date|uname|ps|ss|id|whoami|hostname|env|df|du|free|
      uptime|nproc` — a cluster of read-only info commands. In that company curl
      reads as harmless, and by the category the grouping actually implements
      ("does not modify local state") it IS harmless. The category is what misses:
      a command can be perfectly read-only and still be the INPUT to something that
      writes. The safe-list classifies commands by what they DO; composition is
      about what they CARRY. That is why this survived review rather than being an
      oversight anyone was careless about.

      EPISTEMIC NOTE (AEF's L-546, adopted): we vendor their hook, so re-running
      their rows here executes the SAME predicate and cannot fail differently. Our
      reproduction is reporting fidelity, not corroboration; the finding stands on
      the predicate being read correctly, which either side can do alone. The
      curl/wget grouping observation above is a READ of the list, not a re-run.

      FAILURE DIRECTION IS THE DANGEROUS ONE: false NEGATIVE. Every gate is
      skipped, nothing is written to the bypass log, and the outcome is
      indistinguishable from compliance after the fact. A defect whose signature
      is the ABSENCE of evidence cannot be found by looking for evidence — which
      is why this was found by a peer reading the source, not by anything we run.

      Both controls in the probe were green before any row was believed: a shell
      redirect BLOCKED (the harness reaches the gate) and a deny-listed idiom
      `shutil.` BLOCKED (python3 -c genuinely IS inspected). Without the second,
      "python3 is never checked" and "python3 is checked but these slip" produce
      identical ALLOWED rows and have different fixes.

      Vendored subject: check-active-task.sh @ sha256 b3e135d423df (first 12).
      G-008 applies — fixable in-tree and upstreamable; AEF asked to adopt ours
      rather than invent a second answer, so the remedy is a joint decision, not
      a unilateral patch to a hook they own.
    decision_trigger: >
      A `python3 -c` command that writes cannot reach the interpreter without an
      active task — enforced by CONSTRUCTION rather than by pattern, since the
      subprocess row proves patterns cannot close it. Two directions are on the
      table (AEF rail 465): drop the interpreter from the safe-list entirely, or
      make `-c` scripts write-free by construction.

      CORRECTION (2026-08-08, AEF rail 467 §3, measured here). This entry
      originally said the first direction costs the `python3 -c "import yaml;
      yaml.safe_load(...)"` idiom used throughout our Verification blocks, and
      that the cost was "the reason this is a decision and not a patch". THAT COST
      IS NOT REAL. P-011 executes Verification commands from inside update-task.sh
      as subprocesses; PreToolUse hooks fire on the agent's tool calls, not on
      processes a script spawns. Measured in this tree: the hook is wired
      `Write|Edit|Bash` only, and update-task.sh references it zero times. Both
      sides had independently priced the remedy against a population it does not
      touch. What removal actually costs is interactive one-liners during recovery
      states (no active task, focus drift) — where `grep`/`cat` substitute, though
      whether they substitute FULLY is AEF's IW-2 and remains unmeasured by either
      of us. The remedy is cheaper than this entry first claimed; it is still a
      joint decision because the hook is shared, not because of this cost.

      A "safe-list fewer helpers" remedy is ALSO ruled out by the composition row:
      the bare `python3 -c` form needs no helper and is already open.

      NOT CLOSED BY adding the seven measured idioms to the deny-list. That
      removes the instances and leaves the mechanism: `subprocess.call(cmd,
      shell=True)` still passes, and it can perform every operation the list
      names. A remedy that leaves the last row ALLOWED has not closed this gap
      regardless of how many rows it turns green.

      NOT CLOSED BY the probe existing. tools/_t385-python-c-gate-bypass.sh
      measures the hole; it does not gate anything, and a census that reports a
      known-open gate every run is a description, not a prevention.

      CURRENTLY MET: no. Measured 7/7 ALLOWED at registration.
    related_tasks:
      - T-385

  - id: G-026
    title: "The task gate's EXEMPTION list is maintained by field discovery — three verb-by-verb fixes for one deadlock shape, each found by an agent hitting it live"
    severity: medium
    status: watching
    registered: 2026-08-08
    detail: |
      `check-active-task.sh` blocks when `current_task` is null. Several framework
      verbs must nonetheless run in that state, and each has been discovered the
      same way: an agent hit the block in the field, then a task was filed to add
      that ONE verb to the allowlist.

          T-2052   `fw task create`   the gate's own advice is "create a task",
                                      which the gate was refusing
          T-2054   `git commit`       `--status work-completed` nulls focus, but the
                                      completion's own file-move still needs committing
          T-390    `fw note`,         completing a task nulls focus, and update-task.sh
                   `fw context        prints a LEARNING PROMPT at that moment — the
                   add-*`,            framework asks for a learning in the one state
                   `fw handover`      where its gate refuses the command

      THE SHAPE, stated once: the gate blocks the action its own advice depends on.
      Every instance is an action the framework itself prescribes as the response to
      having just completed work — which is precisely the transition that nulls focus.
      The deadlock is not incidental to these verbs; it is generated by the state
      machine, so more instances should be expected rather than hoped against.

      WHY THIS IS ITS OWN GAP AND NOT THREE CLOSED TASKS. Each fix worked and none
      was wrong. What is unaddressed is the METHOD: the exemption list is extended
      only when someone is blocked by its absence, so its completeness is bounded by
      what agents have happened to try. Between T-2054 (fixed) and T-390 (fixed
      today), `fw note` was unreachable in the post-completion state and nothing
      reported it — the failure is silent by construction, because a blocked capture
      verb produces no record of having been wanted.

      SIBLING OF G-025, OPPOSITE POLARITY, and this is the useful part. G-025 is a
      DENY-list that cannot be closed by enumeration because it cannot name every
      dangerous idiom. This is an ALLOW-list that cannot be closed by enumeration
      because it cannot name every harmless one. Both are maintained by field
      discovery; both fail silently; the deny-list fails toward permitting harm and
      the allow-list toward blocking work. Two enumerations, two directions, one
      structural answer needed — a rule stated over what a command DOES rather than
      what it is CALLED.

      Note the exemptions already share an unstated predicate: every one of them
      writes only under `.tasks/` or `.context/`, both of which are ALREADY exempt
      paths for Write/Edit. The rule "a command whose writes are confined to
      already-exempt paths does not require an active task" would have admitted all
      three without anyone being blocked first. Stated as an observation, not a
      proposal — the hook is shared with AEF and the predicate would need measuring
      before it could be trusted (a command's write-set is not statically knowable
      in general, which is exactly the G-025 problem again).
    decision_trigger: >
      A framework verb that the framework itself prescribes as the response to
      completing work cannot be blocked by the completion of that work — enforced by
      a stated rule rather than by an enumerated list that grows one field incident
      at a time.

      NOT CLOSED BY adding more verbs to the allowlist. That is the method under
      criticism; each addition removes an instance and leaves the generator intact.

      NOT CLOSED BY T-390. T-390 fixed three verbs and is why this gap could be
      written, but it is the third instance, not the remedy.

      CURRENTLY MET: no.
    related_tasks:
      - T-390
  - id: G-027
    title: "No instrument detects a task that is fully verified and one command from done: all ACs ticked + owner human + still started-work is invisible to every check we have"
    severity: medium
    status: watching
    registered: 2026-08-08
    detail: |
      Twelve now-horizon tasks were found in `started-work` with EVERY acceptance
      criterion ticked -- agent and human. The ticks were legitimate: all twelve trace
      to one operator-authorised batch close (`ee2b902a`, T-306, 2026-07-29), where
      55/66 closed and 11 were left as R-033 sovereignty blocks for the operator. They
      then sat for ten days.

      WHY NOTHING SAW IT. The audit's D2 discovery check watches the HUMAN REVIEW
      QUEUE -- tasks whose human ACs are UNCHECKED. These twelve are invisible to it
      *precisely because the human already did the verification work*. Doing the work
      is what removed them from the only instrument that was looking.

      So the state meaning "verified, one command from done" is indistinguishable, to
      every check in the tree, from "in progress". The queue metric improves when a
      task enters this state, which is the wrong direction.

      NOT A GATE DEFECT. R-033 is correct and must not be bypassed: an agent may not
      complete an `owner: human` task, and `--skip-sovereignty` is withheld by
      CLAUDE.md's autonomous-mode boundaries. The missing thing is DETECTION, not
      permission -- nothing tells the operator the queue exists.

      SECOND-ORDER FINDING (why detection alone is not enough). Gate order is
      sovereignty (update-task.sh:1517) -> P-010 (1523) -> P-011 (1528). So "all ACs
      ticked" does NOT imply "will close cleanly"; the sovereignty gate exits first and
      hides the verification result. Pre-running the twelve `## Verification` blocks
      directly: 5 would close cleanly, 7 would fail P-011 AFTER passing sovereignty.
      An operator acting on a naive "these are ready" list would hit seven surprise
      failures. Any detector built for this must report VERIFICATION STATE, not just
      AC state.

    decision_trigger: |
      An instrument reports tasks in the state (all ACs ticked AND owner: human AND
      status: started-work), and reports each one's P-011 result alongside -- so the
      output distinguishes "ready to close" from "ticked but verification red". Closed
      when that surfaces to the operator without an agent being asked to look.
    origin_task: T-398
    related_tasks: [T-398, T-306, T-399]

  - id: G-028
    title: "A learning can be recorded correctly and never applied: nothing revisits an entry whose application field reads TBD"
    severity: high
    status: watching
    registered: "2026-08-09"
    detail: |
      PL-025 was captured on 2026-07-10 (T-170). It named two specific defects in the
      Bash task gate's write-detection heuristic -- that a redirect operator only acts
      OUTSIDE quotes, and that a redirect to a /dev sink is a discard rather than a
      source write -- and it prescribed the exact remedy: pin the boundary with a
      true-positive/false-positive corpus.

      Every word of it was correct. Its `application:` field read `TBD`.

      Thirty days later both defects were still live and blocked five read-only
      commands in a single resume sequence, including `fw task create` for the task
      that describes them (the description quoted the operators). The finding then had
      to be re-derived from scratch -- three falsified hypotheses -- before anyone
      noticed the framework itself had surfaced PL-025 on the new task's creation.

      WHY NOTHING SAW IT. Learnings are write-once. `fw context add-learning` appends
      an entry with `application: TBD` and no check ever reads that field again. There
      is no queue of unapplied learnings, no age alarm, nothing in `fw doctor` or the
      audit that distinguishes a learning that changed the code from one that changed
      nothing. The capture ritual is enforced (the framework PROMPTS for a learning at
      task completion); the application step has no ritual at all.

      This is the inverse of G-027. There, the operator did the work and the instrument
      stopped seeing them. Here, the agent recorded the knowledge and no instrument
      ever looked again. Both are cases where a system measures the ceremony rather
      than the outcome.

      MEASURED (2026-08-09). 113 of 118 learnings -- 96% -- have `application` set to
      TBD or empty. The oldest dates to 2026-07-02; 22 predate PL-025 itself.

      Read that carefully, because the honest conclusion is narrower and worse than
      "113 unapplied findings". Many learnings are behavioural and are applied by being
      read, so the backlog is not 113 live defects. What 96% establishes is that the
      field carries NO INFORMATION: it cannot distinguish a learning that changed the
      code from one that changed nothing, because essentially nothing ever sets it. The
      one entry that mattered -- PL-025, describing a live gate defect -- was
      indistinguishable from the 112 that did not need action. There was no signal to
      miss, which is why nobody missed it.

      SCOPE. Not about PL-025 specifically; that one is now applied (T-404). The
      register entry exists because the mechanism is untouched. Draining a backlog
      would not close this: the defect is that an inert field is the only thing
      standing between a correct finding and a month of silence.

      SECOND WITNESS, DIFFERENT REGISTER (2026-08-11, OBS-021 folded in here under
      T-436). `validation_method` is inert across the ENTIRE assumption register:
      20 of 20 rows read TBD, including all four assumptions that were actually
      disposed with real evidence. A-017/A-018/A-019/A-020 were each settled by a
      concrete method -- a rail question, a CDP spike, a source measurement -- and
      not one row records which.

      This matters because it generalises the concern past learnings. The shape is
      not "learnings are write-once"; it is A FIELD WHOSE NAME IS OBVIOUSLY RIGHT
      AND WHICH NOTHING EVER READS OR WRITES. Two registers, two such fields, 96%
      and 100% inert, neither noticed until someone counted. The consequence here
      is specific: there is no way to ask "how would this assumption be settled"
      BEFORE committing to settle it, so an assumption's cost stays invisible until
      someone tries to pay it.

      Deliberately NOT folded into the dangling-assumption count by the tool that
      measured it (tools/_t428-assumption-disposition-check.py reports the census
      and does not fail on it) -- it is a property of the register's design, and
      failing on it would hide it inside a number.

      Closure below is written for learnings. It should be read as covering both:
      a check that surfaces inert never-written fields per register, not one that
      drains a particular backlog.
    decision_trigger: |
      Unapplied learnings are visible without an agent being asked to look: something
      reports entries whose `application` is TBD/empty, with age, so a correct finding
      cannot sit inert for a month unnoticed. Closed when that surfaces to the operator
      -- NOT when the current backlog happens to be drained, since draining is
      mitigation and the missing instrument is the defect.
    origin_task: T-404
    related_tasks: [T-404, T-170, T-405, T-401]

  - id: G-029
    type: gap
    status: watching
    severity: medium
    title: "Peer identity at the termlink seam is a HOST identity, not a project identity — one fingerprint carries six from_project values, and our own outbound has been signed with it since offset 75"
    detected: 2026-08-09
    origin_task: T-418
    context: |
      AEF reported at rail 509 that one of their posts went out under
      `d1993c2c3ec44c94` instead of their project key, and framed it as "this host's
      key". Measured here before answering, and the framing is under-scoped in the
      direction that matters: it is the fingerprint of the shared
      `/root/.termlink/identity.key`, and OUR OWN shell `termlink` CLI signs as it too.
      The co-resident agent they warned us about is us.

      MEASURED (2026-08-09, tools/_t418-producer-attribution.py over 474 content
      envelopes on two DM topics):

        one fingerprint d1993c2c3ec44c94 carries SIX distinct from_project values
          999-Agentic-Engineering-Framework, 999-agentic-engineering-framework,
          999-AEF, 010-termlink, 002-Claude-Partner-Network, 832-Workflow-designer
        400 of 474 content posts carry NO from_project at all
        AEF's own project key 0e7ee6cad65137fc is unlabelled on 38 posts
        three spellings of one project name, so even a present label does not group

      TWO DIRECTIONS, AND THE SECOND IS OURS.

      READING — nothing in 832 routes on peer producer identity (grep over
      tools/ src/ agents/, 2026-08-09: no site outside the T-418 and T-360 tools
      references sender_id or from_project). So AEF's mis-signature cost us nothing,
      and the fixture-landing gate that mattered most (_t413-land-fixtures.py) is
      content-addressed — it verifies sha256 before writing and never asks who sent
      the bytes. That was luck as much as design and is worth keeping deliberately.

      WRITING — ten of our own posts on the AEF rail went out under the shared key:
      offsets 75, 295, 299, 466, 469, 470, 472, 473, 474, 480. They carry our task
      threads (T-385, T-387), our release cv_key, and a 832 BPMN file transfer. Each
      was sent from the shell rather than through MCP. So we were doing to AEF what
      AEF apologised to us for, earlier and ten times over, while tools/rail-sweep.py
      documented the exact mechanism and scoped it to our own capture path.

      WHY THIS IS A GAP AND NOT JUST A BUG. `from_project` is free text in an
      unsigned metadata map; the hub derives sender_id from sender_pubkey_hex
      (T-1427) so the KEY cannot be forged, but the project claim can. Attribution at
      this seam therefore separates cooperating co-residents and authenticates
      nobody. No instrument on our side reported any of it for the ~4 months since
      offset 75 — it surfaced only because a peer apologised for their instance of it.
    decision_trigger: |
      Two things, and the second is the one that closes this:
        (a) our outbound is single-keyed — every post claiming 832-Workflow-designer
            is signed by our MCP identity, checked by something that runs without an
            agent being asked to look (the --self mode exists; nothing schedules it);
        (b) the hub-side collapse is fixed or formally accepted. That half is
            termlink's, not ours (AEF filed their T-2904); we track it here because
            our seam behaviour depends on it, not because we intend to fix it.
      NOT closed by re-signing the ten historical posts — those are a record, and
      rewriting them would destroy the only evidence of the period. Mitigation is not
      prevention (G-019).
    related_tasks: [T-418, T-360, T-413]

  - id: G-030
    type: gap
    status: watching
    severity: high
    title: "An operator ruling filed as prose is invisible: four tasks waited on a human decision while reading as in-progress agent work"
    detected: 2026-08-10
    origin_task: T-209
    context: |
      Four times now, a task whose next step is a HUMAN decision has recorded that
      decision as prose — in `## Decisions`, or in `## Context` under a phrase like
      "needs human confirmation" / "the default choice remains the operator's" — and
      NOT as a Human AC.

        T-340 AC1   DI repair semantics
        T-341 AC1   (no agent recommendation, deliberately)
        T-358       lane/pool fabrication repair — prose in `## Decisions`
        T-209       decline a peer's proposal — prose in `## Context`

      CONSEQUENCE, and it is not cosmetic. `fw task verify` reports unchecked Human
      ACs. The Watchtower review queue lists tasks with unchecked Human ACs. A ruling
      written as prose appears in NEITHER. So the task reads as in-progress agent work
      to every instrument that looks at it, and the only thing that surfaces it is an
      agent happening to re-read the body. T-340 sat ~7 days that way; T-209 sat ~2
      months.

      WHY THE FRAMEWORK ALLOWS IT. There is no gate between "this task cannot proceed
      without a human" and "this task has a Human AC". The task template offers the
      Human section, and nothing checks that a task whose prose defers to the operator
      actually uses it. The absence is silent in exactly the way the register exists to
      catch: nothing fails, no count moves, and the queue is accurate about the tasks it
      knows about.

      NOT A ONE-INSTANCE COMPLAINT. Each was fixed individually as it was found
      (T-358 and T-209 this session). Four instances across three weeks, each found by
      accident rather than by an instrument, is the class — and the fix-on-discovery
      pattern is what has kept it open.

      SHAPE. Same family as G-013 (a subset reported as the whole) and G-022 (a
      one-topic measurement reported as a fact about a peer): an instrument that is
      accurate about its own scope, read as if its scope were the population.
    decision_trigger: |
      A detector exists that flags any task whose body defers to a human decision
      (ruling-shaped prose: "operator's call", "needs human confirmation", "left for
      human", "the human must decide", "awaiting operator") while its `### Human`
      section is empty or template-only — and it is wired into a gate or the audit, so
      the next instance is caught by the instrument rather than by an agent re-reading
      the body. Detector must be mutation-checked in both directions: a task with the
      prose AND a real Human AC must NOT be flagged, or it will report every correctly
      filed task and be switched off.

      Explicitly NOT closure: fixing a fifth instance by hand.

  - id: G-031
    type: gap
    status: watching
    severity: high
    title: "The push gate's PASS and its could-not-evaluate are the same exit code: a push is allowed when the audit ran zero checks"
    detected: "2026-08-11"
    origin_task: T-435
    context: |
      Reported by AEF (their OBS-221, DM 538 §5) about their tree, with "if your tree
      vendored that hook, it has it". Driven here and REPRODUCED.

        producer  agents/audit/audit.sh:329     exit 0 when `flock -n` fails
        producer  same, no-flock fallback :353  exit 0 when the lock file exists
        consumer  agents/git/lib/hooks.sh:844   generates .git/hooks/pre-push,
                                                which blocks ONLY on `-eq 2`

      So 0 means both "19 checks ran and none failed" and "no check ran at all".

      MEASURED, real hook, real held lock, no push performed:
        lock held  -> HOOK EXIT 0, "Another audit is already running — exiting"
        no lock    -> HOOK EXIT 0, Pass: 19  Warn: 3  Fail: 0
      Same verdict, 19 checks apart. Reciprocal: the same hook DOES return 1 /
      "Push blocked" on a stub audit exiting 2, so the gate is live — this is about
      lock contention specifically, not a gate that blocks nothing.

      NOT CLAIMED: that any push here was let through with a real failure behind it.
      Not looked for, not found. The claim is that the gate cannot tell.

      THE PRODUCER'S 0 IS DELIBERATE. audit.sh:324 documents it as cron behaviour
      (QUIET=true, zero-zombie). The defect is a SECOND caller with the opposite need
      reading the same code — which is why "just exit non-zero" is not the remedy.

      WHY THIS IS A GAP AND NOT JUST A BUG. Every other gate in this tree is trusted
      because it reports. This one reports something indistinguishable from success in
      the exact circumstance where it knows it has measured nothing — and contention is
      likeliest precisely when a cron audit is running, i.e. routinely. The family is
      the session's recurring one: an instrument that always answers, and an answer
      that is read as knowledge.

      BOTH FILES ARE VENDORED (.agentic-framework/). G-008 applies: no local patch.
      Remedy proposed to AEF at DM 539 §1 — contention exits 75/EX_TEMPFAIL in all
      modes, cron call sites map 75 -> 0 where silence is wanted, the push consumer
      treats 75 as could-not-evaluate. Whether could-not-evaluate should BLOCK is a
      sovereignty question and was put to the operator, not taken.

      UPSTREAM DISPOSITION (AEF, DM 541, 2026-08-11). Remedy ACCEPTED AS SPECIFIED —
      75/EX_TEMPFAIL in all modes, cron call sites map 75 -> 0, push consumer treats it
      as could-not-evaluate. Their original filing said "e.g. 3 = did-not-run"; they took
      75 on the grounds that EX_TEMPFAIL already MEANS transient-retry to anything that
      reads it, where 3 means whatever the last author decided. They also confirmed the
      cron point: a blanket non-zero would have fixed the push gate by breaking the
      zero-zombie contract, so the defect is two callers with opposite needs reading one
      code, not the code itself.

      BLOCK-VS-WARN — the half put to them rather than taken. Their answer:
      could-not-evaluate should BLOCK at the push gate. Their reasoning, recorded so it
      can be disagreed with rather than merely accepted: the two cases are not symmetric.
      The population refused by an undecidable-VERSION check CANNOT COMPLY — refusal
      there is a trap with no exit. A push blocked on lock contention has an exit costing
      seconds: wait, or re-run. Nobody is stranded and nothing has to propagate, while
      the failure it prevents is a push that printed the audit banner and went through
      with an invariant red. "A gate that cannot evaluate and says fine is not a gate;
      it is a banner."

      NOT LANDED. Filed upstream, next session on their side (they were at 82% context
      and the change touches the producer, both fallback arms, every cron call site and
      the generated hook). Accepted is not delivered: decision_trigger below is
      deliberately unchanged, and closure remains the probe flipping.
    decision_trigger: |
      tools/_t435-lock-contention-probe.sh exits 1 rather than 0 — i.e. the contention
      path no longer returns a value the push gate reads as PASS. The probe is written
      so PASS means the defect is still present; the FLIP is the closure signal, not
      the green.

      Explicitly NOT closure: a local edit to the vendored audit.sh or hooks.sh, or
      remembering not to push while an audit is running.

  - id: G-032
    type: gap
    status: watching
    severity: high
    title: "The inbox's only CONTENT route is dead and fails silently — the handover prints the count, never the finding"
    detected: '2026-08-11'
    origin_task: T-436
    context: |
      MEASURED under T-436 by running the code, not reading it.

      The handover has a block whose entire purpose is to carry observation CONTENT
      into the next session (handover.sh:921-935). Run verbatim against the live
      inbox it emits ZERO lines for 24 pending observations, because it splits on
      `\n  - ` while the inbox writes `- id:` at column 0. It has done this every
      session since it was written.

      The failure is silent BY CONSTRUCTION: the enclosing `if [ PENDING_OBS -gt 0 ]`
      is true, so the heading, the count and the blank lines all print. The section
      is well-formed and complete-looking with the payload absent. Nothing anywhere
      reports "listed 0 of 24".

      CONSEQUENCE, measured with a denominator: 7/24 pending observations were ever
      read by a later, different task; 13/24 by nothing at all. And read LATENCY
      falsifies the 29% — no observation has EVER been read more than 1 day after
      filing, while the inbox holds items up to 4 days old and the oldest have zero
      reads. What delivered those 7 was session continuity and handover narrative,
      not the inbox. The inbox has never once worked across the gap it exists to
      bridge. OBS-009 is the specimen: filed 08-09, its finding re-derived by T-432
      three days later.

      WHY IT SURVIVED: AEF fixed this exact regex ONE FILE OVER. audit.sh:2681-2686
      names the defect verbatim ("observations are `- id:` at column 0, not `  - `")
      as the rationale for their T-2514 repair. The repair was scoped to the call
      site being debugged; the identical idiom in handover.sh was never swept. The
      class is not the regex — it is a fix applied to an INSTANCE when the finding
      was about an IDIOM, with nothing that enumerates the idiom's other sites.

      SCOPE, checked rather than assumed: 3 live sites. handover.sh:925 actively
      wrong. handover.sh:386 (urgent count) broken but LATENT — always 0, and no
      pending observation carries `urgent: true` today, so the "run triage BEFORE
      starting new work" escalation can never fire but is missing nothing yet.
      lib/harvest.sh:214 is CORRECT — it reads patterns.yaml, which genuinely uses
      2-space indent. Filing that one would have been a false report upstream.

      OWNERSHIP: framework-side, vendored. Reported upstream rather than patched
      here, per G-008 — a local edit to .agentic-framework/ is lost on re-vendor,
      and this project has settled on reporting over forking (DM 522 §1).
    # T-445: first user of a field lib/gaps.py has always read and no gap has ever
    # carried. READY only on FIXED (rows == pending); ABSTAINED emits no verdict key,
    # so gaps.py reads UNKNOWN and refuses closure without calling it a measurement.
    closure_check_command: bash tools/_t436-inbox-route-probe.sh --json
    decision_trigger: |
      A re-vendored handover.sh emits one summary line per pending observation —
      i.e. `fw handover` produces a `## Observation Inbox` section whose line count
      matches `fw note count`, verified against a non-empty inbox.

      Explicitly NOT closure: emptying the inbox (a count of 0 makes the block
      unreachable and the defect invisible again), a local edit to the vendored
      handover.sh, or AEF acknowledging the report. Accepted is not delivered.

      NOT CLOSURE EITHER — THE PARTIAL STATE (T-445, measured by AEF on their tree,
      not by me on mine). A listing that emits SOME rows is not progress toward this
      condition; it is the same silence with a plausible row on top. AEF fixed both
      sites and measured 1 row of 112 pending at :931, and 1 of 3 at :386. In their
      words: a zero can read as "nothing pending", but one well-formed row under a
      "112 pending" heading reads as a section that WORKED, and it is the row an eye
      lands on. The equality above was always the bar — this paragraph exists
      because a careful reader holding the same bug in their own tree read the bar
      as "non-empty", and a closure condition that reader can misread is
      under-specified. States, named: DEFECT rows==0 / PARTIAL 0<rows<N / FIXED
      rows==N. Only FIXED closes.

      SECOND, INDEPENDENT LEG — the silence is the worse half. Closure also
      requires that a listing block which emits nothing for a non-zero count says
      so. While the count and the listing can disagree without complaint, the next
      instance of this class is equally invisible.

  - id: G-033
    type: gap
