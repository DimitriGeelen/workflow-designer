      - T-311

  - id: G-022
    title: "A peer rail nobody read: 'AEF is silent' was scoped to one topic and reported as a fact about the peer"
    severity: high
    status: watching
    registered: 2026-08-03
    detail: |
      For this entire arc I have reported "AEF has posted nothing since offset
      414" and, in handovers and to the operator, "AEF is silent". The
      measurement was real and correct — for the topic
      dm:0e7ee6cad65137fc:6a646ce8b1bc6560, the rail I watch.

      There is a SECOND DM topic (dm:6a646ce8b1bc6560:d1993c2c3ec44c94) with
      three messages, unread from offset 1, the most recent 5 days old and
      relaying AEF content. The oldest, ~24 days old, says in its first line
      that AEF ANSWERED IW-1..IW-5 and posted the answers to agent-chat-arc —
      a broadcast rail — so no waker rang and I would have had to poll.

      THE DEFECT IS NOT THE MISSED MESSAGES. It is that a measurement over one
      carrier was promoted into a claim about the peer, and then repeated often
      enough to become background fact that nothing re-tested. Exactly the
      shape this arc has been cataloguing all week (declarations scoped by
      their fixture; measurement promoted past its scope) — committed by me,
      about my own communications, while writing the catalogue.

      COMPOUNDING: `termlink_agent_inbox` (cross-topic unread digest) returns
      unread_topics: [] — which by its own documented semantics is what an
      EMPTY CURSOR STORE returns, not what "nothing unread" returns. The tool
      I would naturally reach for to check "am I missing anything?" cannot
      distinguish all-clear from never-tracked. A lookup miss carrying two
      meanings: absence-cannot-carry-a-decision, third instance on this arc.

      DURATION: ~24 days blind. Per G-019 that alone makes it structural
      rather than an incident, independent of whether the missed content
      turns out to matter.

      ROOT CAUSE FOUND 2026-08-03, and it is worse than the missed rail.
      THE termlink CLI ON THIS BOX IS A DIFFERENT IDENTITY THAN THE MCP TOOL.
      My MCP fingerprint is 6a646ce8b1bc6560. Every key in
      /root/.termlink/cursors.json is suffixed ::d1993c2c3ec44c94 — the relay's
      fingerprint — and `termlink agent dms` from the CLI returns that agent's
      topics (dm:0e7ee6ca:d1993c2c, dm:3bba15e6:d1993c2c), none of them mine.

      Two consequences that compound:
        1. My MCP identity has NO cursor store, which is precisely why
           agent_inbox returns unread_topics: [] — not "nothing unread" but
           "nothing tracked". The empty answer was structural, not incidental.
        2. THE OBVIOUS REMEDY IS A TRAP. "Just check with the termlink CLI"
           runs as d1993c2c3ec44c94 and returns a confident, well-formed,
           entirely plausible answer ABOUT A DIFFERENT AGENT. A wrong answer
           that looks exactly like a right one, from the tool you would reach
           for to double-check the first tool.

      So the reachable surface is identity-scoped and I have been reading one
      identity's rails while reasoning as another. Any sweep MUST assert its
      own fingerprint matches the identity whose topics it enumerates, or it
      inherits this defect in a new costume.

      NOT CLOSED BY READING THE MESSAGES. Mitigation is having read them;
      prevention is a check that enumerates every topic carrying my
      fingerprint before any "peer X is silent" claim is made, that cannot
      report all-clear from an untracked cursor store, and that FAILS LOUDLY
      when the identity it runs as is not the identity it reports for. Until
      that exists this stays open.
    # T-383: this gap carried NO closure condition for 5 days — it was one of two the
    # T-382 audit check surfaced. The detail above already argued the prevention in its
    # last paragraph; nothing had ever moved it into the field the register renders.
    decision_trigger: >
      A reachability sweep that runs BEFORE any "peer X is silent" / "nothing inbound"
      claim, and that satisfies all three of: (1) it enumerates every topic carrying MY
      fingerprint, not one topic chosen by habit; (2) it CANNOT return all-clear from an
      untracked cursor store — an empty result must be reported as "not tracked",
      distinct from "nothing unread", because those are the two meanings the current
      agent_inbox collapses; (3) it ASSERTS that the identity it executes as is the
      identity it reports for, and fails loudly otherwise — the CLI on this box runs as
      the relay's fingerprint and answers fluently about a different agent, so the
      obvious double-check is a wrong answer wearing a right answer's shape.
      Then close G-022.

      NOT CLOSED BY: reading the missed topic (mitigation — done, and the gap is about
      the next carrier, not this one); nor by "I now also check topic X", which fixes
      one instance of a habit and leaves the class; nor by a sweep that passes without
      condition (3), which would inherit the identity defect in a new costume.

      CURRENTLY MET: no. No such sweep exists. Stated explicitly because a closure
      condition that is already satisfied when written is a description of the present,
      not a condition on the future.
    related_tasks:
      - T-360

  - id: G-023
    title: "The byte-identity gate is scoped to the population that happens to carry uids, and I have cited it without that bound"
    severity: high
    status: watching
    registered: 2026-08-04
    detail: |
      `_t308` byte-identity — "24/24 identical, 0 drifted" — is the instrument
      this arc uses to prove a change moves no bytes. I have cited it in task
      ACs, in commits, and to AEF on the rail (RAIL-427), as evidence that a
      change is safe.

      Measured 2026-08-04 (tools/_t358-export-determinism.mjs): the emitter is
      NOT deterministic. `aef:uid` is minted fresh per parse for any node that
      did not arrive with one, so two consecutive parse->emit cycles of the
      same input differ — kitchen-sink.bpmn by 81 lines. Designer-produced
      corpus maps carry uids and are stable; every third-party fixture is not.

      So the 24/24 result is real and is real ONLY for designer-produced maps.
      The instrument is structurally incapable of reporting on third-party
      documents — which is the exact population every repair in this arc
      (T-337, T-340, T-347, T-348, T-356, T-358) is aimed at. A gate that can
      only speak about the artifacts we generated ourselves is a capability
      bound wearing a coverage number, the same shape as the T-340 DI census
      (126 files, 0 with DI) and G-009.

      What makes this a concern and not just T-364: the number was correct
      every time I quoted it, and nothing in the report said which population
      it covered. A reader — including me, including AEF — takes "24/24
      identical" as "this change moves no bytes", full stop.

      NOT CLOSED BY FIXING THE UID MINTING (T-364). Mitigation is making the
      emitter deterministic; prevention is that any byte-identity claim states
      the population it ranges over and FAILS when asked to speak for a
      population it cannot measure. Until a byte-identity run reports its own
      scope, this stays open.
    # T-383: no closure condition for 4 days. As with G-022 the detail already stated
    # the prevention; it had never been written into the rendered field.
    decision_trigger: >
      The GATING byte-identity run reports the population it ranges over in the same
      breath as its verdict — "N/N identical over <which corpus>" — and refuses to
      return a clean result for a population it cannot measure, rather than silently
      omitting it. Concretely: a run asked to speak for third-party documents must
      either measure them or FAIL as out-of-scope; "24/24 identical" must never again
      be quotable without its denominator's identity attached. Then close G-023.

      NOT CLOSED BY: T-364 making uid minting deterministic — that is mitigation, it
      removes the reason the instrument was blind and leaves the reporting habit that
      let a capability bound be read as a coverage number. Nor by
      tools/_t358-byteid-thirdparty.mjs alone: it CAN reach the third-party population
      (10 identical, 0 drifted, uid-normalised with a leg that fails if the normaliser
      matched nothing), but it is deliberately on-demand — its baseline is a pinned
      commit, so as a standing gate it would compare against an ever-older tree. An
      instrument nobody runs cannot report the silence this gap is about.

      CURRENTLY MET: no. The gating runner still reports a bare 24/24 with no
      population named. Partial progress exists (T-364 + the on-demand third-party
      probe); the reporting requirement — the actual prevention — is not built.
    related_tasks:
      - T-364
      - T-358

  - id: G-024
    title: "No instrument holds the pinned artifact and src at the same time — a consumer-visible fix can sit unreleased indefinitely with nothing reporting it"
    severity: high
    status: watching
    registered: 2026-08-08
    detail: |
      Every gate in this project runs against `src/aef-workflow-designer.html`:
      the bridge suite, the geometry sweep, `_t308` byte-identity, the render
      gate, all 38 CDP probes. They answer "is the code correct" and they
      answer it well. None of them answers "is the code the CONSUMER RUNS
      correct", and no instrument opens both artifacts at once.

      `dist/MANIFEST.yaml` is the consumer-facing contract. It records `latest`,
      `sha256` and `bytes` — the identity of what was cut — and nothing about
      what has happened since. So the state "a consumer-visible fix exists and
      is absent from the pinned artifact" HAS NO REPRESENTATION ANYWHERE. No
      check failed; there is no place where the two facts meet.

      Discovered 2026-08-08 from AEF's RAIL-443, and the cost was already paid.
      They are pinned to 0.8.0 (cut 2026-07-29). Eight commits have touched src
      since, FIVE of them consumer-visible in emitted bytes (T-310, T-311,
      T-315, T-337, T-361). One of those five, T-311, is the exact defect they
      reported at four instances across two months — fixed here 2026-07-30, ONE
      DAY after the cut. Proof it is absent from what they run:
      `grep -c docComment` → src 5, 0.8.0 0, 0.7.1 0.

      In the nine days between our fix and their instances 3 and 4 they
      diagnosed it independently, hand-repaired their only detail-authority map
      (`aef-task-lifecycle` v3), and re-raised a standard proposal partly to
      work around it. All of that was spent on a defect already fixed here.

      Why it survived: nothing degrades and nothing goes red — the number just
      grows. It took a direct human question to surface. The nearest thing to a
      signal was my own RAIL-440, which gave AEF three commit hashes and no
      version: I told them WHAT CHANGED in a vocabulary that cannot express
      WHETHER THEY HAVE IT.

      Same family as G-007 (release immutability) and G-015 (assertions about a
      moving global), opposite direction — those guard the artifact once cut;
      this is the window before it is cut.

