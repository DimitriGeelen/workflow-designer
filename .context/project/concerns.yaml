  - id: G-016
    type: gap
    status: watching
    severity: medium
    title: "The export-safety instrument is DIFFERENTIAL — it compares two designer versions to each other, so a defect both versions share is byte-identical and therefore green"
    detected: 2026-08-02
    origin_task: T-309
    decision_trigger: >
      An input-fidelity check exists in the gating runner that compares the EXPORTED
      document against the INPUT document (counts of flow nodes, edges, lanes at
      minimum), over a population that deliberately includes documents the corpus does
      not contain — malformed input, out-of-vocabulary tags, unresolvable refs. Closing
      because "T-337 is fixed" is not closure: the fix removes one instance, the gap is
      that the next vocabulary divergence would be equally invisible.
    progress: >
      2026-08-02, T-339. All three clauses of the trigger are now covered by
      tools/_t338-input-fidelity-cdp.mjs in the gating runner: out-of-vocabulary tags
      (10 shapes, T-338), malformed input (8 shapes, three-way REFUSED/PRESERVED/
      SILENTLY-PARTIAL — losslessness is the WRONG expectation there, because refusing a
      broken document is correct behaviour), unresolvable refs (4 shapes, keyed on aef:uid
      because a display-id measure reads renumbering as loss). Results: 0 silently-partial,
      0 identity lost, and both zeros are proven fillable rather than merely observed —
      teeth legs (f) and (g) mutate the DESIGNER and the buckets duly fill.
      NOT YET CLOSED, and status deliberately left at watching for the operator. Two
      findings the widening produced are open: T-340 (the whole standard bpmndi sub-tree is
      dropped on import, 24/24 — T-337's class one granularity up) and T-341 (an
      unresolvable flowNodeRef silently re-homes the orphaned node to the human/sovereignty
      lane). The trigger's own logic applies to itself: closing because the instrument now
      exists is the same move as closing because T-337 is fixed.
      Correction recorded: rail 394 reported T-338 as making "the next divergence would be
      equally invisible" false "regardless". That held for a vocabulary divergence and was
      unproven for the other two clauses, and the prose did not say which.
    detail: >
      Found while pricing T-309 IW-3. tools/_t308-export-byte-identity-cdp.mjs is the
      tree's instrument for "this change has zero export surface", and T-309's own
      assumption A-4 cites it as the technique for proving exactly that. It works by
      running buildBpmnXml(parseBpmnXml(map)) under the WORKING-TREE designer and under
      the designer at a git ref, then comparing the two outputs to EACH OTHER across the
      24 rendered corpus maps.

      TWO BLIND SPOTS FOLLOW FROM THAT SHAPE, AND NEITHER IS A BUG IN THE TOOL — it does
      what it says. (1) A defect present in BOTH versions produces identical bytes and
      reports green; the instrument can only see CHANGE, never WRONGNESS. (2) Its
      denominator is 24 well-formed corpus maps, so any defect that only malformed input
      can express is outside the population entirely — a corpus zero standing in for a
      safety property, which cannot distinguish "safe" from "unexercised".

      THE COST IS ALREADY PAID ONCE. T-337: parseBpmnXml enumerates flow nodes by
      iterating an allowlist of tags, so an element with an unlisted tag is not rejected
      but INVISIBLE, and export writes only from state.nodes — the node is deleted on
      open→save and the result validates CLEAN because the evidence went with it.
      Measured at 15 of 24 corpus maps, 15 nodes. Both designer versions drop it, so
      byte-identity is green throughout; the corpus carries no such tag, so the
      population never asks. The defect survived precisely in the intersection of the
      two blind spots.

      WHY THIS IS A GAP AND NOT A CHORE. The honest sentence about the instrument is
      "no drift between versions", and the sentence it has been carrying is "no export
      surface". That is a measurement promoted past its scope, sitting in an assumption
      (A-4) that a feature decision rests on. Same family as G-015: the predicate is
      sound, the SUBJECT is wider than what was measured. And T-259 shows the failure
      mode is recurrent rather than hypothetical — the identical defect class one
      granularity down (an unconsumed <aef:eventDef> destroyed on layout-only open→save,
      the rail-201 field defect) also reached a shipped release before anyone saw it.
    related_tasks:
