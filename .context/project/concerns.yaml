    webdriver=false, UA=Chrome not HeadlessChrome) that was the operator''s

    live editor session. `browser_navigate` + `adoptImportedXml` loaded corpus

    maps over the operator''s unsaved document, destroying it. The agent did

    not verify browser isolation before mutating it. RCA:

    docs/reports/T-126-editor-workloss-rca.md.

    '
  evidence:
  - 'browser_evaluate 2026-07-06: navigator.webdriver=false; UA ''Chrome/149.0.0.0'' (not HeadlessChrome);
    doc reset to default investigate.bpmn after agent navigation.'
  - First browser_navigate errored 'Target page/context/browser has been closed' then reconnected —
    attachment to a persistent/shared browser, not a fresh isolated one.
  closure_evidence:
    verified: 2026-07-28 (T-271)
    status_note: READY FOR CLOSURE — operator to flip watching→resolved. Both trigger halves (learning
      + structural convention) exist.
    trigger_restated: A convention/guard ensures agent browser automation uses an ISOLATED headless
      context before any navigate/adoptImportedXml; captured as a learning and, ideally, a pre-flight
      check.
    evidence:
    - 'Learning recorded: learnings.yaml (PL-line ~124) — ''Verify browser-based editors in an ISOLATED
      headless context (own --user-data-dir), never a shared/live browser.'''
    - 'Convention is structural, not aspirational: every browser harness in tools/ (_*-cdp.mjs, 10+
      scripts) spawns its OWN chromium (--headless=new, mkdtemp --user-data-dir, killed + cleaned in
      finally) — none attaches to a shared/live browser. The T-238 hermetic-sidecar pattern is the standing
      template.'
