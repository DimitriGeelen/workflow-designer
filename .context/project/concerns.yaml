- id: G-026
  title: The task gate's EXEMPTION list is maintained by field discovery — three verb-by-verb fixes
    for one deadlock shape, each found by an agent hitting it live
  severity: medium
  status: watching
  registered: 2026-08-08
  detail: "`check-active-task.sh` blocks when `current_task` is null. Several framework\nverbs must\
    \ nonetheless run in that state, and each has been discovered the\nsame way: an agent hit the block\
    \ in the field, then a task was filed to add\nthat ONE verb to the allowlist.\n\n    T-2052   `fw\
    \ task create`   the gate's own advice is \"create a task\",\n                                which\
    \ the gate was refusing\n    T-2054   `git commit`       `--status work-completed` nulls focus,\
    \ but the\n                                completion's own file-move still needs committing\n \
    \   T-390    `fw note`,         completing a task nulls focus, and update-task.sh\n            \
    \ `fw context        prints a LEARNING PROMPT at that moment — the\n             add-*`,       \
    \     framework asks for a learning in the one state\n             `fw handover`      where its\
    \ gate refuses the command\n\nTHE SHAPE, stated once: the gate blocks the action its own advice\
    \ depends on.\nEvery instance is an action the framework itself prescribes as the response to\n\
    having just completed work — which is precisely the transition that nulls focus.\nThe deadlock is\
    \ not incidental to these verbs; it is generated by the state\nmachine, so more instances should\
    \ be expected rather than hoped against.\n\nWHY THIS IS ITS OWN GAP AND NOT THREE CLOSED TASKS.\
    \ Each fix worked and none\nwas wrong. What is unaddressed is the METHOD: the exemption list is\
    \ extended\nonly when someone is blocked by its absence, so its completeness is bounded by\nwhat\
    \ agents have happened to try. Between T-2054 (fixed) and T-390 (fixed\ntoday), `fw note` was unreachable\
    \ in the post-completion state and nothing\nreported it — the failure is silent by construction,\
    \ because a blocked capture\nverb produces no record of having been wanted.\n\nSIBLING OF G-025,\
    \ OPPOSITE POLARITY, and this is the useful part. G-025 is a\nDENY-list that cannot be closed by\
    \ enumeration because it cannot name every\ndangerous idiom. This is an ALLOW-list that cannot be\
    \ closed by enumeration\nbecause it cannot name every harmless one. Both are maintained by field\n\
    discovery; both fail silently; the deny-list fails toward permitting harm and\nthe allow-list toward\
    \ blocking work. Two enumerations, two directions, one\nstructural answer needed — a rule stated\
    \ over what a command DOES rather than\nwhat it is CALLED.\n\nNote the exemptions already share\
    \ an unstated predicate: every one of them\nwrites only under `.tasks/` or `.context/`, both of\
    \ which are ALREADY exempt\npaths for Write/Edit. The rule \"a command whose writes are confined\
    \ to\nalready-exempt paths does not require an active task\" would have admitted all\nthree without\
    \ anyone being blocked first. Stated as an observation, not a\nproposal — the hook is shared with\
    \ AEF and the predicate would need measuring\nbefore it could be trusted (a command's write-set\
    \ is not statically knowable\nin general, which is exactly the G-025 problem again).\n"
  decision_trigger: 'A framework verb that the framework itself prescribes as the response to completing
    work cannot be blocked by the completion of that work — enforced by a stated rule rather than by
