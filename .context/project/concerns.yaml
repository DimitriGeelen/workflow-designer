- id: G-002
  type: risk
  status: resolved
  resolved: 2026-07-11
  resolution: 'Operator flipped watching→resolved 2026-07-11 on evidence: both prevention halves shipped
    and green — T-187 (editor-internal round-trip fixed point) + T-188 (bridge→editor cross-seam clean
    across all 24 workflows, self-test reproduces T-042). The durable structural round-trip check the
    concern named now exists, replacing the linear per-aspect textual tests. Operator ratified the node+chromium-in-pytest-suite
    portability decision (Directive 4) the same day. See prevention_partial below for full evidence.

    '
  severity: medium
  title: 'Editor↔bridge aef: serialization seam guarded aspect-by-aspect, not by a round-trip harness'
  detected: 2026-07-03
  origin_task: T-053
  decision_trigger: 'A THIRD seam-drift incident (any aef: field where editor JS and bridge Python disagree
    on serialization), OR a human GO to adopt a JS-DOM round-trip harness (which introduces a node toolchain
    — a portability decision, Directive 4). Either resolves this by replacing the growing set of per-aspect
    textual tests with one structural round-trip check.

    '
  description: "The Workflow Designer editor (pure browser JS, src/aef-workflow-designer.html)\nand\
    \ the bridge (Python, tools/yaml-to-bpmn.py) independently serialize the\naef: extension namespace.\
    \ They can drift on ANY aspect of that encoding, and\nbecause each side is internally consistent,\
    \ each side's own test suite passes\n— the mismatch lives only in the cross-artifact (JS↔Python)\
    \ seam, exercised\nonly on the YAML→bridge→editor dogfooding path.\n\nConfirmed instances of this\
    \ class (2):\n  - T-042: editor import used a different aef: namespace URI than the bridge\n   \
    \ → byAef matched nothing, every aef:uid/position silently dropped.\n    Guarded by tests/test_editor_namespace_consistency.py\
    \ (T-044).\n  - T-053: editor read/wrote aef:decisionOutputs as a values=\"…\" attribute\n    while\
    \ the bridge emits element text → bridge BPMN opened in the editor\n    silently lost the decision\
    \ enum. Guarded by\n    tests/test_editor_extension_shape_consistency.py (T-053).\n\nCurrent mitigation\
    \ is aspect-by-aspect: each discovered drift dimension gets\nits own textual (stdlib, no-browser)\
    \ consistency test. This scales linearly\nwith dimensions and can only catch dimensions we've already\
    \ been burned by.\n\nDurable structural fix candidate: a single JS-DOM round-trip harness\n(bridge\
    \ YAML → BPMN → editor parseBpmnXml → editor buildBpmnXml → re-validate)\nthat would catch ALL serialization\
    \ drift at once. It requires a node/jsdom\ntoolchain in a project that is currently pure Python\
    \ + browser-Playwright —\na dependency/portability decision that must NOT be taken autonomously.\n"
  evidence:
  - T-042/T-044 and T-053 RCA sections; both fixes shipped with per-aspect cross-seam tests.
  - Behavioral proof for T-053 captured live via browser Playwright (parseBpmnXml/buildBpmnXml round-trip),
    not the missing automated harness.
  - 'Third instance of the class (2026-07-04, found during T-079 verification): editor-INTERNAL parse/build
    asymmetry — parseBpmnXml drops the bpmn:participant pool id/name, so every import→export cycle rewrites
    Pool_* to Process_*-derived values. Not an aef: field and not a bridge disagreement, so it does
    not mechanically fire the THIRD-incident trigger — but it was caught only by an ad-hoc in-browser
    round-trip check, which is precisely the harness this concern proposes. Filed as T-080.'
  prevention_partial:
    status: BOTH HALVES SHIPPED + GREEN (T-187 editor-internal, T-188 bridge→editor cross-seam). Human
      ratified the portability decision. READY FOR CLOSURE — operator to flip status watching→resolved.
    human_ratification: '2026-07-11 — operator approved decision 1(a): node+chromium wired into the
      pytest suite (skip-guarded), and 2(a): extend the harness to the bridge→editor cross-seam. This
      is the human portability decision the description (line 167) reserved — made, not bypassed.'
    shipped_by: T-187
    half2_shipped_by: T-188
    half2_result: 'T-188 (tools/_bridge-seam-roundtrip-cdp.mjs + tests/test_bridge_seam_roundtrip.py)
      runs the real bridge on all 24 examples/aef-processes/*.workflow.yaml, imports each into the real
      editor, and asserts no aef:uid or editor-known aef:meta is silently dropped, plus editor fixed-point
      on bridge output. Result: cross-seam CLEAN across all 24 workflows (620+ uids, zero drops). Self-test
      mangles the aef namespace URI (reproduces T-042) → detector reports 27/27 dropped uids, proving
      it bites. This is the durable structural fix this concern named (bridge YAML → BPMN → editor parse
      → editor emit → re-validate), replacing the per-aspect textual tests with a structural round-trip
      check.

      '
    note: 'T-187 (2026-07-11) shipped tools/_roundtrip-serialization-cdp.mjs + a pytest wrapper: a fixed-point
      harness that drives the REAL editor runtime (parseBpmnXml→buildBpmnXml) in isolated headless chromium
      over tests/fixtures/aef-bpmn/*.bpmn, with a self-test that perturbs a governance attr to prove
      the guard bites. All 4 fixtures round-trip byte- identically. This covers the EDITOR-INTERNAL
      round trip — structurally catches the instance-#3 class (T-080 pool-id drop) that the per-aspect
      textual tests cannot.

      '
    NOT_yet_covered: 'The BRIDGE→editor cross-seam (bridge YAML → yaml-to-bpmn.py emit → editor parse
      → editor emit → re-validate) — the JS↔Python drift that was this concern''s original motivation
      (instances #1 T-042 namespace, #2 T-053 decisionOutputs). T-187''s fixtures are editor emissions,
      not bridge emissions, so this half is unexercised. A follow-up would add a bridge-fed stage to
      the same harness.

      '
    human_decision_required: '(a) Ratify wiring node+chromium into the pytest suite (the reserved portability
      decision, Directive 4) — the T-187 wrapper skips cleanly when the toolchain is absent, so it does
      not hard-break pure-Python environments; and (b) whether to extend to the bridge→editor stage
      to fully close, or keep the two halves separate. Status stays `watching` until then.

      '
  related:
  - T-042
  - T-044
  - T-053
  - T-080
  - T-187
