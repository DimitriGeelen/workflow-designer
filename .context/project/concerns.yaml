- id: G-016
  type: gap
  status: watching
  severity: medium
  title: The export-safety instrument is DIFFERENTIAL — it compares two designer versions to each other,
    so a defect both versions share is byte-identical and therefore green
  detected: 2026-08-02
  origin_task: T-309
  decision_trigger: 'An input-fidelity check exists in the gating runner that compares the EXPORTED
    document against the INPUT document (counts of flow nodes, edges, lanes at minimum), over a population
    that deliberately includes documents the corpus does not contain — malformed input, out-of-vocabulary
    tags, unresolvable refs. Closing because "T-337 is fixed" is not closure: the fix removes one instance,
    the gap is that the next vocabulary divergence would be equally invisible.

    '
  progress: '2026-08-02, T-339. All three clauses of the trigger are now covered by tools/_t338-input-fidelity-cdp.mjs
    in the gating runner: out-of-vocabulary tags (10 shapes, T-338), malformed input (8 shapes, three-way
    REFUSED/PRESERVED/ SILENTLY-PARTIAL — losslessness is the WRONG expectation there, because refusing
    a broken document is correct behaviour), unresolvable refs (4 shapes, keyed on aef:uid because a
    display-id measure reads renumbering as loss). Results: 0 silently-partial, 0 identity lost, and
    both zeros are proven fillable rather than merely observed — teeth legs (f) and (g) mutate the DESIGNER
    and the buckets duly fill. NOT YET CLOSED, and status deliberately left at watching for the operator.
    Two findings the widening produced are open: T-340 (the whole standard bpmndi sub-tree is dropped
    on import, 24/24 — T-337''s class one granularity up) and T-341 (an unresolvable flowNodeRef silently
    re-homes the orphaned node to the human/sovereignty lane). The trigger''s own logic applies to itself:
    closing because the instrument now exists is the same move as closing because T-337 is fixed. Correction
    recorded: rail 394 reported T-338 as making "the next divergence would be equally invisible" false
    "regardless". That held for a vocabulary divergence and was unproven for the other two clauses,
    and the prose did not say which.

    '
  detail: 'Found while pricing T-309 IW-3. tools/_t308-export-byte-identity-cdp.mjs is the tree''s instrument
    for "this change has zero export surface", and T-309''s own assumption A-4 cites it as the technique
    for proving exactly that. It works by running buildBpmnXml(parseBpmnXml(map)) under the WORKING-TREE
    designer and under the designer at a git ref, then comparing the two outputs to EACH OTHER across
    the 24 rendered corpus maps.

    TWO BLIND SPOTS FOLLOW FROM THAT SHAPE, AND NEITHER IS A BUG IN THE TOOL — it does what it says.
    (1) A defect present in BOTH versions produces identical bytes and reports green; the instrument
    can only see CHANGE, never WRONGNESS. (2) Its denominator is 24 well-formed corpus maps, so any
