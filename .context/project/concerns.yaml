  - id: G-013
    type: gap
    status: watching
    severity: high
    title: "The recorded audit history is a SUBSET presented as a whole — every daily audit for weeks ran sections=structure (20 of 117 checks) and reported 20/0/0 clean"
    detected: 2026-07-31
    origin_task: T-320
    decision_trigger: >
      The audit trail records which SECTIONS ran alongside the pass/warn/fail
      counts at the point a human or agent reads them, AND either the daily/cron
      path runs the full check set or its partial scope is stated in the summary
      line itself rather than in a field nobody reads. A clean count whose scope
      is not in the same sentence is the defect. Then close G-013.
    description: |
      Found while wrapping T-320. `fw handover --commit` runs a pre-push audit that
      prints "Sections: structure" and a SUMMARY of 20 pass / 0 warn / 0 fail. That
      summary has been the reported end-of-session state for weeks, and it is a
      fifth of the check surface.

      Running the full audit on the same tree, same commit, same minute:

        structure-only (what every handover has reported)   20 pass /  0 warn /  0 fail
        full                                               117 pass / 22 warn / 55 fail

      Every recorded daily audit (.context/audits/2026-07-2x..3x.yaml) carries
      `sections: "structure"`. The hourly cron carries `sections: "oe-hourly"`.
      NEITHER recorded path has ever run the full set — today's is the first full
      audit in the recorded history. The 55 failures (all CTL-030: completed tasks
      carrying a stored `horizon` instead of null) are not new breakage. They have
      been true and invisible the whole time.

      WHY THE FRAMEWORK WAS BLIND, which is the part that matters more than the 55:
      this is not a missing check — the checks exist and pass/fail correctly. It is
      a SCOPE that never travels with its VERDICT. "20 pass, 0 fail" is a true
      statement about a subset, rendered in the same shape and place as a true
      statement about the whole, and read as the latter by every session including
      this one. I reported "audit 20 pass / 0 warn / 0 fail" to the operator earlier
      today on exactly that basis.

      Same failure family the whole T-316..T-320 arc has been documenting, now in
      our own observability rather than in a validator: a check that ran honestly,
      whose result was reported about a wider subject than it measured. Sibling of
      the AEF `file receive --replay` "SHA-256 verified" on the wrong object, of
      byte-size parity, and of the 0-of-113 dialect measurement taken over one side
      of a two-sided corpus.

      NOT FIXED HERE, DELIBERATELY. The audit's own priority action names an
      idempotent remedy for the 55 (bin/migrate-horizon-null-completed.sh, touches
      only completed/ files), but a 55-file bulk mutation is the operator's call and
      is not the gap. The gap is that the trend line said "No repeated issues in the
      last 14 days across 13 audits" while 13 of those 13 audits were scoped to a
      fifth of the checks.
    related:
      - T-320
      - G-019

  - id: G-014
    type: gap
    status: watching
    severity: medium
    title: "A leg of the GATING bridge runner can fail intermittently, and until T-326 the failing run discarded its own output — reproducible-only, never diagnosable"
    detected: 2026-08-01
    origin_task: T-326
    decision_trigger: >
      The nondeterminism in tests/test_bridge_seam_roundtrip.py is identified and
      removed (or shown to be environmental and bounded), evidenced by a repeat-run
      experiment large enough to have caught the observed rate. Closing on "we have
      not seen it lately" is exactly the failure mode this gap describes — the
      capture change makes a recurrence readable, it does not make the flake gone.
    detail: >
      tests/test_bridge_seam_roundtrip.py failed once inside tests/run-bridge-tests.sh
      (63 passed, 1 failed) during T-325's P-011 verification gate, then passed
      standalone and on immediate re-run of the identical command. Repeat-run
      experiment the same hour: 0/8 standalone, 0/5 in-suite. NOT REPRODUCED —
      recorded as a bound on the rate, not as an absence.

      Two distinct problems, and the second is the one that mattered:

      (1) The flake itself. Unidentified. First hypothesis is browser/resource
      contention — the harness drives a real Playwright chromium via
      tools/_bridge-seam-roundtrip-cdp.mjs and sibling legs in the same suite drive
      CDP too.

      (2) The runner DISCARDED the failing leg's output (`>/dev/null 2>&1`), so the
      one run that failed left no evidence of its own cause. Fixed in T-326: output
      is captured once and printed on failure only. Swept the whole file rather than
      the one site — two of three invocations discarded output outright, and the
      third RE-RAN the validator to have something to show, which is right exactly
      once: under any nondeterminism the second run can print a different, or clean,
      result than the run whose verdict is being explained.

      WHY THIS IS A GAP AND NOT JUST A TASK: an intermittent red in a GATING runner
      is dismissible as "just flaky", which is precisely how a real regression gets
      waved through. It also weakens every green — a suite that fails 1-in-N for
      unknown reasons is reporting a different, weaker claim than the one its summary
      line makes. Same family as G-013: a verdict whose reliability is not stated
      alongside it.
    related:
      - T-325
      - T-326
      - G-013

  - id: G-015
    type: gap
    status: watching
    severity: medium
    title: "75 verification blocks assert a GLOBAL, always-moving property — `diff src/aef-workflow-designer.html build/gallery/designer.html` — and all of them are red right now"
    detected: 2026-08-02
    origin_task: T-309
    decision_trigger: >
      Either the line is narrowed to assert what its task actually delivered (e.g.
      `grep -q "set-branch-pitch" build/gallery/designer.html` — the serve root
      carries THIS feature), or the convention is dropped in favour of a single
      tree-level freshness check that is not copied into per-task gates, AND
      tools/serve-gallery.sh grows a build-only path so the remedy does not require
      binding a port. Closing because "we rebuilt the gallery" is not closure — the
      line goes red again on the next edit to src, which is the property being
      reported.
    evidence_2026_08_02_T339: >
      A second, independent carrier of the same shape, found while answering AEF
      rail-396. Full scan of every ## Verification block (341 task files, 1292
      non-comment command lines): 18 lines reach the network, only 4 resolve the port
      from the watchtower triple file, and 11 HARD-CODE a literal port — 8 at :8834
      (the gallery port retired by T-253 behind ufw; connection refused today, exit 7)
      and 3 at :3000 (our own Watchtower, live and correct). All 11 sit in completed
      tasks, so nothing re-runs them, but every one is a gate pinned to a host-level
      fact rather than to what the task delivered — the same subject error as the
      diff line, with a different global.
      WHY THE POPULATION IS SMALL, STATED HONESTLY: AEF measured 371 lines of the
      mirror defect (literal localhost:3000, which on this host is OUR server, so
      their gates were passing against our pages — their T-165 was satisfied by our
      T-152 page). Ours number 11 because the port we happened to hard-code is either
      our own (passes correctly) or dead (fails red). Neither direction yields a
      silent false green. That is OCCUPANCY, not construction: nothing in the tree
      stops the next author writing :3001, and CLAUDE.md's ban on hard-coded ports is
      prose, read by nothing — exactly the status of AEF's own T-1376 ban.
      Measured: 0 verification command lines here reference :3001, so our gates have
      never been hitting AEF's server.
    detail: >
      Found while re-running T-093's verification during T-309 (9/10, line 8 red).
      The line is `diff -q src/aef-workflow-designer.html build/gallery/designer.html`.
      Scanned the class before concluding anything: 334 verification blocks, 1261
      non-comment lines, and this exact assertion (diff/cmp variants) appears in
      **75 tasks** — 72 completed, 3 active (T-093, T-102, T-105). It is red right
      now for all of them: build/gallery/designer.html is a Jul-28 snapshot, src was
      last edited Jul-31, 402 diff lines.

      WHAT IS WRONG IS THE SUBJECT, NOT THE PREDICATE. The intent is good and has
      history behind it — T-231 and T-252 both cost real time to "committed is not
      serving" (PL-046), and this line is the scar. But it asserts a property of the
      WHOLE TREE AT THIS MOMENT (serve root in sync with source), not a property of
      the task that carries it. It was true when written and decays the instant
      anyone else edits src. For a completed task that is harmless — the gate already
      passed and the file is archived. For a task sitting in the human review queue
      it converts "the human has not got to it yet" into "permanently red", which is
      exactly the T-178 shape (rail 384) in a reachable costume. T-093 has been
      partial-complete for 28 days with this line red for reasons that have nothing
      to do with T-093.

      THE REMEDY IS NOT FREE, WHICH IS THE PART THAT MAKES IT A GAP. The only tool
      that legitimately produces the artifact is tools/serve-gallery.sh, and it has
      NO build-only path: it does `rm -rf $OUT`, reassembles, then binds a port,
      starts gallery-serve.py and refuses to report success unless the running server
      answers /api/health (the T-231 behaviour probe, itself correct). Its default
      port is :8834, which is retired — ufw has no allow rule for it (T-253) and the
      firewall is the operator's boundary, not the agent's to change. So "just rebuild
      it" couples a per-task verification line to starting a server. Hand-copying only
      designer.html would green all 75 lines while leaving build/gallery/rendered/
      stale — a green that asserts less than it says, which is the class of defect
