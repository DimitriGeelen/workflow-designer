# Concerns Register — Unified gap and risk tracking (T-397)
# Type: gap (spec-reality) | risk (forward-looking)
# Status: watching | decided-build | decided-simplify | decided-defer | closed
concerns:
  - id: G-005
    type: gap
    status: watching
    severity: high
    title: "Editor has no document autosave — an authoring tool loses all unsaved work on any reload/navigation/crash"
    detected: 2026-07-06
    origin_task: T-126
    decision_trigger: >
      Editor (src/aef-workflow-designer.html) autosaves the current document
      (debounced) to localStorage on mutation and offers recover-on-load; a
      reload mid-edit restores the in-progress document. Then close G-005.
    description: |
      The editor persists only PREFERENCES to localStorage
      (aefViewPrefs/aefRoutingPrefs/aefSnapPrefs). The DOCUMENT itself lives
      solely in volatile browser memory until an explicit Save (which merely
      DOWNLOADS a .bpmn). Any reload, navigation, or crash loses all unsaved
      work with no recovery point — a Reliability-directive violation for an
      authoring tool. On 2026-07-06 this destroyed ~1 hour of operator layout
      work when agent Playwright automation navigated the live browser (see
      G-006). Full RCA: docs/reports/T-126-editor-workloss-rca.md.
    evidence:
      - "browser_evaluate: sessionStorage empty, indexedDB.databases()=[], no undo stack; localStorage held only *Prefs keys."
      - "src/aef-workflow-designer.html: localStorage.setItem only for aefRoutingPrefs/aefSnapPrefs/aefLabelPrefs/aefViewPrefs; btn-save downloads `${id}.v${v}.bpmn` (no persistence)."
    related:
      - T-126
      - G-006
  - id: G-006
    type: risk
    status: watching
    severity: high
    title: "Agent visual-verification drove a shared/live non-headless browser instead of an isolated context — destroyed operator state"
    detected: 2026-07-06
    origin_task: T-126
    decision_trigger: >
      A convention/guard ensures agent browser automation uses an ISOLATED
      headless context (or verifies the target page is disposable) before any
      navigate/adoptImportedXml. Captured as a learning and, ideally, a
      pre-flight check. Then close G-006.
    description: |
      The Playwright MCP was connected to a non-headless Chrome (navigator.
      webdriver=false, UA=Chrome not HeadlessChrome) that was the operator's
      live editor session. `browser_navigate` + `adoptImportedXml` loaded corpus
      maps over the operator's unsaved document, destroying it. The agent did
      not verify browser isolation before mutating it. RCA:
      docs/reports/T-126-editor-workloss-rca.md.
    evidence:
      - "browser_evaluate 2026-07-06: navigator.webdriver=false; UA 'Chrome/149.0.0.0' (not HeadlessChrome); doc reset to default investigate.bpmn after agent navigation."
      - "First browser_navigate errored 'Target page/context/browser has been closed' then reconnected — attachment to a persistent/shared browser, not a fresh isolated one."
    related:
      - T-126
      - G-005
  - id: G-004
    type: gap
    status: watching
    severity: high
    title: "Vendored Watchtower review blueprint breaks in shared-tooling mode — PROJECT_ROOT/lib vs FRAMEWORK_ROOT/lib"
    detected: 2026-07-05
    origin_task: T-090
    decision_trigger: >
      Upstream fixes web/blueprints/review.py:18 to insert FRAMEWORK_ROOT/lib
      (like every other blueprint's framework-asset access) and ideally adds a
      shared-mode smoke test (PROJECT_ROOT != FRAMEWORK_ROOT, GET each blueprint
      route, assert non-500). Then re-vendor here, DELETE the product-side shim
      lib/dispatch_pause.py, and close G-004.
    description: |
      review.py inserts PROJECT_ROOT/lib on sys.path before importing
      dispatch_pause (T-1810 helpers), but the module lives at
      FRAMEWORK_ROOT/lib/dispatch_pause.py. In the framework's own repo the two
      roots coincide, so the bug is invisible upstream; in every shared-tooling
      consumer, ALL /review/T-XXX pages 500 (ModuleNotFoundError) — here that
      silently severed the operator's entire 13-task review queue while every
      partial-complete task's Human AC steps pointed at those URLs. No health
      surface exercises /review routes, so nothing flagged it. Same
      shared-mode-blindspot class as the T-015 env contamination.
      Mitigation shipped (NOT prevention): product-side shim
      lib/dispatch_pause.py re-exports the framework module via the exact
      sys.path entry the buggy line inserts; documents its own removal
      condition.
    evidence:
      - "watchtower.log: ModuleNotFoundError: No module named 'dispatch_pause' at review.py:25 on every /review GET."
      - "T-090 RCA: buggy expression sys.path.insert(0, str(PROJECT_ROOT / 'lib')) at review.py:18; docs/cockpit/enforcement/quality blueprints all use FRAMEWORK_ROOT."
      - "T-091 (2026-07-05): upstream patch STAGED at docs/patches/T-091-0001-review-py-lib-path-framework-root.patch (git apply --check verified against vendored copy) + maintainer report docs/reports/T-091-upstream-shared-mode-fixes.md incl. shared-mode smoke test proposal; awaiting ring20 cascade (T-016) for delivery."
    related:
      - T-090
      - T-015
      - T-016
      - T-091
  - id: G-001
    type: gap
    status: watching
    severity: medium
    title: "fw vendor ships incomplete payload — required runtime files dropped to consumer projects"
    detected: 2026-06-05
    origin_task: T-011
    decision_trigger: >
      Upstream framework ships the missing files in the vendor payload (or makes
      the hook hard-fail on missing scanner); then re-vendor here and close G-001.
    description: |
      `fw vendor` / `fw init` ships an incomplete payload to consumer projects —
      required runtime files are silently omitted. This consumer hit it twice
      during bootstrap, and a sibling consumer hit the same class independently,
      so it is systemic (not a one-off packaging slip).

      Local instances (this project):
        - F2 — orchestrator-mcp-scan.sh expects
          .context/audits/orchestrator-mcp-baseline.yaml, which fw vendor does
          not copy → first audit FAILs on a fresh consumer. (consumer track: T-006)
        - F4 — pre-commit secret-scan.sh is absent from the vendor payload, so
          the secret scan SILENTLY SKIPS (a security control that no-ops is worse
          than one that's absent). Violates "no silent failures".

      This is an UPSTREAM fix — local edits to .agentic-framework/ are overwritten
      on re-vendor. Kept here so the gap stays visible in our register / Watchtower
      / audit until upstream ships the fix and we re-vendor. (Recording this was
      previously blocked by the F5 onboarding gate; now unblocked → recorded.)
    evidence:
      - "F2/F4 confirmed by code inspection during bootstrap (see docs/reports/T-006-*.md, framework-agent-pickup-2026-06-05.md §F2/§F4)."
      - "Cross-project corroboration: `[fan-dashboard → framework-agent] RCA: fw init vendoring drops required runtime files` on agent-chat-arc 2026-06-05T12:10Z — same class, different consumer."
      - "Pickup delivered to framework agent 9219671e28054458 (DM + chat-arc) 2026-06-05T10:32Z; no response yet (agent offline)."
    related:
      - T-006
      - T-007
      - docs/reports/framework-agent-pickup-2026-06-05.md

  - id: G-002
    type: risk
    status: resolved
    resolved: 2026-07-11
    resolution: >
      Operator flipped watching→resolved 2026-07-11 on evidence: both prevention halves shipped and
      green — T-187 (editor-internal round-trip fixed point) + T-188 (bridge→editor cross-seam clean
      across all 24 workflows, self-test reproduces T-042). The durable structural round-trip check
      the concern named now exists, replacing the linear per-aspect textual tests. Operator ratified
      the node+chromium-in-pytest-suite portability decision (Directive 4) the same day. See
      prevention_partial below for full evidence.
    severity: medium
    title: "Editor↔bridge aef: serialization seam guarded aspect-by-aspect, not by a round-trip harness"
    detected: 2026-07-03
    origin_task: T-053
    decision_trigger: >
      A THIRD seam-drift incident (any aef: field where editor JS and bridge
      Python disagree on serialization), OR a human GO to adopt a JS-DOM
      round-trip harness (which introduces a node toolchain — a portability
      decision, Directive 4). Either resolves this by replacing the growing set
      of per-aspect textual tests with one structural round-trip check.
    description: |
      The Workflow Designer editor (pure browser JS, src/aef-workflow-designer.html)
      and the bridge (Python, tools/yaml-to-bpmn.py) independently serialize the
      aef: extension namespace. They can drift on ANY aspect of that encoding, and
      because each side is internally consistent, each side's own test suite passes
      — the mismatch lives only in the cross-artifact (JS↔Python) seam, exercised
      only on the YAML→bridge→editor dogfooding path.

      Confirmed instances of this class (2):
        - T-042: editor import used a different aef: namespace URI than the bridge
          → byAef matched nothing, every aef:uid/position silently dropped.
          Guarded by tests/test_editor_namespace_consistency.py (T-044).
        - T-053: editor read/wrote aef:decisionOutputs as a values="…" attribute
          while the bridge emits element text → bridge BPMN opened in the editor
          silently lost the decision enum. Guarded by
          tests/test_editor_extension_shape_consistency.py (T-053).

      Current mitigation is aspect-by-aspect: each discovered drift dimension gets
      its own textual (stdlib, no-browser) consistency test. This scales linearly
      with dimensions and can only catch dimensions we've already been burned by.

      Durable structural fix candidate: a single JS-DOM round-trip harness
      (bridge YAML → BPMN → editor parseBpmnXml → editor buildBpmnXml → re-validate)
      that would catch ALL serialization drift at once. It requires a node/jsdom
      toolchain in a project that is currently pure Python + browser-Playwright —
      a dependency/portability decision that must NOT be taken autonomously.
    evidence:
      - "T-042/T-044 and T-053 RCA sections; both fixes shipped with per-aspect cross-seam tests."
      - "Behavioral proof for T-053 captured live via browser Playwright (parseBpmnXml/buildBpmnXml round-trip), not the missing automated harness."
      - "Third instance of the class (2026-07-04, found during T-079 verification): editor-INTERNAL parse/build asymmetry — parseBpmnXml drops the bpmn:participant pool id/name, so every import→export cycle rewrites Pool_* to Process_*-derived values. Not an aef: field and not a bridge disagreement, so it does not mechanically fire the THIRD-incident trigger — but it was caught only by an ad-hoc in-browser round-trip check, which is precisely the harness this concern proposes. Filed as T-080."
    prevention_partial:
      status: "BOTH HALVES SHIPPED + GREEN (T-187 editor-internal, T-188 bridge→editor cross-seam). Human ratified the portability decision. READY FOR CLOSURE — operator to flip status watching→resolved."
      human_ratification: "2026-07-11 — operator approved decision 1(a): node+chromium wired into the pytest suite (skip-guarded), and 2(a): extend the harness to the bridge→editor cross-seam. This is the human portability decision the description (line 167) reserved — made, not bypassed."
      shipped_by: T-187
      half2_shipped_by: T-188
      half2_result: >
        T-188 (tools/_bridge-seam-roundtrip-cdp.mjs + tests/test_bridge_seam_roundtrip.py) runs the
        real bridge on all 24 examples/aef-processes/*.workflow.yaml, imports each into the real
        editor, and asserts no aef:uid or editor-known aef:meta is silently dropped, plus editor
        fixed-point on bridge output. Result: cross-seam CLEAN across all 24 workflows (620+ uids,
        zero drops). Self-test mangles the aef namespace URI (reproduces T-042) → detector reports
        27/27 dropped uids, proving it bites. This is the durable structural fix this concern named
        (bridge YAML → BPMN → editor parse → editor emit → re-validate), replacing the per-aspect
        textual tests with a structural round-trip check.
      note: >
        T-187 (2026-07-11) shipped tools/_roundtrip-serialization-cdp.mjs + a pytest wrapper:
        a fixed-point harness that drives the REAL editor runtime (parseBpmnXml→buildBpmnXml)
        in isolated headless chromium over tests/fixtures/aef-bpmn/*.bpmn, with a self-test that
        perturbs a governance attr to prove the guard bites. All 4 fixtures round-trip byte-
        identically. This covers the EDITOR-INTERNAL round trip — structurally catches the
        instance-#3 class (T-080 pool-id drop) that the per-aspect textual tests cannot.
      NOT_yet_covered: >
        The BRIDGE→editor cross-seam (bridge YAML → yaml-to-bpmn.py emit → editor parse → editor
        emit → re-validate) — the JS↔Python drift that was this concern's original motivation
        (instances #1 T-042 namespace, #2 T-053 decisionOutputs). T-187's fixtures are editor
        emissions, not bridge emissions, so this half is unexercised. A follow-up would add a
        bridge-fed stage to the same harness.
      human_decision_required: >
        (a) Ratify wiring node+chromium into the pytest suite (the reserved portability decision,
        Directive 4) — the T-187 wrapper skips cleanly when the toolchain is absent, so it does
        not hard-break pure-Python environments; and (b) whether to extend to the bridge→editor
        stage to fully close, or keep the two halves separate. Status stays `watching` until then.
    related:
      - T-042
      - T-044
      - T-053
      - T-080
      - T-187

  - id: G-003
    type: gap
    status: watching
    severity: medium
    title: "Editor pointer-interaction paths have zero trusted-input test coverage — 2 field-found bugs in one day"
    detected: 2026-07-04
    origin_task: T-071
    decision_trigger: >
      A THIRD field-found pointer-interaction bug (click/drag/snap path broken
      while all gates stay green), OR a human GO for a small trusted-input
      interaction smoke suite (Playwright script driving real mouse events
      against the served designer: click-selects, drag-moves, endpoint-reanchor,
      port-pin). Shares the toolchain question with G-002's harness decision.
    description: |
      The designer's pointer pathways (click-to-select, node drag, endpoint
      drag/snap, port pinning) are exercised by no automated test. The bridge
      suite (31 checks) covers serialization statics; the visual-verification
      protocol covers rendered output. Both stayed green while:
        - T-069: stationary clicks selected nothing (zero-move drag re-render
          detached the element before its click event) — operator-found.
        - T-071: clientToSvg stretched axes independently and dropped the
          viewBox origin/letterbox, so endpoint body/port snapping never matched
          (nodeAt missed by ~404px on Y) and vertical drags ran off-speed —
          agent-found only because T-070's AC demanded a trusted-input check.
      Both bugs are of the class PL-006 warns about — synthetic dispatchEvent
      tests pass while real input fails. Interaction coverage must be trusted
      input (Playwright mouse) or it is not coverage.
    evidence:
      - "T-069 RCA (click swallow) and T-071 RCA (coordinate skew), both 2026-07-04."
      - "PL-006 learning: synthetic vs trusted click divergence, recorded at T-069."
      - "Counter-evidence for the fix's value: T-074's trusted-input verification caught a grid-snap dead-zone bug (toleranced grid missed proposals 7-10px from a multiple) BEFORE commit — the first time an interaction bug was found pre-field instead of by the operator. Ad-hoc trusted-input checks work; they are just not yet a standing suite."
      - "Further pre-field catches (2026-07-04, T-076/T-077): the 20-map before/after render sweep caught (1) a loop-leg regression on git-commit-flow (bar-only scoring let legs cross two task boxes) and (2) T-077's estimated-width label placement landing labels on other edges — both fixed before commit. The ad-hoc sweep harness (bbox-vs-polyline measurement in Playwright) is now the third distinct incarnation of the missing standing suite."
    related:
      - T-069
      - T-071
      - T-070

  - id: G-007
    type: gap
    status: watching
    severity: high
    title: "release-designer.sh has no immutability guard — re-running at an already-released VERSION silently mutates the artifact AEF has pinned"
    detected: 2026-07-16
    origin_task: T-197
    decision_trigger: >
      scripts/release-designer.sh refuses to overwrite an existing
      dist/aef-workflow-designer-<VERSION>.html whose bytes differ from src
      (fail-closed, with an explicit bypass for a deliberate re-cut), so a
      released+pinned version cannot change under a consumer. Then close G-007.
    description: |
      A release is a PROMISE to a consumer: version X means these exact bytes,
      forever. AEF vendors dist/aef-workflow-designer-0.2.0.html and verifies
      it by sha256 (e301986b…) per docs/aef-designer-integration-protocol.md;
      the mapping standard's own versioning section cites that sha as the
      editor state v1.1 was validated against. Nothing enforces the promise.

      scripts/release-designer.sh:29 does an unconditional `cp "$SRC"
      "$ARTIFACT"`. There is no check that $ARTIFACT already exists, and no
      check that its bytes match. So: edit src, re-run the script WITHOUT
      bumping VERSION, and dist/aef-workflow-designer-0.2.0.html is silently
      rewritten with different content, MANIFEST.yaml's sha256 is rewritten to
      match the mutation, and every downstream guard reports green — because
      each guard verifies internal self-consistency (artifact == src, manifest
      == artifact), never immutability-vs-history. The two "deterministic"
      guarantees in the script's own header ("same source + same VERSION =>
      byte-identical artifact") hold only if source never changes at a fixed
      VERSION, which is precisely the condition nothing checks.

      Consequence for the consumer is silent and asymmetric: AEF's pin verify
      fails against a version they never asked to change (a mystery integrity
      error on their side, cause invisible from their repo), or worse they
      re-pin to a mutated "0.2.0" and two parties now mean different bytes by
      the same version string — the exact cross-implementation ambiguity the
      byte-validation work (T-193, PL-033) exists to prevent.

      This is not hypothetical, and that is why it is filed now rather than
      noted: T-197 (retire the node-owner override from the editor UI) is the
      first change to src since 0.2.0 shipped. Its render gate
      (tests/test_designer_render.py) resolves its artifact from the VERSION
      file, so T-197 is only verifiable by producing a build — putting the
      unguarded `cp` directly on the next task's happy path, with a pinned
      consumer downstream. src currently still matches dist 0.2.0 byte-for-byte,
      so the mutation has NOT yet occurred; the guard wants to land before the
      first src change, not after.

      Severity high on Reliability (a silent, consumer-visible integrity break
      with no local signal) and Portability (a version string that does not
      denote fixed bytes is not a portable contract).
    evidence:
      - "scripts/release-designer.sh:29 `cp \"$SRC\" \"$ARTIFACT\"` — unconditional; no `[ -f \"$ARTIFACT\" ]` existence/equality guard anywhere in the script (verified by grep for exists/already/immutab/overwrit)."
      - "The script's post-cp `diff -q \"$SRC\" \"$ARTIFACT\"` compares the copy to its own source — it can never fail, and proves nothing about prior released bytes."
      - "MANIFEST.yaml is regenerated from the (possibly mutated) artifact: `SHA=$(sha256sum \"$ARTIFACT\")` — the manifest follows the mutation instead of catching it."
      - "Pinned consumer confirmed: dist/aef-workflow-designer-0.2.0.html sha256 = e301986b993baf58d5ed29ed25436d94b08ed2be910c6781b0f4b906c25c153a, cited in docs/standards/aef-bpmn-mapping-v1.md:164 and vendored by AEF per the integration protocol."
      - "Current state is clean: `diff -q src/aef-workflow-designer.html dist/aef-workflow-designer-0.2.0.html` matches, so 0.2.0 is still reproducible from src — the window to add the guard is now."
      - "Render gate couples src changes to a build: tests/test_designer_render.py:_resolve_build() reads VERSION → dist/aef-workflow-designer-<VERSION>.html, with no artifact override, so verifying any src change requires cutting a build."
    related:
      - T-197
      - T-178
      - T-174
