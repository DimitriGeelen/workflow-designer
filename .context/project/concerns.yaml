- id: G-037
  type: gap
  status: watching
  severity: high
  title: The agent's measuring instrument and the framework's execution environment are different programs
    -- `grep` in the agent tool shell is a ugrep shim, every gate/hook/script runs GNU grep, and the substitution
    changes BOTH the pattern language and the set of files a recursive sweep reads
  detected: 2026-08-12
  origin_task: T-460
  context: "`grep` in the agent's interactive tool shell is a SHELL FUNCTION that routes to ugrep 7.5.0.\
    \ Every subshell, script, hook and P-011 verification leg runs /usr/bin/grep (GNU). The two disagree\
    \ on regex semantics \u2014 most sharply on an unescaped mid-pattern `$`, which GNU grep reads as\
    \ a literal (documented, correct) and ugrep reads as an anchor. Same command, same file, same second:\
    \ 1 versus 0. Direction of harm is a FALSE ABSENCE: the shim's extra anchoring makes patterns match\
    \ LESS, so agent-side sweeps under-report, and the sentence it corrupts is \"I searched and found\
    \ nothing\" \u2014 which is the load-bearing sentence of every census, sweep and negative finding\
    \ this project has produced. It is invisible by construction: not on $PATH, absent from `command -v`\
    \ in every shell that matters, visible only to `type -t grep` in the one shell that has it, and the\
    \ code is correct in both trees so no amount of reading finds it. This is a third distinct way for\
    \ an instrument to report something other than what it means, beside G-034 (verdict computed from\
    \ an empty population) and G-035 (instrument with no live caller).\n\nSECOND AXIS (2026-08-12, reported\
    \ by AEF at rail 572, verified here before acceptance). The same shim also passes `--ignore-files`,\
    \ so an agent-side `grep -r` and a gate-side `grep -r` read a DIFFERENT SET OF FILES. Same direction\
    \ of harm -- false absence -- but it needs no unusual pattern to fire, which makes it the worse of\
    \ the two: the `$` divergence at least requires you to write a `$` in a pattern, whereas any recursive\
    \ sweep over a repo silently skips every gitignored path. So the class has two faces, and naming only\
    \ one of them would leave the register describing a special case as if it were the whole thing: instrument\
    \ and subject differ in SEMANTICS (which pattern language) and in INPUTS (which files). The divergence\
    \ is RECURSION-ONLY -- an explicitly named file and a shell glob are read identically by both -- and\
    \ that bound is load-bearing, because it means `grep pattern file` is trustworthy and only `grep -r`\
    \ is suspect. AEF attributed the effect to `--ignore-files --hidden -I --exclude-dir=.git`; measured\
    \ here, `--hidden` REDUCES the divergence (hidden files appear on both sides) and `--ignore-files`\
    \ is the flag that does the damage."
  evidence:
  - 'T-460: `grep -c ''case "${OUT%/}" in'' tools/serve-gallery.sh` returns 0 through the agent shell
    and 1 through /usr/bin/grep. Same pattern, same file.'
  - '`type grep` in the agent tool shell prints a function body referencing CLAUDE_CODE_EXECPATH and /root/.local/bin/claude;
    `grep --version` there reports ugrep 7.5.0.'
  - "`bash -c 'type -t grep; command -v grep'` returns `file` and `/usr/bin/grep` \u2014 the shim exists\
