# Framework Patterns — Seeded by fw init
# Universal patterns learned from 96+ tasks of framework development.
# scope: universal — applies to all projects using the framework
# scope: project — specific to the originating project (not seeded)
#
# To add a project-specific pattern: fw context add-pattern <type> "name" --task T-XXX
# Universal patterns are synced from the framework via: fw governance sync (planned)

failure_patterns:
  - id: FP-003
    pattern: "dependency-version-conflict"
    description: "Package version conflicts prevent installation when project has pinned dependencies"
    scope: universal
    inherited_from: framework
    learned_from: T-026
    mitigation: "Use built-in libraries or vendored dependencies to avoid version conflicts"

  - id: FP-004
    pattern: "Context exhaustion before handover"
    description: >
      Agent outputs consume context faster than expected. Handover generated as skeleton
      with [TODO] placeholders is useless for recovery.
    scope: universal
    inherited_from: framework
    learned_from: T-059
    mitigation: "Token-aware monitoring from JSONL transcript. Commit early and often. Generate handovers AFTER work, not before."

  - id: FP-005
    pattern: "Plugin authority override bypasses framework governance"
    description: >
      Third-party plugins using authority-claiming language ('YOU MUST', 'BEFORE ANY response')
      override framework rules. Skills rarely reference task creation.
    scope: universal
    inherited_from: framework
    learned_from: T-061
    mitigation: "Instruction precedence in CLAUDE.md, PreToolUse structural gate, plugin audit tool"

  - id: FP-006
    pattern: "Premature task closure with post-closure drift"
    description: >
      Task marked work-completed before all work is done. Subsequent commits reference
      a closed task. Episodic snapshot freezes at premature closure time.
    scope: universal
    inherited_from: framework
    learned_from: T-112
    mitigation: "Acceptance criteria gate in update-task.sh. Closed task commit warning in commit-msg hook."

  - id: FP-007
    pattern: "Silent error bypass"
    description: >
      Agent encounters an error and silently switches to an alternative approach without
      investigating the root cause. The original error may indicate a deeper problem.
    scope: universal
    inherited_from: framework
    learned_from: T-118
    mitigation: "CLAUDE.md error investigation protocol: STOP, investigate, report, fix, then proceed."

  - id: FP-008
    pattern: "vendored-code-without-data"
    description: "Issue resolved in T-262"
    learned_from: T-262
    date_learned: 2026-07-27
    mitigation: "AEF delivered both reviewer policy files via file_send (rail 234, their T-2636): anti-patterns.yaml sha 04f89678 + escalation-patterns.yaml sha 7ebf939d; installed project-local per the code's vendored-consumer fallback path"

  - id: FP-009
    pattern: "retest-link-unreachable-pinned-old-code"
    description: "Issue resolved in T-293"
    learned_from: T-293
    date_learned: 2026-07-29
    mitigation: "Field failure was environmental: operator-reachable designers all serve pinned 0.7.1 (predates fix) and :8834 has no ufw allow rule (T-253 class). Code fix verified 12/12 zoom legs + 8/8 served real-click legs. Remedy: cut 0.8.0 + rail announce for re-pin; ufw allow is operator-only."

  - id: FP-010
    pattern: "Two hand-copied implementations of one algorithm feeding one enforcement decision: the copy that does not fire drifts unnoticed. budget-gate.sh (PreToolUse, blocking) and checkpoint.sh (PostToolUse, warning) each carried an inline transcript scan; budget-gate gained the T-2322 compact_boundary reset and checkpoint never did, so the fallback gauge was silently a version behind the gate it backs up."
    description: "Two hand-copied implementations of one algorithm feeding one enforcement decision: the copy that does not fire drifts unnoticed. budget-gate.sh (PreToolUse, blocking) and checkpoint.sh (PostToolUse, warning) each carried an inline transcript scan; budget-gate gained the T-2322 compact_boundary reset and checkpoint never did, so the fallback gauge was silently a version behind the gate it backs up."
    scope: project
    learned_from: T-401
    date_learned: 2026-08-09
    mitigation: "Extract to one implementation with both callers (lib/context_tokens.py) rather than patching both copies — patching leaves the drift class alive and there is simply a third divergence later. Level C, not Level A."

  - id: FP-011
    pattern: "Capture-without-application: a correct, specific, actionable learning is recorded and nothing ever revisits it. PL-025 named two live gate defects and prescribed the exact remedy on 2026-07-10; its application field read TBD and the defects stayed live for 30 days, until they blocked five read-only commands in one resume and had to be re-derived from scratch. Census: 113 of 118 learnings sit at application TBD, so the field cannot distinguish applied from unapplied — there was no signal to miss."
    description: "Capture-without-application: a correct, specific, actionable learning is recorded and nothing ever revisits it. PL-025 named two live gate defects and prescribed the exact remedy on 2026-07-10; its application field read TBD and the defects stayed live for 30 days, until they blocked five read-only commands in one resume and had to be re-derived from scratch. Census: 113 of 118 learnings sit at application TBD, so the field cannot distinguish applied from unapplied — there was no signal to miss."
    scope: project
    learned_from: T-404
    date_learned: 2026-08-09
    mitigation: "Registered as G-028. Do not treat draining the backlog as the fix: the defect is that an inert field is the only thing between a correct finding and a month of silence. When a task's creation surfaces a related learning, READ IT before investigating — the framework printed PL-025 at T-404 creation and it was nearly scrolled past."

  - id: FP-012
    pattern: "Authorship inferred from document CONTENT rather than from a producer field: three live instances in one tree (T-361 trailer prefix as an is-this-ours proxy, the T-372 provably-foreign criterion, readDocComment treating a leading comment that opens with our prefix as our own boilerplate). All three were correct while the corpus held only our own output, and the third-party intake falsified them together."
    description: "Authorship inferred from document CONTENT rather than from a producer field: three live instances in one tree (T-361 trailer prefix as an is-this-ours proxy, the T-372 provably-foreign criterion, readDocComment treating a leading comment that opens with our prefix as our own boilerplate). All three were correct while the corpus held only our own output, and the third-party intake falsified them together."
    scope: project
    learned_from: T-399
    date_learned: 2026-08-09
    mitigation: "Answer identity with a field ABOUT the producer, preferring one the standard already defines; where no such field exists, use a cryptographic fingerprint as tools/rail-sweep.py does. Add an anti-vacuity assertion per identity arm, because a scope test that resolves nothing produces output indistinguishable from a clean tree."

  - id: FP-013
    pattern: "Identity keyed on a property the system itself moves"
    description: "Identity keyed on a property the system itself moves"
    scope: project
    learned_from: T-409
    date_learned: 2026-08-09
    mitigation: "Key exemption/scope records on the artifact's IDENTITY (basename, ID, content sha) and never on a location the framework mutates as part of normal lifecycle. Instances: T-409 (baseline keyed on .tasks/active vs completed relpath; work-completed moves the file), T-399 (scope had to key on ledger path while exemption keyed on sha, so a re-export drops back under the live rule), PL-083 (a verification line pinning a CURRENT pointer as a stand-in for a delivered property). Test for it by performing the framework's own move in the harness, not by editing content in place."

  - id: FP-014
    pattern: "An instrument matched the TOKENS of the property it was testing instead of the property: -eq 0 near exit 1 read as an abstention guard when it was the ordinary verdict line, which fires on NON-zero. Same shape as grepping a commit MESSAGE for a task id to decide whether the task advanced (AEF 529 §3). Name: mention-vs-instance."
    description: "An instrument matched the TOKENS of the property it was testing instead of the property: -eq 0 near exit 1 read as an abstention guard when it was the ordinary verdict line, which fires on NON-zero. Same shape as grepping a commit MESSAGE for a task id to decide whether the task advanced (AEF 529 §3). Name: mention-vs-instance."
    scope: project
    learned_from: T-429
    date_learned: 2026-08-11
    mitigation: "Key the predicate on the structure that carries the meaning — operator AND connective together, and the region a test actually GOVERNS rather than the lines near it. Keep the token-identical negative row in the fixture permanently."

  - id: FP-015
    pattern: "Simulating 'nothing ran' by disabling ONE recorder leaves the other recorders counting"
    description: "Simulating 'nothing ran' by disabling ONE recorder leaves the other recorders counting"
    scope: project
    learned_from: T-430
    date_learned: 2026-08-11
    mitigation: "Neuter every increment-bearing helper, not the first one found — otherwise a suite with any real failure never reaches the zero-branch and the simulation silently measures nothing"

  - id: FP-016
    pattern: "A gate's real-AC counter counts the template's own commented example checkboxes, so the zero-AC half can never fire"
    description: "A gate's real-AC counter counts the template's own commented example checkboxes, so the zero-AC half can never fire"
    scope: project
    learned_from: T-453
    date_learned: 2026-08-12
    mitigation: "Strip HTML comments before counting, as the sibling G-067 gate in the same file already does at :539. Measured on the SHIPPED template: REAL_AC_COUNT=4, placeholders=2 - delete the 2 placeholder lines (the literal instruction in the block message) and the gate passes over zero acceptance criteria."

success_patterns:
  - id: SP-001
    pattern: "Phased implementation"
    description: "Breaking large changes into numbered phases improves traceability and reviewability"
    scope: universal
    inherited_from: framework
    learned_from: T-014
    context: "5-phase audit improvement was easier to review and commit"

  - id: SP-002
    pattern: "Hybrid agent architecture"
    description: "Bash scripts for mechanical work + AGENT.md for intelligence guidance"
    scope: universal
    inherited_from: framework
    learned_from: T-002
    context: "Scripts are reliable and portable, AGENT.md provides judgment guidance"

  - id: SP-003
    pattern: "Commit early, commit often"
    description: >
      Frequent commits preserve work even when session context is lost.
      Each commit is a recovery point.
    scope: universal
    inherited_from: framework
    learned_from: T-059
    context: "Despite losing all context, all code changes were preserved because phases were committed before exhaustion"

  - id: SP-004
    pattern: "Graduated enforcement: detect-then-prevent"
    description: >
      Build detective controls first (audit), then preventive controls (hooks/gates).
      Evidence from detective controls justifies and shapes preventive ones.
    scope: universal
    inherited_from: framework
    learned_from: T-061
    context: "Investigation (detective) provided evidence for PreToolUse hook (preventive). Both layers needed."

  - id: SP-005
    pattern: "Trap-pin an AC on the SUBJECT population, not just the verdict"
    description: "Trap-pin an AC on the SUBJECT population, not just the verdict"
    scope: project
    learned_from: T-454
    date_learned: 2026-08-12
    context: "Added via context agent"

antifragile_patterns:
  - id: AF-001
    pattern: "Failure-driven capability acquisition"
    description: >
      System failures trigger post-mortems that lead to capabilities that didn't exist before.
      The system becomes stronger than if the failure never occurred.
    scope: universal
    inherited_from: framework
    learned_from: T-059
    trigger: "Session context exhaustion with stale handover"
    capability_gained: "Real-time context budget monitoring with graduated warnings"
    directive: D1

workflow_patterns:
  - id: WP-001
    pattern: "Task absorption"
    description: "Related small tasks can be absorbed into a larger coherent task"
    scope: universal
    inherited_from: framework
    learned_from: T-013
    example: "Multiple small tasks absorbed into a single coherent agent task"

  - id: WP-002
    pattern: "Experiment protocol: baseline-disable-measure-restore"
    description: >
      To validate that an enforcement mechanism is load-bearing: establish a baseline metric,
      disable the mechanism, perform operations, measure degradation, restore the mechanism.
    scope: universal
    inherited_from: framework
    learned_from: T-024
    example: "Disabled git hook, made 5 commits, traceability dropped 97% to 88%. Proved hooks are load-bearing."
  - id: WP-003
    pattern: "Emit witnesses, not counts, in any finding that can fire on more than one item"
    description: "Emit witnesses, not counts, in any finding that can fire on more than one item"
    scope: project
    learned_from: T-330
    date_learned: 2026-08-01
    context: "Added via context agent"
  - id: WP-004
    pattern: "Before shipping a fix, ask what else was only visible through the population it empties"
    description: "Before shipping a fix, ask what else was only visible through the population it empties"
    scope: project
    learned_from: T-331
    date_learned: 2026-08-02
    context: "Added via context agent"
