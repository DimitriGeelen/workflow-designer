  context: Added via context agent
  application: TBD
- id: PL-169
  learning: "A search anchor that describes a defect will be found inside the artifact documenting that defect. Four instances this session: a P-011 leg matching its own explanatory comment (T-468), a stale-phrase leg that would have matched the correction quoting the phrase (T-470, caught pre-write), and a tick script whose '### Human' anchor matched the task description explaining the '### Human' bug (T-470, corrupted the file). Remedy: anchor on STRUCTURE (heading position, after-frontmatter offset) not on a bare string that prose is free to contain."
