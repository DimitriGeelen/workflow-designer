- id: PL-147
  learning: "An enforcement artifact cannot be verified by the process that installs it — verification must cross a boundary (session, repo, or install). Measured twice on the same day: T-420's gate was inert to the session that registered it (Claude Code snapshots hook config at session start) and fired correctly in the successor; AEF's check-onboarding-gate has 38 green legs that all execute in the repo with ZERO onboarding tasks, and is unregistered in every consumer where the guarded thing exists. A green suite and an unreachable gate are the same observable. The in-process test that IS answerable: not 'does the gate block?' but 'is the gate registered where the guarded thing exists?'"
  source: P-001
  task: T-420
  date: 2026-08-10
  context: Added via context agent
  application: TBD
- id: PL-148
  learning: "An instrument's REGISTRATION must be asserted by something other than the instrument. A green test suite proves the decision logic and says nothing about reachability, and from inside the suite the two are the same observable. Three instances across two projects: AEF's check-onboarding-gate (38 green legs, zero onboarding tasks in the repo, unregistered in every consumer), 832's T-420 gate (inert to the session that registered it), and 832's T-421 detector (registered NOWHERE — its only call site was its own task's P-011 block, which stops running at completion; it has been exiting 1 into a void). Remedy: assert registration as a SEPARATE verification command from behaviour, and state reachability as an explicit LIMIT in the instrument's own output so a green run cannot imply coverage it does not have."
  source: P-011
