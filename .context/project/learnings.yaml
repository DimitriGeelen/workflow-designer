- id: PL-095
  learning: "A before/after comparison run in a state where the subject does NOTHING returns identical and proves nothing. T-343's first write-equivalence check compared card-tree shas on the stock registry and reported identical:YES — but enrich writes zero cards in that state, so the shas would have matched had edge-writing been broken outright. Re-run with a card registered so enrich genuinely wrote (5 cards, 4 forward + 4 reverse edges), the comparison could fail and didn't. Ask what an equivalence check would have said if the change had been catastrophic; if the answer is 'the same', it is not a check."
  source: P-001
