- id: PL-237
  learning: "A defect whose visibility requires TWO conditions to co-occur is unfalsifiable under single-condition testing, and the natural minimal fixture is the single-condition one. audit.sh appended to one shared details list from two threshold branches and printed one branch's COUNT against it; with only the fail tier populated the shared list IS the fail list and the line is internally consistent, so any test, any reading, any operator glance at a single-tier queue confirms correctness. The remedy is not a better assertion but a stimulus that guarantees co-occurrence — the T-534 teeth drive all three tiers on every run rather than accepting whatever shape the live queue happens to have. Ask of any new probe: what has to be true SIMULTANEOUSLY for this defect to show, and does my fixture force it?"
  source: P-001
