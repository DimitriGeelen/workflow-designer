- id: PL-174
  learning: "SUPERSEDES the T-478 backtick learning, which was wrong. A P-011 leg is not mangled by backticks: our gate is a single eval (update-task.sh:1101) and single quotes protect backticks (measured by AEF, rail 593). The real mechanism is update-task.sh:978-983, which strips HTML comment SPANS from the Verification block before executing it — so any live command containing '<!--' ... '-->' as literal data loses its middle. Rule: a P-011 leg must not contain an HTML comment span; anchor on a fragment without '<!--'. The general form is the one this session kept finding — a stripper that matches a token without asking which sense of it, applied to content the consumer EXECUTES."
