- id: PL-182
  learning: "REACHABILITY IS NOT BINARY: between 'runs on a schedule' and 'nothing can run it' sits UNWATCHED — a live call path exists but only fires when somebody asks. T-451's unwired-guard census was reachable solely through the on-demand G-034 gap gauge, so it correctly measured a growing backlog for weeks and reported to nobody; T-490 and T-448 were both found by hand in that interval and the census had both the whole time. A binary reached/unreached model calls this either 'reached' (hiding that nobody watches) or 'unreached' (false, there IS a caller), and both answers lose the thing that matters. Corollary on wiring: an instrument that exits non-zero on a real pre-existing backlog cannot have its raw exit code wired into a suite — the suite goes permanently red and the red carries no information. Gate on MOVEMENT against a derived baseline instead, failing in BOTH directions: growth means a guard just went dark, and shrinkage means the baseline now lies. PL-004 prescribed exactly this ('legacy allowlist WITH stale-entry detection') and only the allowlist half was ever built; without the stale half a baseline decays into permanent amnesty, which is a hand-typed denominator wearing a different hat. Meta, and the expensive part: this task was FILED on the claim that no such census existed. It did, it was better than the replacement I started, and I found it only because my draft's own orphan list printed its filename. Verify the premise against the tree before building what a task says is missing (PL-023) — the cost of not checking was two wrong population definitions and a bogus '115 orphans' headline; the cost of checking was one grep."
