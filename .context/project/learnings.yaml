  learning: "P-011 Verification runs each line as its OWN shell under set -u — a variable set by out=$(...) on one line is unbound on any LATER line (echo \"$out\" → 'out: unbound variable', command fails, completion blocked). Distinct from the L-387 SIGPIPE / T-2090 single-pipe hints (those are about pipes). Fix: make each Verification line self-contained — grep -q PAT file directly, no cross-line $out. Hit 2x same session (T-219, T-220)."
