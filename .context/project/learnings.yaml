- id: PL-158
  learning: "A guard must DERIVE its checked set from the authority it guards, not restate it. T-365: the fixture paths named normatively in the frozen two-party standard are extracted BY READING the standard at check time, not hard-coded in the guard. A guard that hard-codes 'inception-gonogo.bpmn' restates the standard instead of following it — revise the standard and the guard still passes on a promise nobody makes any more, and the direction of failure is silent. Derived extraction also makes the guard demand the NEW path after a legitimate revision, which is the correct direction. Corollary: pair it with an abstention exit, because an extraction that silently stops matching yields zero findings and reads as clean."
  source: P-001
  task: T-444
  date: 2026-08-11
  context: Added via context agent
  application: TBD
- id: PL-159
  learning: "A bar stated in a failure-message string is not a bar the instrument holds: _t436 leg A tested rows==0 while naming count-equality in its FAIL text, so register and probe demanded different things for as long as both existed. It survived because the local tree can only occupy ONE state of the machine - with the vendored file unfixed, leg A is pinned at 0 and the other arms are unreachable, and an arm that has never fired is indistinguishable from one that cannot. Drive every state from fixtures through the real entry point. Second half: check a peer report against your own artifact BEFORE repairing it - AEF's claim that G-032's closure condition was satisfiable was wrong, and building the repair would have recorded a fix for a defect that was not there."
  source: P-001
  task: T-445
  date: 2026-08-11
  context: Added via context agent
  application: TBD
- id: PL-160
  learning: "A control that fails to place itself reports the same thing as a subject that cannot be moved. Twice in T-440 the poisoned control copy never landed where the instrument looked — first because emptying a parent directory deleted the child the poison was written into, then because the poison sat only at each population's top level while probes read subdirectories. Both times every instrument came back 'CANNOT-DRIVE: emptying the tree changes nothing', which is exactly what a genuinely sealed instrument looks like. When a control run and a null result are indistinguishable, verify the control landed before believing the null."
  source: P-001
  task: T-440
  date: 2026-08-12
  context: Added via context agent
  application: TBD
- id: PL-161
  learning: "A '## Verification' block is a ONE-SHOT COMPLETION GATE, not a standing guard. P-011 runs it on the work-completed transition and at no other time, so an instrument whose only call site is a Verification block runs exactly once and then sits in .tasks/completed/ still reading as a live call site to any grep. Both halves are silent: the guard cannot go red, and its not-going-red looks like evidence. Measured 2026-08-12 across 832: 30 of 154 tools read as standing guards with no caller that re-executes, 11 referenced by no task at all. The load-bearing instance was the operator's approvals-queue guard, which last ran 2026-07-22 at 0 NO-REC while the queue regrew to 14. PL-148 named this mechanism from three anecdotes a month earlier; what was missing was a denominator, so its prescribed remedy was applied to the three files that motivated it and nowhere else. Remedy: wire standing guards to something that re-executes (hook, cron, tests/, tool-chain, or a gap closure_check_command) and derive the unwired count rather than asserting it."
  source: P-011
  task: T-451
  date: 2026-08-12
  context: Added via context agent
  application: TBD
- id: PL-162
  learning: "When measuring a class, enumerate from the POPULATION side, never the caller side. My first count of unwired instruments was 39, taken from the callers (tools named by some completed task, minus those with a live caller). That query structurally cannot see an instrument NO caller references at all, and 11 were invisible to it by construction; the population-side census (tools/* on disk) found them. A caller-side denominator silently excludes exactly the worst cases - the fully orphaned ones - and it reads as a complete measurement. Same wrong-authority defect as PL-158, committed inside the measurement of that defect."
  source: P-011
  task: T-451
  date: 2026-08-12
  context: Added via context agent
  application: TBD
- id: PL-163
  learning: "An exemption channel in a census is a fake-progress channel unless the closure condition forbids it. The T-451 census excuses *-teeth and *-mutation-check by NAMING CONVENTION, which means the findings count can be lowered by renaming a file rather than wiring one. G-035's trigger therefore requires any drop in FINDINGS to be matched by a RISE in live-callable, not by a rise in the excused column. General form: whenever a verdict has a legitimate 'does not count' bucket, state what must move in the OTHER direction, or the bucket becomes the cheapest way to go green."
  source: P-011
  task: T-451
  date: 2026-08-12
  context: Added via context agent
  application: TBD
- id: PL-164
  learning: "Prose ABOUT a string-matching gate reliably contains the string the gate matches on - so a task describing the gate is unfileable. Live instance 2026-08-12: I quoted G-020's own block message inside a genuine acceptance criterion; the message contains the placeholder token G-020 greps for, so the gate read a fully-written AC block as placeholders. AEF reported this exact class at rail 554 (their OBS-233 quoting 'status: pending' and pushing their own count 118->119), I replied at 558 that 'grep the text you are about to file, first' was now how I file, and I committed it 48 hours later. Two independent trees, one class, near-zero behavioural transfer from reading it. What catches it is the number or the block looking wrong, never recall - so the durable remedy is a gate that parses structurally (strip HTML comments, distinguish an AC line from prose quoting one), not an agent that remembers."
  source: P-011
  task: T-452
  date: 2026-08-12
  context: Added via context agent
  application: TBD
- id: PL-165
  learning: "A gate that cannot accept a refusal does not enforce rigour, it buys compliance. _norec-verify accepted GO/NO-GO/DEFER, so a task where WITHHOLDING a recommendation was the correct agent behaviour (a sovereignty question my own brief had ruled operator-only) could satisfy the gate only by manufacturing a verdict. I did exactly that, re-tokenising a superseded proposal to GO, and caught it only because the two positions were five days apart and I checked the dates. Remedy: ABSTAIN parses, and is counted on its OWN line so an abstention wave and a well-served queue cannot print the same number. Test for any gate: is there a legitimate answer the gate makes unsayable?"
  source: P-001
  task: T-454
  date: 2026-08-12
  context: Added via context agent
  application: TBD
- id: PL-166
  learning: "Tick a vacuously-satisfied AC only with the word VACUOUS beside it. T-454's 'every DEFER carries a revisit_at' was satisfied by issuing zero DEFERs - a green computed from an empty population, which is G-034 at the acceptance-criteria level rather than the instrument level. The tick is indistinguishable from one earned over a real population, and in a task about zero-population blindness it would have been the defect closing itself"
  source: P-001
  task: T-454
  date: 2026-08-12
  context: Added via context agent
  application: TBD
- id: PL-167
  learning: "When a gate demands a shape, the SHIPPED template must supply it. _norec-verify demands a '## Recommendation' section that .tasks/templates/default.md does not contain, while inception.md does at :117. 132 of 133 task files got it right purely by imitation - and the 3 that did not had each ALREADY reached a verdict, so the operator saw nothing actionable on tasks whose analysis was complete. Second instance of the class in one week (T-453: G-020 measured against the shipped template passes over zero ACs). Check gates against the template the framework ships, not against a fixture"
  source: P-001
  task: T-455
