- id: PL-135
  learning: "A GENERATIVE test is only as general as the SHAPE it generates. T-412's generative leg enumerated the word tuples at run time and probed each word ALONE — and stayed green through the entire life of the two-qualifier defect T-416 fixed, because no single-word probe can construct a name carrying two members of the password family. Deriving cases from the data at run time protects against the data changing; it does not protect against the defect needing a bigger shape than the generator emits. When a rule takes N inputs, generate over N-tuples, not over members."
