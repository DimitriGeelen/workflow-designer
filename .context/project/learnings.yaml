  learning: "A producer's report that a stamp SHIPPED is a claim about the EMITTER; the consumer needs a claim about the ARTIFACT. AEF shipped exporter=aef-corpus-spec at rail 494 and it is real in tools/corpus_spec.py:407 — inside generate(), which nothing calls on stored maps. T-413 measured 0 occurrences on 37 live .bpmn, 0 on disk, 0 on both fixtures. A prediction was built on that stamp and was wrong in its mechanism, not just its outcome. At a seam, re-measure the peer's mechanism on the bytes you actually receive (AEF's own formulation, rail 506 §3, adopted)."
