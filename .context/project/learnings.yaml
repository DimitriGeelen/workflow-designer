- id: PL-134
  learning: "A BRANCH's presence in a test matrix reads as coverage of that branch's BEHAVIOUR. T-406 gated doc-comment suppression on producer identity and pinned four legs; T-413's branch column disproved the obvious theory that the unstamped default branch was untested (two of four legs ran through it) and showed the real hole was an untested AXIS: every leg's comment was either nothing-but-the-trailer or had no trailer, so the mixed shape appeared on no leg at any branch. Coverage of the branch is exactly what made the axis hole invisible. Sibling of AEF L-560 (a detector's scope note reads as coverage) and PL-132 (a schema's field presence reads as content)."
