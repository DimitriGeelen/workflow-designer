  application: TBD
- id: PL-094
  learning: "A literal integer in an acceptance criterion is the same G-015 subject error as a global pinned in a verification block, and decays just as fast. T-343's AC read 'the new counter reads 15'; it read 17 a day later and 20 an hour after that, no regression among them — each move came from registering a card, the very thing the tool exists to encourage. Written in the same window that registered G-015. Assert the PROPERTY (non-zero; agrees with an independent measurement; moves together with its sibling counter), never the value."
  source: P-001
