- id: PL-024
  learning: "Non-atomic file writes (open(path,'w') truncate-in-place) to any file that a gate or another process concurrently reads/parses cause transient false failures — e.g. metrics-history.yaml written by cron audits while the T-1610 pre-push YAML gate parsed it, producing an empty-detail parse-failure push block. The empty error is diagnostic: the reader caught the file empty/header-only, so safe_load returned None (not a YAMLError). Fix: atomic write via same-dir temp file + os.replace() (POSIX atomic rename). Stress signature: old pattern failed 19/24 concurrent reads, atomic 0/53."
