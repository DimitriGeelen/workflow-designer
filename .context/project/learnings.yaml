- id: PL-045
  learning: "A server-side slice is not 'live' until the SERVED surface is verify-live'd — committed code != running code. The gallery-serve.py :8834 instance was Jul-10 (pre-S1); S1-S3 landed in git but the running process served the old /api/list shape. AEF's peer probe (committed!=serving discipline) caught that I announced 'S3 live' against a stale surface. FIX PATTERN: after completing a server-side slice, redeploy the running instance (serve-gallery.sh restart) AND curl the served endpoint to confirm the new response shape BEFORE announcing 'live' to a peer. Same class as T-223/T-2589 entry-point shadowing."
