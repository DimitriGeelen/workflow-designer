- id: PL-238
  learning: "Folding an observation into a task copies its CONCLUSION and drops the thread. OBS-027 is status=dismissed, which reads as handled, yet its inference had already been transcribed into T-432's Recommendation where it did load-bearing work for four days — it was the stated 'measured grounds' for rejecting one of three options in front of the operator. When the inference was refuted, nothing linked the refutation back, because the register entry that would have been re-read was already closed. Dismissing an observation should require naming where its content now lives, or the closure is a claim that nothing depends on it."
  source: P-001
