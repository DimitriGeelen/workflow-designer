- id: PL-089
  learning: "A decision_trigger with several clauses can be satisfied on ONE clause and reported in prose that does not name which — the reader hears the whole trigger. Same failure as doing arithmetic over a 'not measured' table cell. When a gap names N populations, report coverage clause by clause or not at all."
