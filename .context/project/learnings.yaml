- id: PL-196
  learning: "Measured shell half of the derived-root class (T-496's stated hole, now closed): 162 files scanned, 42 shell members and 86 python members derive a root from their own location and resolve a subject beneath it. Unverified count is an INTERVAL, not a number — shell 30-36, python 29-35 — because the two classifier readings are wrong in opposite directions: LOOSE over-credits any existence test in the file (run-bridge-tests.sh matched on a check of a captured OUTPUT while never checking the 74 harnesses it launches; _t408 matched a 'test -f' inside a quoted fixture string), STRICT cannot see through argparse-default indirection (concerns-schema.py, tracked-secret-artifacts.py are genuinely guarded). Reporting one number would have picked a side by accident. Also: 4 shell files' only guard is 'cd $(dirname $0)/.. || exit', which guards the one step that cannot fail — cd to a parent always succeeds, including from a copy."
