  learning: "A gating suite that discards a failing leg's output converts every intermittent failure into an undiagnosable one: the run that failed leaves no evidence of its own cause, so it can only be re-run until green. Worse, re-invoking the subject to obtain something to print is right exactly once — under nondeterminism the second run can print a different, or clean, result than the run whose verdict is being explained. Capture once, print on failure only."
