- id: PL-146
  learning: "A single-population measurement cannot distinguish 'we drifted' from 'we were never given it'. T-421 correctly found check-arc-id promised-but-unregistered; I attributed it to local drift because this repo was the only tree I could measure. AEF measured a fresh consumer: our 17 hooks ARE the vendored default and 7 hooks never shipped to any consumer. The blast-radius check even CLEARED the fix (3 arc_id files, 0 unresolved) — a safe, measured, evidenced recommendation that was still wrong. Before attributing a gap to your own drift, ask whether you have a second population; if not, label the owner as UNKNOWN rather than SELF."
