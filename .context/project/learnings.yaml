- id: PL-092
  learning: "An acceptance criterion that ENUMERATES gets ticked from the memory of the plan rather than from the artifact — twice on one arc an AC named a probe case that was never implemented and was ticked anyway. P-010 checks the box is ticked, never that the sentence is true. Before ticking any AC containing a list, re-read the list against what shipped; amend in place with the reason an item is deliberately absent. Prefer ACs stating a property over ACs listing instances."
