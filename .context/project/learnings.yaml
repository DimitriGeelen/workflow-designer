- id: PL-202
  learning: "A naming convention used as a CLASSIFIER is an assumption with an expiry date, and nothing re-checks it because a convention is not code. _t451's unwired-guard census excuses every tools/*teeth*, *probe*, *mutation* file as 'one-shot by design'. That was true when written. Measured under T-509 it is false for 19 of 24: they are hermetic (running all 24 left git status byte-identical) and pass today, so they are re-runnable and were simply never called. The exemption did not decay because anyone changed it — it decayed because the FILES changed category underneath it while the pattern kept matching. Corollary that generalises: an exemption granted by pattern-match must name the PROPERTY it stands for, not the shape of the filename, because the property is testable and the filename is not. 'One-shot' can be checked by running the thing twice. 'Named *teeth*' can only be re-read. Where PL-182 said reachability is not binary, this is one level up: the CATEGORY was never in question, and that is why nobody looked"
  source: P-001
