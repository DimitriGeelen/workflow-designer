- id: PL-069
  learning: "(from T-327) A probe can fail when the claim is RIGHT, and that direction costs more than the usual one: it sends you to debug working code, and you cannot tell it from a real finding by looking at it. T-327 leg (b) asserted a bogus tag inside a COMMENT must NOT trip the guard; it went red, which reads exactly as 'comment-stripping is broken'. The guard was correct — the mutate chained a replace across the whole file and manufactured a real violation. Only the LANDING assertion caught it: +2 occurrences where +1 was expected. Remedy: every teeth leg names the specific evidence its own branch should produce (expected violation count, expected failure wording), so a green leg means THAT branch fired rather than that something did."
