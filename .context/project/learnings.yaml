- id: PL-042
  learning: "Completion-gate AC/comment parsing in update-task.sh is a recurring fragility class: sed-based HTML-comment stripping breaks on content it didn't anticipate (T-1967: one-line comments confused the range-delete; G-009/T-210: a literal '>' inside a one-line comment defeated the [^>]* strip, swallowing the ### Human header and mis-counting Human ACs as agent ACs). When touching this stripper, use a delimiter-complete minimal match (<!--([^-]|-[^-]|--[^>])*-->), never a char-class that assumes comment bodies avoid a metacharacter, and add a regression fixture exercising the awkward content (>, --, multi-line). 2nd instance of this class — the 3rd is preventable. UPDATE (T-211): the 3rd instance materialised the same day — the same broken `[^>]*` strip existed at TWO more sites in the vendored tree (check-active-task.sh inception-OQ strip; update-task.sh partial-complete re-check) that T-210's single-site fix missed. Meta-lesson: a copy-paste defect class needs a whole-tree SWEEP, not a single-site fix. T-211's Verification now greps the entire agents/ tree for the broken pattern (behavior-over-pattern invariant) so a 4th copy fails structurally. AEF independently swept and found all 3, confirming the sweep discipline."
