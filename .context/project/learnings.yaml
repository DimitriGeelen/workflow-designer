- id: PL-101
  learning: "Before copying a repair across a 'same class' boundary, check whether the preserved content collides with something the model already owns: T-337's foreign-tag passthrough is inert, T-340's DI duplicates aef:position, so verbatim preservation would publish two contradictory geometries"
  source: P-001
