- id: PL-034
  learning: "A guard that checks INTERNAL SELF-CONSISTENCY cannot detect a broken promise to a consumer — immutability needs a check against history, not against self. release-designer.sh verified artifact==src and manifest==artifact and so was green by construction, while silently rewriting the pinned bytes AEF vendors (0.2.0 @ e301986b) and rewriting the manifest sha to follow the mutation. Its own post-cp 'diff -q $SRC $ARTIFACT' compared the copy to its source: a check that can never fail is not a check. Ask of any release/publish path: what does this compare against that it did NOT itself just write? If the answer is nothing, the promise is unenforced. Sibling of PL-033 (push real bytes early): both are the same failure class — an artifact contract is only real when something compares it to bytes it did not produce. Found by scoping T-197 (the first src change since 0.2.0 shipped), not by a field failure: the hazard sat armed and invisible from T-174 because nothing had changed src at a released VERSION yet. Corollary: version-pinned publish paths are trap-shaped — the flaw only fires on the FIRST edit after a release, i.e. long after review."
  source: P-001
  task: T-198
  date: 2026-07-16
  context: Added via context agent
  application: TBD
- id: PL-035
  learning: "When a spec names X the SOLE source of a decision, ABSENCE of X is a violation of the same severity as a WRONG X — and the absent case is the one nobody writes a fixture for. IW-9 v1.1 made aef:laneMeta@authority the sole authority-of-record, so a diagram with no lanes is not a milder case than a diagram with the wrong lane; both fail §7's MUST identically. T-196 tested wrong-authority and never absent-authority, because absence reads intuitively as a GAP (nothing to check) rather than a VIOLATION (the requirement is unmet). The resulting guard, 'if lane_set is None: return', made the check get WEAKER as the evidence got WORSE: the one diagram with no human signal at all was the only one that passed. Root distinction to carry: an existence rule ('there MUST be a sovereignty lane') and a comparison rule ('task-type should agree with its lane') have OPPOSITE behaviour on missing input — the comparison correctly no-ops, the existence rule must fire. One early return served both and inverted the severe one. Test heuristic: for every closed value set, enumerate the EMPTY case explicitly, and ask 'does my guard fire hardest when the input is worst?'. Corpus blindness compounds it: 80/80 lanes carried explicit authority, so no real fixture could ever expose the empty case — a clean corpus HIDES absence bugs by construction. Sibling of PL-034 (a promise with no guard): here the promise was one 832 had just issued to AEF as a conformance ruling, while our own code was more permissive than the peer's we vetoed. Writing the test to LOCK a ruling is what exposed that we did not honour it."
  source: P-001
  task: T-199
  date: 2026-07-17
  context: Added via context agent
  application: TBD
- id: PL-036
  learning: "A test that guards an immutable versioned artifact (a release gate) must NOT have its expectations flipped by a source change that has not yet been released. When src retires a field, the release-gate test over the already-shipped build still correctly asserts the OLD contract about those immutable bytes; its expectations flip atomically with the VERSION bump that rebuilds the artifact. Flipping the gate in the src-only task would (a) assert a falsehood about immutable bytes and (b) be un-greenable under a same-version rebuild guard (G-007). Split: src change + src-served guard now; release-gate flip travels with the release (human-owned). Origin T-197 (IW-9 editor owner retire) vs dist-0.2.0 render gate."
