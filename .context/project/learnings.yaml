- id: PL-156
  learning: "Claude Code SNAPSHOTS hook configuration at session start: a hook registered mid-session does not fire for the rest of that session. Measured in T-420 with a DISCRIMINATING probe — a trivial hook on matcher 'Bash' (a matcher already proven live) also failed to fire, which separates 'my matcher pattern is wrong' from 'registrations are snapshotted'. CONSEQUENCE: any task whose deliverable is a PreToolUse/PostToolUse gate CANNOT verify live interception within the session that builds it. A mutation check proves the script's logic; it cannot prove the wiring. Write the AC accordingly — claim logic, not interception — or the task ships an unverifiable claim."
