  learning: "Never run 'fw inception decide' with ANY argument (incl. --help/--dry-run) to inspect it — check-tier0's regex 'fw\\s+inception\\s+decide' (check-tier0.sh:156) matches every subcommand, so even --help trips the Tier-0 gate and writes a spurious pending approval request to .context/approvals/ that the operator may approve by mistake (truncated command_preview hides the --help). To learn the syntax, read the block message or the hook source, don't attempt the command."
