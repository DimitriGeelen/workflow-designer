- id: PL-239
  learning: "When measuring an instrument's blind spot, measure the corpus it CONSUMES, not the corpus that EXISTS. T-535 was filed claiming '37 of 41 audit records' when the trend reader's non-recursive glob plus 14-day window resolves to 9 files holding 25 lines — there was never a 37 of anything. The error class is the dangerous one AEF named the same day from an unrelated probe: not a missing measurement but a CONFIDENT one against the wrong set, which no single-arm check can detect because it returns a plausible number. The remedy is mechanical — re-derive the reader's actual input set from its own selection code (glob, filter, window) before counting anything, and state the resolved input size alongside the result."
  source: P-001
