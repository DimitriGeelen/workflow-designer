  application: TBD
- id: PL-106
  learning: "A guard keyed on a by-product of a defect only protects the instances lacking the by-product. The validator's flow-node false positive fired on ioSpecification and dataObject for a long time, but those carry ids so the finding anchored and the anchorability guard stayed green; only the id-less documentation case was observable. Ask what made an instance detectable and whether that property is part of the defect."
  source: P-001
  task: T-359
  date: 2026-08-03
