- id: PL-200
  learning: "A P-011 Verification block is a one-shot completion gate here, but AEF's CTL-013 re-runs verification on COMPLETED tasks daily — so the same line has mirror-image failure modes across the seam: ours goes stale silently, theirs goes red spuriously. Operational rule that follows: never write a verification line that asserts TRANSIENT state (a current count, a working-tree condition, a running service). Assert the durable thing instead. Four legs written today assert corpus counts = 24 and would go red the day the corpus legitimately grows; under a re-running gate they would already be noise."
