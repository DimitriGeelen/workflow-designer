learnings:
- id: PL-001
  learning: "Friction-dry (schema-expressivity convergence) must be qualified PER control-flow family, not declared globally. The T-030 global friction-dry claim held only within the sequential/exclusive family; probing new families each added 1-2 gaps — fan-out→F14, saga→F15, timer+multi-instance→F16/F17. Sweep all six BPMN families (linear, state-machine, advisory-loop, ambient-guard, container, fan-out, saga, timer/multi-instance) before declaring input-gathering complete."
  source: P-001
  task: T-033
  date: 2026-07-02
  context: Added via context agent
  application: TBD
- id: PL-002
  learning: "A standalone HTML editor's XML-import namespace can silently drift from the toolchain's canonical namespace; getElementsByTagNameNS then matches zero extension elements and the importer falls through to auto-layout, discarding authored positions/uids with NO error. Symptom mimics a coordinate/layout bug but root cause is a namespace-constant mismatch. Prevention: round-trip a corpus file through the editor's OWN parser and assert extension data survives — Python-side validators miss it entirely."
  source: P-001
  task: T-042
  date: 2026-07-03
  context: Added via context agent
  application: TBD
- id: PL-003
  learning: "Editor fit-to-view sizes the viewBox from node boxes, not label text — long node labels clip past the viewBox; short labels are the reliable workaround (flagged in T-046 + T-048 friction reports; candidate T-043 follow-up: measure text extent)"
  source: P-001
  task: T-049
  date: 2026-07-03
  context: Added via context agent
  application: TBD
- id: PL-004
  learning: "A quality gate that exists but is never run against its subject corpus is latent G-019 blindness — the check passes by never executing. tools/check-lane-bands.py guarded geometry but nothing ran it over examples/, so 8 maps straddled bands undetected until a manual sweep in T-050. Prevention: wire every gate into CI over its full subject set, with a legacy allowlist (with stale-entry detection) to tighten past pre-existing violations without blocking."
  source: P-001
  task: T-052
  date: 2026-07-03
  context: Added via context agent
  application: TBD
- id: PL-005
  learning: "Editor (JS) and bridge (Python) can drift on ANY aspect of aef: serialization — namespace URI (T-042), field shape attr-vs-element (T-053) — and each side's own tests pass because the mismatch lives only in the cross-artifact seam. Each aspect needs an explicit cross-seam consistency test (namespace T-044; shape T-053). Durable fix = one JS-DOM round-trip harness covering all aspects, but that adds a node toolchain (portability decision — needs human/inception, do not add autonomously)."
  source: P-002
  task: T-053
  date: 2026-07-03
  context: Added via context agent
  application: TBD
- id: PL-006
  learning: "Synthetic dispatchEvent click tests pass while real trusted clicks fail when a mousedown-triggered re-render detaches the element before the browser dispatches click — always verify pointer-interaction claims with trusted (Playwright) input, not synthetic events"
  source: P-001
  task: T-069
  date: 2026-07-04
  context: Added via context agent
  application: TBD
- id: PL-007
  learning: "Manual viewBox math for SVG cursor conversion silently skews when preserveAspectRatio letterboxes — the binding axis stays exact (masking the bug) while the other axis drifts; always convert through getScreenCTM().inverse(), and test hit-paths with absolute round-trips, not relative drags"
  source: P-001
  task: T-071
  date: 2026-07-04
  context: Added via context agent
  application: TBD
- id: PL-008
  learning: "Estimated text metrics (px-per-char) diverge enough from rendered getBBox to invalidate placement decisions — apply the candidate, measure the real bbox, keep only verified-clean results (measure-after-move). Decision metric must equal verification metric."
  source: PL-006
  task: T-077
  date: 2026-07-04
  context: Added via context agent
  application: TBD
- id: PL-009
  learning: "SVG presentation attributes (font-size etc.) are silently overridden by any CSS class rule — when code must control styling on a class-styled SVG element, set inline style and verify the outcome with getComputedStyle, never trust the attribute you set (twin-probe: attr vs style element, compare computed values)"
  source: PL-008
  task: T-088
  date: 2026-07-04
  context: Added via context agent
  application: TBD
- id: PL-010
  learning: "Vendored-framework code paths that resolve assets via PROJECT_ROOT break silently in shared-tooling mode (PROJECT_ROOT != FRAMEWORK_ROOT) — upstream never sees it because its own repo has the roots coincide. When a vendored web route or CLI 500s/fails here, check for PROJECT_ROOT-vs-FRAMEWORK_ROOT path resolution FIRST (2nd instance: T-015 env contamination, T-090 review.py sys.path). Workaround pattern: product-side shim at the exact path the buggy code expects, re-exporting the framework module, with a documented removal condition + concerns.yaml gap."
  source: G-004
  task: T-090
  date: 2026-07-04
  context: Added via context agent
  application: TBD
- id: PL-011
  learning: "Settings that only affect FUTURE actions (density, branch pitch -> next Tidy/Clean) read as broken to users unless the UI surfaces the apply path at the moment of change; pair every deferred-effect pref with an explicit apply affordance (PD-044-safe: the apply is a user click)"
  source: P-001
  task: T-096
  date: 2026-07-05
  context: Added via context agent
  application: TBD
- id: PL-012
  learning: "A view/preference control that only affects FUTURE actions (density, branch pitch) reads as broken — users expect a view control to change what they see immediately. Prefer live-apply with revertible feedback (run the action + 'N moved, Ctrl+Z reverts') over opt-in Apply. PD-044 (no unattributed geometry mutation) is preserved: a user changing the control IS the explicit action, and Ctrl+Z restores. Same class hit T-096 (opt-in) then T-104 (opt-in felt inert)."
  source: P-001
  task: T-104
  date: 2026-07-05
  context: Added via context agent
  application: TBD
- id: PL-013
  learning: "T-092 Phase C is effectively complete: opt 3=T-106, opt 7=T-107, opt 8=T-109 shipped. Opt 5 (structural-straightening) is SUBSUMED by align-rows (T-094)+align-columns (T-107) in a swimlane model — same-lane near-aligned edges are already snapped; cross-lane handoff edges cannot be straightened without moving a node out of its lane band. Opt 4 (row-alignment-mode top) worsens routing (mixed-height rows connect edges at unequal heights). The real remaining routing frontier is obstacle-avoiding orthogonal routing for the 42 corpus node-cuts (edges slicing unrelated node boxes) — a DESIGN-sized task deserving an inception, not an autonomous build."
  source: D2
  task: T-109
  date: 2026-07-05
  context: Added via context agent
  application: TBD
- id: PL-014
  learning: "Corpus node-cuts are 27 incidences / 21 cut-edges (not the stale ~42), 74% concentrated in harvest-pipeline + error-escalation-ladder; 17/24 maps cut-free. The editor ALREADY routes crossing-aware (needsLoop→orthoLoopBack picks the min-crossing detour band, src:3629-3637) — residual cuts are where that band heuristic minimises but cannot zero crossings in dense fan/join maps. A router = replace the band-pick at ONE bounded insertion point (src:3636) with pathfinding + clean fallback. Also: the T-101 baked corpus is not at the current Clean fixpoint (re-running Clean drops harvest 13→8), so a Clean re-bake is a ~40% free win — but gated on T-105 (aligned-gateway edge-label collision) clearing first."
  source: P-001
  task: T-112
  date: 2026-07-05
  context: Added via context agent
  application: TBD
- id: PL-015
  learning: "Routing-metric prototypes must preserve exact edge attach points and guard on ALL quality metrics (crossings AND overlap-pairs AND node-cuts), not just the target metric. A shared-riser uncross prototype showed corpus crossings 20->14 only because it relocated attach points to node-face centres — discarding T-097 anchor spread and worsening overlap. The faithful, fully-guarded number was 20->18 (one map), and even that was not a visual improvement. Measure faithfully + screenshot before committing to a permanent render pass."
  source: P-001
  task: T-120
  date: 2026-07-06
  context: Added via context agent
  application: TBD
- id: PL-016
  learning: "Corpus routing is objectively clean: 0 node-cuts/24, crossings topologically forced (T-097 done/T-120 NO-GO), 9 minor label-on-gateway overlaps immune to the vertical branch-pitch lever (T-124 NO-GO), edge de-jog done (T-117/118/119). No high-value AUTOMATED routing optimisation remains without risking the tuned layout engine. Run the corpus census (cuts/labels/crossings/bends) BEFORE proposing routing work — most 'defects' are already handled or topologically forced."
  source: P-001
  task: T-124
