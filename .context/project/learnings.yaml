  application: TBD
- id: PL-149
  learning: "A single population contains its own history — provenance is answerable from inside one tree, by git blame, without a second population. Sharpens PL-146, which concluded too pessimistically that one population cannot distinguish 'we drifted' from 'we were never given it' and the owner should be labelled UNKNOWN. The question an attribution detector must ask is not 'does the tree say this?' but 'did WE say it?': compare the introducing commit of the CLAIM LINE against the commit that ADDED the file — same commit means seeded/inherited (owner upstream), later commit means authored here (owner us). Crucially this is per-LINE, not per-FILE: the vendored-path test gives the WRONG answer, because .tasks/templates/default.md sits outside .agentic-framework/ and is project-owned under agent authority (T-352) yet its claim lines are inherited. Fails loud: git unavailable or history absent must yield 'authored', so an unmeasurable provenance still blocks."
