- id: PL-197
  learning: "Two readers of one state file, and the PUBLIC accessor is the unverified one. AEF's T-1106 RCA (2026-04-11, ULTRA-HIGH) fixed the Watchtower URL emitter with an /api/_identity handshake and 3-layer fail-loud discovery in lib/watchtower.sh:_watchtower_url. bin/watchtower.sh:do_url — what 'fw watchtower url' actually execs — still cats the triple file verbatim with no owner check. Measured: with a dead pid and a stale url, the verified reader refuses and the public one returns a FOREIGN project's URL at rc=0. Callers of the unverified path include handover.sh:16, so handover documents can carry another project's Watchtower link and outlive the session. This is the reintroduction shape in its second-reader form: the reader that burned someone got fixed, the reader that had not yet burned anyone was out of scope, and re-reading never finds it because re-reading finds what IS there."
