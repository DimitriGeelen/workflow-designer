- id: PL-236
  learning: "The residue that outlives a cleanup is disproportionately the MIS-CLASSIFIED item, because a remedy aimed at a class cannot reach the item that was never in the class. T-432 measured 60 FAILs and attributed all of them to oe-daily; 59 were genuinely oe-daily and a correctly-targeted backfill fixed them, and the single survivor turned out to have been in 'discovery' the whole time — visible in the report's own section header. So 'what is left after the big fix' is a far better place to hunt classification errors than the original population was: the population's majority hides the misfit, and the cleanup subtracts exactly the correctly-filed members."
  source: P-001
  task: T-534
  date: 2026-08-15
