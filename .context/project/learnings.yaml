- id: PL-039
  learning: "termlink MCP file_send mints ONE transfer_id per SESSION (per MCP process, e.g. xfer-mcp-3313260) and reuses it for EVERY send that session — NOT per-send. Two same-session sends to a target share the id; if the recipient hasn't DRAINED the first transfer (file_receive) before the second lands, file_receive blends the chunk streams (17/1 chunks) and rejects. If the recipient drains between sends, each is clean (verified: AEF consumed the 0.3.0 before the fixture send hit the same id — no blend). Robust delivery, in preference order: (1) DURABLE INLINE — `termlink channel post <topic> --msg-type artifact --metadata sha256=… --payload <base64>` (durable, boundary-safe, read back verbatim; the byte-exact-handoff path from PL-033/line-222); (2) CLI `termlink file send` runs per-process so it mints a fresh unique id per invocation (xfer-<n>-<epoch>) — use it, not MCP file_send, when you must chunk-transfer >1 file; note it prints [DEPRECATED]→'channel post --file' and silently falls back to legacy events. file_receive grabs the MOST RECENT transfer; use --replay for history. Delivery is not done until the recipient sha-verifies the reassembled bytes; ok:true is hub-acceptance, not delivery."
  source: P-002
  task: T-207
  date: 2026-07-19
  context: Corrected after over-reacting to a session-constant-id collision that did not bite (recipient had drained). Refines the initial 'never back-to-back' framing.
  application: For any byte-exact artifact hand-off to a peer agent, prefer durable inline channel_post payload_b64; reserve chunk-transfer for large files and use the CLI (per-process id).
