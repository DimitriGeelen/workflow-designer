- id: PL-096
  learning: "A safeguard that is never verified to have applied is not a safeguard. T-350's teeth leg stubbed a recursive delete via replace-first-occurrence; the first occurrence was a COMMENT quoting the command, so the live command survived and deleted the repository. The arc has catalogued five CHECKS that cannot fail; this is the first SAFEGUARD that silently did not apply, and it is worse - a dead check costs a false green, a dead safeguard costs the guarded thing. Remedies that generalise: (1) prose about code shares a byte-space with code, so never quote a dangerous command in the comment guarding it, and exclude comment lines from any safety scan; (2) state the invariant a harness must satisfy before executing anything it mutated (guard intact OR danger stubbed) and assert it as a precondition; (3) give the precondition its own teeth leg that constructs a violating mutant and requires refusal; (4) anchor mutations at start-of-line, require an exact substitution count, and make a non-applying mutation report BROKEN rather than run; (5) verify the EFFECT, never the edit."
  source: P-001
  task: T-350
  date: 2026-08-02
  context: Added via context agent
  application: TBD
- id: PL-097
  learning: "A stop path that assumes its own signal works is not a stop path. serve-gallery.sh forwarded SIGINT to a child started with '&' — bash sets SIGINT to SIG_IGN for such children with job control off, and the ignore survives exec, so the trap was a no-op for eleven days and produced six orphaned servers. The generalisable half is the harness: the probe written to catch this ended each case with 'kill -TERM parent; wait parent', assuming the very property under test, and hung on both mutants. Verify a stop path by mutation and bound every cleanup wait (TERM, poll, then KILL). Testing a signal path also requires 'set -m' in the harness, or backgrounding the subject hands it the same SIG_IGN and the test measures the harness."
  source: P-001
  task: T-351
  date: 2026-08-03
  context: Added via context agent
  application: TBD
- id: PL-098
  learning: "A 'passes before / fails after' predicate aggregates every cause of the change, including the fix breaking something correct. T-352's 19 DIVERGENT lines were named 'the finding' when they were the blast radius: validate-workflow.py exits non-zero on an invalid fixture BY DESIGN, so a line asserting the right error code appears is correct and the remedy kills it. Separate the causes by reading each member's intent before attaching a noun to the number."
  source: P-011
  task: T-352
  date: 2026-08-03
  context: Added via context agent
  application: TBD
- id: PL-099
  learning: "A bucket keyed on 'the two measurements did not differ' spans BOTH 'both passed' and 'the first failed so the second never ran' — n/a is the ABSENCE of a measurement, not a matching one. Report the DISTRIBUTION of per-member verdicts, never the cardinality: LATENT 189 hid a 159 PASS/PASS + 30 FAIL/n-a split. Corollary (T-354): an instrument's population definition is chosen for the defect under study, then silently inherited by every later question asked of its output — 30 red lines meant 30 among semicolon-shaped lines only."
  source: P-011
