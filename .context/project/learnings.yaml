- id: PL-102
  learning: "An incident DIRECTS attention rather than DISTRIBUTING it: the property that drew scrutiny gets fixed while the artifact's central claim can survive a two-party review unexamined — and the review then stands as evidence the artifact was checked. 832's DI trailer poisoned AEF's corpus; both sides investigated WHERE the comment appears, neither asked whether its sentence ('AEF generates DI from node coordinates') is TRUE. 59 days, 10 releases, inside sha-pinned bytes."
  source: P-001
  task: T-357
  date: 2026-08-03
  context: Added via context agent
  application: TBD
- id: PL-103
  learning: "When a population's membership criterion is carried BY the artifact (exporter=, version stamp, provenance header), check whether the operation under test destroys it. T-356: exporter= is dropped 5/5 by the very round trip being measured, so a round-tripped fixture becomes indistinguishable from designer output and the population silently reverts to incapable — while the detecting census (grep -c exporter=) keeps counting the originals and reports fine. Membership feels like a fact about the file so it is checked once, at admission, which is the one moment the operation has not yet run."
  source: P-001
  task: T-356
  date: 2026-08-03
  context: Added via context agent
  application: TBD
- id: PL-104
  learning: "Capability is per-QUESTION, not per-population. A remedy that genuinely fixes a capability zero casts a halo over every neighbouring question, and the halo is produced BY the fix. T-356 added third-party BPMN fixtures and made T-340/T-348/T-358 witnessable for the first time — but censused against T-347's five shapes, four are exactly as unreachable as before (documentation 0, foreign extensionElements 0, property 0, loopCharacteristics 0 across all five fixtures). 'The corpus can now exhibit real-world import defects' is true of some questions and false of others and the sentence does not distinguish. Before citing a new population as coverage for a question, census THAT question's shape in it."
  source: P-001
  task: T-347
  date: 2026-08-03
  context: Added via context agent
  application: TBD
- id: PL-105
  learning: "A summed total over a category cannot distinguish preservation from substitution: censusing foreign BPMN content, our own aef:position output pushed the output total to 162 against an input of 1, so a deletion reported as 'kept'. Compare per-key over the keys the INPUT had, never the union. Direction matters: this bug failed toward agreement, which is the failure mode that gets published."
  source: P-001
  task: T-347
  date: 2026-08-03
