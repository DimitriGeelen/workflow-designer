- id: PL-100
  learning: "A corpus census over artifacts your own tooling produced rates your generator, not the population: T-340's '0 of N files carry DI' was measured over 126 files of which 121 carry our exporter's fingerprint, and our exporter never emits DI — the bucket could not fill"
  source: P-001
