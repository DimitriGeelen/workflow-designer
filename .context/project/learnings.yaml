  task: T-470
  date: 2026-08-12
  context: Added via context agent
  application: TBD
- id: PL-170
  learning: "A finding does not reach the instruments of the task that found it unless someone walks it there. T-469's headline was that a shell glob does not descend (it had hidden a subdirectory from a corpus count); the verification leg written later in that same task pinned the corpus with the same glob, 42 of 47 paths, missing the two files T-469 had just called most seam-relevant. Once the prose reads correctly the finding FEELS discharged, and guards written afterwards inherit the habit rather than the correction. Check: after fixing a claim, grep the same task's own Verification block for the construct the claim was about."
