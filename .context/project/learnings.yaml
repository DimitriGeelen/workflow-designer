- id: PL-195
  learning: "A control that is INVISIBLE to the instrument it tests reports on nothing and says PASS. T-497's census controls planted their fixtures under dot-names (copying _t429's scratch-copy convention); glob.glob does not match dotfiles, so the census never saw them — control A read CLEAR because the fixture was ABSENT, not because it was clean, and control B 'passed' only because everything was clear. Absent and clean are the same observable to a glob-scoped instrument. Same shape as T-495, where the probe's own -probe.py name was excused by the census's one-shot convention: in both cases the control inherited a naming convention that placed it outside its own subject's scope."
