- id: PL-132
  learning: "A schema field written by the tool at record-creation time cannot register as missing, so field PRESENCE reads as CONTENT to every downstream consumer. learnings.yaml application: 100% present, 2.3% authored — 127/132 are the literal TBD from context/lib/learning.sh:100, 2 are a slug template from healing/lib/resolve.sh:133. Prevention: leave a decision field ABSENT until someone decides; a placeholder written by machine is indistinguishable from a filled-in answer in every count. Sibling of AEF's L-560 (a detector's scope note reads as coverage) one layer down."
  source: P-001
  task: T-411
  date: 2026-08-09
  context: Added via context agent
  application: "Applied here immediately, deliberately: this record is the first in the
    register to carry a real application, and leaving it TBD would have made the learning
    an instance of itself. When adding any decision-shaped field to a schema, write the
    emitter so an undecided record leaves the field ABSENT rather than filled with a
    placeholder — then `field in record` is a true coverage measure and needs no
    classifier. Audit existing registers with tools/memory-application-census.py, which
    separates AUTHORED from MACHINE-written values; a bare presence count over any
    machine-populated field is the misleading answer, not the owed one."
- id: PL-133
  learning: "Two word-lists being disjoint does not make their MATCHES disjoint: a word present in both satisfies an AND-pair from a single span, collapsing a two-signal rule into a one-word match. tracked-secret-artifacts.py had password/passwd in both the secrecy and noun halves, so reset-password.md classed as key material. Prevention: require the halves to match at NON-OVERLAPPING SPANS, and deliberately KEEP the overlapping words so the span rule stays load-bearing — set-differencing the lists fixes the instance and leaves the rule that permits it. Test generatively from the word lists at run time, not from the filenames that happened to be wrong."
  source: P-001
