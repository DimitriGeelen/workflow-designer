- id: PL-029
  learning: "Deployment verification needs a browser render-check of the SERVED artifact, not curl+sha256. curl/sha only prove the bytes match the pin — they cannot catch render failures, console errors, or that the served pin is a STALE version. Verify by loading the URL in a browser and asserting: (1) render (key elements present), (2) expected version markers (e.g. a feature-specific global like FIELD_META.horizon), (3) console cleanliness (whitelisting expected backend-absent 404s like /api/health)."
  source: P-011
