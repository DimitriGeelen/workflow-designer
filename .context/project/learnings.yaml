- id: PL-173
  learning: "P-011 verification legs must contain no backticks: the gate eval-expands each line, so backticks are command-substituted even inside single quotes. A leg like grep -q 'lines.push(`  <!-- ${DI_TRAILER} -->`)' silently collapses to grep -q 'lines.push(  )' and goes RED for the wrong reason — the leg reports a failure that has nothing to do with the property it was written to check. Escaped \\${...} survives; backticks do not. Prefer a backtick-free substring (here: 'DI_TRAILER} -->')."
