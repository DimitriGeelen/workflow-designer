- id: PL-090
  learning: "A mitigation string in a report is an untested claim: 'Run: fw fabric enrich' was the audit's sole priority action for 13 consecutive audits and is a structural no-op. Verify that a prescribed remedy can move the metric it is attached to before the report recommends it — a remedy that cannot is indistinguishable, on the reader's screen, from one nobody has run."
