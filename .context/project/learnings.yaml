- id: PL-019
  learning: "Serializing an SVG to PNG (Image+canvas+toDataURL) loses class-based CSS from the document <style> — the export renders BLANK. Inline computed styles onto the clone. A file-existence/size check passes on a blank image; only READing the rendered image catches it (Visual Verification rule)."
  source: P-001
