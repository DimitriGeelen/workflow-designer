- id: PL-157
  learning: "'Blocking' is a property of an assumption PLUS the schedule, not of the assumption. A-014 was carried on the arc anchor's blocker list and sent to AEF as blocking, when it is child-3's premise — and child-3 (T-184) was operator-DEFERRED on 2026-07-11 with a revisit trigger that has not fired. With A-012 (answerable locally) that is two of three so-called anchor blockers that were not blockers. Nothing re-checks a blocker list against the deferral state of the child that owns it, so a deferred child's premise keeps reporting as an active blocker on its parent indefinitely. Before escalating an assumption as blocking, check which task OWNS it and whether that task is scheduled."
  source: P-001
