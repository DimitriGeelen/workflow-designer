- id: PL-093
  learning: "A count computed as a DIFFERENCE spans every reason the function had for dropping — attributing that difference to one cause is a guess dressed as a measurement. resolve_edges drops for three reasons (unregistered target, self-edge, duplicate); T-342 measured len(raw)-len(resolved) and labelled the whole thing 'discarded for want of a card'. Decomposing before building the fix gave 17/0/0 — right in kind, but only because the other two arms are empty HERE. An occupancy zero, not a construction one. Decompose before you attribute, and count the arm you are naming."
  source: P-001
