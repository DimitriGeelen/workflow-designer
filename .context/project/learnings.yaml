- id: PL-206
  learning: "A control that CAN fail is still worthless if its STIMULUS was built so it never would. PL-205 and AEF rail 11876 cover the two known shapes — a probe reporting an absence is indistinguishable from a dead comparator, and a control that cannot fail is not a control. T-513 produced a third: both of its legs had live, failable comparators, and both passed on inputs constructed so the comparator was never actually challenged. The anti-overfit leg renamed 'Review request' to 'Review request (renamed)' and reported id_survived_a_rename=true; the emitted id slug is built from the LEADING WORD, so both names slug to 'review' and no rename was ever exercised. The boundary leg re-minted only the four node ids and reported three surviving edge uids, which was an artifact of the three Flow_ ids left untouched rather than a property of the designer. Both numbers were true statements about the fixture and false ones about the system. So the check is two questions, not one: did the control fire, AND does the stimulus actually contain the thing the control looks for. The tell in both cases was that the number looked too tidy — a survivor count that lands exactly on a subset you happen to have skipped, or a stability result on an edit you happen to have made invisible."
  source: P-001
  task: T-513
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-207
  learning: "A permission to fix a vendored dependency in-tree AND upstream it records only the first half. The commit proves a fix happened; nothing marks it as LOCAL, so the upstream half silently never happens and the next re-vendor destroys it. Measured here: 28 diverged paths, 16 real fixes upstream lacks, and a peer re-pinged the same concern three times across four months while our tested fix for it sat in the tree unlabelled. Divergence from a vendor baseline has to be a declared artifact, not an inference from git history — and it must record FILE MODE, because 8 of the 28 carried no content change at all and content review calls those clean. Corollary worth acting on: two consumers of the same vendored dependency independently fixing the same defect is not redundancy, it is evidence the upstream path is missing."
  source: P-001
  task: T-517
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-208
  learning: "PL-206 refinement: asserting that a control went RED is not enough — assert it went red for the NAMED REASON. The T-517 teeth leg for mode-only divergence originally checked rc==1 plus the bare word 'mode' in the output; tightened to the bracketed classification column '[mode', it went red, and the failure was a genuine defect in the instrument rather than in the leg: git diff --raw reports an all-zero destination sha for UNSTAGED files, so every mode-only change was being classified as content — in exactly the state that matters most, someone having just patched the file and not yet committed. A loose assertion would have banked the pass, shipped the misclassification, and left the tool blind to the one class it was built for. Red for the wrong reason still counts as wrong, and the cheap tell is an assertion matching a substring that appears in prose and summary lines as well as in the field under test."
  source: P-001
  task: T-517
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-209
  learning: "The phrase that NAMES a gap is not always the shape of the risk. _t515's does_not_cover said 'uid collision between an externally-assigned value and one the editor would mint' — I wrote that sentence, and building faithfully to it would have tested the one direction that is GUARDED, gone green, and reported that collisions are handled. Reading the import path first showed the two directions are asymmetric: a derived uid colliding with an authored one is protected by a pre-seeded used-set, while two AUTHORED uids with the same value never enter the deriving function at all and both survive. The dangerous direction was the one my own gap statement did not describe. Before building to a gap note — especially your own — read the code path and ask which directions the stated phrase actually covers."
  source: P-001
  task: T-518
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-210
  learning: "Never key a before/after comparison on a field the operation under test rewrites. T-518's first implementation tracked each uid carrier across a save round-trip by its owning element's id and produced pure artifacts — one lookup returned null, another returned a different element's uid — and the reason was T-513, a finding I had made myself and reported to AEF weeks earlier: the element id is derived from lane + x-order + node name and is re-minted on EVERY save. Knowing a fact and remembering it while designing a comparator are different things. The tell is a result that is not merely wrong but incoherent (a null where a value must exist). The remedy is usually to stop needing the handle at all: counts of a specific value and set differences answered the question — do two carriers share one identity — without any per-element key, and are immune to the rewrite by construction."
  source: P-001
  task: T-518
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-211
  learning: "A register field that asserts something about a repository you cannot read is the only field that goes stale with NO local edit, and no local instrument can ever detect it. T-517's .vendor-divergence.yaml was correct when written on 2026-08-14; AEF's reply on the 15th falsified three of its 28 entries because THEIR tree moved. Every other field in that manifest (path, kind, task) is a fact about our own tree and any drift is observable here. 'upstream:' is a claim about theirs. The instinct on discovering this is to build a better check — there is none to build, because the input is not visible from this side. The remedy is structural in a different direction: schedule the triage OUT, to the side that can read the thing, and treat every such verdict as provisional and dated. Generalises to any cached claim about an external system: pinned peer versions, 'known upstream' bug lists, third-party API capability notes. The test is 'could this become false while my repo is untouched?' — if yes, it needs an expiry and an owner, not an assertion."
  source: P-001
  task: T-519
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-212
  learning: "A register keyed on a PATH cannot carry one verdict when that path bundles several independent changes, and the moment you discover it is the moment you are about to be wrong in the expensive direction. .vendor-divergence.yaml records agents/audit/audit.sh as one entry with one upstream: verdict, but five tasks changed that file. When AEF confirmed one of the five was fixed on their side, the tempting edit was to flip the entry to 'superseded' — which would have silently written off four real fixes and, worse, marked them safe to lose at the next re-vendor, since 'superseded' MEANS 'being overwritten is the correct outcome'. The granularity of the KEY (path) and the granularity of the CLAIM (per-change) were different all along and nothing surfaced that until an external answer arrived addressing a subset. Remedy used: keep the entry's verdict for what REMAINS true and record the resolved subset in a separate field, so the count of outstanding debt stays honest. General rule: before flipping a register entry on new evidence, check whether the evidence covers the WHOLE entry or only part of it — and if the entry cannot express 'partly', that is a schema defect, not a judgement call."
  source: P-001
  task: T-519
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-213
  learning: "When verifying a SEAM, the reader must be the class of reader on the FAR side, because the producer's own parser will agree with the producer's own defect. T-520's probe drives the editor in a browser, so the free way to read the round-tripped document back is Chrome's DOMParser. It reported all 11 candidate uid values surviving byte-identical — including one containing a raw newline, which XML 1.0 3.3.3 says is impossible, since attribute-value normalisation replaces a literal newline in an attribute with a space before the application sees it. Chrome does not apply it there; expat does, and so does everything on AEF's side. The green run was the lenient reader confirming what the lenient writer produced. Nothing about the test was lazy — the stimulus was verified, the negative control was live, the exits were three-valued — and it would still have certified a silent cross-project corruption. The tell that should have fired earlier: I was EXPECTING a loss I believed unavoidable, so a result showing no loss read as good news rather than as a contradiction of the spec worth chasing. A measurement that disagrees with a standard you just cited is not a pleasant surprise, it is an instrument fault until proven otherwise. Applies to every encode/decode boundary where both sides are not the same implementation: JSON number precision, unicode normalisation forms, path encoding, timezone handling, HTTP header folding."
  source: P-001
  task: T-520
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-214
  learning: "Fix at the shared mechanism, not at the site where you happened to find the defect — a narrow fix leaves the identical bug under a different name PLUS a passing test asserting it is gone, which is strictly worse than not fixing it. T-520 found that a newline in an aef:uid was written raw into an XML attribute and destroyed by attribute-value normalisation. The obvious fix was 'escape whitespace when writing aef:uid'. The actual defect was in escAttr, the escaper shared by EVERY attribute the writer emits, so a node NAME containing a newline was corrupted by the same path with nobody looking. The uid was where the seam contract lives and therefore where the instrument pointed, not where the bug lived. AEF independently made the same argument about the alternative remedy — putting a MUST NOT on the assigner would have been 'the same silent failure mode, relocated' — and that phrase generalises to narrow fixes exactly as well as to misplaced constraints. The test to apply before shipping any fix: name the mechanism the defect actually flows through, then ask whether the fix sits at that mechanism or at one of its callers. If it sits at a caller, every other caller still has the bug and your regression test now covers only the one you looked at. Corollary for instrument design: a probe scoped to one contract will keep finding class defects through that contract, so the scope of the FINDING is never evidence for the scope of the FIX."
  source: P-001
  task: T-521
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-215
  learning: "Absence-detection placed INSIDE the block it guards cannot observe the block being skipped — it can only certify a line that never ran. T-522: update-task.sh already had two controls for 'the episodic did not get generated' (T-1169 warns when the generator yields no file, T-1860 logs every invocation) and both sat inside the generation block, so when a set -e abort 110 lines earlier killed the script the loss was completely silent and cost two episodics. The remedy is not a better check but a DIFFERENT PLACEMENT: a watchdog on the EXIT trap, outside the guarded region, armed when the transition begins and disarmed when the stage is reached, so an abort anywhere between the two is reported. Corollary that keeps such a watchdog alive: it must stay silent on designed skips (partial-complete defers episodic generation on purpose) — a watchdog that alarms on a legitimate skip gets muted, and muted is worse than absent because it still looks installed"
  source: P-001
  task: T-522
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-216
  learning: "Under 'set -euo pipefail' a failing command substitution in an ASSIGNMENT terminates the whole script, not the loop it sits in — and 'x=$(grep PATTERN file | ...)' is the everyday carrier, because grep's no-match exit 1 is a normal result rather than an error and pipefail hands it to the assignment. T-522: one fabric card missing a 'location:' key killed update-task.sh mid-loop, AFTER the task had been moved to completed/ and rewritten, so completion looked successful while three later stages never ran. Two properties make this class nastier than it reads: the abort lands after side effects, so the visible state says success; and the trigger is DATA, not code, so the script that worked for months breaks the moment someone hand-writes a file. The idiom is '{ grep ... || true; } | ...' and it belongs on every such assignment at once — T-1374 fixed two greps in this exact block for this exact reason and left the two beside them, which is how the same bug arrived a third time"
  source: P-001
  task: T-522
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-217
  learning: "A comment stating a behavioural fact is an assumption with an expiry date, and citing it when SCOPING a task propagates the error into the deliverable's shape. T-523: parseBpmnXml carried 'the whole interior of an accepted element is dropped today'; I read it, believed it, and wrote a task expecting to measure NODE LOSS. Measured, nested flow nodes are not dropped at all — they are HOISTED to process level with their uids intact while containment is destroyed, because the collection query is a descendant query over a flat model. The comment was true of a neighbouring branch and false of this one, which is why it survived: a claim that is true SOMEWHERE is far more durable than one that is simply wrong. Two consequences worth carrying: the outcome vocabulary a probe is built with must not be inherited from the claim it is testing (a survives/dropped probe would have reported 'survives' and hidden the finding, since the third outcome had no name in it), and a test that merely disagrees with a comment leaves the next reader two claims and no way to choose — correct the comment in place or the measurement decays into folklore"
  source: P-001
  task: T-523
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-218
  learning: "A loss that keeps every COUNT constant is invisible to every count-based instrument, and those are most of the instruments anyone builds. T-523: a node authored inside a subProcess round-trips with the same node count, same flow count, same uid count, same uids — and a different parent. The bridge suite had 90 legs and not one could see it. The general form: when the property under test is a RELATION (containment, ownership, ordering, scope) rather than a quantity, presence-and-count checks are structurally blind, and their greenness is not evidence. The remedy is to make the instrument report ANCESTRY or the relation itself, which also means the reader has to be structure-aware — a reader returning a flat list of values reports the interesting case as identical to the boring one. Corollary for cross-project seams specifically: a relation-loss is the worst class to ship, because the record still resolves on the far side and simply means something else, with no error at either end"
  source: P-001
  task: T-523
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-219
  learning: "A NEGATIVE ASSERTION IS SATISFIED BY SILENCE. Any test leg of the form 'X was not reported' passes when NOTHING is reported at all — which is exactly the broken-instrument case the leg was written to catch. T-524's leg 3 ('the valid card is not flagged') existed to prove green is a classification rather than absence, and it passed VACUOUSLY against a validator regressed to print nothing: 3 of 10 legs survived the mutation and that was one of them. Reading the leg cannot reveal this; only feeding it the broken instrument can. The remedy is to assert that a discrimination OCCURRED — findings were reported, the valid subject is absent from them, and the counts match — never that a symptom is missing. Applies to every suite with negative legs, and the cost of finding out the other way is that the leg is green on the day it matters."
  source: P-001
  task: T-524
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-220
  learning: "FIXING A CRASH CAN CONVERT A LOUD FAILURE INTO A QUIET ONE, AND THAT IS NOT THE SAME AS FIXING IT. T-522 guarded the assignment so a fabric card missing 'location:' no longer killed update-task.sh mid-completion — correct, and it made the malformed card NON-FATAL without making it VISIBLE. Resilience and detection are separate deliverables and a fix that ships only the first leaves the failure in the tree with its alarm removed. Measured here rather than argued: the inert card is not merely ignored — because drift builds its 'registered' set by grepping ^location:, a card without one makes ITS OWN FILE report as unregistered, and the printed remedy is 'fw fabric scan', which would mint a SECOND card for a file that already has one. So the silence actively manufactures duplicates. The test at the end of any crash fix: after this change, what NOTICES the input that used to crash? If the answer is nothing, half the work is still open."
  source: P-001
  task: T-524
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-221
  learning: "AN ACCEPTED RECURRING WARNING IS THE IDEAL HIDING PLACE FOR A REPORTING DEFECT. The fabric coverage WARN was correct, deliberate, and RATIFIED — watch-patterns.yaml records it as the standing warning the operator's T-344 [REVIEW] accepted — and the audit's own trend analysis flagged it three times in fourteen days. Because everyone had agreed in advance the line would be there, nobody read the number in it, and the number was wrong in a way that mattered: coverage went 10.6 to 22.5 percent while the headline figure went 147 to 189, so the figure moved OPPOSITE to the property it described for six consecutive audits. The generalisation: acceptance is granted to a CONDITION but silences the whole LINE, so any defect in what the line says inherits the exemption. When a warning has been accepted rather than fixed, its message text is unaudited by construction — the acceptance is precisely what stops anyone checking. Worth re-reading the wording of every standing accepted warning on that basis. Corollary that made this actionable: a metric which is a DIFFERENCE between two independently moving quantities cannot report direction, because only one of them is under anyone's control on a given day; report the ratio and the delta of the controllable term instead."
  source: P-001
  task: T-525
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-222
  learning: "CONTINUOUS DECAY IS USUALLY NOT DECAY — IT IS A CONSTANT FAULT WHOSE CONSEQUENCE SCALES, AND THAT DISTINCTION DECIDES WHICH INSTRUMENT CAN SEE IT. AEF reported fw doctor at 222s and framed it as gradual degradation with no event to bisect to. But their own measurement disproves the framing: 1.94 ms per fork, perfectly linear, one stat per tracked file. The per-unit cost never moved. The code forked per file on the day it was written and forks per file today; only N grew. So there was no decay event because there was no decay. Consequences: a budget on TOTAL cost fires only once the thing is already unusable AND fires on legitimate growth too, so the realistic response is to raise the threshold rather than investigate, which trains dismissal; a budget on PER-UNIT cost never fires at all, and it is the one that feels rigorous; what catches it is an assertion about the SHAPE of the cost function ('must not spawn a process per tracked file'), which is true or false independently of N, was false on day one, and needs no timing, no load isolation and no threshold to argue about. The general rule: values are supposed to move, which is exactly why value-based instruments are blind to this class; shapes are not supposed to move, so when a quantity legitimately grows stop asserting the quantity and assert the invariant that holds at any size. Honest limit: shape assertions require someone to NAME the forbidden shapes, which is a design judgment rather than a measurement, so this is not free. Same shape found in our own tree by applying it: the bridge suite launches a browser PER CDP probe and gains a probe roughly every task — structurally identical, present since the first CDP probe, and the reason wall-clock went 103s to 168s in T-509."
  source: P-001
  task: T-525
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-223
  learning: "A FIX APPLIED TO THE INSTANCE THAT RAISED IT DOES NOT REACH THE POPULATION, AND THE POPULATION KEEPS GROWING BY COPY. T-326 diagnosed that a leg discarding its own failure output makes an intermittent failure permanently undiagnosable, wrote that reason into the source, and wired the remedy into 4 legs. Measured today: 66 report FAIL calls, 4 show_output calls. Every probe added since was written by copying a leg that discards, so the defect propagated by the same mechanism that should have propagated the fix. This is the third instance in a week (T-508: one teeth script wired, 24 existed; T-509: 22 of 24 had no standing caller; now this), which makes it a class rather than three accidents. THE TELL IS CHEAP AND NOBODY RUNS IT: count the calls to the remedy against the calls to the thing it remedies. 4/66 is visible in one grep and had been true for weeks. THE REASON IT HIDES: a fix is recorded as a TASK, and a task closes; nothing re-asks whether the remedy still covers the population, because coverage of a growing population is not a property of the task that introduced the remedy. A ratio is the instrument, not a count — 4 was never wrong, 4-of-66 is."
  source: P-001
  task: T-526
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-224
  learning: "AN APPEND-ONLY REGISTER WHOSE ENTRIES NEVER REFERENCE EACH OTHER MANUFACTURES CONFIDENT WRONG CLAIMS, AND THE FAILURE IS SILENT BECAUSE EVERY ENTRY IS INDIVIDUALLY CORRECT. Measured instance: OBS-250 recorded a flake with the leg unnamed; OBS-255 localised it three hours later; OBS-256 asserted seven hours after THAT that the leg was never named, and the false claim was transmitted to a peer project. All three entries are accurate as of their own timestamp and all three read 'pending'. Nothing links them, nothing flags an entry that reopens a resolved one, and the file is read chronologically so a reader who stops at the first hit gets the OLDEST state of the question. THE DIRECTION IS THE POINT: this gets monotonically likelier as the register grows, so a register with 30 pending entries is not 30 times as useful as one with 1 — past some size it starts producing negative-value claims, which is worse than having no register, because a wrong claim carrying a register ID is trusted more than an unsourced one. GENERALISATION BEYOND THE INBOX: the same shape holds for any store where writes are cheap, reads are chronological, and resolution is recorded as a NEW entry rather than a change to the old one — changelogs, decision logs, gap registers. The discriminating question is not 'is each entry true' but 'can two entries contradict without anything noticing'."
  source: P-001
  task: T-526
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-225
  learning: "A PROBE'S COVERAGE GAP IS A FACT ABOUT THE POPULATION IT WAS AIMED AT, NOT ABOUT THE RIGOUR OF ITS CONTROLS — SO NO AMOUNT OF CARE ABOUT THE ARMS YOU HAVE WILL SURFACE IT. T-523 asked whether children survive subProcess containment, and answered it correctly with two well-controlled arms, both injecting a subProcess WITH children — necessarily, because containment is only answerable when something is contained. AEF then measured their own corpus and reported that every subProcess they publish is CHILDLESS, three maps plus three drafts, zero contained flow nodes. So the pair covered 100% of the question I asked and 0% of their actual usage, and the property they depend on (does the ELEMENT TYPE survive) sits adjacent to the one I measured. THE STRUCTURAL POINT: the gap was invisible from inside because every internal check was about whether the arms tested what they claimed, and they did. Only the consumer's population could reveal that the claim was about the wrong thing. THE DISCRIMINATING QUESTION to ask of any conformance probe is therefore not 'are my controls sound' but 'what shape does the consumer actually send, and does any arm contain it' — and that is answerable only by asking them or reading their corpus, never by inspecting my own instrument. COROLLARY worth the same weight: 'the uid came back' is the answer to a question nobody asked. Report WHAT the thing became, not whether it was preserved — a boolean would have made me confirm a retype-to-task that never happened (it fell back to serviceTask) and tell a peer project so."
  source: P-001
  task: T-528
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-226
  learning: "A wrong REFUTATION is more dangerous than a wrong measurement, and it can sit on entirely correct numbers. T-526 killed the cron-contention hypothesis because cron writes landed in green runs; T-527 showed the exposure window is per-leg (61s) not per-run (305s) and that the deciding property is whether the write PERSISTS, so the refutation tested a proposition nobody held. Every number in T-526 was right — the error was one level up, in reasoning built on them, which is why re-running and re-checking would never have found it. A measurement that is wrong invites correction; a refutation that is wrong CLOSES the investigation, and it gets transmitted (rail 11929) as settled."
  source: P-001
  task: T-527
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-227
  learning: "Instrumentation that merely stops destroying evidence is prior-independent for free, and it works retroactively. AEF's argument (rail 11937) is that errors with plausible shapes survive measurement because plausibility is a function of your own priors, so catching them requires a path that does not share the prior — but deliberately building such a path requires already suspecting the error, which is the part that fails. T-527 sharpens it: the independent path need not be a check, need not be aimed at the belief, need not know the belief exists. Replacing '> /dev/null' with a captured file on 23 legs, for unrelated reasons, made the very next run print the offending script's NAME — reopening a conclusion already published to a peer and closed. Cost about an hour and finds nothing on demand; it changes the odds that an error, when something eventually trips over it, is legible instead of a shrug."
  source: P-001
  task: T-527
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-228
  learning: "A completion gate must assert a property that must REMAIN true, never a number that WAS true. T-527 pinned 'show_output == 27' in its own Verification, then added a leg containing a show_output call, and P-011 blocked its own author within the same task — the G-015 defect (a count of an always-moving population) committed inside the task whose subject is that class. Bumping 27 to 28 restores green and preserves the defect for whoever next adds a leg. The remedy is an invariant ('zero if-guards discard'), which does not move as the population grows, plus an abstention (rc 2) when the thing that makes the invariant meaningful is missing — 'zero discards' is vacuously true of a suite whose capture helper was deleted."
  source: P-001
  task: T-527
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-229
  learning: "A corpus byte-measurement must be validated against git before it is interpreted, because os.path.getsize FOLLOWS symlinks and git does not. T-530 measured .context/handovers at 474 files / 15.06 MB from the working tree and 474 files / 14.96 MB from git ls-tree — identical file count, 0.10 MB apart. Cause: LATEST.md is a symlink to the newest handover, stored by git as a ~0 KB blob holding the target path and reported by getsize as the full 99.3 KB, so the newest file was counted twice. Corrected figure is 473 files / 14.96 MB, delta 0.00. The error was small, in the flattering direction (a bigger corpus makes the finding louder), and would have survived review because 15.06 vs 14.96 reads as rounding. Adopted from AEF's L-608 and it caught a defect in my own instrument on first use."
  source: P-001
  task: T-530
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-230
  learning: "Session handovers grow because the handover renders every ACTIVE TASK inline — the size is the backlog, paid once per session, forever. Measured T-530: 62.6% of all handover size growth is the '## Work in Progress' section alone, and that section tracks distinct T- refs (5 refs/1.1 KB -> 140 refs/61.3 KB). The 2026-08-08 handover is the discriminating datapoint: total size went DOWN as task count went down, which a pure time-trend does not predict. So a 13x mean-file-size growth is not a handover-writing defect and no retention policy addresses it: deleting old handovers is a one-time reclaim that does nothing to the slope, while closing or parking an active task shrinks EVERY future handover. The cost is of carrying work, not of doing it."
  source: P-001
  task: T-530
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-231
  learning: "When a share reverses and its numerator does not, believe the numerator — PL-222 caught in own data. T-530's handover series shows zero reversals in bytes and zero in mean file size across every weekly point, but the SHARE of .context/ reverses at 2026-07-20 (45.1% -> 39.2%) purely because the denominator grew faster that week. The share is the figure both projects instinctively quoted (AEF's 68%, T-529's 55%) and it is the only one of the three that can lie about direction. Related trap in the same task: T-529's 55% and T-530's 61.5% are NOT comparable — different instrument (du block-rounding vs byte sums) and a denominator that moved when cron audit files were deleted. Two numbers about 'the same thing' are only a trend if the instrument and the denominator both held still."
  source: P-001
  task: T-530
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-232
  learning: "A channel's own analytics tools can be blind to the traffic on it, and the blindness is invisible because they return 0 rather than erroring. termlink_agent_first_post_by and termlink_agent_search_by both filter msg_type=='post'; the entire 832-AEF arc conversation is msg_type=='note'. Measured: agent_search_by(query='832-Workflow-designer') returns count 0 while channel_search finds 20 envelopes for the same string in the same offset range. first_post_by on a real fingerprint returned found:false, which reads as 'this agent never posted' and actually means 'no envelope of the filtered type'. Anything built on those tools — digests, attribution, who-said-what counts — reports on a different population than the one humans are reading, and reports it as an empty or small result rather than as an error."
  source: P-001
  task: T-531
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-233
  learning: "Before escalating a cross-project anomaly, grep the shared framework's source for it — the condition may already be documented as a deferred known. AEF discovered empirically that sender_id merges co-resident agents and asked which end re-keyed. agent-conversation-status.sh:87-94 already says verbatim: 'sender identity is multi-source on shared hosts', priority .metadata.agent_id // .metadata._from // .sender_id, and '.sender_id (envelope fingerprint - collapses co-resident agents) ... deferred to T-1693, so chain falls through to .sender_id'. The readers were already written to prefer explicit identity; only the producers do not populate it. That changes the remedy from a config-parity question to 'finish the deferred producer half', and it changes the framing from surprise to known-debt. Related: the two-party framing was also wrong — first_post_by on the shared fingerprint returned a THIRD project (050-email-archive), predating the observed switch window."
  source: P-001
  task: T-531
