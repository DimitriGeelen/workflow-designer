- id: PL-088
  learning: "A comparison baselined on the MUTATED input cannot observe its own subject: if the mutation erases the victim's reference, the victim is absent from the before-set, so the diff can only ever report collateral movement — and it returns a confident, clean zero. Baseline from the ORIGINAL artifact and identify the subject by its stable id (aef:uid), not by a computed display name that the change under test recomputes."
