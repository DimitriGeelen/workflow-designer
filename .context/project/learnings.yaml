  task: T-471
  date: 2026-08-12
  context: Added via context agent
  application: TBD
- id: PL-171
  learning: "A task's frontmatter description: outlives the body's corrections, because correcting the body is where the work feels finished — and the field is what every listing, handover and task view renders. T-443's description said 'TRIGGER: AEF answers DM 548 s5'; its ## Context four lines below opened 'AEF HAS RULED: KEEP THE PATH'. The stale field was read as current state 32 rails later and the answered question was put back to the peer who answered it. Frontmatter is a cache with no invalidation. Third instance this session (T-466, T-209, T-472). Detector: tools/_t472-stale-trigger-field.py."
