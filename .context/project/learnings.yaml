- id: PL-198
  learning: "HTTP 200 is not evidence of identity — it is the shape of the right answer. Handed the operator a Watchtower link that served another project's dashboard, having curled the URL and treated the 200 as confirmation. The disconfirming evidence was already printed two lines earlier ('pid 8448 NOT running') and I reasoned it away as a stale pid rather than reading it as 'this is not our server'. Verify identity with something the wrong server cannot also satisfy (here: /api/_identity returning project_root), never with reachability. Related failure the same hour: testing that matcher in a bare shell without exporting PROJECT_ROOT made it reject our OWN server, and I nearly filed that as an upstream defect — the harness, not the subject."
