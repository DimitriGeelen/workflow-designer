- id: PL-172
  learning: "A census written with 'grep | head -N' is a sample presented as a complete set, and it reads as complete in the write-up. T-475's census of a false-premise carrier used head -3, found the two occurrences it expected, and missed three more in the same file (a GO rationale reproduced verbatim in three record blocks). They surfaced only because a verification leg asserted 'no unannotated occurrence' and went red. Rule: when the deliverable is completeness, the measuring command must not be truncated - and pin the count, so a later addition cannot slip in unnoticed."
