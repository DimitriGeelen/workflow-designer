- id: PL-154
  learning: "A gate that cannot report 'I could not evaluate' will report 'pass'. The push gate's audit exits 0 on lock contention and the hook blocks only on 2, so zero-checks-ran and 19-checks-clean are the same verdict (T-435, AEF OBS-221). Design the third value into the protocol when writing the gate, not when reading its output."
