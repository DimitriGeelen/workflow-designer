- id: PL-235
  learning: "A static classifier gets WORSE as authors document the pattern it detects, unless it strips comments. T-533's census flagged both files it had just certified, because the fix's own explanatory comments contained `git status --porcelain` in backticks and backtick is a shell-invocation prefix. Incentives inverted: writing a clear comment about the defect creates a false positive, so the pressure is to under-document exactly the thing that needs explaining. Second instance in the same task: hoisting the pathspec into a SCOPE variable made the call site read as unscoped, because the classifier judges argv syntactically — fixed by inlining the pathspec, which is better code regardless. General rule: when a checker's subject is source text, its own prose and its subjects' prose are part of the input, and both must be excluded deliberately rather than by hoping the regex misses them."
  source: P-001
  task: T-533
  date: 2026-08-15
