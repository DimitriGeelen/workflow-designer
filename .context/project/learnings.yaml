  learning: "Check that a mutation had an EFFECT, not merely that it LANDED. T-321 taught 'assert the mutation landed before reading the verdict' — a sed matching nothing prints output identical to a clean pass. T-326 found the next layer: the mutation landed (file sha moved, anchor occurrence asserted =1) and still produced no failure, because the thing mutated was ignored by the subject (an unknown CLI flag the test scripts silently accept). Landing is necessary and not sufficient. A teeth run must show the subject BEHAVING differently, not just the tree being different."
