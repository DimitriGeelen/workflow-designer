  learning: "A probe whose transform direction is fixed by the probe table rather than derived from the claim it tests cannot falsify that claim. T-325's first polarity probe transformed a real fixture and asserted the rule fell silent — and would have passed identically with the polarity label flipped, because the direction came from the table, not from the declared polarity. It looked like behavioural evidence and was decoration. Fix: derive the transform direction FROM the declared property (REQUIRES must be silenced by ADDING the carrier, CONSTRAINS by REMOVING it) so a wrong label fails. Test to apply: would this probe have come out differently if the label were wrong? If not it is zero evidence, the unfalsifiable-classification trap wearing a probe's clothes."
