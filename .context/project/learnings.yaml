  learning: "Do NOT mark machine-checkable functional tests as Human [REVIEW] ACs. T-174's 'authors offline / export-import round-trips / no console errors' was mechanically verifiable (Playwright: serve artifact statically, call buildBpmnXml(state)+parseBpmnXml, assert node/flow/aef counts survive) — should have been an Agent AC or [RUBBER-STAMP], never [REVIEW]. [REVIEW] is for genuine human JUDGMENT (tone/UX/architecture), not functional smoke tests the agent can run headless. Second instance of over-gating (cf. 'a go is a go, a review is a review')."
