- id: PL-203
  learning: "An exit branch placed AFTER a loop that can also fail is UNREACHABLE whenever the loop fails, so a control asserting only the exit code certifies a line that never executed. T-509's sweep checked stale exclusions, then ran 19 scripts, then exited on stale — but the run-failure exit came first, so with the exclusion list mutated the control saw rc=1 off the RUN branch while the stale branch had never run. rc alone could not tell the two apart and the control read green. Two fixes, both cheap: move the branch BEFORE the work it guards (also correct on the merits — a sweep driven by an exclusion list known to be wrong produces a verdict about the wrong population), and assert something only that branch produces. The tell that caught it was TIMING: the correct version fails in 0s because the run loop never starts, the wrong one takes ~90s. When two failure paths share an exit code, the control must discriminate on message, side-effect or wall-clock — never on rc. Same family as T-491's control C passing because set -e aborted before the assertion"
  source: P-001
  task: T-509
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-204
  learning: "Inferring a tool's failure MECHANISM from an exit code obtained by invoking it DIFFERENTLY than its caller does. T-509 reported _t364-t308-teeth.py's control red and published the cause as 'the teeth script's own stored reference shas went stale'. It stores no shas: run() passes REF=3bf37909~1 to _t308, so the comparison is CURRENT BUILD vs A PINNED GIT REF. I had run _t308 bare, with no ref argument, seen rc=0, and reasoned 'the gate is fine, so the teeth's own baseline must be stale' — two different comparisons treated as one, and the wrong one was the one I ran. Reading run() takes ten seconds and was skipped because a plausible story already fit the evidence. TWO TRANSFERABLE TELLS. (1) UNIFORMITY: all 24 maps drifted by EXACTLY +51 bytes, which is a shipped line (T-399's exporter=\"aef-workflow-designer\", 18 spaces + 32 chars + newline) and never decay — decay is ragged, a shipped change is uniform, so a constant delta across a whole corpus means 'somebody changed the producer', not 'the reference rotted'. (2) When reproducing a failure, invoke the failing tool THE WAY ITS CALLER INVOKES IT, argv included; a bare run is a different experiment wearing the same name. The conclusion 'a pinned baseline decayed silently, and nothing ran the thing that would have said so' survived intact — only the mechanism was wrong, which is the dangerous shape: a correct headline makes nobody re-check the sentence under it. Sibling of PL-203 (a control that discriminates only on rc cannot tell two failure paths apart)"
  source: P-001
  task: T-510
  date: 2026-08-15
  context: Added via context agent
  application: TBD
- id: PL-205
  learning: "A probe that reports an ABSENCE — nothing was dropped, no violations found, no drift — is indistinguishable from a probe whose comparator is dead, and the two failures produce byte-identical output. The only thing that separates them is a control that deliberately creates the absence and requires the probe to report it. Measured twice in one day: T-510's teeth-vs-gate mechanism error (PL-204) and T-511's round-trip probe, which reported 'YES, both unwired nodes dropped' because it compared element id, the one attribute the exporter is documented to re-mint, so a rename read as a deletion. In T-511 the verdict was FALSE and about to be posted to a peer project over the rail; what stopped it was not review and not care but the negative control failing to fire, which turned an odd result into an undeniable one. The tell is available before the control: when a probe reports a dramatic absence, check whether its OWN counters agree with its verdict — ids_in and ids_out were both 38 while it claimed two nodes were gone. Cheap, mechanical, and it fires before anything is published. So: any probe whose green means 'X did not happen' must carry a leg that makes X happen and watches it go red, and the leg must operate on the SAME identity the comparator reads — cutting on something it does not consult proves nothing about it."
  source: P-001
