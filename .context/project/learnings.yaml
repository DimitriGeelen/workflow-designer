- id: PL-194
  learning: "The derived-root harness class was already written down in this tree, correctly, three days before it was 'discovered'. tools/_t429-zero-leg-probe.sh (2026-08-11) states the class, the diagnosis and the remedy verbatim: 'A copy in /tmp resolves that to /tmp and the suite dies on its own setup — which would produce a non-zero exit for the WRONG REASON'. It was then rediscovered independently four times (T-494, T-495 x2, T-496), and the remedy was offered to AEF at rail 619 'as cheap rather than clever'. The knowledge lived as PROSE IN A FILE HEADER — the one location T-495 established nothing indexes, greps, or reports dark. A lesson recorded only in the comment of the tool that learned it is not recorded."
