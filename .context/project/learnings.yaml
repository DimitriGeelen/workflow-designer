  application: TBD
- id: PL-107
  learning: "A zero from an unvalidated probe is not evidence of absence. Checking whether canvas navigation shipped, I grepped for 'zoomLevel' and got 0 in both the old and new artifact — a clean, confident 'never shipped' finding. The real identifier is 'zoomFactor' (11 occurrences in both src and the release). The zero was my invented token, not a property of the system. Run any absence-probe against a known-positive carrier first, or you report your own typo as a fact about the artifact."
  source: P-001
  task: T-360
  date: 2026-08-03
  context: Added via context agent
  application: TBD
- id: PL-108
  learning: "A remedy and its verifier can be keyed to different quantities, so the verifier reports FAILURE exactly when the remedy SUCCEEDS. cohort-hub T-953 proposed (i) deploy by POSTing the newest local vN to /api/save and (ii) audit by comparing disk-latest vs server-latest. Version ordinals are issued by the SERVER from its own store (designer_api.py:138 and gallery-serve.py:627 agree, so it is contract behaviour, not a quirk): POSTing disk-v12 to a server at 9 writes v10. The audit then reads 12 vs 10 and reports drift forever - red on success. Both halves were written in one document by one author, each checked against the SYMPTOM and never against the other half. Test: does the verifier measure a quantity the remedy actually controls? Fix: compare content (sha of /api/version bytes), not ordinals."
  source: P-001
  task: T-362
  date: 2026-08-03
  context: Added via context agent
  application: TBD
- id: PL-109
  learning: "A check can be structurally unable to fire, and that is byte-identical to a check that passes. T-358: the probe's totality check was 'seen.some(v => v === undefined)' over an array built with '.filter(Boolean)' -- the filter strips exactly the values the check exists to find. It sat inside an otherwise correct, green probe and would have reported 'the partition is total' for a build where the field was deleted outright. Only the mutation harness found it: case 3 was green when it should have been red. Rule: for every check, ask what input would make it fire, then construct that input. If you cannot, the check is a constant. Related shape: an exemption that cannot fail for existing wrongly (T-361), and a bucket that has never filled (T-361 '0 current, 106 legacy')."
  source: P-001
  task: T-358
  date: 2026-08-04
  context: Added via context agent
  application: TBD
- id: PL-110
  learning: "A diagnostic computed at READ time is erased by the WRITE it describes. T-358's laneProvenance correctly reports 'defaulted:no-laneset' on import, but our own emitted output re-imports as 'authored' — one save and the fabricated assertion is indistinguishable from a human-authored one, by our own instrument. The signal is a parse-time property, not a document property, and it dies at exactly the act that makes the defect permanent. Ask of any provenance/diagnostic signal: does it survive the operation that makes the thing it describes canonical? If not, a report-only remedy cannot reach the corpus and cannot reach anything already written. Corollary found in the same measurement: sibling guards keyed on DIFFERENT predicates (importer on !x.length, emitter/getLanes/addLane on !x) mean a repair at the site everyone points at flows through the others untouched — [] is truthy"
  source: P-001
  task: T-358
  date: 2026-08-04
  context: Added via context agent
  application: TBD
- id: PL-111
  learning: "Mutation teeth can catch a BLIND INSTRUMENT, not just a missing guard. A T-389 idempotence leg asserted 'topic length unchanged' via a helper that parsed 'channel state --json' as {rows:[...]} when it is a BARE LIST — the helper returned -1 on every call, so the leg compared -1 to -1 and went green: a length check that never read a length. The teeth (disable the guard, require a duplicate to appear) went RED while the leg they protect stayed green, because no duplicate could 'appear' through a dead measurement. Remedy: a parse-failure sentinel must be an explicit REJECTION at the call site, never a value — otherwise a failed measurement is indistinguishable from two values agreeing."
  source: P-011
  task: T-389
  date: 2026-08-08
  context: Added via context agent
  application: TBD
- id: PL-112
  learning: "A gate that runs authored lines one-per-command must first ask the shell whether each line IS a complete command (bash -n: exit!=0 = fragment, stderr!=empty = unterminated heredoc). Otherwise a multi-line construct is torn apart and its body lines execute as bare shell in the gate's cwd. Do NOT enumerate dangerous tokens: the danger is not that 'import' is a python keyword, it is that it is a complete shell command that writes and exits 0 — so the gate reports PASS for a program nobody invoked."
  source: P-011
  task: T-391
  date: 2026-08-08
  context: Added via context agent
  application: TBD
- id: PL-113
  learning: "A clone-based probe tests COMMITTED state, not the change under test. tools/_t396-release-tag-state.sh cloned the repo to drive both branches in isolation; the script change was uncommitted, so both branches ran the previous version and four legs went red for a cause unrelated to either branch. The red was luck: had the change been a no-op-looking addition the legs could equally have gone GREEN against the old artifact. Same family as rehearsed-in-the-wrong-shell and the T-391 mutant that died before reaching the gate. Fix: overlay the working-tree file into the clone after cloning, and say why in the probe. General rule: any probe that materialises its own fixture from git (clone, worktree, git show, archive) is testing a REF, and the ref is almost never the working tree you are editing."
  source: P-001
  task: T-396
  date: 2026-08-08
  context: Added via context agent
  application: TBD
- id: PL-114
  learning: "Competing-carrier rule: preserve-and-re-emit is the right semantics for content an importer does not consume, UNLESS the importer generates a rival carrier for the same fact. Where it does, preservation makes export write BOTH the preserved original and the generated one — a self-contradictory document, which is worse than the loss it was meant to fix. Corollary for reasoning about precedent: a ratified decision at one granularity does NOT automatically transfer to a sibling granularity. Test the transfer by asking 'do we generate a competing carrier here?' rather than assuming uniformity. Measured on 832: T-337 foreign tag (no rival, preserve, shipped) and T-347 element content (no rival, preserve) vs T-340 BPMN DI (rival = aef:position we generate, so consume)."
  source: P-001
  task: T-397
  date: 2026-08-08
  context: Added via context agent
  application: "MEASURED since T-419 (2026-08-10). The rule's factual premise — which
    granularities we generate a rival carrier for — was prose in a brief and three task
    files until `tools/_t338-input-fidelity-cdp.mjs` leg 8 (population 7) began deriving
    it from the round trip: feed the importer a fact in standard form only, and observe
    whether the exporter emits a representation the input never had. EXPECTED_CARRIER
    pins today's answer per row and fails in BOTH directions. This matters because the
    DI row's premise is scheduled for deletion: T-357 proposes retiring `aef:position`,
    which would silently void T-340's ruling. Mutation-checked by
    `tools/_t419-carrier-mutation-check.sh`. Instrument adopted from AEF (rail 487,
    their `test_di_drop_has_a_competing_carrier`) and widened — theirs pins the one
    'yes' row, ours pins all three, because a 'no' row expiring inverts a ruling just as
    completely."
- id: PL-115
  learning: "Fixing a gate does not replay what it blocked. When a gate correctly refuses an edit, two acts are needed: fix the gate, and REDO the refused edit. Only the first has anything forcing it — the block is loud, the fix feels like closure, and the un-restored edit leaves no trace, so session notes truthfully record 'gate fixed' and 'edit intended' while the edit never landed. The gate's SUCCESS is what erases the evidence. Remedy: when a gate blocks an edit, record the blocked edit as an outstanding item before fixing the gate, and verify it landed after. Origin: AEF L-556 via rail 485 — their arc-017 T-2877 lost its prose-quality [REVIEW] AC exactly this way (our Half B invariant refused the edit on a tag-matching bug; they fixed the invariant, never restored the AC), so a deliverable whose entire value is how it reads to a newcomer shipped with zero operator review. Applies to every gate on both sides: G-020 blocked this session three times and restoration depended on habit, not mechanism."
  source: P-001
  task: T-398
  date: 2026-08-08
  context: Added via context agent
  application: TBD
- id: PL-116
  learning: "A filter keyed on POSITION in a shared log silently stops being sufficient the moment the log gains a second writer. The budget gauge had three defenses (compact_boundary reset, session-start-ts filter, <synthetic> skip) and all three missed a foreign-model entry because all three ask WHEN a record was written, and none asks WHOSE conversation it belongs to. Until a second writer appeared, every entry belonged to the conversation by construction, so the question had never needed asking. When a log acquires a new writer, audit every filter over it for the position-vs-identity assumption."
  source: P-001
  task: T-401
  date: 2026-08-09
  context: Added via context agent
  application: TBD
- id: PL-117
  learning: "A false-positive that self-clears is nearly undetectable, and is worse than one that persists. The budget gauge's poisoned reading blocked only while its cache was <90s fresh, then re-read healthy. So it struck exactly at session resumption and looked fine by the time anyone investigated. When triaging 'it was broken but works now', treat the self-clearing as a property of the defect to be explained, not as evidence that nothing was wrong."
  source: P-001
  task: T-401
  date: 2026-08-09
  context: Added via context agent
  application: TBD
- id: PL-118
  learning: "A test corpus that only asserts the permissive half is not teeth. When T-404 broke the write-predicate wide open (the strip loop never ran, so every command read as 'not a write'), the 15 benign-command assertions all passed — a predicate that returns false for everything trivially satisfies 'benign forms must pass'. Only the genuine-writes half caught it. Whenever a fix WIDENS what is allowed, the must-still-be-caught list is the load-bearing half of the test; write it first and treat a green benign list as no evidence at all."
  source: P-001
  task: T-404
  date: 2026-08-09
  context: Added via context agent
  application: TBD
- id: PL-119
  learning: "Two bash traps that fail SILENTLY inside hook predicates, both hit in T-404. (1) In 'local s=$1 out= n=${#s}' bash expands every word BEFORE performing any assignment, so ${#s} reads the not-yet-assigned s and yields 0 — a length-driven loop never runs and the function returns a plausible-looking empty result. Declare the derived variable in its own statement. (2) bash's =~ uses the system ERE engine, where glibc gives \\\\> the meaning 'end of word' — so a pattern written \\\\>\\\\>? matches word boundaries and never sees a redirect character. Write [>] instead. Neither raises an error; both produce a predicate that quietly answers 'no' to everything."
  source: P-001
  task: T-404
  date: 2026-08-09
  context: Added via context agent
  application: TBD
- id: PL-120
  learning: "A predicate can be answering a question its input does not have. is_bash_safe_command extracted 'the base command' as the first word — but a compound command (cd X followed by a recursive delete, or any multi-line script) has no single base, so the function returned a plausible string either way and nothing looked wrong. The fix was not a better extractor but a different question: judge every segment, all must pass. Watch for this shape — a helper whose name presupposes a unique answer (THE base, THE target, THE owner) applied to inputs that can carry several. It fails quietly in BOTH directions: a destructive compound was allowlisted wholesale on the strength of its leading 'cd', and every multi-line read was blocked."
  source: P-001
  task: T-405
  date: 2026-08-09
  context: Added via context agent
  application: TBD
- id: PL-121
  learning: "When a peer authors to your published standard, every structural marker you emit becomes shared BY DESIGN — namespaces, targetNamespace, id shapes — because conforming is the point of the standard. Identity therefore cannot come from any field describing the process; it has to come from a field describing the PRODUCER. Check the standard first: BPMN already defines exporter on definitions, and every real emitter in our third-party corpus stamps it while our own output was the only one that stayed silent."
  source: P-001
  task: T-399
  date: 2026-08-09
  context: Added via context agent
  application: TBD
- id: PL-122
  learning: "A scope pre-filter can be load-bearing for correctness while reading as a cheap optimisation. The T-361 guard's continue-unless-prefix-present line looked like a fast path and was actually the answer to who wrote this. Its failure mode is silent WIDENING: it can only ever pull more documents into scope, and in a guard that reports offenders every wrongly-included document becomes an accusation. A red naming a file always reads as that file is broken and never as the check misidentified whose file this is."
  source: P-001
  task: T-399
  date: 2026-08-09
  context: Added via context agent
  application: TBD
- id: PL-123
  learning: "Rank a proposed default by whether each competing failure has a live witness. Choosing between two harms, prefer the one that is hypothetical over the one that is measured — a guard protecting against a real past incident outranks a plausible argument about an unwitnessed one, even when the argument is sound. The reversal signal is cheap to get: run the suite before believing your own reasoning."
  source: P-001
  task: T-406
  date: 2026-08-09
  context: Added via context agent
  application: TBD
- id: PL-124
  learning: "A gap whose remedy needs an operator ruling still needs CONTAINMENT while it waits, or the population the operator will rule on keeps moving under them. G-015 was filed 2026-08-02 with 11 hard-coded-port carriers; seven days later there were 17, authored while the gap was open, documented and severity-medium. The ratchet (baseline the known population, fail only on new members) is the containment shape: it changes nothing the operator must decide, and pins the number they decide about."
  source: P-001
  task: T-408
  date: 2026-08-09
  context: Added via context agent
  application: TBD
- id: PL-125
  learning: "A prose ban is not enforcement, and this is now measured rather than argued. CLAUDE.md banned hard-coded ports in verification lines, the gap register described the defect at length, and a checker existed — but it took a task ID as argv[1], so nothing scanned the population. Six new violations landed in seven days. If a rule matters, something must read the whole population; a per-item checker enforces nothing about the set."
  source: P-001
  task: T-408
  date: 2026-08-09
  context: Added via context agent
  application: TBD
- id: PL-126
  learning: "Teeth that only mutate CONTENT are blind to the LIFECYCLE operations the framework itself performs on the artifact. T-408 shipped ten green legs, every one editing a task file in place; none moved one. But work-completed MOVES task files active/ -> completed/, so a baseline keyed on relpath fired a false red on the very tasks waiting for the ruling. When guarding an artifact the framework moves, renames or archives, the test vocabulary must include those moves."
  source: P-001
  task: T-409
  date: 2026-08-09
  context: Added via context agent
  application: TBD
- id: PL-127
  learning: "A schema whose field names are 'obviously' right is where silent inertness hides, and it fails in BOTH directions. Census the register: of 20 field names only 6 were read by any code. The two near-synonym pairs suspected of hiding a load-bearing member (detail/description, related/related_tasks) turned out to have NEITHER member read — the danger was never that the wrong one was load-bearing, it was that both look like they are. And the mirror query found the more interesting half: closure_check_command, last_reviewed and created are READ by lib/gaps.py and carried by 0 of 25 entries, so correct machinery sits inert with its input never arriving. When auditing a schema, always run the read-but-absent query too; present-but-unread is only half the defect."
  source: P-001
  task: T-400
  date: 2026-08-09
  context: Added via context agent
  application: TBD
- id: PL-128
  learning: "A near-synonym detector keyed on a shared substring cannot catch near-synonyms. The audit grew a check that flags an alternate field name only when it contains 'trigger' — but the field that caused the gap was 'closure_condition', which does not. Sharing a substring with the field you shadow is precisely what near-synonyms do not do. The only reliable separator between 'a field the code reads' and 'a field that looks like one' is an explicit allowlist of the former, with each entry naming its reader so the claim stays checkable."
  source: P-001
  task: T-400
  date: 2026-08-09
  context: Added via context agent
  application: TBD
- id: PL-129
  learning: "A secret scanner built on vendor prefixes (AKIA, ghp_, sk-ant-) is structurally blind to the secrets the framework GENERATES ITSELF: secrets.token_hex(32) has no third-party fingerprint to anchor a specific pattern on. The class of secret a system is guaranteed to produce is the class its own prefix-based scanner is guaranteed to miss. Fix the AXIS (read filenames over git ls-files), not the pattern list."
  source: P-001
  task: T-410
  date: 2026-08-09
  context: Added via context agent
  application: TBD
- id: PL-130
  learning: "Rotate BEFORE untracking a committed secret. git rm --cached produces a repo that LOOKS clean and a key that still signs — the value stays readable in history and in every existing clone. Untracking is bookkeeping; rotation is the remedy. History rewrite is Tier 0 defence-in-depth AFTER rotation, never instead of it."
  source: P-001
  task: T-410
  date: 2026-08-09
  context: Added via context agent
