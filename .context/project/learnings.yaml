- id: PL-091
  learning: "Two checks over the same question agreeing is only evidence if BOTH could have disagreed. An inert check (empty input set, or the same verdict on every branch) agrees with everything, and converts a shared blind spot into apparent independent corroboration. Vary the input and require them to move together; make 'they disagree' red rather than something a reader must notice."
