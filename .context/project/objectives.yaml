# Project objectives — 832-Workflow-designer.
#
# Authored intent; progress is derived, never written here.
# Arcs reference these ids via `supports: [O-n, ...]`.
#
# Drafted under T-986 (2026-10-05) from this project's own material only:
# docs/832-project-purpose-and-goals.md (T-874, the operator's 2026-09-27 statement, §1-§3),
# docs/aef-designer-integration-protocol.md, the corpus and its `aef:` vocabulary, and arcs
# 001-005. O-1..O-6 are that document's G1..G6. Its G0 (the method: nothing is asserted that
# cannot be wrong) is how these get built, not what the project is for, so it is not listed.
# Independently reviewed (T-986); corrections applied — see the task's Recommendation.
# Revised 2026-11-14 (T-1072) on the operator's rulings 1a-4a, after the sources review
# (docs/reports/T-1072-objectives-sources.md) and AEF's input (§6 there): O-4 now guards with
# advice and friction, refusal is AEF's runtime; out_of_scope #3 narrowed to "never executes or
# authorises"; new O-7 (deterministic-first, routing as a captured preference), O-8 (learning loop
# as a proposal to AEF), O-9 (lossless BPMN-to-procedure round trip, AEF's ask).
# Revised again 2026-11-15 after the external review (docs/reports/T-1072-external-review-answers.md)
# and the operator's rulings: O-2 no longer refuses; O-4 gains stalled-past-deadline, human-required
# with a reason, override who/why, strictness tied to ratification; O-5 is many projects plus field
# feedback; O-1 agrees with the canonical task; O-9 merged into O-6 (one interchange test, reverse
# render its own still-unmeasured part). Still a draft until the operator ratifies it (T-986).
#
# Stop conditions (purpose doc P5). The shape below has no field for these, so they are kept
# here for the operator to place: the project is worth stopping
#   - if AEF stops consuming the seam (an authoring surface nothing authors for is a drawing tool);
#   - if instances cannot be bound to their templates without hand-maintenance (O-3/O-4 collapse);
#   - if no project besides AEF can use it without project-specific changes (O-5).
headline: >-
  Workflow Designer is AEF's process add-on, for process authors, AEF agents and operators:
  it captures a process completely enough to execute it, so that a human and an agent can work
  the same picture from idea to running implementation. Processes are modelled once as
  templates (classes) and run many times as instances, for AEF and for other tenants.
objectives:
  - id: O-1
    text: >-
      A step on the diagram carries everything an implementer needs (its inputs, outputs,
      decisions, the artifacts it reads and writes, and its pseudocode), and it agrees with the
      task: tasks stay canonical, so where the picture and the task differ, that is a reported
      defect, never a silent difference.
    measure: >-
      Every carrier, pseudocode included, exists and round-trips; and for a fixed list of fields,
      a check compares each step with its task and reports every disagreement.
  - id: O-2
    text: >-
      A map says whether it is a picture of a process (documentation) or a plan of work, so AEF
      can tell the two apart when something is promoted into real governed work. The designer
      never promotes and never refuses; what a promote does with the marker is AEF's decision.
    measure: >-
      The marker is authorable, survives save, load and export, and reaches AEF in the exported
      contract; the designer has no promote action and blocks nothing on the marker.
  - id: O-3
    text: >-
      Every real instance (a task, an inception, a sprint item) knows which template it
      follows and which step it is on, and the system can answer that, not a person's memory.
    measure: >-
      Asked "what process is T-NNN following?", the framework answers with its template and
      its current node.
  - id: O-4
    text: >-
      A running process is observable, and the designer guards with advice and friction, never
      a hard block: it warns when a step is out of order, a human gateway is skipped or an input
      contract is unmet, always lets the author override with a record of who and why, and grows
      stricter only as a process matures from draft to ratified. Absence is a signal: a step can
      declare when it is expected to finish, and a step that neither finishes nor fails by then is
      shown as stalled. Humans are asked only where it matters: a step can be marked as needing a
      human, with its reason (destructive, risky, or uncertain), and other steps are not. Refusal
      is AEF's runtime behaviour, which the designer shows faithfully; the designer itself never
      blocks authoring.
    measure: >-
      An out-of-order advance, a skipped human-required step and an unmet input contract each
      raise a visible warning and an override logged with who and why, never a block; a refusal
      by AEF's runtime is shown on the step it refused; a step past its declared deadline with no
      outcome is shown as stalled; a human-required mark carries one of the three reasons and
      survives export; and the operator can see which step an instance is on, which it failed or
      stalled at, and why. The override is never removed (the hatch never closes).
  - id: O-5
    text: >-
      The designer serves many projects. Each project designs its own workflows in its own copy
      (AEF, Greenfield, Sprind, and more to come), and nothing in the designer is specific to one
      project. The workflows those projects really draw come back to us as field feedback, and what
      we learn from them is built back into the designer. Each project's data stays where its own
      rules say (Greenfield's never leaves this machine).
    measure: >-
      At least two projects besides AEF draw their own workflows with it with no project-specific
      changes; their real maps are part of our feedback set; and each improvement they lead to is
      traceable to the map it came from.
  - id: O-6
    text: >-
      Work can start as a picture and existing work can be seen as one. Forward: the exchange
      with AEF is lossless, a map round-trips through the versioned interchange contract (BPMN to
      AEF procedure and back) within the frozen Mapping Standard's boundaries; this is what AEF
      consumes. Reverse: existing work (AEF's own record first, other code later) can be drawn
      as a picture.
    measure: >-
      Forward: every corpus map exports to the procedure form and back with no loss and no hand
      repair under the current frozen Mapping Standard version, and a change outside those
      boundaries is refused by the conformance tests, not shipped. Reverse: not measured yet;
      the first measurement is an instance that deviated from its template, drawn back as a
      picture that is both faithful and readable.
  - id: O-7
    text: >-
      A step can declare how it is meant to run: deterministic first (script or service), with
      an agentic fallback, and which kind of worker or model should take it. This routing is a
      preference captured in the workflow element; selection and refusal stay with AEF's runtime.
    measure: >-
      Executor kind and a routing preference are authorable on a step, survive save, load and
      export, and reach AEF as declared preferences in the exported contract; nothing in the
      designer selects or guarantees a worker.
  - id: O-8
    text: >-
      A process learns from use: when instances deviate from their template, the deviation can
      be turned into a proposed change to the template, sent to AEF as a new version for
      ratification, never applied silently to a ratified procedure.
    measure: >-
      A recorded deviation can be raised as a template-change proposal that names the template
      version it departs from; the ratified template stays unchanged until AEF ratifies the new
      version.
out_of_scope:
  - "A general-purpose BPMN editor. BPMN is the portable format, not the product."
  - "Replacing the task system. Tasks are canonical: a diagram proposes governed work and never authors it."
  - "Executing or authorising. The designer never executes, ratifies, resolves secrets, launches actions or approves gates; that is AEF's runtime (EWCR §5.1). Authoring definitions for execution and the diagram-to-procedure seam to the runtime are in scope."
