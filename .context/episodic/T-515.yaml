# Summary (auto-generated from git commit messages)
summary: |
  mapping standard section 6.3 had no machine check, and it is the sentence AEF's reverse renderer is built on. Section 6 lists four conformance requirements; T-182 built test_mapping_standard_conformance.py and it guards section 2 only, the frozen governance meta-key list. Requirement 3 — a stable, externally-assignable aef:uid on every node and edge — was unguarded on both sides, and section 5 turns it into a promise made to AEF by name: 'the reference editor's import path honors arbitrary aef:uid values, so a reverse renderer needs no editor change for identity.' That sentence licenses them to build against us without asking, which makes an unchecked claim in a standard worse than an unchecked claim on the rail: a standard reads as settled. ANSWER: it holds. 27 externally-assigned uids over a live corpus map — 14 nodes as T-42NN task ids, 13 edges as AEF-DEP-NNNN — all survive byte-identical, missing[] and unexpected[] both empty, and the second round-trip is byte-identical at 12385 bytes. Two claims measured separately because they fail independently: honouring every uid we supplied, and minting none of its own alongside them. T-513 measured the ABSENT branch where a uid gets derived from the element id; this is the PRESENT-AND-NOT-OURS branch, which is different code and the only one section 5 actually promises. Fixture is a real map with its identity externalised rather than an authored document, so only identity differs from a normal save. Refuses rather than passes in the two vacuous shapes: editor-shaped uids surviving the externalisation, and a corpus map carrying zero of either kind, since 'every node AND edge' cannot be tested over an empty half. Negative control mutates one uid and carries a stimulus_really_differs leg — PL-206 applied the day it was filed, asserting the mutation changed the parsed uid list rather than merely some bytes. Anti-overfit nudges an aef:position, which section 6.4 defines as a task-graph no-op. Wired: 84 passed, 0 failed. Rail post outstanding, AC deliberately unticked.. report the section 6.3 result to AEF at rail 11891 and tick the last AC. Post separates the three claims that fail independently — every supplied uid honoured, none minted alongside them, re-render byte-stable — because section 5 literally promises only the first and a reverse renderer needs all three. Also names the branch distinction: T-513 measured the ABSENT-uid path, this measures the PRESENT-AND-NOT-OURS path, and I had told them nothing about the second until now. Scope stated as does_not_cover with four named gaps and a recommendation of which to close first rather than a menu, since offering a peer a list without a view is work transferred rather than work done.

