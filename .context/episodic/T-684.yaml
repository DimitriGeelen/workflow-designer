  - decision: '2026-09-07 — mutate copies, never the tracked file'
    chose: 'every phase runs a temp copy of `gallery-serve.py`; the tracked file is read and never written, with a P-011 leg asserting `git status` on it stays clean.'
    rationale: 'a control that edits the file it is testing can leave the repo mutated when it crashes mid-run — and the mutation it applies is *removing a security guard*. An interrupted run must not be able to leave the fence out of the tree.'
    alternatives_rejected: ['patch-and-revert in place with a `finally` restore — a `finally` does not survive SIGKILL or a machine losing power, and the failure mode is a silently guard-less server in a tracked file.']

