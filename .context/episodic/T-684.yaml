    chose: 'three exit codes — 0 GREEN, 1 BREACH, 2 INCONCLUSIVE — with INCONCLUSIVE checked BEFORE the breach branch.'
    rationale: 'the failure being defended against is not "the fence broke", it is "the harness stopped being able to tell". Those need different exits because they need different human responses: a breach is a bug in the product, an inconclusive is a bug in the evidence. A two-valued control has to map the second onto one of the first two, and whichever it picks is a lie — GREEN hides it, RED cries wolf until someone disables the check.'
