# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-09-29 — where the two shapes live'
    chose: 'ACTOR in `update-task.sh` beside `:2356` (+ the class surfaced in `fw task delegate`); DETECTOR in `fw audit`, which is what cron already runs. Cron runs the detector and NEVER the actor.'
    rationale: 'the `owner:` field should have exactly one writer in code. `:2356` already sets `owner: human` on the partial-complete transition — precisely when a Human criterion becomes open. The revert is the same rule read backwards, so it belongs in the same function, fires on the same transition, and is audited the same way. Splitting it into a second writer elsewhere is how two mechanisms end up disagreeing about who owns a task. `fw task delegate` is the operator''s ratified delegation surface (D-626) and already has `--dry-run`; it should be able to SEE the class it is the surface for, which today it cannot. - **Rejected — the actor on cron.** This is the important rejection. An unattended sweep that strips `owner: human` across the corpus is the single most dangerous placement available: if the predicate is wrong, sovereignty is removed from N tasks with nobody watching, and the first symptom is a task closing that the operator wanted to see. Attended-only is not caution, it is the property that makes the ruling safe to implement. A detector on cron has the opposite risk profile — it can only over-report. - **Rejected — a PreToolUse/PostToolUse hook.** Fires on unrelated tool calls, so the write would be triggered by activity that has nothing to do with the task''s criteria changing. Also B-005 blocks the agent from writing `.claude/settings.json`, and a side door around that is not on the table. - **Rejected — the actor inside `fw audit`.** An audit that repairs what it measures can no longer report honestly on it: the next run reads clean because the previous run wrote. Measure and mutate stay separate.'
  - decision: '2026-09-29 — CORRECTION: the parser is fine, and the real mechanism is the unticked filter'
  - decision: '2026-09-29 — the predicate is the whole risk, and its likely failure is silence'
    chose: 'prove the predicate READS correctly before letting it write, negative direction first.'
    rationale: 'measured across active tasks — **160 carry a `### Human` section, and for 126 of them stripping HTML comments changes the count.** T-885 is the clean example: a naive count of `- [ ]` under `### Human` returns 2, and both hits are the template''s own `[REVIEW]`/`[REVIEWER]` examples inside a comment. The task has zero real criteria. The direction of that error is what makes it insidious. The naive count is too HIGH, and those phantom criteria are unchecked, so a naive predicate concludes "a Human criterion is open" and declines to flip. The mechanism would then sit inert over 126 tasks while reporting nothing wrong — a false silence, not a false write. The dangerous direction (missing a REAL open criterion and flipping anyway) needs its own proof and does not follow from the same test. - **Rejected — reusing an existing extractor without re-proving it.** `lib/section-extract.sh` already does anchored first-wins AC extraction (T-3148) and is the right thing to build on, but "it is already used elsewhere" is not evidence that it handles the comment-only `### Human` section. That gets its own control leg. Skip for tasks with no meaningful choices. Format:'
