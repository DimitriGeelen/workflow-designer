# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-07-05 — Where to store baked geometry'
    chose: 'Bake tidied y/lane-height into the `*.workflow.yaml` SOURCE, then re-render.'
    rationale: 'Geometry lives in the yaml and `yaml-to-bpmn.py` is a pure projection of it, so baking into the source makes the generator naturally emit tidy output — a naive regen can never silently un-tidy the corpus (strongest form of AC #3). Also keeps `check-lane-bands` (reads yaml) validating the real shipped geometry.'
    alternatives_rejected: ['Post-processing only the rendered `.bpmn` — a naive `yaml-to-bpmn.py` regen would clobber it; would need a fragile "remember to re-bake" post-step.']
  - decision: '2026-07-05 — Iterate Clean to a fixpoint'
    chose: 'Run `cleanLayout()` repeatedly (to a fixpoint, cap 12) per map during the bake.'
    rationale: 'One Clean pass isn''t idempotent — align-rows snapping merges clusters, so a 2nd pass settles nodes a few px further. Baking the fixpoint makes a re-bake move 0 nodes (AC #4).'
    alternatives_rejected: ['Single pass — left arc-lifecycle/inception-lifecycle non-idempotent (moved 2/6 on re-check).']
  - decision: '2026-07-05 — Reuse editor Clean via headless CDP, no dependencies'
    chose: 'Drive the real editor in headless Chromium over the DevTools Protocol using Node''s native WebSocket/fetch (no npm install).'
    rationale: 'Reuses `cleanLayout()` verbatim (PL-005: no editor/bridge drift) with zero added dependencies; chromium is the cached Playwright build.'
    alternatives_rejected: ['Reimplementing Tidy in Python (PL-005 drift risk); `npm install playwright` (adds node_modules to a dependency-free repo).']

