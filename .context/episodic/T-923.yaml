  OBS-433 (T-880) and T-882's close. A recorded current_node goes stale at the next status transition because the agent is the writer and the framework is the mover. T-882 delivered the guarded advance; nothing calls it yet, so 193 live entities stay NO-POSITION and the one recorded node (T-880, frw_6_run in completed/) is wrong by four hops. Scope: update-task.sh's own transitions call 'instance-node.py advance' for the node they are — captured→started-work is frw_3_start, gate battery is frw_6_run, refusal at frw_7_all, partial-complete is frw_8_partial, finalize is frw_10_finalize then frw_11_task — and a refusal from the guard is surfaced, not swallowed. Open design question for the ACs: an entity at NO-POSITION cannot advance mid-flow by construction (T-882), so the first framework-driven move must either place (set) from NO-POSITION or walk the prefix from frw_1_task; choose and pin it. Sequenced with T-883 (refusals land in the audit log).

