# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-09-29 — the framework''s verb is a walk, the agent''s is a hop'
    chose: 'a separate `walk` verb for the framework (shortest path over the artefact''s flows, every hop printed and each taken through the same core as `advance`), `advance` unchanged for a single hop; a refused walk is a `WARNING` and never fails the status change.'
    rationale: 'the framework knows its target node, not the agent-lane nodes in between; PD-345 rejected multi-hop *advance* because it hides which hop was validated — `walk` prints each one, so the objection does not apply. Status remains governed by `status-transitions.yaml`; the map records position. Making the map refuse a STATUS change is the `strict` rung SD-8 keeps out of scope, and it would also turn every legacy entity''s first transition into a failure.'
    alternatives_rejected: ['(a) `set` (placement) from NO-POSITION at the target node — cheaper, but the record would then say nothing about how the entity got there, and 193 entities would carry a position with no history; (b) a hop table in bash per transition — a successor table outside the artefact, the thing T-882 refused to have in the tool; (c) refusing the status change on a refused walk — `strict`, out of scope, and wrong for the legacy corpus.']

