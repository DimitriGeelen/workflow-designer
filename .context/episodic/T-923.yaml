  - '**`walk` refuses when no path exists and writes nothing.** A fixture on `frw_11_task` walked to `frw_4_enter` exits 1 with `REFUSED-TRANSITION` naming the template file; the record still reads `frw_11_task`.'
  - '**`walk` from NO-POSITION starts at the start.** A fixture with no position walked to `frw_3_start` prints hops beginning `HOP frw_1_task -> frw_2_build` and lands on `frw_3_start`; an inception fixture walked to `hum_2_decision` starts at `frw_1_inception` (the template containing the target).'
