# Summary (auto-generated from git commit messages)
summary: |
  two of 488 episodics have been unparseable and nothing noticed, because episodic memory is written once and never read again. mine_git_timeline emitted each git subject into a DOUBLE-quoted YAML scalar escaping only the double quote (episodic.sh:367-369). A double-quoted YAML scalar interprets a FIXED escape set, so any backslash before a character outside that set is a parse error for the WHOLE file. T-431 died 2026-08-11 on a regex alternation's \| and sat dead for nine days while being cited as ordinary completed work; T-562 died yesterday on a character class's \-. THE FIX WAS ALREADY IN THE SAME FILE, TWO BLOCKS DOWN: the challenges and artifacts blocks mine the SAME git log --format=%s subjects and have always used single-quoted YAML with '' doubling, which interprets no escapes at all. T-562's own episodic held the offending subject SAFELY in challenges on line 37 while line 61 killed the document. So this is not a novel repair, it is the timeline block being brought back to its siblings' form: sed "s/'/''/g" and action: '$escaped_msg'. time: is left double-quoted deliberately — it is %ai-derived and cannot contain a quote or a backslash. POPULATION MEASURED, NOT ASSUMED: 488 episodics, exactly 2 unparseable, both regenerated with the real generator rather than hand-edited, and all 488 now parse with 766/766 timeline entries BYTE-EQUAL to their git subjects. THE ROUND TRIP IS THE POINT AND MUTANT B IS WHY. 'It parses' is also what a generator that emitted nothing produces — so the teeth require the stored string to be byte-equal to the commit subject over a 173-char adversarial message carrying a character class, an alternation, a double quote, an apostrophe, a colon-space, a hash, brackets, braces and a TRAILING backslash. Mutant A restores the pre-fix double-quoted emission (must go UNPARSEABLE), mutant B emits a parseable file with an empty action (must go NO TIMELINE ENTRY). 4/4. Everything runs against a COPY of the framework in a tmpdir driving the REAL context.sh generate-episodic — no mutant touches the tree. G-040 REGISTERED FOR THE BLINDNESS, WHICH THIS REPAIR DOES NOT CLOSE. Fixing the generator stops new corruption; it does not give anyone eyes. The gap is 'episodic memory is written and never read again, so a corrupt episodic is invisible from the moment it is generated', and it closes only when an UNATTENDED instrument parses the corpus — which is why tools/_t567-episodic-parse-check.py is a standalone script with --min and --match-git rather than an inline one-liner: the cron audit can call it. --min guards the pass that an empty directory would also give. Its closure_check_command currently returns NOT_READY, honestly, because the audit does not call it yet. VENDORED UNDER G-008 AND DECLARED: .vendor-divergence.yaml entry marks episodic.sh upstream: fix with GENERIC debt — AEF's own tree has this generator and this bug. Checker green at 34 diverged, 34 declared. Reported upstream on framework:pickup as a pickup-bug-report. Suite 117 -> 118 passed, 0 failed. Third framework-tooling bug this week whose failure mode is silence: T-560 (an absence assertion satisfied by its own breakage), T-561 (inception completion crashing after every gate passed), and now a memory store that cannot report its own corruption

