# Summary (auto-generated from git commit messages)
summary: |
  the operator's class/instance proposal, and it is far smaller than building an instance layer — the runs already exist and the class pointer already exists. THE INSTANCES ARE NOT HYPOTHETICAL, THEY ARE RUNNING TODAY: inception-lifecycle.bpmn has 44 inception tasks, task-lifecycle.bpmn has 797 tasks, session-handover.bpmn has 656 handovers, arc-lifecycle.bpmn has 3 arcs. Roughly 1,500 runs of 7 designs, with ZERO linkage back to the design they are runs of. An inception IS a workflow class and T-788 IS an instance of it; nothing records that. THE CLASS POINTER ALREADY EXISTS TOO: every task carries workflow_type: inception, which is the class name, read as a bare string at resolver.py:1060 with nothing joining it to a design document. The contrast that makes this actionable is in the SAME framework — arc_id DOES resolve, check-arc-id.py verifies .context/arcs/<arc_id>.yaml exists and BLOCKS under agent control when it does not. The resolving-reference pattern is already built and already gated one field over. So the proposal is not invent an instance model, it is make the pointer you already have resolve, after which 1,500 existing runs become tracked instances retroactively with no migration. THE DESIGN QUESTION WE DID NOT ANSWER FOR THEM: two diagram-to-work mappings that are incompatible. Today fw bpmn compile is node-to-task, a design becoming a backlog. An instance needs run-to-something, and the answer differs by workflow shape. For a LIFECYCLE design one run is ONE task passing through the nodes as STATES — T-788 went captured to started-work to work-completed — so compiling node-to-task there would produce a task called 'explore', which is not what an inception is. For a PIPELINE design one run plausibly IS a set of tasks. Both shapes are in the corpus, it does not resolve itself, and choosing silently is worse than leaving it open. OWNERSHIP ARGUED FROM THEIR OWN PRINCIPLE: AEF claimed Child-2 at @1631 because 'the .tasks/ write never leaves our task-gate perimeter'. An instance that tracks task execution IS task state — same perimeter, same argument. Put to them as two questions at sidecar @6, correlation 832-T798-WORKFLOW-CLASS-INSTANCE, with 'nobody owns this' named as a complete and useful answer. NOTHING BUILT, no schema proposed, frozen standard untouched. Guessing a schema and shipping an exporter for it is the T-786 error at larger radius, and this time there is no frozen document to catch it. Co-Authored-By: Claude Opus 5 (1M context) <noreply@anthropic.com>

