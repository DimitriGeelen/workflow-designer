# Summary (auto-generated from git commit messages)
summary: |
  every teeth suite in this project exits 0 having run no legs — 35 of 35, and the instrument built to find that committed the defect twice on its way to finding it. Arrived as AEF's finding about AEF's code (DM 529 §4): a stalled-task guard with 11/1325 coverage printing the sentence a guard that cleared 300 tasks would print, generalised as 'a verdict must never print without its denominator'. Taken as a question about our side rather than agreement. Answer is worse than theirs because it is not one guard but the whole population: every suite ends on [ "$fail" -eq 0 ] || exit 1, and a suite whose legs never ran has fail=0. Measured behaviourally, not read off exit lines — the zero-leg probe neuters the assertion helper (FOUND, not assumed: first function whose body increments a variable by one) and runs the real file. Two results worth keeping: _t421-drift-mutation-check exited 0 printing 'refuses to answer rather than pass when an input is missing', and _t420-gate-mutation-check exited 0 printing 'It is not an all-block or an all-allow' — both sentences true, both printed by a run that asserted nothing, the second being the summary of a gate audit. Three defects inside the instruments built here, all the same family: (1) the census's first classifier called the VERDICT line a guard because it matched -eq 0 near exit 1 — that line fires when fail is NON-zero and is silent in exactly the audited case, 16 false GUARDED; (2) the second credited an exit it did not CONTROL via a 4-line proximity window, and the statement after a zero-test is in every one of these files the verdict line's own || exit 1, so a suite that merely PRINTED 'nothing ran' classified as guarded; (3) the applier's first fix injected a leg counter into fail(), the FAILURE reporter, so a fully clean run reads zero legs and the guard would have fired on every green suite — a fix manufacturing the alarm it exists to raise, with bash -n catching the syntax accident that came with it and saying nothing about the semantic one. (1) and (2) are AEF 529 §3's class (_git_commit_count_since grepping a commit MESSAGE for a task id); named back to them at 530 as mention-vs-instance — a predicate answering 'is the thing named here' when the question was 'is this the thing'. 22 suites guarded and proven in BOTH directions (neutered -> exit 2; unmodified -> still green); 13 refused BY NAME, 11 of them because they tally only failures so a clean run and an empty run are identical in the file's own state, and inventing a leg counter there is a per-file judgement which defect (3) proves an applier must not attempt. Teeth 14/14 over ONE scratch tools/ carrying all four verdicts, keeping the verdict-line row permanently. Verification coverage stated rather than implied: four state-touching suites are static-check-only and say so. the applier's first draft did not cost nothing — it shipped two broken suites, and re-running them is the only reason anyone found out. Nine files reverted on the syntax accident the leg-counter injection caused (a one-liner helper swallows the injected comment and takes the closing brace with it); _t418-mutation-check and _t419-carrier-mutation-check did NOT, because on those the same injection stayed syntactically valid. Both were written, both passed bash -n, both were committed in the previous commit BROKEN: 't429_legs: unbound variable' on the first leg under set -u. A runtime error is invisible to a syntax check, and I had already written the sentence claiming revert-on-failure made the draft cost nothing. Caught by the re-run step whose entire purpose is this and which nothing forced me to do — the suites are in the STATIC-CHECK-ONLY column of this task's own coverage table, which is exactly how they got there. Restored from HEAD~1, both exit 0, both moved into the refused list where they always belonged: fails-only, so a clean run and an empty run are identical in the file's own state and a leg counter is a per-file judgement. Refused set now 13 (12 fails-only + _t353-repair-probe, no identifiable verdict block), carried to T-430 one suite at a time. Coverage table rewritten to name every suite in each column rather than say 'the self-contained ones': 3 proven in both directions, 10 re-run green, 9 static-only because they start servers or mutate live focus/task/tag state — _t351-teeth had to be killed after outliving its own 240s timeout, since it drives _t351-shutdown-probe which stops and restarts a real server. Also: learning on fails-only tallies, failure pattern 'mention-vs-instance', T-430 filed, OBS-023 (the class generalises to the 60+ .mjs CDP probes, unasked), OBS-024 (fw note add "text" captures the literal string 'add' as the observation and silently discards the rest — a well-formed inbox entry with no content, indistinguishable from a real one until read, which is this task's finding wearing different clothes). OBS-022 was that defect happening to me and is dismissed with the reason

