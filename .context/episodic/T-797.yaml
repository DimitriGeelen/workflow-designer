# Summary (auto-generated from git commit messages)
summary: |
  the operator asked design or instance, and the answer is NEITHER — nothing anywhere models a run. Measured across three layers rather than reasoned from one. The designer, 997 KB: processInstance 0, instanceId 0, runId 0, execution 0, instantiate 0, startInstance 0. The frozen mapping standard: instance 0, runtime 0, execution 0, invocation 0. Both with positive controls on the same files so the zeros mean something — the designer yields 1035 node, 980 lane, 162 version; the standard 35 task, 22 lane, 17 owner. The files are readable and the vocabulary is rich. It is simply a vocabulary about DEFINITIONS. THE DECISIVE ARGUMENT IS AEF'S OWN, AND THEY MADE IT WITHOUT MEANING TO: their reconcile rules at @1631 are idempotent on (uid, source_bpmn_sha) — new creates, UNCHANGED IS A NO-OP, changed refuses to clobber, deleted orphans. Run fw bpmn compile twice and you do not get two runs, you get the same tasks. aef:uid described as 'the modify/create discriminator' only makes sense at exactly one task per node, permanently. That is SYNCHRONISATION, not instantiation. So the chain is one diagram to one task set kept in sync with it — never one diagram to run 1, run 2, run 3. IN THE OPERATOR'S OWN TERMS: process design is fully served — authored, validated, governed, and now exposed to agents through three MCP tools. Instantiation, where you track the execution, DOES NOT EXIST ON EITHER SIDE OF THE SEAM. Not here, not upstream, not in the frozen standard, and not in AEF's @1631 list of what they own. STATED FAIRLY: for a governance framework one living backlog per process may be deliberate — a process describing how a team works has one backlog, not one per occurrence. But the standard is SILENT rather than exclusionary, zero occurrences of the entire vocabulary, and an absent concept and a rejected concept look identical in a document while only one of them is a decision. It also collides with the yardstick's word 'iterate': if that means refine the design and recompile, today's stack delivers it; if it means run this process repeatedly and watch each run, nothing does. NO SCOPE CLAIMED ON THE STRENGTH OF THIS. The predecessor question is whether AEF considers instances theirs as they considered the compiler theirs, and asking is cheap where guessing wrong is the T-786 error again. Co-Authored-By: Claude Opus 5 (1M context) <noreply@anthropic.com>

