# Summary (auto-generated from git commit messages)
summary: |
  the sweep now says what its probes said, and the first thing it caught was me. _t509 ran every probe as 'timeout N runner tools/X > /dev/null 2>&1', so a run yielded one integer per probe and nothing else. T-548 made that integer honest — regressed / did-not-finish / abstained / passed — and honesty about which of four buckets an integer falls into is still an integer. That became the binding constraint on a real problem: three instruments have failed ONLY inside a full sweep and passed every standalone attempt afterwards (_t523 rc=1, _t366 rc=2, _t344 leg 2), zero bytes retained from any of them, while _t523 alone prints nine named legs when run by hand. For that class the sweep's own closing advice — 'Run it directly for its own output' — is unsatisfiable, because running it directly is exactly what does not reproduce it; I had read that sentence as a workaround rather than as an admission, which is why it survived T-548's rewrite of the same code. Now: per-probe capture in a mktemp dir removed by a trap, printed for regressions, abstentions AND kills, bounded to the last 30 lines with the truncation STATED, and captured for passing probes too so that no branch decides in advance whose output matters using the exit code. THE MEASUREMENT IS THE POINT AND IT COST ME A REPRODUCTION. Seven sweeps ran after this landed; run 2 came back rc=1 — the fourth sighting of the intermittent class and the first since a capture existed to explain it — and I destroyed the report by timing the sweep with '> /dev/null 2>&1', four minutes after landing the fix whose entire subject is not discarding that output. The next run was green, so it is gone. Registered as OBS-270 rather than left as an anecdote, because the mechanism generalises: the capture lives in the sweep's stdout, so any caller that discards it discards the capture, and exactly one standing caller preserves it. Four further hunt runs with output kept found nothing, which settles nothing at 1-in-7 against T-543's ~9%-per-run bound — the instrument can now explain the next occurrence and has not yet had the chance, and the task says so instead of implying the capture was validated in the field. Teeth drive the REAL sweep over synthetic probes with known exit codes and known sentinels in a mktemp tree and require each sentinel to REACH THE REPORT, because the exit codes were never wrong and a probe checking only rc would have stayed green across the whole defect; mutation-verified with 5 of 7 legs red against the reconstructed pre-T-551 redirect, and the 2 that stay green are named as such. AC2 ticked and its benefit NOT claimed: nothing reads a passing probe's capture today, so 'not invisible by construction' is structural rather than realised — OBS-271. The bridge-suite wiring is staged as the T-551 leg ALONE; the T-549 and T-550 legs sit in the same file and cannot land with it, because their probes are in the operator-blocked commits and a suite referencing files that are not in the tree is red for a fresh clone. 6/6 verification, full sweep 38/38 with the tree byte-identical and no capture directories left behind

