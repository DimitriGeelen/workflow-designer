# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-08-16 — where the capture lives'
    chose: 'a `mktemp -d` capture directory per sweep run, one file per probe, removed by a `trap ... EXIT INT TERM`.'
    rationale: 'the sweep''s hermeticity is an asserted property — T-509''s header records that running all 24 probes left `git status` byte-identical, and the bridge suite still checks it. A diagnostic that writes into the tree would have traded that away for convenience. Re-measured after this change: byte-identical across three sweep runs, zero leftover capture directories, and leg 7 of the new teeth asserts the second half over six runs.'
    alternatives_rejected: ['writing captures under `.context/working/` (survives the run, and would be read later — but it puts sweep debris into a tracked-adjacent directory and makes the hermeticity claim conditional); keeping everything in bash variables (a pathological probe''s output then lives in memory with no bound, and `$(...)` strips trailing newlines, so the report would misstate what the probe printed).']
  - decision: '2026-08-16 — the tail, not the head, and the bound is said out loud'
    chose: 'keep the last `T509_CAPTURE_LINES` (default 30) lines and print `--- last 30 of N lines from <probe> ---` whenever N exceeds the bound.'
    rationale: 'these probes print per-leg lines and then a summary, so the verdict and the legs that produced it are both at the end. A silently clipped report is how a reader ends up confident about the wrong evidence — the same shape T-550 had just repaired one file over, where a stale anchor bound to a plausible-looking wrong line.'
    alternatives_rejected: ['unbounded output (one pathological probe buries the report, and the report then stops being read, which is the defect again one level up); head-first truncation (keeps the banner and throws away the verdict).']
  - decision: '2026-08-16 — capture on green too, and what that does and does not buy'
    chose: 'capture every probe including passing ones, and delete the file only after the verdict is known (`0) pass=$((pass + 1)); rm -f "$cap";;`).'
    rationale: 'the alternative decides in advance whose output is worth keeping, using the exit code — which is the assumption the whole task is about. One uniform path also means a future keep-everything mode is a deleted `rm`, not new plumbing.'
    alternatives_rejected: ['adding a heuristic that scans a passing probe''s output for alarming shapes — that invents a classifier nobody asked for, and a wrong one would relabel green runs.']
  - decision: '2026-08-16 — a load-bearing sentence, discovered by breaking it'
    chose: 'keep `These are hermetic and leave the repo untouched, so a red here is a real regression in the thing it guards.` on a single source line, with a comment saying why.'
    rationale: '`_t548-sweep-classification-teeth.py` REFUSES outright if it cannot find that literal phrase in the sweep''s source, and `_t364-tie-guard-teeth.py` goes red. I split it across two `echo` calls for line width and broke both within one run. A verification line now pins the count at 2 (the comment and the `echo`).'
    alternatives_rejected: ['loosening the two probes to tolerate a wrapped sentence — they are asserting that the regression claim is withheld from timeouts and abstentions, which is T-548''s whole finding; weakening a guard to fit my formatting is the trade this week''s work keeps arguing against.']

