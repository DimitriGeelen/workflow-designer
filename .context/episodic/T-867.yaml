# Summary (auto-generated from git commit messages)
summary: |
  The operator said formulating a hypothesis is difficult; a blank required field would therefore be a gate that blocks rather than helps. So the estimator drafts one from the task's own text, the human edits it, and hypothesis_source: human makes the edit permanent against every later automatic pass. Reuses the sticky-provenance mechanism shipped in T-865 for voi_score and target_blast_radius — same two-state rule, no third 'unknown provenance' state. Every human-vs-draft divergence emits telemetry, because that delta is the only evidence available for improving the drafter.

# Key outcomes
outcomes:
  - '`_draft_hypothesis()` produces the canonical three-part form from a task''s own name, description and body — not a blank template echoed back'
  - '**It never invents a success clause.** When the body offers no candidate observable, the third clause carries an explicit `[NEEDS YOU: ...]` marker naming what is missing, rather than a plausible metric. Proven by fixture: a body with no numbers and no named checks yields the marker, never a fabricated figure'
  - '**It does propose an observable when the body actually contains one** — a count, a named tool or check, a threshold. Helpful where there is material, honest where there is not. Proven by a fixture whose body carries a real figure'
  - 'A draft carrying the `[NEEDS YOU]` marker is still REFUSED by S1''s gate. The two halves must agree: the drafter marks the gap, the gate holds the line, and neither pretends the task is ready'
  - '**`hypothesis_source: human` is sticky** — a human-written hypothesis is never replaced by a draft, proven by asserting the stored text is byte-identical after a drafting pass'
  - 'The run reports how many hypotheses it drafted and how many human-written ones it left alone, so the protection is observable rather than assumed'
  - 'Every human-vs-draft divergence emits telemetry carrying both texts, because that delta is the only evidence available for improving the drafter and cannot be reconstructed later'
  - '`tools/_t867-hypothesis-draft-teeth.sh` covers the above with a `--mutation` mode whose CONTROL SET reports `MUTATION SETUP BROKEN` rather than reading a broken harness as a clean kill'

