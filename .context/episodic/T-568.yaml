# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-08-20 — The unwired-guard ratchet fired mid-task; wired, not re-baselined'
    chose: 'give both orphaned checkers a live caller in `tests/run-bridge-tests.sh`.'
    rationale: 'this task''s first full suite run came back 118 passed / **1 failed**, and the failure was not T-568''s — the ratchet had grown by one because `tools/_t567-episodic-parse-check.py` lost its last live caller when T-567 moved from `active/` to `completed/`. Its only reference had been T-567''s own `## Verification` block. That is a general trap, not a one-off: **a tool called only from a task''s Verification block becomes unwired the moment that task completes**, and it was about to happen a second time to `_t568-live-card-visibility-probe.py` the instant this task closed. The census''s own message says a new entry is a finding to report and must not be silently re-baselined, and it is right — re-baselining would have recorded the loss as the new normal.'
    alternatives_rejected: ['re-baselining (forbidden by the instrument, and it converts a finding into a floor); leaving the suite red and completing under `--skip-verification` (that gate exists for exactly this moment); deferring to a follow-up task (the second orphan would have landed in the same breath as the deferral).']
  - decision: '2026-08-20 — Content digest, not the suggested (count, max-mtime) pair'
    chose: 'key the cache on a sha256 over each card''s **filename and bytes**, reading each file once and using those same bytes for both the digest and the parse.'
    rationale: 'the reporter''s suggested key — `(count, max-mtime)` — fixes the reported case but keeps an aliasing window, and the window is not brief. Measured on this filesystem: five back-to-back writes produced `st_mtime_ns` deltas of **exactly 0**, so the kernel''s file-time clock is coarser than the gap between a write and the request that follows it. An edit that lands inside the current tick leaves the key unchanged — and a key that never changes again is never re-read, so that edit is invisible *permanently*, not until the next second. Cost was measured before the choice, not after: 65 cards / 61,598 bytes — read+sha256 **1.36 ms**, `yaml.safe_load` **98.58 ms**. The digest costs 1.4% of the parse it avoids, so the cache keeps its entire point while becoming exact.'
    alternatives_rejected: ['- *(count, max-mtime)* — see above. Cheaper by ~1.1 ms; wrong in a way that cannot be observed after the fact. - *Drop the cache* — correct on every request and 72× the cost. This is mutant B, and it is in the teeth precisely because it is the tempting one: it would have passed any test that only asked "is the page fresh?" (PL-220 — a repair must not convert the defect into a quieter one). - *Digest of bytes only, no filename* — reads as a simplification and silently loses the rename case, which the old directory key actually handled. This is mutant C. - *A TTL backstop* — bounds staleness instead of eliminating it, and adds a second knob that has to be right. Not needed once the key is exact.']

