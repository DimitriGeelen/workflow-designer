# Summary (auto-generated from git commit messages)
summary: |
  every edit to a component card has been invisible to the page that shows it, and the framework's own priority action is what routes operators at the invisible half. Watchtower's _load_components() keyed its cache on os.stat(COMP_DIR).st_mtime — the mtime of the DIRECTORY, while the data cached is the CONTENT of the files inside it. POSIX moves a directory's mtime on create/delete/rename of an entry and NOT on a write to a file already there. Measured here rather than recalled: in-place edit -> unchanged; create, delete, rename -> changed. So 'fw fabric register' creates a file and invalidated correctly, while 'fw fabric enrich' rewrites cards IN PLACE and never did — the page served the pre-enrichment card for the life of the process at HTTP 200 with no warning and no log line. OUR AUDIT PRINTS 'Mitigation: Run: fw fabric enrich' UNDER PRIORITY ACTIONS ON EVERY RUN, and has for eleven consecutive audits. Reported by 001-CashWeb-Lightspeed-Ecwid-integration, who rated it above the note-rendering ask they had waited longer for, and who lost a diagnosis to it — they concluded Watchtower was serving a different checkout, which is a reasonable inference from the evidence available. Reproduced at HTTP level against our own running dashboard BEFORE anything was changed: card on disk said BEFORE, /fabric/component/<id> answered AFTER. NOT THE SUGGESTED (count, max-mtime) PAIR, and the reason is measured: five back-to-back writes here produced st_mtime_ns deltas of EXACTLY 0, so any mtime-derived key has an aliasing window — and since a key that never changes again is never re-read, an edit inside that window is invisible PERMANENTLY rather than briefly. The key is now a sha256 over each card's FILENAME and BYTES. The name is in it because a rename moves neither mtime nor content and rename is the one case the old key got right (mutant C). The bytes are read ONCE and used for both the digest and the parse — hashing then re-opening leaves a window where a write between the two lands parsed content under the pre-write digest, the same defect in a smaller costume. COST MEASURED BEFORE THE CHOICE: 65 cards / 61,598 bytes, read+sha256 1.36 ms against yaml.safe_load 98.58 ms, so the digest costs 1.4% of the parse it avoids and the cache keeps its point. TEETH: control plus three mutants, each required to redden EXACTLY ONE leg. Mutant A is the shipping code. Mutant B deletes the caching — which also returns the right answer on every request and would pass any test that only asked 'is the page fresh?' (PL-220). A mutant that reddens more than its own leg is not discriminating and is reported as a failure. SIBLINGS CHECKED RATHER THAN ASSUMED (PL-214): web/shared.py:498 and web/blueprints/costs.py:141 key a FILE's cache on THAT FILE's own stat, correct in kind; fabric.py was the only site keying a collection on a directory, so this is singular and not a class repair. A PRECISION TRAP COST US A FALSE PASS AND IS NOW A LEARNING: the first live probe PASSED against unfixed code because 'stat -c %Y' + 'touch -d @seconds' round to whole seconds, so restoring a directory mtime that carried a fractional part CHANGED it and invalidated the broken cache for that reason. os.utime(ns=...) plus an equality assertion. The control arm of a test is itself an intervention, and an imprecise control does not weaken the test, it INVERTS it. THE RATCHET FIRED MID-TASK AND WAS WIRED, NOT RE-BASELINED: the first full suite run was 118 passed / 1 FAILED, and the failure was not this task's — _t567-episodic-parse-check.py had lost its last live caller when T-567 moved to completed/, because its only reference was T-567's own Verification block. A tool called only from a task's Verification block becomes unwired the moment that task completes, and _t568-live-card-visibility-probe.py was about to do the same. Both are now suite legs; the live probe spawns its own Watchtower on an ephemeral port when none is reachable, so it can never pass by not running. G-040 stays OPEN — it closes when the CRON audit parses the corpus, not when a commit-time suite does. Suite 118 -> 121 passed, 0 failed; unwired-guard ratchet back at baseline 66/66. Vendored under G-008, declared (35 diverged, 35 declared), reported to AEF on framework:pickup, and answered to CashWeb on agent-chat-arc T-064 with a yes/no/not-soon on all three of their items. T-569 filed for their second finding

