decisions:
  - decision: '2026-10-24 — how a leg declares its tier'
    chose: 'every leg body became a function, registered by one `leg <tier> <name> <fn>` line (mechanical: the wrapped text is byte-identical to the old blocks, unindented so the column-0 censuses still read it); the tier engine lives in `tools/_t1288-tiers.sh`, the static no-tier guard in `tools/_t1288-tier-guard.py`.'
    rationale: 'retry-once needs a leg that can be re-run alone, which a function is and an inline if-block is not.'
    alternatives_rejected: ['`if leg core …; then … fi` wrappers (no re-run); inferring the tier at run time (the criterion forbids it).']
  - decision: '2026-10-24 — retry and quarantine also apply to `--tier all`'
    chose: '`all` runs the same legs as before, with the same per-check pass/fail counts, and applies the tier rules (browser retry-once, quarantine) — otherwise the full run stays red for known reasons forever.'
    alternatives_rejected: ['a rule-free `all` (keeps the 10-reds-in-3-runs problem the task exists to end).']
  - decision: '2026-10-24 — core''s hermeticity is enforced, not only declared'
    chose: '`--tier core` re-execs in a private mount + network namespace (only `lo`; Playwright/Chromium binaries and caches covered), falling back to a printed "NOT enforced" where unshare is unavailable.'
    rationale: 'a static classification can be wrong (it was, once: T-690); the namespace makes such a leg fail visibly.'
  - decision: '2026-10-24 — history rows'
    chose: 'keep the six T-813 columns and append tier, flaky, quarantined; an `all` run writes its all-row plus one row per tier. `_t952` and `_t813-suite-age` read only `all` (and old 6-column) rows, so a core row is never mistaken for the whole suite''s failure count.'

