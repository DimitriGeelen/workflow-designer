summary: |
  capture the class-level prevention PL-148 prescribed and nobody built — instrument reachability asserted population-wide. Five instances across two projects, each repaired by hand, none making the next detectable (PL-145's fix-on-discovery shape). Records the population trap T-490 measured: a census scoped to tools/_*.mjs answered 0 of 27 while T-448 is a live instance outside that glob, so the population must derive from what CLAIMS to guard, not a file extension. the population check already existed and was better than my replacement — deleted the reimplementation and gave the real one a schedule. T-451's census knows every distinction I was rediscovering (one-shot Verification semantics, teeth-by-convention, derived denominators, its own stated LIMIT); I found it because my draft's orphan list printed its filename, after two wrong population definitions and a '115 orphans' headline. Its only live caller was the on-demand G-034 gap gauge, so it has measured a real backlog since T-451 and told nobody — unwatched, which is a distinct state from unrunnable and was worth naming. T-490 and T-448 were both found by hand in that interval and the census had both. Raw exit 1 on a pre-existing backlog cannot be wired without painting the suite permanently red, so --ratchet gates on MOVEMENT: fails when the backlog GROWS and equally when it SHRINKS, PL-004's stale-entry half that was never built anywhere here. Baseline derived from --json, never hand-typed, and refuses to mint itself. Three negative controls; control C passed for the wrong reason first (set -e aborted before the assertion) and is fixed with a comment saying why. Suite 73 passed, 0 failed

