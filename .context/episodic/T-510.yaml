summary: |
  I published a mechanism I never checked, and the finding it explained was right. T-509 reported _t364-t308-teeth.py's control red — maps=24 identical=0 drifted=24 — and said the cause was 'the teeth script's own stored reference shas that went stale'. It stores no shas and computes no hash. run() passes REF=3bf37909~1 to _t308, so the comparison is CURRENT BUILD vs A PINNED GIT REF. I had run _t308 bare, with no ref argument, seen rc=0, and reasoned 'the gate is fine, so the staleness is in the teeth' — two different comparisons treated as one, and the wrong one was the one I ran. Eight lines of run() would have settled it; I skipped them because a plausible story already fit. Reproduced with the caller's argv: all 24 maps drift, every one by EXACTLY +51 bytes, which is commit 4c40414c (T-399) adding exporter=aef-workflow-designer to every export, 18 spaces + 32 chars + newline. Uniformity is the tell — decay is ragged, a shipped line is uniform. So the red is EXPECTED, not a regression: the control's identical=24 became false the moment T-399 landed, and git merge-base --is-ancestor 3bf37909 4c40414c proves the pin predates the change, as a verification leg rather than a sentence. T-509's stated remedy was wrong too: a re-pin makes the injected fixture comparable on both sides, so unusable goes to 0 and the teeth go red for the opposite reason — the docstring prescribes a NEW unstable injection and that stays the operator's. Corrected in the four places it was actually published: sweep header, suite comment, T-509's record twice, episodic summary. The wrong sentence is left standing beside each correction, because a correction that deletes what it corrects is unfalsifiable by the next reader; verification asserts the MARKER is present, never that the phrase is gone. NOT corrected, deliberately: commit f7438c37 and the git_timeline entry quoting it — a transcript of immutable history is not a place to edit. AC3's own premise was false and is recorded as such rather than ticked: it said the claim went to the rail and into a learning. Searched both — agent-chat-arc has two hits for the pattern, AEF's own and my PL-200 post, neither carries it; T-509's learnings are PL-202/PL-203 and neither mentions the file. No rail correction is owed, discharged as verified-not-published. PL-204 captures the mechanism with two transferable tells: a constant delta across a whole corpus is a shipped producer change and refutes decay without reading code, and reproduce a failure with the CALLER's argv because a bare run is a different experiment wearing the same name. Sibling of PL-203 from the same session. The bridge suite is not a verification leg here — that is G-015's own class, the ratchet this project wired two tasks ago — it was run as evidence: 80 passed, 0 failed. Carried in this commit and named rather than folded: T-508's completion metadata, which said work-completed on disk and nothing in the tree for three sessions, T-487's dated correction of a rail-offset misidentification, and a T-423 timestamp. Their correct label is T-508 and the focus-drift gate refuses that under T-510 focus, offering only Tier 2 bypasses that an autonomous directive does not authorise

