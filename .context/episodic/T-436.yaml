summary: |
  scope the inbox triage with real ACs, to be worked next session. the inbox route is built, wired and silently dead — handover.sh:925 splits observations on an indentation the file does not use, so 24 pending yield 0 summary lines every session, inside a section that still prints its heading and count and therefore looks complete. AEF fixed this exact regex one file over (audit.sh:2681 comments the defect verbatim as their T-2514 rationale); the sweep stopped at the call site being debugged. Idiom census 3 sites: handover.sh:925 actively wrong, handover.sh:386 broken-but-latent (urgent path can never fire; no obs carries the key today, so recorded as latent not as a miss), lib/harvest.sh:214 CORRECT — it reads patterns.yaml which genuinely uses 2-space indent, and filing it would have been a false upstream report. Re-derivation measured with a denominator: 7/24 read by a later different task, 4/24 self-cited only, 13/24 never read — and read latency kills the 29%: no observation has EVER been read more than 1 day after filing, while the oldest entries have zero reads. What delivered those 7 was session continuity, not the inbox. triage complete 24 in / 24 out — 4 promoted (T-439..T-442), 6 folded into existing carriers, 2 to learnings PL-156/157, 5 reported upstream at DM 546, 3 closed as decided, 1 retained. Third fw note defect found by verifying my own dispositions instead of trusting the success message: observe.sh:229-248 parses --reason into a local, echoes it on line 247, and the sed on 246 writes status: dismissed and nothing else — no reason field, no dismissed_at. The command's own help advertises the flag and this task's AC4 requires it; all 26 dismissals in the register carry no reason. That also falsifies a claim I made last session about OBS-028 (the reason 'the next person will find' has nowhere to be), corrected in the file rather than left standing. The disposition ledger now lives in the task because the register cannot hold it. G-032 registered for the dead handover route with closure defined as a re-vendored handover.sh whose section line count matches fw note count — explicitly NOT emptying the inbox, since a count of 0 makes the block unreachable and the defect invisible again. standing detector for G-032 + RCA. tools/_t436-inbox-route-probe.sh extracts the REAL listing block from the shipped handover and runs it against the live inbox (leg A) and a synthetic 2-space-indent fixture (leg R). Leg R went red on the first run and caught my own crashed extraction — the shipped 'python3 <<' line is INDENTED, so my ^python3 anchor missed it and left a shell line atop the .py; both legs then emitted 0 and leg A reported a FALSE ok, i.e. the crash was indistinguishable from the defect it was built to detect. That is the same mention-vs-instance shape a third time, in the instrument, and it is only visible because the reciprocal exists. Now guarded by three markers + a compile check that exit 2 rather than score. Both refusal paths mutation-proven: zero-pending abstains (so 'we emptied the inbox' cannot read as a fix, which is exactly what G-032 refuses as closure) and a moved anchor abstains. RCA names two independent silences: the listing block prints its heading and count regardless, and nothing compares the count printed against the lines produced; plus a fix scoped to the instance that hurt when the finding was about an idiom

