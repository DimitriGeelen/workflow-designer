# Summary (auto-generated from git commit messages)
summary: |
  AEF ruled at 11909 and the escaping fix is in — one line at the shared escaper, confirmed by the instrument that found the defect. T-520 measured that escAttr wrote a raw newline or tab into an XML attribute and XML 1.0 3.3.3 normalisation turns it into a space for every conforming parser, so AEF read n_a b where we wrote n_a<newline>b, silently, on the field their reverse renderer keys records on. They chose my recommendation over the alternative and gave a better reason than mine for rejecting it: a spec MUST NOT on the assigner is a promise made by whoever wrote the importer, checked by nobody, whose violation produces a well-formed document passing every conformance check we have — the same silent failure mode relocated rather than removed. FIXED AT escAttr, NOT AT THE UID. That escaper is shared by every attribute the writer emits; T-520 found the defect through aef:uid because that is where the seam contract lives, but a node NAME containing a newline was corrupted by the identical path today. Fixing only the uid would have left the same defect under a different attribute plus a test asserting it was gone. escText deliberately untouched and the reason recorded in the code: normalisation applies to attribute values only, newlines in text content are legal and preserved, so escaping them there would invent a behaviour rather than restore one. Ampersand replacement stays first or it re-escapes the references it just emitted. VERIFIED BY THE PROBE THAT FOUND IT, not by inspection: emitted_as now shows n_a&#10;b and n_a&#9;b, expat reads both back byte-identical, the reader-disagreement flag that flagged the seam risk is gone, and the 8 already-surviving candidates still survive. The pin moved a third time — transformed from expectation, identical from a false browser read, transformed once the reader was fixed, identical now — and this is the only one of the four that reflects the editor changing rather than my understanding of it. Suite 89 passed 0 failed; the one red on the first run was OBS-255's _t358 flake, confirmed by running the sweep standalone at 22/22 rather than assumed, because a change touching every attribute write earns a real check. T-451 ratchet unmoved at 67. verification block, and the AEF report at rail 11911. Four checks, each its own verdict: the probe that found the defect, escAttr carrying all three references with ampersand still replaced first, escText NOT given attribute treatment, and a conforming parser reading a character-reference newline back intact. Also answered their reverse-renderer question — the blocker is (3), the oracle, not the corpus and not headless invocation. I can state what I put INTO a document but not what their renderer should produce from it, because correct there means the records AEF would have produced had the workflow been authored natively, which is a fact about their data model. Proposed a fixture-pair contract: we publish N documents plus a machine-readable statement of what each asserts, they publish the expected rendering, each side runs its own half against a fixed reference without executing the other's code. Respects the T-559 boundary, refs-only until OBS-108 closes, and it is more work for them than for us which is why it is a proposal and not an assumption

