# Summary (auto-generated from git commit messages)
summary: |
  AEF's 11895 falsified three entries in the vendor-divergence manifest one day after I wrote it, and that is the finding rather than the error. G-AUDIT-EXCLUDE-NOT-HONORED is fixed upstream by their T-2735 and the episodic placeholder leak by their T-3015 — the caveat I attached at 11893, that my 'valid upstream' could already be stale, fired on schedule. Nothing here was wrong when written and nothing here changed: upstream: is the only field in this manifest making a claim about a repository I cannot see, so it is the only one that can go stale with no local edit, and no instrument on this side can ever detect it. There is no better check to build; the remedy is periodic triage by the side that can read upstream, which is why the 14-entry list went out at rail 11900 answering their explicit ask. Added a fifth taxonomy value, superseded — upstream has an equivalent arrived at independently and ours is overwritten at the next re-vendor, which is correct — kept distinct from vendoring-repair because that one is loss in TRANSIT and this one is CONVERGENCE. Deliberately did NOT reclassify audit.sh wholesale: that path carries five tasks and only T-374 is superseded, so collapsing it would have quietly written off four real fixes; the entry keeps upstream: fix and names the superseded change separately. The bundling is now the live risk — at the next re-vendor their audit.sh overwrites ours and the other four die, which is T-517's learning arriving with a date on it. Enum validation added to the instrument because it had been documented in the manifest header and enforced NOWHERE, so a typo classified as neither debt nor not-debt: adding a fifth value to an unenforced list is T-509's class verbatim, a convention used as a classifier that nothing re-checks. Two teeth legs, and the second exists because the first alone is satisfied by a validator that rejects everything — mutation-tested both ways, each mutation kills exactly one leg. OBS-254 applied, zero unknown entries remain. Flagged a collision nobody would have found later: our extract-decisions.py is hyphenated and theirs is underscored, so a re-vendor lands theirs ALONGSIDE ours and ours becomes orphaned dead code. One AC amended in place rather than ticked as written: the suite gave 88/0, 86/2 and 87/1 on an unchanged tree, so 'the suite is green' would have been true of one run and false of the next. Localised that to _t358-teeth.py case 5 and registered OBS-255 rather than absorbing someone else's defect into this task's evidence — and it was the reason-asserting form of those legs, the PL-206 refinement captured yesterday, that surfaced it at all. Teeth 7 -> 9, 0 failed

