# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-09-22 — instrument 31 of 70 catch sites, excuse 39, and make the split auditable'
    chose: 'instrument where the operator LOSES something or is MISLED; excuse the rest with a written reason and an exact site count; enforce the split with a census.'
    rationale: 'the two failure modes are opposite and both real. Instrumenting everything would put a permanent badge on a healthy editor — `getBBox` throws on every headless render — and OBS-293 records what a permanently-lit indicator teaches: to stop looking. Reporting nothing is where we started. The line is whether a human lost work or was shown something false: an empty list after a failed fetch is indistinguishable from "there is nothing", which is the worst case in the file and is now recorded.'
    alternatives_rejected: ['a blanket rule either way. Also rejected: keeping the chosen set in my head, which is exactly PL-288''s hole — the census is the answer to my own judgement, not a supplement to it.']
  - decision: '2026-09-22 — an excuse carries a COUNT, not just a reason'
    chose: 'each excuse is keyed to a source line AND the number of sites it may cover.'
    rationale: 'a reason is a claim about the sites that existed when it was written. Without the count, adding a fifth copy of an excused one-liner inherits an excuse nobody wrote for it, and the list rots from a record of decisions into a blindfold.'

