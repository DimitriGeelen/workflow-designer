  the editor stops swallowing its own failures — F-05, the review's highest-leverage ADD

# Key outcomes
outcomes:
  - '`aefRecordFault(code, detail)` exists and CANNOT THROW under any input — it is called only from inside `catch` blocks whose contract is "never break the editor", so a recorder that can throw converts a silent failure into a broken editor, which is strictly worse than the silence it replaces'
  - 'It is declared ABOVE its earliest call site (module top level, ~line 2345). A recorder placed beside `APP_VERSION` would put every top-level caller in the temporal dead zone'
  - 'A bounded ring (no unbounded growth) persisted to `localStorage`, with the quota case explicitly handled: when the fault BEING recorded is localStorage refusing writes, the in-memory record still stands'
  - 'An operator-visible surface: an indicator that is ABSENT when there are no faults and appears when there are, opening a panel that lists each fault with code, detail, time and build'
  - 'The meaningful swallowed sites are instrumented — clipboard write, autosave persist, autosave restore, prefs persist, prefs restore, annotation seam, workflow parse, save-to-project'
  - 'CENSUS (PL-288: a chosen-set assertion cannot find what you forgot to choose): every `catch (_)` in `src/` is enumerated and must be either INSTRUMENTED or carry an EXPLICIT written excuse. The remainder fails. My hand-picked list of sites is exactly the thing that cannot audit itself'
  - 'CONTROL: the recorder is proven to RECORD (a forced fault appears), the indicator proven to APPEAR only then, the recorder proven NOT TO THROW on hostile input, and the census proven to DISCRIMINATE (a new bare catch makes it red)'
  - 'Visual verification: element-level screenshots of the indicator present and absent, in light and dark, READ — not DOM-measured (CLAUDE.md §Visual Verification)'
  - 'The usage histogram (§8 item 3, the other half of F-05/F-18) is FILED as its own task, not built here — one task, one deliverable'

