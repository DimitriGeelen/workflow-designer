# Summary (auto-generated from git commit messages)
summary: |
  a consumer project cannot link to anything it publishes, because the one project-owned surface Watchtower's nav reaches renders its text autoescaped. fabric_detail.html:35 emitted <p>{{ component.purpose }}</p>, so a markdown link written into a card came out as literal text — reported and empirically verified by 001-CashWeb-Lightspeed-Ecwid-integration, who wrote a link into a purpose, forced a cache reload, fetched the page and got no anchor. THEIR FRAMING IS LARGER THAN THE FIX AND IS THE PART WORTH KEEPING: NAV_GROUPS (shared.py:136) is a hardcoded list of Flask blueprint endpoints so a project can neither add an entry nor point one at a URL, /file/<dir>/ has no index, /search does not index docs/reports. The fabric card is therefore the ONLY project-owned surface the nav already links, and AEF's own Carrier Discipline rule — an artefact must be 'reachable without instructions' — is currently unsatisfiable by any consumer project. purpose now renders blueprint-side through render_markdown_safe into purpose_html, the established *_html + | safe pattern (arcs.py:600, review.py:179, tasks.py:831), with NO wrapping <p> because markdown2 emits its own and nesting them is invalid. Passed as its own template variable rather than written back into the component dict — that is the cache T-568 just made exact and folding rendered HTML into it would put presentation inside the digest's payload. THE IMPORTERROR BRANCH WAS THE REAL FIND. render_markdown_safe returned RAW text when markdown2 is unimportable, while its own docstring three lines up instructs every caller to mark the result | safe — and every caller does. Latent here (markdown2 2.5.4 present) and an injection on any host where it is not. Fifth instance this week of a degradation path that RENDERS AS HEALTH: the page still loads, the text still appears, and the only observable difference is that escaping quietly stopped. Fixed at the helper, not at the call site (PL-214) — a caller about to mark a string safe cannot know whether the renderer degraded. TWO MUTANTS PULLING OPPOSITE WAYS, and mutant B is why one would not do. B drops safe_mode and THE LINK STILL RENDERS, so 'the link works' alone accepts an XSS regression as a pass; it must redden the escaping leg and ONLY that. A restores the shipped autoescaped template and must redden BOTH rendering legs and NOT the escaping one — autoescape is, after all, safe — and the expectation was corrected from 'exactly one leg' to that, because demanding one would have been demanding the probe misreport. Control first (T-560). 3/3. A CLAIM I MADE TO A PEER WAS FALSE AND IS CORRECTED RATHER THAN QUIETLY DROPPED: I told CashWeb on agent-chat-arc that bare docs/reports/* paths would auto-link once purpose rendered through the helper. Measured instead of re-asserted: _auto_link_files at shared.py:650 gates on (PROJECT_ROOT / path).exists() and PROJECT_ROOT in a consumer project is the .agentic-framework directory, so NO project-owned artefact path resolves — on any Markdown surface in Watchtower, not just this one. An existing docs/standards path renders as plain text while a bare T-NNN ref in the same string becomes an anchor. True in AEF's tree, false in ours and theirs. Filed OBS-305 urgent, corrected on the thread, NOT fixed here — one bug, one task, and fabric.py:18-21 already carries the compensating idiom that fix will use. Probe wired into the suite in the SAME commit rather than left as a Verification-block orphan, which is the trap T-568 hit one task earlier. Suite 121 -> 122 passed, 0 failed; ratchet at baseline. Divergences declared for shared.py and fabric_detail.html; checker green at 37 diverged, 37 declared

