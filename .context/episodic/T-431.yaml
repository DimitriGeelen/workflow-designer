summary: |
  A-012 never needed AEF — it is a claim about an ENUMERATION and the enumeration is vendored in this tree. Sent to them at 527 §1 alongside A-013/A-014, which genuinely do need them (what their model can RECEIVE, whether their record is RECONSTRUCTIBLE); A-012 is not in that class and should not have been sent in it. Waiting for an answer we can measure is the same shape as waiting for a ruling that was already given. Measured: workflow_type is 7 for 7, exact in both directions, both sides EXTRACTED AT RUN TIME from the shipping files — AEF's from lib/enums.sh, the standard's from the frozen doc — because a closed-world claim about somebody else's list, written once with nothing re-checking it across re-vendors, is the T-402 shape, and the remedy is the convention AEF took from us at 529 §1. owner holds too but not for the reason the register implies: v1.1 derives owner from the LANE and a lane carries any label, so no owner value can require a new BPMN shape, which is exactly what A-012 asserts. Recorded validated WITH the evidence, not flipped. Separate and deliberately not folded in (a disposition is an evidence claim about ONE statement): three incompatible owner vocabularies in simultaneous use — the standard says human|agent, AEF ships human claude-code, this tree practises agent x304 / human x118 / claude-code x9 — and nothing ever objected because is_valid_owner() is defined at enums.sh:101 and called from NOWHERE, zero sites, the T-429 family inside the vendored tree. OBS-025; the authoritative-value question is AEF's and no edit to their tree is made from here. Two probe bugs kept as legs M1/M2: splitting the allowed-values cell on bare | tore 'a \| b \| c' apart and reported six of seven types unmapped (confident, specific, entirely wrong, produced by an extractor under-reading in silence), and requiring backticks on the row that writes values bare made extraction find nothing. Teeth had the same disease one layer in: the first mutation legs used sed with | delimiters against escaped pipes, two seds died writing no mutant file, and the legs went GREEN because a missing mutant makes the grep find nothing — replaced with a mutator that exits non-zero when its anchor is absent. 13/13. Side effect: T-428's register moved for the first time by our own measurement rather than a rail question (dangling 16->15, disposed 4->5), and validation_method stayed TBD on the row that now carries real evidence — 20 of 20 still inert, confirming OBS-021

