# Summary (auto-generated from git commit messages)
summary: |
  the T-429 question asked of .mjs and .py — population census (73 of 101) plus an execution harness, because static reachability is not decidable here (failures++ lives in a helper whose call sites are elsewhere). Both instruments caught their own version of the defect first: the census's tally regex required a character BEFORE the keyword so 'failures'/'passed' never matched and it printed PASS over 88-of-101 out-of-population; the drive harness set GALLERY_DIR on a script that overrides it at :74 and filed a fully-executed green as BLIND. Positive control added — a knob is only load-bearing if a poisoned population moves the rc/line/verdict signature. the drive knob is the TREE, not the environment — probes resolve REPO from their own file path, so no env var can empty their population. Harness rebuilt around a hollow copy of the repo plus a poisoned control copy. Two control bugs found and fixed by their own symptoms: emptying parent dirs deleted the child dirs the poison was written into (all 5 smoke instruments read CANNOT-DRIVE), and poison placed only at each population's top left subdirectories empty in BOTH copies. An under-placed control does not report as under-placed — it reports as a sealed instrument. measured — 5 of 14 drivable instruments report success having examined nothing, and 59 of 73 cannot be driven at all. bake-clean-layout.py prints 'Baked Clean into 0 maps; ... gallery mirror synced.' and exits 0, with open arc task T-101 reading that code; _norec-verify.py reports its own zero in the same voice as the silent zero it was built to catch. Nine instruments refused (four by exiting 2), which is what makes the five a finding rather than a harness artifact. Registered as G-034 — the class had four instances in the register (G-016/G-017/G-031/T-429) and no entry describing the class; its closure condition runs rather than reads, and refuses BLIND-0-over-a-shrinking-driven-count and fix-the-five-leave-the-59. PL-160 — a control that fails to place itself reports the same thing as a subject that cannot be moved. re-measured after the first repair — driven 14 (unchanged), BLIND 5->4, guarded 9->10, CANNOT-DRIVE 59. The stable denominator is the point: G-034 refuses a falling BLIND count over a shrinking driven count, and 14->14 with BLIND 5->4 is the one shape that means a repair happened rather than an instrument becoming untestable. Corrected this task's own claim that T-101 reads bake-clean-layout's exit code — nothing does; the caller was inferred from provenance, not grepped for, and the real finding is T-448 (documented gate, invoked by nothing, red at 0/24). OBS-033 (P-002 blocks a partial-complete task from committing its own state under its own id — the ordinary end-state of every such task) and OBS-034 (fw note silently discards its payload on an unrecognised subcommand: 'fw note add <1200 chars> --urgent' stored text='add' at exit 0 and inflated the urgent queue) filed. strike the contradicting sentence — the findings section asserted both that nothing reads bake-clean-layout's exit code and that T-101 does. _norec-verify.py takes the load-bearing title instead: it is the operator's approvals-queue guard, built because a silent zero once misled them, reporting its own zero in the same voice

