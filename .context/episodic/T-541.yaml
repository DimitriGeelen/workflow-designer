he vendor manifest as upstream debt with the two generic findings separated from the three project-specific handlers. My own probe's first version could not fail — mutation-testing the dead-level leg against a copy with an un-derived gate left it GREEN, because the level-2 fixture said 'Edge arrowheads' and Edge is itself a gate word, so every fixture entered through the gate rather than its own trigger. PL-206. Fixtures rewritten gate-word-free; mutant now yields 11 findings, real file 0. Suite 101 -> 102 legs, 0 failed. T-517 caught the undeclared vendor change before I declared it, which is the guard working. the verification block was EMPTY while all seven Agent ACs were ticked, which is a vacuous gate in my own task file. Tasks with no ## Verification are waved through P-011 for backward compatibility, so the completion gate would have certified this task by finding nothing to run — a ticked AC standing in for a checked one, which is the shape T-524, T-548 and T-550 have each repaired elsewhere this week. Now three real lines: the handler probe (wired / alive / selective / graded / no-dead-levels / boilerplate-blind, dead-level leg mutation-verified at 11 findings on the mutant and 0 on the real file), the vendor-divergence guard because the estimator is vendored and an undeclared divergence is reverted by the next bump while the history still reads as fixed, and a dispatch-table assertion keyed on the canonical NAME rather than the register id — T-542 measured the register recycling ids, F3 meaning V_PROMPT_QUALITY minutes before it meant V_AEF_INTEGRATION, and an id-keyed dispatch would have scored every task against its predecessor's axis while looking healthy. Two ACs annotated rather than re-ticked, because the world moved after they were written and quietly refreshing the numbers would erase the ordering that matters: the operator's approval landed under T-542, so the three drivers are now live at weight 9 each and the queue records read rejected rather than pending, and the corpus grew from 44 tasks to 45 so V_SDLC_ENABLEMENT now fires on 33/45. What the ACs assert is still true of T-541's own diff — this task changed no policy and activated nothing, and the handlers were written and proven BEFORE the axes they score were approved, which is the order the sovereignty boundary requires

