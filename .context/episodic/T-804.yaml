# Summary (auto-generated from git commit messages)
summary: |
  the operator asked why they should tick ACs at all, and my comfortable answer was disproved by the first measurement. I EXPECTED to find most of the 77 unchecked Human ACs were misfiled — machine-checkable work dressed as human judgement — because the framework has a marker for exactly that case. Measured: 71 [REVIEW], 6 [RUBBER-STAMP], and ZERO [REVIEWER]. Zero. The marker meaning 'this should have been an Agent AC' is unused across the entire live queue, and reading the [REVIEW]s confirms they are what they claim: 'Rule H1 — do roadmap Arcs 4-6 supersede the standing DEFERs', 'Rule on the rail substrate', 'Rule the 22 findings item by item'. Governance rulings a machine cannot make. So the queue is NOT misfiled and the tidy answer is gone. WHAT IS ACTUALLY WRONG IS VOLUME AND AGE: 77 ACs across 62 tasks, MEDIAN AGE 42 DAYS, 32 of them aged 31-90 days, oldest 73. Nothing has rotted past 90 so this is not abandonment — but nothing leaves either. The queue is held at a level rather than drained. And agents generate these faster than any human issues them: three went to the operator today, of which ONE was genuinely blocked on (SQ-2) and ONE DID NOT EXIST (IW-3, my own misquotation of the README). A 42-day median does not mean the human is slow. It means we are asking too much, and that is ours to fix rather than theirs. ONE PATHOLOGICAL SHAPE NAMED: T-732 carries an acceptance criterion whose content is ticking another acceptance criterion — 'Tick T-596's Human AC to set definition_ratified: true'. Queue recursion, pure overhead, a step without a judgement. ON THE SPECIFIC ONE I ASKED FOR: T-353's AC is a genuine [REVIEW] and legitimately theirs — but they ALREADY MADE IT. They said c, it is PD-308, it has been exercised (T-802 applied it) and it has already constrained me (T-803 was refused by it). The ruling was the valuable act; the tick is bookkeeping on a decision already in force. Skipping it costs one open task and nothing else. REMEDIES WITH COSTS, recommending A: stop adding — escalate only what is BLOCKED, and accept that the agent then makes calls it would have escalated. That is the trade the operator is implicitly asking for, it starts now, and it costs nothing to begin. NOT TICKING ANYTHING, and not converting [REVIEW]s to Agent ACs — there are none to convert, and doing it anyway would be manufacturing the tidy answer I went looking for. Co-Authored-By: Claude Opus 5 (1M context) <noreply@anthropic.com>

