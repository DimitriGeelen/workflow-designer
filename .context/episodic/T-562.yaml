# Summary (auto-generated from git commit messages)
summary: |
  the rule T-501 ruled was 'already correct and shipping' has a hole its own census could not see, and this task lifts a CORRECTED :9162 rather than the one the GO budgeted. The four sites read side by side: :2685 and :5223 sanitize with .replace(/[^a-z0-9_\-]/g,'-') and no strip and no fallback; :9162 adds .replace(/^-+|-+$/g,'') and || 'workflow'; :8433 judges all three with an inline /^[a-z0-9][a-z0-9_-]*$/. The character class PRESERVES underscore and the strip removes DASHES ONLY, so '_foo' survives sanitisation as '_foo' and the validator rejects it on the first character; '___' likewise, non-empty so the fallback never fires. T-501's census measured 10 distinct / 0 invalid over the 14 fallback documents and was RIGHT — 0 of 30 shipped ids begin with a separator, so the corpus does not reach the case. Fifth instance this week of a measurement whose defect was its SCOPE and not its value, and the first found in our own ruling's evidence rather than a peer's, in a document whose §0 was written to correct exactly this class. A UNIFIED HELPER CANNOT HAVE ONE FALLBACK, which is the design point and the load-bearing test. The three sites disagree about the empty case for a REASON: createFromPendingRef needs a usable id, while renameActiveWorkflow's very next line treats empty as 'refuse this rename'. One unconditional fallback — the obvious simplification, and mutant A — turns a refused rename into a silent rename to 'workflow', this week's shape again with the failure rendering as success. Hence sanitizeWorkflowId(raw, fallback) with the fallback as a parameter. THE BEHAVIOUR CHANGE IS RECORDED, NOT SLIPPED IN: measured exhaustively over 4681 inputs from an alphabet covering every character class, at :9162 ZERO already-valid outputs change (strict repair), at :2685/:5223 726 DO, every one of them trailing-separator trimming ('aaa-' -> 'aaa') because those sites never had a strip at all. That is the point of unification rather than a side effect, it cannot reach a shipped id (0 of 30 corpus ids end in a separator), and the trimmed form is what :9162 has produced all along. Trailing '_' deliberately left legal and untrimmed — the validator constrains the first character only, and trimming it would change ids that already round-trip. CDP, NOT SOURCE-READING, AND LEG 6 IS WHY. The helpers are pure and could have been unit-tested by extracting the text, which would assert the fix is in the FILE. Leg 6 drives an actual rename through renameActiveWorkflow('_Bad Name') and requires 'bad-name' back plus a REFUSED rename on '!!!' with the id unchanged — the only leg that separates 'the helper is correct' from 'the call site uses it' (PL-148). Leg 5 runs the exhaustive property in-page. Leg 3 reproduces the PRE-fix rule in the page and requires it to fail where the helper succeeds, so the repair is evidenced rather than asserted — without it, '0 invalid' is also what a corpus with no leading underscore reports, which is how the hole survived in the first place. 7/7 in headless Chromium. TEETH 6/6 WITH THE DISCRIMINATION ARM PINNED: four mutants, each a fix someone would plausibly ship — unconditional fallback (kills 4,5,6), pre-fix leading strip (kills 2,3,5,6), validator loosened instead of sanitizer fixed (kills 3,5,7), and call-site un-wired with the helper left correct, which must redden leg 6 AND ONLY LEG 6. That uniqueness is asserted explicitly: if C also reddened 2/3/5/7 it would be indistinguishable from B and the probe would not be proving the wiring. A control run on unmutated source is required first, because 'every mutant died' is also satisfied by a probe that fails on everything. Probe takes --src so mutants live in a tmpdir, never in the tree. NO ABSENCE ASSERTION IN THE VERIFICATION BLOCK: the obvious leg is 'no inline sanitizer remains', which passes just as readily when the pattern is mis-quoted. Asserted as positive counts instead — exactly 4 sanitizeWorkflowId( occurrences (1 definition + 3 call sites) and exactly 1 occurrence of the validator regex in all of src/ and web/. Census unchanged at 78/78. Suite 115 -> 117 passed, 0 failed, RUN not grepped for registration. T-563/T-564/T-565 created for the GO's remaining decomposition items; T-565 measures IW-0's deferral exit condition and explicitly does not change the emitter, because that ruling is the operator's and remains untaken

