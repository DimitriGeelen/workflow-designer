# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-08-20 — unify on the `:9162`-shaped rule, accepting a change at the rename sites'
    chose: 'one helper with a leading `[-_]` strip and a trailing `-` strip, called from all three sites, with the fallback as a parameter.'
    rationale: 'measured, exhaustively over 4681 inputs drawn from an alphabet covering every character class. At `:9162` **zero** already-valid outputs change — the fix is a strict repair there. At `:2685`/`:5223` **726** already-valid outputs change, every one of them trailing-separator trimming (`"aaa-"` → `"aaa"`), because those sites never had a strip at all. That is a real behaviour change and it is the point of unification: D2 says the three sites disagree. It cannot reach a shipped id — 0 of 30 corpus ids end in a separator — and the trimmed form is what `:9162` has been producing all along.'
    alternatives_rejected: ['(a) dropping the trailing strip to make the rename sites byte-identical — that changes `:9162` instead, giving ghost names like "My map!" the id `my-map-`, and regresses the population that *does* exercise the path; (b) leaving `:2685`/`:5223` alone and unifying only two of three — T-501 item 3 already records that unifying two of three leaves `renameActiveWorkflow` able to mint an invalid id, which is the defect.']

