# Summary (auto-generated from git commit messages)
summary: |
  BVP scoring is now automatic for agents, with the telemetry that makes it reviewable — operator ruling

# Key outcomes
outcomes:
  - '**Only what the operator ruled on is opened.** `acd_gate` guards five verbs; the ruling covers scoring (`confirm`) and arc creation. `weight --set`, `driver --add`, `driver --remove` and `auto-promote --enable` stay gated — they carry policy-edit authority over the value model itself (D8), which is a different thing from scoring a task, and were not ruled on'
  - 'The gate is **not deleted**. A config-consulted policy switch is added that `acd_gate` reads, defaulting **off** so upstream behaviour is unchanged, and set on in this project only. A deleted gate is invisible; a switch is reversible and shows up as divergence'
  - 'Auto-confirm **promotes `bvp_scores_proposed:` into `bvp_scores:` and preserves the proposed record** — the proposed/confirmed distinction survives in the data, so telemetry can later show how often the proposer was wrong. Throwing that away would defeat the operator''s stated reason for wanting this'
  - '**Telemetry is written for every auto-approved action**, append-only, one row per event, carrying at minimum: timestamp, verb, target id, whether a proposal existed, the proposed values, the confirmed values, the per-driver delta, and the switch state that permitted it'
  - 'Telemetry is written **only on the auto path** — a human-approved action is not silently logged as automatic, or the data cannot answer the question it exists for'
  - 'The switch being **off** still refuses, with the original message, proven by a test that flips it off rather than by reading the code'
  - 'The switch being **on** for `confirm` does **not** open `weight` or `driver` — proven by a test, because a blanket `CLAUDECODE` bypass is the obvious wrong implementation and would look identical from the happy path'
  - 'Arc creation is opened on the same pattern, with its own switch and its own telemetry rows, and its own test'
  - 'A test instrument exists and is **mutation-tested** with a control set: stripping the switch turns the auto-path cases red while the still-gated verbs and the refusal cases stay green'
  - 'The vendored edit carries its rationale **in-file**, naming the operator ruling and the date — T-853 measured that a vendored fix without visible rationale is what the next `fw upgrade` reverts'

