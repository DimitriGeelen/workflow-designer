# Key outcomes
outcomes:
  - '`_t509-instrument-sweep.sh --list` prints the population — every teeth script with its excluded/included state — and exits 0 without running anything'
  - '`--only <pattern>` (repeatable, matched against the basename) runs just the matching instruments, so one instrument can be re-run in seconds instead of eleven minutes'
  - '`--only` with a pattern matching nothing **REFUSES** (non-zero) rather than reporting a clean sweep over an empty set — a sweep over nothing is not a pass, which the script already says for the unfiltered case'
  - '**A filtered run can never be mistaken for full coverage.** Its summary is a different sentence, it carries a banner naming how many of the population were skipped, and the phrase a full run emits does not appear in filtered output'
  - 'The **full-run output is unchanged** for population, exclusions, summary and exit codes — two probes read this script''s SOURCE for a literal one-line sentence (flagged in its own comments), so neither that line nor the full-run summary may be reflowed'
  - 'Exclusions, the stale-exclusion check, the rc classification (0/124/2/4/other) and the headroom warning all behave identically under `--only`'
  - 'An unknown flag is refused rather than silently treated as a pattern — a typo''d `--onyl` must not run the whole sweep and read as intentional'
  - 'A test instrument exists and is **mutation-tested**: with the subset feature stripped, the new cases go red while cases that do not depend on it stay green (a red-for-the-wrong-reason mutation run proves nothing — T-849''s lesson, the same day)'
  - 'The tests never invoke the real eleven-minute sweep over the real population: they run it against a **fixture directory of tiny stub instruments**, so the suite is fast enough to actually be run'
  - '`bash -n` passes, and one real filtered invocation against the live tree is exercised end to end'

