# Key outcomes
outcomes:
  - '**Clean-stop-before-bind:** before binding, `serve-gallery.sh` detects any process listening on the target PORT (via `ss`) and stops it cleanly (SIGTERM then SIGINT, since `gallery-serve.py` ignores SIGTERM), waiting for the port to release'
  - '**Fail-loud on still-held:** if the port is still held after the stop attempt, the script prints a clear FATAL message naming the port + holder PID(s) and exits non-zero — it never binds a second, shadowed server (the committed!=serving root cause) and never escalates to SIGKILL silently'
  - '**Post-deploy behavior probe:** after starting the server the script probes the RUNNING process (`/api/health` for gallery-serve, `/` for the static fallback) and only reports "live" on success (emitting the served PID + start-time); if the server never answers, the script exits non-zero rather than claiming success'
  - '**Lifecycle regression test** (`tools/_serve-gallery-verify.py`) reproduces both failure modes: (A) start on port P, start AGAIN on P → exactly ONE listener answers `/api/health` afterward and it is a FRESH pid (old one cleanly stopped, no dual-process); (B) a SIGINT-deaf holder on P → serve-gallery.sh exits non-zero with a loud message and starts no shadow server. Passes'
  - '**No regression:** the normal single-start path still serves the gallery + `/api/*` (health OK, index lists the corpus maps); `bash -n tools/serve-gallery.sh` is clean'

