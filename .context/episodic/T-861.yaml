# Key outcomes
outcomes:
  - 'The sweep classifies a probe as **DEAD CONTROL when the probe says so in its output**, not only when it volunteers `rc=4`. T-851 measured the cost: `regressed 12, dead-control 2` where the truth was 6 dead / 8 regressed — wrong by four, because four probes announce breakage in plain English and exit 1'
  - 'The detection is driven by **markers the probes actually emit**, quoted from their real output, not from phrasings I invent: `_t542`''s traceback, `_t568`/`_t569`''s `control: unmutated source passes all four legs`, `_t574`''s `ABORT: … can no longer test what it claims to test`'
  - 'A traceback is classified as a **broken guard**, not a regression — a probe that raises has reported nothing about its subject. This is the distinction the whole fix exists for'
  - '**A probe that genuinely fails its subject is still `regressed`.** The suite proves both directions, because a classifier that moves everything to `dead-control` would satisfy the first criterion and be worse than the bug'
  - '`rc=4` continues to work exactly as before — this **adds** a detection path, it does not replace the convention'
  - 'The full-run summary sentence and the `PARTIAL` sentence keep their existing shapes, since other probes read this file''s source and output (T-850 established that constraint the hard way)'
  - 'The count actually moves on the live corpus: a filtered run over the known self-declarers reports them as `dead-control`, verified by running it rather than by reading the diff'
  - 'Tests extend `tools/_t850-sweep-subset-teeth.sh` (or a sibling) with fixture probes that self-declare, and are **mutation-checked with a control set** — stripping the new detection turns the new cases red while the pre-existing cases stay green'
  - 'No probe under `tools/` is edited to make the sweep''s job easier — the point is that the sweep must not depend on the classified party''s cooperation'

