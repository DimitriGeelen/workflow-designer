# Summary (auto-generated from git commit messages)
summary: |
  the third _t515 gap measured — a node nested in a subProcess keeps its uid and loses its parent. MEASURED, not inferred: the subProcess and both its children come back with aef:uid byte-identical, the sequenceFlow joining the children survives and still connects them, and the children are HOISTED to <bpmn:process> level while the subProcess returns EMPTY. Nothing disappears; the scope does. AEF keys records on uid, so a record survives and silently changes parent — worse than losing it, because losing it is countable, and precisely why no count-based instrument in this suite has ever gone red on it. THIS FALSIFIED A CLAIM SITTING IN OUR OWN SOURCE. parseBpmnXml's T-337 comment asserted 'the whole interior of an accepted element is dropped today' and I had cited it as fact when scoping the task. It is true of the FOREIGN-tag branch, which walks proc.children, and false for flow nodes, which are collected by byBpmn(proc, tag) — a descendant query. A comment used as a fact with nothing re-checking it: the T-509 class, in our tree this time. Corrected in place rather than contradicted only in a test file. TWO ARMS BECAUSE ONE ARM CANNOT NAME A CAUSE: nested and flat inject the same two nodes with the same uids and the same connecting flow, differing only in containment, so 'both vanished' would be a finding about injection rather than about subProcess. The first flat arm omitted the sequenceFlow and duly reported edge lost — a control differing from the treatment in more than the variable under test, caught before it reached the pin. TEETH MUTATE THE SUBJECT, NOT THE PROBE: restricting node collection to direct children makes the old comment TRUE, and the probe must go red, on the NESTED arm, leaving the FLAT arm untouched — without that third leg a red is equally explained by the mutant breaking the round-trip wholesale. Absent pin exits 2 with a refusal rather than passing. Verdicts come from expat via a new structure-aware reader, never the browser's DOMParser — T-520's lesson, and the reader reports ancestry because 'the uid is still somewhere in the document' is not an answer to a containment question. Suite 90 -> 92 passed 0 failed, ratchet unmoved at 67, tree byte-identical after the run. Three of four _t515 gaps now closed; the fourth is AEF's reverse renderer and stays open by agreement, not neglect

