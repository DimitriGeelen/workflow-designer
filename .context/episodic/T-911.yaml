decisions:
  - decision: '2026-09-28 — where the marker is visible: the canvas overlay, not the panel'
    chose: 'a badge in the existing `canvas-overlay` status strip, beside "Mode: select", rendered only when `kind` is SET.'
    rationale: 'arc-005''s headline mechanic is *"sees it marked"*. Behind a panel disclosure that is "can find it if they look", which is a different claim and would not close the arc. The overlay is already persistent, already themed, and already the place the editor states what mode it is in — the map''s kind is the same class of fact.'
    alternatives_rejected: ['(a) a panel-only field — fails the mechanic; (b) showing a badge when UNSET — T-213 IW-3 kept the marker an explicit author decision, so an "unset" chip on all 24 maps that declare nothing would be chrome for a non-event, and would read as a nag toward setting it; (c) folding it into `updateStatus()` — that function has early returns (the endpoint-drag hint takes priority and returns), so the marker would vanish mid-drag and reappear after, which reads as a bug in the marker rather than a property of the status line.']
  - decision: '2026-09-28 — the badge prints the enum value, not a synonym'
    chose: 'render `documentation · illustrative` / `work-plan · actionable` — the value verbatim, with a gloss.'
    rationale: 'the tempting alternative is to render `documentation` as **"template"**, since that is the word arc-005''s own headline mechanic uses. That would put a second vocabulary on one closed set — the T-322 defect — where the UI and the wire disagree about what a map is called, and a reader comparing a screenshot to a BPMN file would find two different words for one value.'
    alternatives_rejected: ['a UI-only synonym. The enum is the name; the gloss explains it.']
  - decision: '2026-09-28 — UNSET writes `null`, not `''''`'
    chose: '`wm.kind = v || null` in the select callback.'
    rationale: 'the emitter writes the attribute only when truthy, so `null` exports byte-identically to a map that never carried one. `''''` would be falsy too and would work by luck; `null` matches what the parser produces for an absent attribute, so the value a user sets and the value an import produces are the same object. Asserted directly — the instrument checks `kind === null`, not merely falsy, and compares the exported bytes against the pre-set export.'
  - decision: '2026-09-28 — the verification instrument, and why it had to exist'
    chose: 'write `tools/_t911-kind-badge-verify-cdp.mjs` rather than screenshot through the MCP browser tool.'
    rationale: 'the MCP tool wrote its PNG to a path outside every directory this session may read (T-559 blocks the Bash side; the Read tool found nothing there either). The screenshots would have been *taken and never looked at* — which is precisely the failure the visual-verification rule exists to prevent, so routing around it would have defeated the rule rather than satisfied it. The CDP instrument is also the house pattern (a dozen `tools/_*-verify-cdp.mjs` siblings) and it drives the REAL select with a dispatched `change` event, so an unwired control fails.'
    alternatives_rejected: ['asserting DOM state only. It would have passed on the render whose hint was broken across a line — which is the one defect this task''s visual pass actually found.']

