  - decision: '2026-07-05 — Redistribute within the existing span (anchor extremes)'
    chose: 'Keep the leftmost and rightmost node fixed; equalise only the interior gaps within the unchanged span.'
    rationale: 'Anchoring the extremes means the row''s overall footprint never changes, so the action can''t push a row into its neighbours or grow the pool — and because interior nodes keep their left-to-right order inside a span that already held them at non-negative gaps, no *new* overlap can arise (the measure-after-move guard is then just insurance). This mirrors the classic "distribute horizontal spacing" of design tools and matches operator intuition.'
