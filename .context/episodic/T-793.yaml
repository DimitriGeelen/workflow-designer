summary: |
  I was wrong twice about semgrep, and the uninstall I asked the operator to run had nothing to uninstall. The operator asked why I would not just run it. Fair question, and running it produced the answer: 'Plugin semgrep@claude-plugins-official not found in installed plugins'. CORRECTION 1, MY REPORTING. I described Write/Edit as blocked by an installed plugin and recommended removing it. It is not installed for this session on any register I can read - absent from installed_plugins.json (23 entries), from enabledPlugins in settings.json (17), and from claude plugin list (24 listed). The block spanned exactly two consecutive tool calls and every Edit since has passed, including the ones writing this correction. It was TRANSIENT and I reported it as standing. What is on disk is the shared plugin cache at semgrep/2.3.0 carrying .in_use PID markers stamped today; this machine runs a fleet of sessions for other projects against that same cache, which fits a transient load far better than an enablement here. CORRECTION 2, THE CLASSIFICATION, AND THIS ONE STANDS REGARDLESS. T-784 recorded semgrep in the borderline group as passing the operator's plugin-independence constraint, on the grounds that it spawns a local process with no third party, no account and no runtime network. That judged the semgrep CLI. The PLUGIN is Semgrep Guardian - its manifest says displayName 'Semgrep Guardian', author Semgrep - its hooks.json registers on BOTH PreToolUse and PostToolUse with matcher Write|Edit|Bash, and the hook's own words were 'Not logged into Semgrep Guardian. Ask the guardian mcp to login.' An account, and without it the editor blocks rather than degrades. That is disqualifying under the load-bearing line, in the same class as qdrant-skills rather than pyright-lsp. Four of the five borderline verdicts stand; only semgrep moves. Recorded as PD-307. WHAT I COULD NOT SETTLE, stated rather than papered over: /root/.claude.json is refused by the T-559 project-boundary hook as an outside path not in the read-side allowlist, so an enterprise/managed or foreign-project scope is UNVERIFIED rather than excluded. Absence legs carry positive controls on the same registers, so a bad path cannot score the silences green. Co-Authored-By: Claude Opus 5 (1M context) <noreply@anthropic.com>

