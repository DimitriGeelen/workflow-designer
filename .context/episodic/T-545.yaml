# Summary (auto-generated from git commit messages)
summary: |
  a 403 was written for the wrong reader, and the mechanism I recorded yesterday was wrong in the direction that would have misdirected the fix. The handler chose its body by WHY the request failed — T-2309 split CSRF from generic, a real improvement — and never by WHO was asking, so an hx-post whose target is a div received 66456 bytes of complete HTML document. T-544's note said the browser rendered that document into the page. It did not: htmx 2.0.4 ships responseHandling {code:'[45]..',swap:false,error:true} and never swaps a 4xx, so the body reached ONLY htmx-toast.js, whose error listener extracts its message with .replace(/<[^>]*>/g,'').trim().substring(0,100). That is a TAG stripper, not a text extractor — it removes <title> and <script> tags and keeps the text INSIDE them. Reproduced byte-for-byte against the running instance: 'Session expired — Workflow designer (function(){var t=localStorage.getItem(' is the page title followed by the theme bootstrap's JavaScript source, truncated at 100 chars. The lines I identified yesterday were right and the reason they reached the operator was not, which matters because the earlier framing pointed at the swap path rather than at the handler. Fix is _is_spliced_request() -> a fragment carrying HX-Error-Kind: csrf|forbidden so the T-2309 distinction survives for machines without parsing prose; 103 bytes where 66456 stood. MY FIRST DRAFT WAS WRONG AND THE CORPUS CAUGHT IT, not review: it exempted HX-Boosted requests to protect T-2309's full-page Reload UI, since base.html sets hx-boost on body and ordinary navigation therefore also carries HX-Request. But five routes post a plain <form method=post> under that boost — /arcs/*/close, /assumptions/*/resolve, /inception/*/decide, /inception/*/add-assumption, /review/*/pause/*/resolve — so they are boosted POSTs and the exemption would have left them carrying the exact defect the task exists to remove. The library's own default settled it: since a 4xx is never swapped, the full page is never DISPLAYED for any htmx request, only scraped, and T-2309's page stays reachable by the one thing that displays it, a genuine non-htmx navigation. Probe pins TWO properties because fixing either alone leaves the defect — the SHAPE (a fragment, no <html>) and the CONSEQUENCE (the shipped toast expression over that body yields no script source) — and it reads the real regex out of htmx-toast.js rather than re-typing it, so it cannot keep passing after the real one changes. Leg 6 re-reads htmx's responseHandling every run because the whole design rests on it and an upgrade could retire it silently. Leg 4 went red on its first run for the RIGHT reason and the wrong cause: csrf_protect is a before_request on every POST, so my synthetic generic-403 route was CSRF-blocked before it was reached and the leg was comparing a CSRF failure with itself. Fixing that exposed a second self-defect — the refusal guard matched a bare 'CSRF' substring, which every rendered page carries in a meta tag, so under the revert mutant the probe ABSTAINED exactly where it owed an accusation. A control that declines to answer when the defect returns is not a control. Mutation-verified against three mutants, each killed by the leg that owns it, and the revert mutant reproduces the operator's string verbatim. NOT patched, reported: the tag-stripping regex is a separate defect with its own root cause, latent for any HTML body from any endpoint. Suite 104 -> 105 legs, 0 failed; T-509's sweep did not flake this run

