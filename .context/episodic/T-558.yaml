# Summary (auto-generated from git commit messages)
summary: |
  the bridge suite went red on 2026-08-17 and three tasks shipped green through it, because each of them verified that its new probe was REGISTERED and none of them ran the suite. T-448, T-552 and T-557 all wrote grep -q '<probe>' tests/run-bridge-tests.sh into their Verification blocks and stopped there; their own probes passed, and the three commits tripped four OTHER gates that every artifact reporting on the session then read as healthy. Found only by executing T-101's Verification block by hand to check whether a task with every Agent and Human AC ticked would survive the P-011 gate -- T-101 leg 2 IS the suite, so a rank-5 HV/HC task could not have completed and nothing said so. This is PL-148 one turn out: the instrument asserted its own registration while nothing asserted the host suite's verdict. FOUR REPAIRS, EACH ON ITS MERITS RATHER THAN TO REACH GREEN. (1) T-557 patched vendored observe.sh with no manifest entry -- DECLARED in .vendor-divergence.yaml, not reverted, with the fix and the upstream debt written out, because the file's own header says the suite stays red until you declare it and that is the point not an obstacle. (2) bake-clean-layout.py left the unwired-guard baseline, and the reason is NOT the one the ratchet printed: it says 'now wired or gone' and the truth is that T-448's teeth load it via importlib from a composed path (_t448:44,87), which is precisely the T-495 edge that was ABSENT when the entry arrived on 2026-08-14. It came in because prose stopped counting as a call; it leaves because a call appeared. Recorded in the baseline header, with the distinction a reader would otherwise get wrong -- the MODULE is now wired, the CORPUS GATE is still deliberately not, and T-448's re-bake ruling is still open. (3) _t448's fixture synthesised <bpmn:task>, which neither emitter produces and which appears 0 times across the 24 rendered maps -- changed to scriptTask rather than declared TOLERATED, because the two existing tolerances are cases where un-producibility IS the property under test and this one is scaffolding classify_drift never looks at; a tolerance here would be an exemption bought with a false statement. Teeth still 7/7. Its comment claimed to be 'verbatim from git diff' and the diff SHAPE was; the node element never was. (4) THE CENSUS WAS WRONG ABOUT THE FILE IT FLAGGED. _t532 reported tools/_writeset_hermeticity.py as the corpus's one WHOLE-TREE hermeticity assertion. That module contains no subprocess call of any kind -- it walks a parameterised subdirectory and hashes bytes -- and was flagged on the strength of its module DOCSTRING explaining the git status --porcelain comparand it REPLACED. The census's own strip_comments docstring names this failure mode ('a checker that is confused by comments ABOUT the pattern it detects gets steadily more wrong as authors document the thing') and T-533 closed it for # comments only. A docstring is a comment the tokenizer does not call a comment; the sibling census _t451 reached the same conclusion under T-495 and blanks ast.Expr(Constant str). So the CENSUS was fixed and the module left untouched. GOING FROM ONE FINDING TO ZERO IS ALSO WHAT DELETING THE CLASSIFIER PRODUCES, so tools/_t558-hermeticity-census-teeth.py separates them: it plants a real unscoped before/after git status assertion in the scanned directory and requires it to be flagged AND to still drive rc=1, and plants the same words in a docstring and requires silence. 5/5, wired into the suite. THE TEETH FAILED ON THEMSELVES TWICE AND BOTH TIMES THE FIXTURE BENT RATHER THAN THE GATE: mutant sources embedded as string literals, and later a single backticked phrase inside a failure message, each made this file the corpus's WHOLE-TREE finding -- because the census strips comments and docstrings but not a string literal assigned to a variable or passed as an argument. Stripping every string constant would lose subprocess.run(cmd, shell=True), so the limit is recorded on the task rather than absorbed. SUITE 109 passed/4 failed -> 114 passed/0 failed: the four legs were repaired and one added, and this task's own first verification leg is the suite with a count floor of 114, because '0 failed' is also what deleting four legs produces. OBS-292 registers the structural hole with its detector shape (any task whose diff touches run-bridge-tests.sh must name it in Verification -- decidable at completion time from the task file plus git diff --name-only); building it is a completion-gate change and its own task. OBS-293 registers something found while verifying this one: the suite is NON-DETERMINISTIC. Four consecutive runs on an unchanged tree gave 114/0, 113/1, 114/0, the red being four audit-driven teeth abstaining with rc=2 in one run and 41/41 green two minutes later. Four probes losing their stimulus together points at one audit-level event, not four coincidences -- mechanism NOT measured and stated as a hypothesis. The sharper half: the sweep's own message says an abstention is 'NOT a regression, nothing is claimed', and the suite counts it as a failed leg anyway, so the honest refusal T-430 discipline exists to produce is indistinguishable at suite level from a real break, and a reader who reruns and sees green learns to rerun rather than to look

