# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-08-18 — the `<bpmn:task>` fixture: change the tag, not declare a tolerance'
    chose: 'replace `<bpmn:task>` with `<bpmn:scriptTask>` in `tools/_t448-drift-classification-teeth.py`.'
    rationale: 'the T-327 gate offers two exits — use a producible tag, or declare in TOLERATED that un-producibility is the property under test. The two existing tolerances are genuine: `test_t313_lane_capacity.py` injects `<bpmn:transaction>` precisely to prove lane-capacity SKIPS an unknown type, and `test_typed_event_fixture_contract.py` injects a native `<bpmn:timerEventDefinition>` to prove the IW-1 guard trips on a thing no emitter emits. In both, an emitter-producible tag would not exercise the path at all. Here the node element is incidental scaffolding: `classify_drift()` reads diff lines for `aef:position` and `dc:Bounds`, and never looks at the element name. So a tolerance would be a declaration that the fixture depends on un-producibility when it does not — an exemption bought with a false statement.'
    alternatives_rejected: ['declaring a tolerance (buys silence with a false claim); leaving it (the gate is right).']
  - decision: '2026-08-18 — the hermeticity census: fix the census, not the module it flagged'
    chose: 'teach `tools/_t532-hermeticity-scope-census.py` to blank Python docstrings before classifying, and leave `tools/_writeset_hermeticity.py` untouched.'
    rationale: 'the census reported `_writeset_hermeticity.py` as the corpus''s one WHOLE-TREE hermeticity assertion. That module contains **no subprocess call of any kind** — it walks a subdirectory and hashes bytes, and takes the subdirectory as a parameter. It was flagged on the strength of its module docstring, which explains at length that the FIRST form of the assertion used `git status --porcelain` and why a digest comparand replaced it. The census''s own `strip_comments` docstring names this failure mode exactly — *"a checker that is confused by comments ABOUT the pattern it detects gets steadily more wrong as authors document the thing"* — and T-533 closed it for `#` comments only. A docstring is a comment the tokenizer does not call a comment. The sibling census `_t451-unwired-guard-census.py` reached the same conclusion under T-495 and blanks `ast.Expr(Constant str)`; this is that fix arriving in the second census, five days later, in the first file to trip it.'
    alternatives_rejected: ['scoping `_writeset_hermeticity.py`''s walk (it is already scoped — the caller passes `.context/audits`; there is nothing to fix); adding it to an exemption list (an exemption for a file that is correct); stripping every string constant (a real weakening — `subprocess.run("...", shell=True)` is a call whose command lives in a string).']
  - decision: '2026-08-18 — residual limit, recorded rather than absorbed'

