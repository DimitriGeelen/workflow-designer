  false: _t364-t308-teeth.py stores no shas. Its run() passes REF="3bf37909~1" to _t308, so
  the comparison is CURRENT BUILD vs A PINNED GIT REF. All 24 maps drift by EXACTLY +51
  bytes — commit 4c40414c (T-399) adding exporter="aef-workflow-designer" to every export.
  The red is therefore EXPECTED, not decay: the control's identical=24 became false by
  design the moment T-399 landed. The remedy is also not the re-pin stated above — moving
  BASELINE_REF past the T-364 repair makes the injected fixture comparable, so unusable
  goes to 0 and the teeth go red for the opposite reason; the script's docstring prescribes
  a NEW genuinely-unstable injection. Mechanism of the error: I ran _t308 WITHOUT the ref
  argument, saw rc=0, and concluded the gate was fine and the teeth stale — inferring a
