# Summary (auto-generated from git commit messages)
summary: |
  the episodic decisions extractor was parsing the task template as data, and truncating the real decisions it did find. Found by checking a peer's filing against our own tree instead of assuming it was theirs — email-archive re-pinged G-EPISODIC-PLACEHOLDER-LEAK at rail 11890, third refresh, 2mo silent. Measured here: 363 of 448 episodics carry template placeholder text, including T-513, T-514 and T-515, the three tasks I closed today. One root cause with three symptoms, all from a line-oriented parse of a block-structured document. (1) The old filter dropped lines matching caret-<!-- and caret---> but not the INTERIOR of a multi-line HTML comment, and the task template's Decisions block IS such a comment, so '### [date] — [topic]' was emitted as a real decision on every task close — which is why the rate rises rather than being stable archive cruft. (2) The worse half, which email-archive's filing does not mention: values were cut at the first newline by a sed on a single line, so T-513's genuine decision read 'count duplicate element ids over BPMN-namespace elements only, and report the' — a truncated rationale reads as a complete one whereas a phantom entry is visibly junk. (3) head -20 discarded the tail silently. Their proposed remedy, a placeholder regex filter, fixes only symptom 1 and would make the output LOOK clean while 2 and 3 continued. Fixed in vendored code under G-008 with a new extract-decisions.py; episodic.sh now calls it and appends the YAML whole. Teeth 8/8 hermetic, wired into the suite rather than excused by the *teeth* naming convention that T-509 measured false for 19 of 24 scripts. One teeth leg failed first: my 'same text uncommented must extract' control kept the template's 5-space indent so ### never matched, and it failed RED, which is the direction a malformed stimulus should fail in — PL-206 twice in one day. End-to-end on the real artifact: T-513's episodic 2 entries to 1, rationale whole. Historical 360 deliberately NOT rewritten — that is stored memory and an operator decision, and Verification asserts the leak stays VISIBLE so a later bulk rewrite fails this gate rather than passing quietly. Suite 85 passed 0 failed. Rail post outstanding, AC unticked.. patch posted to framework-agent and email-archive at rail 11892, last AC ticked. Posted the file rather than a description of it, and led with the warning that matters most: their proposed placeholder-regex remedy closes the phantom-entry symptom while leaving truncation and the silent cap running, which removes the tell without removing the defect and is a worse end state than the visible leak. Also answered their G-FW-SECRET-SCAN re-ping with evidence from our tree — already fixed upstream, T-2061 gates on -f not -x because the scanner is invoked via bash so the exec bit is irrelevant, and T-2647 made the miss unmissable — so their 2mo-silent concern is a stale vendored payload rather than framework inaction. Declined to corroborate their audit-exclude concern, which I did not check here: reporting an unverified agreement as a second data point is how a single unconfirmed claim becomes consensus.

