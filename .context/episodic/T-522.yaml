# Summary (auto-generated from git commit messages)
summary: |
  two episodics were lost and nothing said so — the component loop kills update-task.sh before episodic generation whenever a fabric card lacks 'location:'. Under 'set -euo pipefail' the assignment c_loc=$(grep "^location:" "$card" | ...) inherits grep's exit 1 through pipefail, and a failing assignment terminates the script — mid-loop, after the task file has already been moved to completed/, so completion LOOKS successful while decision capture, outcome back-prop and the episodic block 110 lines below never run. DEMONSTRATED THREE WAYS, not inferred: the assignment aborts standalone; the verbatim loop from update-task.sh:1953 exits 1 against the REAL .fabric dir, meaning every completion in this project was dying, not just the two observed; and the timeline discriminates — the two location-less cards are the two I hand-wrote during T-520, they landed at 12:13:39Z, T-520 completed 20 seconds later and T-521 next, both lost, while T-519 at 11:53:42Z was fine. Two cards without location, two tasks without episodics. THE DETECTION STORY IS THE REAL FINDING. T-1169 warns when the generator yields nothing and T-1860 logs every invocation; both live INSIDE the block that never executed, so neither can observe a skip — a control downstream of the branch that fails certifies a line that never ran. And this is the THIRD instance of one bug in one block: T-1374/G-054 guarded two greps forty lines below for exactly this reason and did not carry it to these two. That is T-521's learning arrived at from the opposite direction — fix the mechanism, not the site where it was noticed. So the remedy is not just two '|| true's: an EXIT-trap watchdog now sits OUTSIDE the guarded block, writes a NOT REACHED record honouring the T-1860 promise on the one path where the logging code itself cannot run, and stays silent on the designed partial-complete skip because a watchdog that cries on a legitimate skip gets muted. Teeth prove it by MUTATION: copy the framework, put the unguarded grep back, and require that run to lose the episodic AND name the loss; leg 5 guards the guard, since bash silently replaces an EXIT trap when a second is installed. T-520 and T-521 episodics backfilled, both non-empty and parsing. Vendored fix declared upstream: fix — a re-vendor would otherwise restore the bug. Suite 89 -> 90 passed 0 failed, T-451 ratchet unmoved at 67

