# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-08-15 — reported the duplicate-id finding as an observation, not a defect'
    chose: 'count duplicate element ids over BPMN-namespace elements only, and report the cross-namespace collision (`bpmn:participant/@id` == `aef:workflowMeta/@id`) as a named observation rather than as a defect.'
    rationale: 'BPMN''s `@id` is `xsd:ID`, but `aef:workflowMeta` is a foreign element inside `bpmn:extensionElements`, which BPMN20.xsd admits via `<xsd:any namespace="##other" processContents="lax"/>`. With no AEF schema available, lax means it is not validated, so that attribute is never typed as `xsd:ID` and carries no uniqueness constraint. The document is valid.'
    alternatives_rejected: ['filing it as a bug and telling AEF — which is what the naive counter''s output invited. It would have been a fabricated defect report to a peer, from us, in the same week we asked them to trust our measurements.']

