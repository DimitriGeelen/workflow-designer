# Summary (auto-generated from git commit messages)
summary: |
  AEF asked for the case _t511 explicitly excluded — a BPMN document arriving with no aef:uid — and the answer is YES, identity survives. A uid is minted on first save (0 in, 7 out) and the same set comes back on re-import; stable across two opens of the same bytes. Measured by running buildBpmnXml(parseBpmnXml(x)) in the loaded designer over an AUTHORED bpmn.io-shaped fixture, because every .bpmn in our corpus is designer-produced and carries aef:uid, so none of them can stand in for a document that does not. Three legs passed on the first run and two were worthless, which is the part worth keeping: the anti-overfit rename appended '(renamed)' to 'Review request' and the id slug is built from the LEADING WORD, so both slug to 'review' and the leg reported id_survived_a_rename=true without ever exercising a rename; the boundary leg re-minted only the four node ids and reported three surviving edge uids, an artifact of the three Flow_ ids I left alone rather than a property of the designer. PL-205 and AEF's 11876 both say a control that cannot fail is not a control; the variant here is a control that CAN fail fed a stimulus built so it never would, so the question is not only 'did it fire' but 'does the input contain what it looks for'. Substantive rename now shows hum_2_review -> hum_2_escalate with the uid unchanged, which sharpens what I told AEF at 11879: the element id is not merely re-minted on import, it is a function of lane + x-order + NAME and churns during ordinary authoring. Full re-mint drops the overlap to 0 of 7 — the honest boundary. Also nearly sent AEF a fabricated defect: the naive duplicate-id counter reported Process_t513 twice, but the two carriers are bpmn:participant/@id and aef:workflowMeta/@id, and a foreign element inside extensionElements is admitted by xsd:any processContents=lax, so with no AEF schema present its @id is never typed xsd:ID and the document is valid. Counter now scoped to the BPMN namespace, collision reported as an observation. Wired into the bridge suite: 83 passed 0 failed, T-451 census findings unchanged at 67. Rail post still outstanding, AC deliberately unticked.. answer posted to AEF at rail 11885 and the last AC ticked with the offset as evidence. The post carries four things and not just the answer: identity survives (0 uids in, 7 out, identical set on re-import), the 0-of-7 boundary when a third-party editor re-mints its own ids, the scope it must not be read past, and a CORRECTION — at 11879 I told them the element id is 're-minted on import', and measured it is a function of lane + x-order + NAME, so hum_2_review becomes hum_2_escalate under a plain rename with the uid unchanged. They closed the id question on their side on the strength of the narrower statement, so the sharper one had to reach them in the same breath as the new answer rather than sit in our task file. Also disclosed the fabricated defect I nearly sent: the duplicate-id counter reported Process_t513 twice and BPMN's @id is xsd:ID, but the second carrier is aef:workflowMeta inside extensionElements, admitted by xsd:any processContents=lax and therefore never validated or typed as an ID. Suite failure message corrected from 11884 to 11885 — I had written the offset before the post existed, and a failure message that cites the wrong rail entry sends the next reader to someone else's conversation.. capture PL-206. PL-205 and AEF's 11876 cover the two known control failures — an absence is indistinguishable from a dead comparator, and a control that cannot fail is not a control. T-513 produced a third and it caught me twice in one sitting: a control that CAN fail, fed a stimulus built so it never would. Both legs had live comparators and both passed on inputs that never challenged them, so both numbers were true about the fixture and false about the system. The check is two questions rather than one — did the control fire, and does the stimulus actually contain the thing it looks for. The tell both times was a number that looked too tidy: a survivor count landing exactly on the subset I had skipped, and a stability result on an edit I had made invisible by keeping the leading word.

