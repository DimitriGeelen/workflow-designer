# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-11-02 — severities, and where a fixture keeps its catalog'
    chose: '- W-XML-IO-FIELD-UNKNOWN and W-XML-IO-FIELD-ENTITY: **WARN**. - E-XML-IO-EXPECT-CONTRADICTS: **ERROR**. - W-XML-IO-EXPECT-REDUNDANT: **WARN**. - A fixture''s catalog lives in `tests/fixtures/catalogs/<code>.json`.'
    rationale: '- **Unknown and entity are warnings because a catalog can be partial.** Greenfield''s full catalog has 1332 rows, only 108 with a shape, and its Novis rows have no type source. An unknown fieldRef or an entity mismatch can be the catalog''s gap rather than the map''s error. They stay visible (greenfield''s own entity check found 15 real errors), but they do not make a map INVALID. - **A contradiction is an error**, as AEF spec T-4415 C says: the step demands a value the attribute can never hold, so either the map or the catalog is wrong, and a generator must not proceed. - **A repetition is a warning**, also per T-4415 C. - **The catalogs live outside the swept fixture folders.** `test_check_pass_reachability` sweeps `tests/fixtures/{invalid,warn,valid}/*` and would read a JSON catalog as a YAML map. The two harnesses that need a catalog look it up by the fixture''s name.'
    alternatives_rejected: ['- An ERROR for the entity check: it would turn every partial catalog into an invalid map. - A catalog next to the fixture: the sweep would read it as a map. - Having the validator discover a catalog by itself: implicit, and the result would depend on files lying around.']

