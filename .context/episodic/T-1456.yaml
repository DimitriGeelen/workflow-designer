  - decision: '2026-11-20 — Two scoring changes, measured against every drawn flow of the corpus'
    chose: '(1) a bar outside the lanes the flow connects costs 50 (more than an interior bar''s 10, less than one cut step''s 100); (2) on a side that mixes incoming and outgoing ends, and ONLY where the ends as they actually land (a straight end snapped onto the centre line, the rest at the even spread) put an incoming end closer than the pitch to an outgoing one: the straight ends keep their place (else the outgoing ones) and the others move out an arrowhead (12 px) beside them, where that fits on the side.'
    rationale: 'each was tried and measured on all 340 drawn flows (24 corpus maps + the fixture). A first version (wider pitch for mixed sides) bent 7 straight flows; "incoming always yields" bent straight incoming flows; clamping on a short side put two ends on one point (task-gate); re-spreading EVERY mixed side at 16 px (then 12) moved aef-task-lifecycle''s ''shelved'' label onto flow tl_e15 (person-sees label-clearance: 56 errors). The real fault is only the snap: the even spread puts a straight end off-centre, straightening pulls it back, and its neighbour is left half a pitch away (Greenfield 4 px). The final rule changes 18 of 340 flows, bends none that was straight, adds no close pair or lane exit, and label-clearance is clean.'
    alternatives_rejected: ['forbidding a foreign lane outright (where every in-lane bar cuts a step, leaving is the lesser fault); entering the far side (top) for a loop from above (a deeper port change; not needed once the ends are apart).']
  - decision: '2026-11-20 — Round 2 (reviewer AMBER, V judge-t-1456-r1-11f433b45871): a bar must not run along another flow'
    chose: 'a bar height within 6 px of another flow''s horizontal run over >= 12 px costs 60 per such flow (more than leaving the lane, 50: an ambiguous route reads worse than one outside the lanes). The other flows are read from their NATURAL routes, which buildEdgeGroups already computes from the map alone and caches (T-423: saved bytes must not depend on the screen), behind a re-entry guard (T-1459''s prototype hung a renderer without one).'
    rationale: 'the scoring knew steps, lanes and closeness, never other flows'' lines.'
    alternatives_rejected: ['reading other flows'' DRAWN polylines (render state in export geometry; order-dependent bytes).']

