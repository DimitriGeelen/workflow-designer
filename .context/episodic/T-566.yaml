decisions:
  - decision: '2026-08-20 — Both scopes, not one: `note` AND a general disclosure'
    chose: 'add `note` as an editable field, AND add a read-only disclosure branch that renders every `aef:` key the node carries but `AEF_FIELDS[n.type]` does not name.'
    rationale: 'measured over 91 bpmn files / 714 `aef:meta` values — 305 (42.7%) sit outside AEF_FIELDS across 14 distinct keys, of which `note` is 92. Shipping only the whitelist entry fixes 92 and leaves 213 in the same condition, at which point the next consumer files the same report about `terminalKind` (60) or `state` (56). `note` is the key that bit two projects; a panel that iterates a whitelist and silently drops the rest is the SHAPE that bit them. Mutant A makes the point mechanically: with `note` unlisted, the disclosure branch is what catches it.'
    alternatives_rejected: ['whitelist-entry-only (mutant B — satisfies both reporters, leaves the shape). Also rejected: making the disclosure editable (mutant C) — T-197 establishes that `owner` is DERIVED from lane authority and `gatewayKind`/`scopeOf` are structural, so an edit box on them would be overwritten on the next render and is a lie.']
  - decision: '2026-08-20 — `note` on all 13 node types, not "task-like and event"'
    chose: 'list `note` on every type in AEF_FIELDS, including gateways.'
    rationale: '001-CashWeb asked for "task-like and event types" and I told them a blanket add was "the tempting version and probably the wrong one". On reading the table that was wrong, and the correction is worth stating rather than quietly shipping. Every other key in AEF_FIELDS is type-specific because it carries type-specific SEMANTICS — `emits` on a startEvent is meaningless, a `timerSpec` on a task has nothing to bind to. `note` carries no semantics a node type could contradict: it is author prose. T-197''s principle is that a field appears where it is AUTHORABLE, and prose is authorable everywhere. Restricting it would have produced this same report from the next author who put a note on a gateway.'
    alternatives_rejected: ['the requested narrower set — it would have needed a defensible reason to exclude gateways and there is none.']
  - decision: '2026-08-20 — Multi-line asserted on the bytes, not on the textarea'
    chose: 'a probe leg that round-trips through `parseBpmnXml(buildBpmnXml(state))` and requires the newline back, plus the presence of `&#10;` in the emitted XML.'
    rationale: '`note` is serialised as an XML ATTRIBUTE, and attribute-value normalisation collapses a literal newline to a space. "Multi-line note" is therefore a claim about `escAttr`, not about the panel — a textarea that renders three lines and re-loads as one would satisfy any panel-level assertion. `escAttr` already emits `&#10;` (src:9437) and the comment beside it shows the author knew the rule; this leg pins that behaviour so a later "simplification" of escAttr cannot silently flatten the reporter''s content.'

