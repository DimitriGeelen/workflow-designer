decisions:
  - decision: '2026-09-29 — what counts as the lane''s default while T-895 is pending'
    chose: 'the effective default is `lane.authoringDefault` when declared, else the lane''s legacy `authority` unless it is the retired `none` sentinel (`effectiveLaneDefault`).'
    rationale: 'today no corpus map declares an authoring default and no element carries its own authority, so the literal clause-4 rule ("no authority → louder marker") would flag every node on all 24 maps. The lane''s `authority` IS where the fact lives until T-895 migrates it; reading it as the default keeps the marker truthful on the current corpus and makes the retired `none` lanes — whose elements genuinely carry no authority anywhere — the only place the louder marker fires.'
    alternatives_rejected: ['authoringDefault-only (the pure clause-4 reading): correct after migration, a corpus-wide false alarm before it. Treating `none` as a default: it is the value T-888 retired precisely because it hid this hole.']

