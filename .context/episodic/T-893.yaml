# Key outcomes
outcomes:
  - '**One pure function decides the state:** `authorityMarkerState(own, laneDefault)` in `src/aef-workflow-designer.html` returns exactly one of `''none'' | ''differs'' | ''missing''`, with the three states from T-888 clause 4 and nothing else: own present and equal to the lane default → `none`; own present and different from a present default → `differs`; neither own nor default → `missing`. Own present with no default → `none` (there is nothing to differ from — the same three-state grammar the validator''s `W-XML-AUTHORITY-DEFAULT-MISMATCH` uses, T-894). Pinned by a node-run unit test that slices the function out of the HTML, so it runs without a browser'
  - '`renderNodes()` draws a marker per state: nothing for `none`; a subtle marker (class `node-authority-badge`, faint text, the element''s own authority abbreviated) for `differs`; a louder marker (class `node-authority-missing`, the `--orange` token, never a literal colour) for `missing`. Colours come from theme tokens'
  - '**The default never writes (T-888 clause 3):** rendering a marker mutates no node — a leg serialises the document before and after a render with lane defaults set and requires byte-identical output'
  - '**Visual verification per CLAUDE.md, not DOM math:** element-level Playwright screenshots of a node in each of the three states, in every label-size mode the app has (`s` / `m` / `l`, its only visual modes — there is a single theme), READ back, and referenced in a `## Visual Verification` section of this task. Nine screenshots minimum, each one named'
  - 'The existing designer suites that touch node rendering stay green (`tools/_t889-authority-on-the-element-teeth.sh` static legs and the round-trip guard''s `--denominators-only`), because the marker adds no emitted key and no new `aef.*` access'
  - '[REVIEW] **The two markers read as different KINDS of thing, and the common case is silent.**'

