# Summary (auto-generated from git commit messages)
summary: |
  one place holding the decisions only a human can make — listing by default, and refusing to pretend the queue is executable end to end. WHY IT EXISTS: several pending items are Tier 0 or sovereignty-gated, so the agent is structurally blocked from running them, which is correct. But the commands are long, and a long command pasted out of a chat log is a command nobody reads before running. THE SHAPE IS THE POINT: bare invocation LISTS and does nothing. Each action prints WHY a human is required above what it runs — t788 says what it does to the record (rewrites the Decision block, original GO survives in Updates), t353 says it is read-only, names the expected output, and admits the AC's own 16/16 citation decayed and is now 23/23. A queue of opaque one-liners would train exactly the reflex the gates exist to prevent. CONSEQUENTIAL AND READ-ONLY ARE NOT PRESENTED ALIKE: t353-probe runs immediately. t788-redecide demands the action id TYPED IN FULL, because y/N is too easy to fat-finger for something that writes a sovereignty record. Measured: answering 'yes' aborts with 'nothing was run'. THE COMMAND DISPLAY IS DELIBERATELY NOT %q-ESCAPED. The first version was, and it turned a paragraph of rationale into a wall of backslashes — unreadable, which defeats the one AC that matters here. If the point of showing a command is that a human reads it before approving, an unreadable rendering is worse than none. It is not meant to be copy-pasted; the script runs it. IT SAYS WHAT IT CANNOT DO: a NOT RUNNABLE FROM HERE section names SQ-2 and IW-3 as judgement rather than commands, states outright that a ### Human AC must never be ticked on someone's behalf — not the agent's to do and not this script's either — gives the file to edit, and the arithmetic that turns on it (113 - 17 = 96 > 78). THE AGENT DID NOT RUN ITS OWN SCRIPT: a Verification leg asserts T-788 still reads Decision: GO, and goes red if that ever stops being true. Co-Authored-By: Claude Opus 5 (1M context) <noreply@anthropic.com>

