summary: |
  budget-gate's allowlist matches ENGLISH, not shell structure — measured, reported upstream, deliberately not patched. Probe with the allow-expression EXTRACTED from the shipping file at run time (a retyped copy tests my transcription, not the gate): 5 of 9 misclassified, both negative controls hold. Wider than the ticket said — it was filed as a compound-command defect, but the match also fires on an allowlisted phrase inside a COMMENT and inside a STRING LITERAL, neither of which is a compound command. Bounded honestly rather than alarmed: classification is consulted ONLY at critical (:331), ok/warn/urgent exit 0 regardless, so with CONTEXT_WINDOW=300000 the window is the last 5% — total inside it, irrelevant outside it — and the realistic failure is accidental self-evasion (exactly how T-401 found it, its first post-compact call carrying 'git log'), not an attacker. Ownership taken from the T-427 instrument and not from the path: vendored import, blame ebf0c721, breadth 1367. The path test would have agreed here BY COINCIDENCE and would have been wrong for 86a256fd. So: no edit to the vendored file under agent initiative (asserted in Verification), reported to AEF at DM offset 526 with the probe table and no dependency on their answer, and local containment (wait / carry-a-patch / accept) put to the operator as A/B/C because 'wait by choice' and 'wait because nobody decided' are the same observable. The finding is committed as an executable probe rather than prose: a claim about someone else's code that we cannot fix locally is exactly the kind that rots, and exit 1 after a future re-vendor is the fix ARRIVING, not a regression. drive the real gate instead of the expression it uses — the old probe's close condition could not fire on the fix that is actually coming. AEF's T-2919 (f1b1023f0) replaces the single allow-regex with segment-splitting in lib/cmd_classify.py, so the extraction regex finds nothing and the probe exits 2 'cannot answer' at exactly the moment it was built to speak. The defect in it is mention-vs-instance, the class we have been trading all week: it asks does this regex match when the question is does the gate block this command — and my own AC carries the same slip, saying 'against the real classifier' then defining that as 'feed the allow-expression'. New probe runs budget-gate.sh as Claude Code runs it (PreToolUse JSON on stdin, verdict from the exit code), sandboxed via PROJECT_ROOT so the T-2403 restart signal lands in scratch and never arms a real relaunch. Baseline: 9/9 as documented, this tree is pre-fix. Teeth 18/18 including all seven transitions AEF pre-registered at DM 532, reproduced against a SIMULATED anchor (their file is not vendored here — evidence their transitions follow from their design, not a test of their implementation), plus cannot-answer legs for missing/uniform/crashing gates. A-013 validated with the basis stated — the forward compile target exists (AEF DM 532 section 3: tools/bpmn_to_tasks.py via 'fw bpmn compile|promote', uid-keyed, idempotent, flow order preserved through _task_tier/_nearest_task_preds). The compiler is not vendored here and I will not run their tooling, so its existence is ATTESTED by its owner rather than measured by me, and the evidence says so instead of blurring it. What was checkable here was checked: their related_tasks ceiling reproduces against the vendored copy, and lib/task_pair_acd.py:96 is a THIRD consumer of that field they did not name — arc membership, compiled precedence and hand-authored see-also are already indistinguishable to every reader, today, before my compiler writes into it. OBS-026: A-014 is child-3's premise (T-184, operator-DEFERRED 2026-07-11, revisit trigger not fired), not the anchor's — so two of the three assumptions I carried as arc blockers were not blockers, because 'blocking' was read as a property of the assumption when it is a property of the assumption plus the schedule. add the two rows AEF's T-2923 incident proves were missing. They shipped T-2919 and it refused their own wrap-up commit — 'git commit -F - <<EOF' splits on newlines outside quotes, a heredoc body IS newline-separated text outside quotes, so every line of the commit MESSAGE became a segment judged as a command and the gate quoted the message back as its reason. Neither their wrap-up legs nor mine could have caught it: we both wrote them in the bare -m form, the shape the gate ADVERTISES in its own block message rather than the shape a session actually runs. Two regression sentinels added (heredoc commit, and a commit whose BODY reads as a dangerous command) — both must STAY allowed, so they fail only when a fix for the anywhere-match overshoots. Teeth 26/26: M1 now simulates T-2919 WITH its defect and reproduces the incident (7 rows move, both sentinels strand), M2 adds T-2923's heredoc stripping and moves them back while all five bypasses stay shut. Only the pair moving in opposite directions is the correct outcome. M2's first draft injected a double-quoted regex into the gate's python3 -c block, ending the bash string and crashing the gate on every row — the probe refused to score it (exit 2) rather than reporting, which is the only reason the mistake was visible. reviewer verdict

