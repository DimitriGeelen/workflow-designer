# Summary (auto-generated from git commit messages)
summary: |
  open the sixth input-fidelity population — definitions' children OTHER than the single process (collaboration/participant/messageFlow, root message/signal/error, dataStore, a second process). Distinct from T-347 because these root elements are REFERENCED by nodes: if the designer drops the referent but keeps the referencing construct the emitted document has a DANGLING REFERENCE — invalid BPMN, not merely poorer BPMN, a consequence class no population so far has produced. If instead both go, it is repair-semantics-identical to T-347 and folds into it rather than opening a second operator decision; deciding which is the point of the task. ALSO CARRIES T-343's completion bookkeeping (episodic, moved task file, three learnings) — work-completed is terminal so T-343 cannot be refocused, and the focus-drift gate correctly refuses a T-343-labelled commit while focus is elsewhere. Recording the carry here rather than reaching for FW_SWITCH_FOCUS: the standing directive delegates initiative, not gate bypasses. Worth the operator's attention as a small traceability seam — every completed task's episodic necessarily lands under some LATER task's ID. T-343 learnings carried: a DIFFERENCE-based count spans every drop reason so attributing it to one cause is a guess dressed as a measurement; a literal integer in an AC is a G-015 subject error and decayed 15->17->20 in one day with no regression among them; an equivalence check run in a state where the subject does nothing returns identical and proves nothing. sixth input-fidelity population — definitions' children OTHER than the process the importer reads. parseBpmnXml takes processes[0]/participant[0]/laneSets[0], first-only with no complement branch, so 7 root shapes drop 24/24: second-process, root message/signal/error, dataStore, second-participant, messageFlow. THE HYPOTHESIS THAT MOTIVATED THE TASK IS FALSE, and that is the result: no dangling references are introduced, baseline clean, output stays SELF-CONSISTENT — buildBpmnXml emits a fixed root skeleton and copies no references from the input, so a kept ref can never outlive a dropped referent. Repair semantics are therefore identical to T-347's (preserve / consume / refuse) and this FOLDS INTO T-347 rather than putting the same question to the operator twice; addendum written there. One qualification carried across: second-process is not equal in weight to the others — a two-pool collaboration returns as one pool with the surviving pool's counts unchanged, so every count-based instrument and the validator stay green, and 'refuse' is far more defensible for that row than for a documentation string. TWO SELF-CORRECTIONS. (1) The positive control I specified in the AC could not have failed: buildBpmnXml hard-codes <bpmn:process>, so a predicate on it reports PRESERVED over an empty document — third time on this arc a predicate was written against something the emitter guarantees (T-335 REPAIRED, T-336 VALUE). Control changed to pool identity, which is input-derived; teeth leg (b) flips it by neutering that read. (2) The dangling-ref checker matched any attribute ending in 'ref' and invented 21 findings — AEF's own semantic ref=G-019 / ref=P-010 payloads — before it found any; caught by printing the MEMBERS rather than trusting the count. Narrowed to an explicit IDREF set, and because that narrowing is large the checker now runs positive/negative/exclusion controls before use, with teeth leg (e) re-widening it to the broken form and requiring the exclusion control to fire. Teeth 6/6; leg (c) went red for the wrong reason first (unclosed concat, node died at parse) and the name-your-condition requirement caught it — third time it has paid. bridge 69/0, validator 54/0, geometry 24 clean

