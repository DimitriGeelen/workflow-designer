# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-07-05 — Retire Density, keep Branch-pitch'
    chose: 'Remove the Density preset entirely; keep Branch-pitch.'
    rationale: 'Density only scaled a snap *threshold* (`DENSITY_PITCH` × `ROW_PITCH`) that Tidy/drag consult — it never re-spaced existing rows nor grew lanes, so on an already-tidy baked map tight↔wide read as inert (the operator''s report; measured inverted spread tight 547 > wide 490). The new Vertical spacing control fully subsumes and surpasses its intent (absolute pitch + lane growth), so Density became redundant *and* misleading. Branch-pitch, by contrast, demonstrably works: harvest-pipeline''s 6-node fan-out stack widened auto 80px → roomy 92px, visible in screenshots. It is orthogonal to Vertical spacing (tunes the gap *within* fan-out stacks during Clean, not the global inter-row pitch), so both earn their place.'
    alternatives_rejected: ['(a) Repointing Density to the new logic — would keep a second, weaker vertical-spacing control competing with the explicit one. (b) Removing Branch-pitch too — it is not inert; removing a working, distinct control on suspicion would lose real capability.']
  - decision: '2026-07-05 — Rigid row-shift over snap-to-row-centre'
    chose: 'Translate each detected row as a rigid group (`n.y += delta`) rather than snapping every node onto the row''s exact centre-y.'
    rationale: 'Rigid translation preserves intra-row layout, so no *new* same-row overlap can be introduced; combined with the ≥72px clamp exceeding the tallest node (task 64px), inter-row folding is impossible either — the effect is monotonic by construction with no measure-after-move revert needed (unlike alignRows/alignColumns, which snap to a shared axis and must guard collisions).'
    alternatives_rejected: ['Snap-to-centre (as alignRowsLane does) — would force intra-row nodes at differing y onto one line, risking overlaps and needing a revert path for no gain here.']

