# Summary (auto-generated from git commit messages)
summary: |
  the D2 review-queue line stated a bar the instrument did not hold, and it is unfalsifiable with one tier populated. audit.sh appended to a single d2_details from BOTH the >=720h and >=336h branches, then printed the fail-tier COUNT against that shared list: '2 task(s) waiting >30d: T-093(41d) T-178(36d) T-308(17d) T-310(17d) T-325(14d)' — count 2, list 5, three of them below the threshold the sentence states. PL-159 verbatim, one register over: the variable had no owner, so whichever branches wrote to it silently redefined what the message meant. WHY IT SURVIVED IS THE HALF WORTH KEEPING: the defect is unobservable unless both tiers are populated at once, because with fail-tier entries only the shared list IS the fail list and the line is internally consistent. My first instinct was a fixture with one aged task, which passes against the broken code — PL-206, a stimulus built so it cannot fail, caught before writing it rather than after. Teeth therefore drive all three tiers 40d/20d/5d through the TASKS_DIR seam against the REAL audit.sh, not a reimplementation of four lines of branch logic, which would assert a copy. Both arms on the live binary: re-merging the tiers turns legs 2, 3 AND 7 red naming T-902(20d), restore is sha256 byte-identical. Leg 7 'no task appears in both lists' was written as a consistency check and turned out to be an independent second detector I had not predicted. REFUSE arm proven too, not merely implemented: fixture owner human->agent empties the queue, the audit renders '[PASS] D2: no pending items' which does not parse, rc 2 abstention — a green there would have been the exact vacuous pass PL-205 names. Fix appends the >14d tier with ITS OWN count and label rather than dropping it: deleting it would reconcile count with list by hiding a real queue, a worse line than the broken one. SECOND FINDING, which corrects my own record rather than the code: D2 is NOT an oe-daily check. It sits inside 'if should_run_section discovery' at audit.sh:3915 and the report prints it under '=== DISCOVERY: OMISSION DETECTION ===' in the header, plainly. T-432's per-section breakdown has no discovery row at all and attributed all 60 FAILs to oe-daily; 59 were genuinely oe-daily, the 1 survivor was not. That also makes the teeth affordable — 8s via --section discovery against 81s for a full run, 216s against a synthetic TASKS_DIR. Vendored fix under G-008, reported upstream at rail 11955. Suite 96 -> 97 passed 0 failed at 313s (the familiar 168s is T-509's stale figure, corrected to ~309s by T-526 and I reached for the stale one again). T-451 ratchet unmoved at 67 because the tool is wired, not shelved. Push gate section list deliberately untouched — that is T-432's open operator ruling and this task fixes what the line SAYS, not whether it gates

