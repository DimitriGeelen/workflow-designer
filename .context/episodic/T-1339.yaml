# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-29 — indenting nested elements'
    chose: 'indent only the first line of each written entry by two spaces per nesting level; `incoming`/`outgoing` are written one entry per line so they indent too. A nested node''s `extensionElements` contents sit two spaces short.'
    rationale: 'an entry''s inner lines can be kept XML (other tools'' extensions, event definitions, documentation text), stored verbatim with the file''s whitespace and read back verbatim. Indenting them added two spaces on every save (the second save differed), and inside `documentation` or a condition it would change the text itself.'
    alternatives_rejected: ['indenting every line (unstable, alters text content); no indentation for nested elements (stable but unreadable nesting).']
  - decision: '2026-10-29 — node reads inside a container'
    chose: 'in the import''s node loop, `byAef`/`byBpmn` stop at another imported node (`ownOnly`).'
    rationale: 'they are descendant queries. Once a saved container holds its nodes, the container would read a nested node''s `aef:position`, `aef:meta`, documentation … as its own. With no nested node the result is unchanged.'
    alternatives_rejected: ['rewriting each read as a direct-child query (14 sites, more change for the same result).']
  - decision: '2026-10-29 — the notice line'
    chose: 'keep a line for nested contents, flipped to "drawn at the top level of the canvas — on save they stay inside their subprocess".'
    rationale: 'the canvas still shows them flat, so a person who sees them outside the subprocess needs to know the file is not changed by that.'
    alternatives_rejected: ['dropping the line (the flat drawing would then read as the file''s truth).']

