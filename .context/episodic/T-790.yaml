# Summary (auto-generated from git commit messages)
summary: |
  plugin vs MCP is not a choice — one contains the other, and the skill's default collides with our own constraint. Read from the two installed trees rather than recalled, 8 citations checked including a positive control on the load-bearing absence. (1) NOT ALTERNATIVES: plugin-dev ships a whole mcp-integration skill about putting an MCP server INSIDE a plugin, and plugin-structure lists .mcp.json in the plugin layout. Containment, not competition. (2) The operator's portability instinct is CORRECT for capability — remote MCP works across Desktop, Code, claude.ai and third-party hosts — and INCOMPLETE for governance: MCP is a protocol for offering capability, it cannot intercept the host lifecycle, so the nine plugin hook events have no MCP equivalent. That is not abstract here: four gates fired in this session alone (P-002, G-020, G-067, T-638) and none of them is expressible over MCP. Nothing gets done without a task is not a tool, it is a veto on other tools. (3) THE COLLISION, which neither skill can know about: build-mcp-server's starred default is a remote streamable-HTTP server, which is a load-bearing service dependency by construction and therefore exactly the shape the operator's standalone ruling excludes. The two shapes that DO pass are the ones the skill ranks lower — local stdio, and MCPB which packages the runtime so it installs without Node or Python. (4) Recommendation: logic in an MCPB-packaged local stdio MCP server, a thin Claude Code plugin wrapping it for commands and skills, and governance explicitly NOT made portable — inventing a private protocol for it would be the lock-in D4 exists to prevent. Cost stated plainly: outside Claude Code the capability travels with none of the enforcement. Co-Authored-By: Claude Opus 5 (1M context) <noreply@anthropic.com>

