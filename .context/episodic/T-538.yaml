    rationale: 'the id namespace is AEF''s. Renumbering in our vendored copy diverges it from upstream and will conflict on the next `fw upgrade` — and AEF stated plainly at DM 536 §1 that the bump is the operator''s call. A register-allocation decision made silently by an agent inside a vendor copy is exactly the kind of change that is invisible until it collides.'
