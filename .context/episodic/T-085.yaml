# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-07-04 — Density scales the row-pitch heuristic, never stored geometry'
    chose: '`viewPrefs.density` scales `rowPitch()` consumed by laneRowYs (and thus tidy, drag row-snap, lane inspector). Changing the pref moves nothing; tidy remains the explicit, human-triggered mutation that adopts the new pitch.'
    rationale: 'A view preference that silently re-layouts the document would violate the render-only seam (same discipline as T-084''s rejected lane auto-grow) and make the toggle destructive.'
    alternatives_rejected: ['Re-layout on density change (mutates document from a settings toggle); scaling default lane heights (deferred later slice per operator scoping).']
  - decision: '2026-07-04 — Visibility hides text, never bands'
    chose: 'Toggles remove only text/halo elements (lane label text, id badge text, edge label + data-elr halo, pool title). Lane header band and pool band always render.'
    rationale: 'The bands are interaction affordances (lane click target, resize grip anchor) and structural landmarks; hiding them would change hit-geometry, not just ink.'
    alternatives_rejected: ['Collapsing the 60px lane header / 32px pool header when hidden — that is geometry, shifts every lane, and belongs to a layout feature, not a label toggle.']
  - decision: '2026-07-04 — Label size via CSS keyed off svg[data-lsize]; ladder steps moved to inline style'
    chose: 'S/M/L as CSS rules on a root data attribute; the lane-fit ladder''s explicit shrink steps switched from font-size ATTRIBUTE to inline STYLE so measured shrink always beats both `.lane-label` and the size rules.'
    rationale: 'SVG presentation attributes lose to any CSS rule — probe confirmed a `font-size="8px"` attribute computes to 10px under `.lane-label` while `style="font-size:8px"` computes to 8px. This also uncovered that T-084''s shrink tier had been a silent no-op (registered as T-088).'
    alternatives_rejected: ['Per-element font-size attributes for the size pref (defeated by class CSS); duplicating three sized class variants (rule explosion).']

