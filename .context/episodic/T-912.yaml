# Summary (auto-generated from git commit messages)
summary: |
  Two defects in one 8-line function, both of which multiply by the size of any inbox drain. do_promote (.agentic-framework/agents/observe/observe.sh:339-346) hardcodes --owner human with no override, and its post-promote sed writes the LITERAL string 'task' into promoted_to rather than the created task id. Blocks draining the 182-item inbox: promoting the 71 urgent items would manufacture 71 human-owned tasks that an agent cannot close, each carrying zero Human ACs, plus 71 records that cannot say which task they became.

# Key outcomes
outcomes:
  - '`fw note promote` accepts `--owner <owner>` and **defaults to `agent`**. The default is the change that matters: a flag nobody passes fixes nothing, and the 182 pending observations will be promoted by whoever drains them, not by someone remembering a flag'
  - '`--owner human` remains available and is still honoured — the point is that human ownership becomes a **choice with a reason**, not the silent default'
  - '`promoted_to` records the **actual created task id** (`T-NNN`), read back from what `create-task.sh` produced rather than assumed. If the id cannot be determined, promote **fails loudly** rather than writing a placeholder — writing `task` again would be the same defect with better intentions'
  - 'The **reverse link exists too**: the created task names the observation it came from in a field a query can read, not only in prose. `description:` already says "Promoted from observation OBS-NNN"; that is text, and text is not an index'
  - '**Proved by a real promotion**, not by reading the diff: promote a disposable observation, assert the task is `owner: agent`, assert `promoted_to` equals that task''s id, assert the reverse link resolves. Then clean up the fixture'
  - '**Control set first**, and it reports `SETUP BROKEN` rather than scoring: a promotion that did not create a task must be distinguishable from one that created a task with the wrong owner. The two look identical in a naive grep of the inbox'
  - 'The six **already-promoted** observations are either backfilled with their real task ids or left alone with a recorded reason. OBS-416→T-910 and OBS-402→T-875 are known; the older four need looking up or honestly marking unknown. **`unknown` is not `ok`** (T-675)'

