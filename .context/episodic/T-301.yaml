# Summary (auto-generated from git commit messages)
summary: |
  the defect is real, complete and UNREACHABLE, and the fix for T-501 would activate it. The chain: openProjectMap (:8756) fetches rendered/<m.id>.bpmn by the STORE CARD id, then hands the bytes to adoptImportedXml, which re-derives workflowMeta.id from the document and sets activeKey to that — discarding the id it just fetched by. From there openVersionsModal (:8588) queries /api/versions?id=state.workflowMeta.id and saveToProject (:8467) POSTs the same value, so ONE divergence produces BOTH reported symptoms: empty Versions panel and a forked project record. IW-3 answered: one defect, one build task, not two. T-264's load-source mismatch confirm does not fire here — it is gated on _loadSrcKey, which only the ?load deep-link path sets, and test_t264_save_target_guards.py:19 covers that path only. THEN I MEASURED THE WRONG POPULATION AND THE TASK'S OWN OLD RECOMMENDATION CAUGHT ME. First census scoped the two rendered/ roots — 49 documents, 0 divergent — and I was ready to write 'not reachable'. The 2026-08-14 DEFER, three sections further down the same file, names a live instance I had not looked for: store card t101-review-audit-process, 2 versions, empty panel, forking audit-process v1. That is a card in .editor-versions/, a different population and the one the symptom actually lives in. Re-measured: 24 store cards, 0 divergent, and no t101-review-audit-process card survives. The answer holds and the correction is recorded, because a census that scopes the wrong population and comes out clean is indistinguishable from one that scoped the right one — third time this week that the defect in a measurement was its SCOPE rather than its value. THE EDITOR CANNOT PRODUCE THE DIVERGENCE; THE STORE CAN. Every editor write path keys the card by workflowMeta.id. t101-review-audit-process was made by copying at the store level, outside the editor entirely. So an editor-side fix would guard the path that was never the source, and the honest guard is a corpus check — stem == workflowMeta.id across both rendered roots and .editor-versions/*/ — which would have caught the reported instance on the day it appeared and costs one file walk. RECOMMENDATION FLIPPED FROM DEFER TO GO ON A SMALLER AND DIFFERENT THING than the title asks for: assert the invariant, do not chase the symptom. Explicitly NOT changing openProjectMap, NOT carrying the card id through adoptImportedXml, NOT reopening T-263. THE COUPLING TO T-501 IS THE REASON THE URGENCY CHANGED, and neither task's write-up mentioned the other. deriveSlug('customer-refund') === 'customer' (verified in node), and build/gallery/rendered/customer-refund.bpmn is the SINGLE served document with no <aef:workflowMeta> to pin its id. If T-501's drafted deriveSlug fix ships, this defect fires for the first time, on that file, silently — empty panel and a forked save on a map that worked yesterday. That is an independent second reason to replace that transform, and it is the argument for landing the invariant check BEFORE any T-501 build task rather than after. IW-4 ANSWERED AND IT IS NOT A BUG: the file stem IS a second identity authority in practice — the server keys versions by it, the browser fetches by it, delete/thumb/list all use it. T-263 declared which of the two wins; it did not remove the other or require them to agree, and nothing asserts that they do. Reopening that is a standard-level decision and belongs in its own inception rather than smuggled into a fix for an empty panel. FOUR VERIFICATION LEGS, and leg 4 FAILED FIRST for the second time this session in the same class as T-501's leg 2: a double-quoted grep pattern containing ${encodeURIComponent(id)} was expanded to empty by the shell before grep saw it. Caught only by running the extracted legs through the same eval loop update-task.sh:1018 uses. Filed as OBS-297 with the part that matters — an existence leg fails LOUD when mis-quoted, but a 'test N -eq $(grep -c ...)' count leg silently compares against zero, so the same defect is loud in one leg shape and invisible in the other. Detector shape recorded: warn on any Verification grep whose pattern is double-quoted and contains an unescaped $ or a backslash-bracket. Would have fired on both of today's. Open Questions were filed BEFORE investigation because the G-067 gate blocked Bash until they existed, which is the correct ordering and is why IW-5 could be added mid-flight as a finding rather than folded into an answer. No fw inception decide invoked

