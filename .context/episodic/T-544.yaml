# Summary (auto-generated from git commit messages)
summary: |
  'Session expired' on Approve was never an expiry — two Watchtowers on one host were destroying each other's sessions, and the guard against exactly that was reading the wrong port. Operator clicked Approve on /approvals and got a session-expired page plus raw JS text. Reproduced with a CSRF-less POST: HTTP 403, Content-Type text/html, 67632 bytes. What they pasted is literally base.html line 12 (<title>Session expired — Workflow designer</title>) followed by line 14 (the theme bootstrap script) — the top of that document, surfaced as text because the Approve control is an htmx POST and the 403 handler answers /api/* with a full HTML page. RCA: app.py sets SESSION_COOKIE_NAME = f'fw_session_{Config.PORT}' under T-2278, whose own comment states the reason — RFC 6265 does not scope cookies by port, so two instances on one host share a cookie slot and overwrite each other. Config.PORT reads FW_PORT or falls back to 3000 and --port never updates it; --port moves the listening socket and nothing else, and create_app() runs at MODULE level before argparse exists. Measured, not inferred: AEF's Watchtower on :3000 and this project's on :3012 BOTH emitted fw_session_3000, and because each signs with its own .fw-secret-key neither could decode the other's cookie, so session came back empty, session.get('_csrf_token') was None and every state-changing POST 403'd. Watchtower had been up 2d03h with no restart and the page was freshly loaded, which is why the message was actively misleading: nothing had expired. Ruled out in order rather than guessed — secret key is persisted by T-1306 precisely to survive restarts, and uptime says there was no restart. A guard that names the wrong port is worse than no guard: it reads as protection in review AND in its own comment, and the failure it permits presents to the user as expiry rather than as a collision. Fixed in main() where the bound port is first known, deliberately NOT by assigning Config.PORT — other call sites read that as 'the configured port' and having the CLI mutate shared config to correct a cookie name trades one action-at-a-distance for another. Verified end-to-end at three points: a throwaway instance on :3099 emitted fw_session_3099, the restarted :3012 now emits fw_session_3012 where it emitted fw_session_3000 an hour ago, and AEF's :3000 is no longer collided with. Probe boots a real instance on a real non-default port and reads the real Set-Cookie, because a static check could not have established this — the defect WAS source that looked correct. Mutation-verified: reverting the fix makes it emit fw_session_3000 on a port in the 57000s and both legs go red with the collision consequence named. Generic upstream debt, declared in the vendor manifest — AEF's own Watchtower has this bug identically and is one of the two colliding instances. The HTML-403-to-a-JSON-client defect is real and deliberately NOT patched here: one bug, one task. Suite 103 -> 104 legs. T-509's sweep flaked red as a leg while returning rc=0 and 32/32 green standalone — the second instrument today to fail only in suite context, recorded on T-543 with the honest note that my new server-booting probe now runs twice per suite and may be the load I introduced

