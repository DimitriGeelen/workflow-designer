# Summary (auto-generated from git commit messages)
summary: |
  the designer MCP server exists and has been spoken to — validate_workflow, stdio, zero dependencies, 21/21. Operator authorised T-791's GO. One tool, because proving the pattern beats shipping four. WHAT IT IS: a local stdio MCP server wrapping tools/validate-workflow.py. The caller passes THEIR bytes as content and gets back a verdict plus every finding with its rule id, so they learn why and not just whether — no checkout of this repo required, which is the entire point. HAND-ROLLED RATHER THAN SDK-BASED, DELIBERATELY: the mcp SDK is installed on this machine and would be conventional. It was rejected because the measured demand is another project's agent validating its own documents, and if adopting this needs pip install mcp into whatever environment that agent runs in, it is the same friction that killed the manual transport this replaces. One file, any python3, nothing to install. The cost is accepted knowingly and named in the module docstring: spec compliance is now ours. It is bounded to initialize/tools-list/tools-call and it is verified empirically rather than asserted. PROVEN BY BEING SPOKEN TO, NOT BY BEING READ: tools/_t792-mcp-server-probe.py spawns the server as a subprocess and speaks newline-delimited JSON-RPC at it. 21 passed, 0 failed. Both verdict directions in the same run — a valid document returns valid, E-XML-NODE-TYPE.xml returns invalid — plus a leg asserting the two DIFFER, so the tool cannot pass by being a constant. Unknown protocol version falls back instead of echoing nonsense back at the client. THE SCOPE FENCE HAS TEETH AND THEY WERE TESTED: there is no PreToolUse behind an MCP server, no task gate, no sovereignty boundary, so validate this file must not become read any file on the host. _resolve_repo_path resolves symlinks BEFORE the containment test; ../../etc/passwd and a deep traversal are both refused with a message saying why, and a positive control proves an in-repo path IS accepted so the refusals are about location rather than breakage. NEGATIVE-CONTROLLED: replacing the containment test with if False: turns the probe red at 18 passed 3 failed; restored, 21/21. The probe lives in tools/ and derives its root from its own location — leaving it in a scratchpad would have repeated T-787 on the same morning it was fixed. NOT wired into any live MCP config: that changes the operator's environment and is their call, not a side effect of a build. Install line in docs/mcp-designer-server.md, syntax taken from claude mcp add --help rather than from memory. Co-Authored-By: Claude Opus 5 (1M context) <noreply@anthropic.com>

