# Summary (auto-generated from git commit messages)
summary: |
  the uid-collision gap measured, and half of it is not what the gap statement said. Took the first of the four _t515 gaps I named to AEF at 11891 rather than waiting on their answer, since it is our own coverage of a standard we co-own. Reading the import path before building changed the test: the two directions are NOT symmetric. D1, an authored uid equal to one the editor would MINT for another node, is GUARDED — designer.html:9909 pre-seeds usedUids with every authored uid before any derivation runs and deriveUid salts deterministically, measured as the authored value occurring exactly once afterwards. D2, two elements carrying the SAME authored uid, is UNGUARDED by construction: the call site is uidEl?.getAttribute(value) || deriveUid(...), so an authored uid short-circuits and deriveUid is never entered, meaning usedUids is neither consulted nor updated and nothing on that path can observe a duplicate. Measured on arc-lifecycle: duplicate survives a full round-trip with 2 occurrences, 27 carriers before and after so nothing is dropped, 26 distinct values for 27 carriers, and edges behave identically through their own call site. D1 is the direction _t515's does_not_cover literally names, so testing only that would have gone green and I would have reported that collisions are handled — PL-206 a third time, where the phrase naming a gap was not the shape of the risk. Second self-inflicted one: the first implementation tracked carriers across the round-trip by their owning element id and produced pure artifacts, one lookup null and another a different element's uid, because T-513 — my own finding, reported to AEF at 11885 — says the element id is re-minted from lane plus x-order plus name on every save. I keyed a before/after comparison on the field the operation under test rewrites. Everything is counts and set differences now. Pinned as a CHARACTERISATION test rather than failed: nobody has ratified what should happen, section 6.3 invites external assignment and states no uniqueness requirement, and that silence IS the finding — a standing red would be a test file legislating a co-designed standard. One AC amended in place rather than silently narrowed, because 'which node holds which' is not deliverable and asking for it was the error. Reported at rail 11896 with a single recommendation instead of a menu: put the uniqueness obligation on the assigner in section 6.3, do NOT make the editor reject duplicates, since that breaks section 5's honour-what-you-were-given promise and moves the failure rather than removing it. Suite 87 -> 88 passed 0 failed

