# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-08-15 — measure both collision directions, not the one the gap statement names'
    chose: 'the probe stages D1 (authored value equal to one the editor would mint) AND D2 (two carriers with the same authored value), after reading the import path rather than building straight from `_t515`''s phrasing.'
    rationale: 'the source shows the directions are not symmetric. `usedUids` is pre-seeded at designer.html:9909, so D1 is guarded; the authored-uid call site short-circuits before `deriveUid` is ever entered, so D2 has no guard at all. D1 alone would have gone green and I would have reported "collisions are handled" — a control fed a stimulus built so it cannot fire, which is PL-206 for the third time this week.'
    alternatives_rejected: ['testing only the direction `_t515`''s does_not_cover literally names, which is what a faithful reading of my own earlier note would have produced.']
  - decision: '2026-08-15 — key the comparison on counts, never on element id'
    chose: 'every verdict is a count of a specific uid value in the output, or a set difference; the minted value is recovered by diffing uid sets rather than by looking up an element.'
    rationale: 'the first version tracked carriers across the round-trip by their owning element''s `id` and produced pure artifacts — one lookup returned `null`, another returned a different element''s uid. T-513 measured that the element id is a function of lane + x-order + node name and is re-minted on every save. I filed that finding and then keyed a before/after comparison on precisely the field the operation under test rewrites.'
    alternatives_rejected: ['adding a stable marker attribute to the fixture, which would have meant testing a document shape the editor never actually receives.']
  - decision: '2026-08-15 — pin the observed behaviour rather than fail on it'
    chose: 'the probe records D2''s duplicate-survives result as a pinned expectation and goes red on a CHANGE; it does not fail merely because the duplicate survives.'
    rationale: 'nobody has ratified what should happen. §6.3 invites external uid assignment and states no uniqueness requirement — that silence IS the finding. A standing red would assert a preference no standard carries, and a test file is not where a co-designed standard gets legislated. A change in behaviour, by contrast, is exactly what AEF needs to hear before they build a reverse renderer on it.'
    alternatives_rejected: ['failing on the duplicate (legislates), and asserting nothing (loses the regression signal entirely).']

