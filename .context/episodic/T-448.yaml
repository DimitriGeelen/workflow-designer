summary: |
  diagnosed — the gate is red for a SERIALIZATION reason, not a layout one, and the cause is two deliberate improvements the corpus was never re-baked against. Measured all 24 maps: zero driver errors, exactly ONE diff shape, uniform — exporter= producer identity (T-399/4c40414c) plus the DI comment rewording (T-361/07a62951). Corpus last baked at T-300/bdcfbc86 which left --check 24/24 green; both emitter changes landed after, nothing re-ran the check because nothing invokes it, so the corpus left its fixpoint silently. The stale comment still asserts 'AEF generates it from node coordinates', which T-340 has since disproved on both sides. Verdict text now names LAYOUT vs SERIALIZATION so a red gate stops sending readers into the layout engine for a byte problem. Re-bake is +2/-1 lines x24, no geometry, no DI — proposed to the operator, NOT taken under agent initiative, and wiring deliberately deferred until that ruling rather than scaffolding an allowlist around a decision. examples/ untouched. the gate that names which subsystem broke was naming the wrong one for two maps out of twenty-four — by the repair for naming the wrong one. T-448's verdict fix decided LAYOUT vs SERIALIZATION from the headless driver's 'moved' counter, and the reason that is the wrong source was already written in the same file THREE LINES ABOVE THE CALL SITE, at T-300: 'In-state metrics (moved/netMoved) are unreliable proxies — adoptImportedXml normalizes coordinates on import, so transient/net movement can be nonzero while the serialization is byte-stable (T-300: audit-process + error-escalation-ladder).' Those are the exact two maps it mislabelled. A comment stating a property and the code below it using the property the comment rejects, which is this week's shape landing inside this week's repair. Verdict now comes from the DIFF, which is the artifact the gate is about; 'moved' is still reported, with what a non-zero value means, because in-editor movement that leaves no trace in the bytes is a real fact about the driver and hiding it would be a second wrong answer. All 24 maps now read SERIALIZATION ONLY. THE NEW CLASSIFIER'S FIRST RUN WAS ALSO WRONG AND THE GATE CAUGHT IT: all 24 jumped to LAYOUT+SERIALIZATION because the corpus's own DI trailer reads 'node geometry travels as aef:position', so a substring test found the marker in PROSE. Kept as leg 3 rather than fixed and forgotten. Teeth 7/7, mutation-verified against three mutants — the pre-fix counter rule (4 legs red), no comment-stripping (3 red), and never-implicate-layout (2 red, the discrimination guard that stops a repair from becoming agreeable rather than accurate). RE-MEASUREMENT CONTRADICTED THIS TASK'S OWN DIAGNOSIS AND THE OUTLIER IS MINE: the 2026-08-13 reading of 'all 24 at moved=0' does not reproduce, seven deterministic runs say two maps move, the filing of 2026-08-12 agrees with today, and a git worktree at c6b02d7c — the commit whose own message records 24/24 — reproduces today's answer rather than its own, which rules out every src commit since. Either that reading was wrong or the metric depends on something outside the tree; the driver runs the real editor in headless Chrome, so viewport, fonts, DPR and browser version are inputs no commit records, and THE SAME DRIVER PRODUCES THE BYTES A RE-BAKE WOULD COMMIT. Registered as OBS-272 and written into the recommendation as a caveat against my own GO. AC4's blast radius is now MEASURED rather than estimated, in an isolated git worktree with the live corpus never written to: 24 rendered .bpmn at +2/-1 with no geometry on any map, 15 .editor-versions index.json, 30 new store artifacts of which 15 are binary thumbnails, 0 workflow.yaml, 39 tracked files +153 -24, and one bake reaches a 24/24 fixpoint. The earlier estimate said '+2/-1 x24, no geometry' and missed the store half entirely — 45 of 69 touched paths. Re-bake is RECOMMENDED and NOT TAKEN; the operator's command is in the decision entry. The gate over the corpus stays unwired with the reason recorded, because wiring it today paints the suite red on a benign staleness one command removes, and PL-148's population-wide unwired-guard check is still unbuilt and still belongs in its own task. 4/4 verification, sweep 39/39 with the tree byte-identical

