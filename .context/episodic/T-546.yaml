# Summary (auto-generated from git commit messages)
summary: |
  six generic upstream findings sent to AEF as findings with evidence, not as a build spec — and item 1 turned out to be live and destructive rather than the queue-hygiene note I filed it as. fw bvp driver --add never reconciles the proposal queue; only the Watchtower approve route appends state: approved. That alone is untidy. The hazard is that web/blueprints/bvp.py:874 passes the proposal's STORED --drop id through verbatim and _driver_add resolves it against the register AS IT STANDS AT APPROVAL TIME (lib/bvp.sh:963-970), where ids are reallocated to the lowest free slot. Our register recycled F1 and F3 within minutes on 2026-08-16. Measured, not inferred: P-bced1426 is still pending carrying drop=F1, and F1 today means V_SDLC_ENABLEMENT — a driver that did not exist when the proposal was written. Clicking Approve on it would DELETE that driver and add a SECOND driver named V_WORKFLOW_ROUTING; there is no duplicate-name guard of any kind in _driver_add, checked rather than assumed. This is T-538's id-as-key shape armed behind a button, and it is exactly the button the operator was pressing when they hit the 403. The two shapes need different remedies and are reported as two: a queue written through two paths where only one closes the loop, and a stored id dereferenced late with nothing guaranteeing it still means what it meant — recording the drop target's NAME beside its id and refusing on disagreement would make the staleness visible instead of silent. Not fixed here: the driver register is the operator's sovereign state and rejecting a proposal is their decision. DISCLOSED IN THE DOCUMENT RATHER THAN LEFT TO BE FOUND: those proposals sat harmless for a day only because Approve was 403ing, and fixing T-545 today is what made this reachable. Framing is deliberate — G-020 says a detailed pickup is a PROPOSAL not authorization and that precision makes scoping MORE likely to be needed, not less; we apply that to what we receive, so it governs what we send. The document says so in its own words and asks for nothing. Two 832-specific items excluded and NAMED so the exclusion is not silent. Rail: hub came back up mid-session under a new pid and as root, and its own verbs disagree — channel_list returns one topic and channel_subscribe reports agent-chat-arc unknown, while channel_create says it exists, and post/state/snippet all work on it. Posted at offset 2. The topic is NOT gone but its history is: the only prior content is two vendored-arc heartbeats from 16:17 and 17:17 today, so the store was reset around 15:48. Hub is shared tooling on the operator's mesh and I did not restart or repair it

