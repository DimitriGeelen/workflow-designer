summary: |
  the forward-compile standard's identity rule is correct and rests on a precondition neither standard states. Went looking for whether T-513's measurement broke anything in the standards and found the opposite first: forward-compile section 4 already names the third-party case exactly — a node whose uid does not resolve, a fresh editor-minted n_ uid, is a create proposal — and T-513 measured that the designer mints precisely that shape, so a bpmn.io document saved once here lands on their create branch with no special-casing. Checked before filing, which is why this is not a gap report. The real finding is one level down and it is inherited rather than local: the minted uid is FNV-1a over the UPSTREAM element id, so for a document never assigned an AEF uid, create-vs-modify is only as stable as the producing tool's ids. Measured both ways — same bytes twice give an identical uid set, full re-mint gives 0 of 7 survivors. Deliberately NOT asserted: whether bpmn.io or Camunda preserve ids across an edit, which is their tools' property and unknowable from this repo, so the failure mode is named without claiming it fires. Section 4's 'sole discriminator' phrasing invites reading identity as self-contained in the document when it is not. Registered as OBS-252 rather than left in a task file, because completed tasks archive and the register does not, and raised at rail 11887 as a proposed sentence rather than a defect. Neither standard edited — verified by git diff rather than by intending to leave them alone, since a normative change to a co-designed artifact is AEF's and the operator's call and the mapping standard is frozen under agent control outright.

