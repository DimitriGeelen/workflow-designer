# EPISODIC MEMORY - T-917: THE BRIDGE SUITE HAS NO SCHEDULED CALLER. 94 legs, the standing evidence that the AEF seam is intact, and nothing runs it: no cron, no git hook, no CI. Measured 2026-08-15 by searching the whole tree for 'run-bridge-tests' — every hit is prose or episodic memory. Subtract an agent choosing to type the command and it does not execute. Surfaced by AEF's question at rail 11919 ('subtract the tests, and is anything left calling it?'), asked about their own subsystem; the same question turned on my tree gives a worse answer than theirs, because their subsystem at least had health checks executing against it. THIS COMPOUNDS WITH TWO PROPERTIES ALREADY RECORDED AND NOT ACTED ON. (1) The suite is not deterministic under repetition — four consecutive runs on an unchanged tree gave 79/2, 80/1, then 82/0 twice, and the differing leg was never identified by name. (2) It launches a browser per CDP probe and gains a probe roughly every task, so cost grows one browser launch per task; wall-clock went 103s to 168s when 24 instruments were wired in T-509. Unrun plus non-deterministic plus growing interact specifically: with no scheduled baseline, the first person to run it after a gap cannot separate a real red from the flake, and the cheapest reading of a lone red is 'flake' — the dangerous direction. NOT FIXED HERE and deliberately not started: installing a scheduled caller means /etc/cron.d, which is outside the project boundary and therefore an operator action, and the honest fix may be to make the suite cheap and deterministic FIRST rather than to schedule something that will be dismissed. Needs an operator decision on which comes first. — CORRECTED 2026-08-15 by T-526, and the correction matters more than the original. (a) THIS OBSERVATION WAS FACTUALLY WRONG when filed: the claim that the differing leg 'was never identified by name' was true of OBS-250 (08:59Z) but had ceased to be true at 11:51Z, when OBS-255 localised the flake to _t358-teeth.py case 5 — seven hours before this entry asserted the question was still open. The same false claim was carried to AEF at rail 11924 and corrected to them at rail 11929. The cause is structural, not careless: this inbox has no cross-referencing, so nothing links entries on the same subject and nothing flags a new entry that reopens a resolved one; both read as 'pending' and the contradiction is invisible, with OBS-250 and OBS-255 four entries apart in the same file. (b) The 168s cost figure is STALE BY ROUGHLY 2x: measured 305-315s, mean 309s, across five runs. (c) Measured determinism is worse than 'a flake': 2 of 5 runs red on TWO DIFFERENT legs, neither reproducing, red rate 40% and per-leg reproducibility zero. (d) The blocking sub-defect is now named — 66 report FAIL calls against 4 show_output calls, so 62 legs discard the evidence of their own failure, and 6 of the 10 CDP legs (all of them AEF-seam conformance probes) redirect to /dev/null. Both failures in the measurement were uninvestigable from their own output. Whether the non-determinism is instrument-side or subject-side CANNOT be answered until that is fixed, which is why it is the prerequisite rather than the flake itself.
