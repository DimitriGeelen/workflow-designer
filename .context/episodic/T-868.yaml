# Summary (auto-generated from git commit messages)
summary: |
  Today the estimator pattern-matches the task body and emits a number. In the source BVP method a support score is an ARGUMENT ABOUT A STATED CLAIM — 'support 5 on Legal/Regulatory' means something only because the hypothesis says what success looks like. Rewire scoring so each driver's support cites the hypothesis clause it reacted to, and the evidence line quotes it. Falls back to body matching while a task has no hypothesis, so the transition is not a cliff. The point is not accuracy: it is that a cited score is CORRECTABLE, and a pattern-matched one cannot be wrong about anything.

# Key outcomes
outcomes:
  - 'When a task carries `hypothesis_source: human`, declarative driver signals are matched against the hypothesis text and the evidence line names the clause that matched — `@hypothesis:outcome` or `@hypothesis:signal`, not just the keyword'
  - '**A machine-drafted hypothesis is NOT cited.** The evidence says it scored from the body, and says why, so the reader can tell a score grounded in a human claim from one that is not. The machine citing its own draft would read as provenance while being none'
  - 'Where no signal matches the hypothesis but one matches the body, the evidence marks the fallback explicitly rather than silently presenting a body match as a hypothesis match'
  - 'Scores themselves are unchanged for every task that has no human hypothesis — proven by comparing driver output across the corpus before and after, so this slice cannot quietly re-rank anything'
  - '`tools/_t868-cited-support-teeth.sh` covers the above with a `--mutation` mode whose CONTROL SET reports `MUTATION SETUP BROKEN` rather than reading a broken harness as a clean kill'
  - 'The slice boundary is recorded in code: D1-D4 keep their hand-written handlers, and the reason is stated where a future reader will find it rather than in this task alone'

