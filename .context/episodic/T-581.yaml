# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-08-24 — recorded golden bytes, not a git ref'
    chose: 'the baseline is 11 committed `.golden` files — the uid-normalised emission of a reviewed build — read from disk. The gate builds the editor **once**.'
    rationale: 'it removes the staleness clock rather than resetting it. A git ref names a *build*, so it ages against every legitimate exporter change and drags the cross-build uid hazard in with it; recorded bytes name an *output*, and an accepted change becomes a diff someone reads in review. It is also strictly cheaper — one build instead of two — and the tree already uses this shape for ratchets (`tools/_t560-absence-baseline.txt`, `tools/unwired-guard-baseline.txt`). - **Rejected — re-pin `BASELINE_REF` to a newer commit.** This is the obvious move and it is the defect: the successor goes stale on the same clock, and the choice of *when* is made by whoever is next inconvenienced rather than by anyone deciding. - **Rejected — `git merge-base`.** Degenerate here. This repo has one long-lived branch, so the merge-base of `HEAD` with anything is `HEAD` or an arbitrary ancestor; it would encode "compare against nothing" as a computation and read as rigour. - **Rejected — a last-green marker the gate advances itself.** The worst of the three, and the attractive one: a gate that re-records its baseline whenever it passes ratchets forward silently and can never report drift that accumulated one green run at a time. That is this week''s whole failure class — a stated property standing in for a checked one, with the failure rendering as health. `--record` is therefore explicit, refused by default, and absent from the suite''s call.'

