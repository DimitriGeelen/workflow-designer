# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-23 — which text the opening zoom measures (items 6-7)'
    chose: '`OPEN_MIN_TEXT_PX` 9, and `openingZoom()` takes its minimum over every drawn node name, flow label, id caption and lane caption (`OPEN_TEXT_SEL`), skipping text that is not drawn (lens or ids toggle).'
    rationale: 'measured at opening on 2015e17e (aef-task-lifecycle, 1024): names 7.02 px (9 px font), id captions 7.02 (9), lane captions 7.02 (9), flow labels 7.80 (10). No class is drawn smaller than the names on this map today, but nothing guarantees it on another map; counting all four classes costs nothing and keeps the floor true for every class. After: 9.0 / 9.0 / 9.0 / 10.0 px at 1024, 1440 and 1920 in all four lenses; Fit still shows the whole map.'
    alternatives_rejected: ['names only (as before): a smaller caption or flow label on another map would open under 9 px unseen.']
  - decision: '2026-10-23 — items 1-3 and 5 are scroll, not defects'
    chose: 'no layout change; prove reachability with a CDP leg and scrolled shots.'
    rationale: 'the side panel sits beside the canvas (grid column), not over it: at 1024 the canvas is x 220-704, the panel 704-1024. The canvas scrolls (scrollWidth 1410 > clientWidth 484 at 1024; 900 at 1440). Every drawn text and node shape (84 business/logical, 101 technical/all) scrolls fully into view and uncovered, and at the furthest scroll the pool''s right edge is at x 674 against the visible edge 704 (1024) and 1090 against 1120 (1440). The palette is `overflow-y: auto` (scrollHeight 1285 > clientHeight 693/825/1032). All 23 controls scroll into view, and at the end "+ Add Lane" (LANES) is inside at 1024/1440/1920. The leg is green on 2015e17e too, so nothing needed fixing.'
    alternatives_rejected: ['shrinking or overlaying the panel to show the whole map at 1024. That would undo T-1256''s readable opening; scroll is the design.']
  - decision: '2026-10-23 — items 8-9 (ids and commands in business names) are not changed here'
    chose: 'leave "T-1068", "fw work-on T-XXX", "P-010", "## Verification commands", "P-011" and "G-020" as they are.'
    rationale: 'they are words inside AEF''s node names, flow names and the Note: map CONTENT that AEF authored. A lens filters fields and decoration; rewriting words inside a name would change what a person reads per lens and would put content edits in the designer. They are reported to AEF as content for their map.'
    alternatives_rejected: ['a business-lens text filter that strips id-like tokens from names: it guesses, and it would hide words AEF chose to show.']
  - decision: '2026-10-23 — the Name field (item 4)'
    chose: 'the node Name is a one-row textarea (`field(..., { line: true, grow: true })`) sized by T-1274''s `growToContent` (grows to the cap, then scrolls). Enter ends the edit (blur) and never inserts a newline; a pasted line break becomes a space before the value reaches the model. Each keystroke updates the step and the canvas; the panel re-renders when the edit ends.'
    rationale: 'the single-line input cut the value ("captu…"): 99 of 321 named nodes were cut at 1440 across the corpus. The T-1278 probe also found that the field re-rendered the panel on every keystroke, which rebuilt the box under the cursor: typing "abc" stored "a" and focus fell to the page (the T-264 failure, never covered by a leg). Moving the panel re-render to the end of the edit fixes both in the same field.'
    alternatives_rejected: ['a deferred commit (blur/Enter only, as the workflow ID): it loses the live canvas update while typing.']
  - decision: '2026-10-23 — business-lens palette wording (item 10)'
    chose: 'a table, `PALETTE_WORDING[lens][data-create]`, applied by `renderPaletteWording()` from `renderLensSelect()`. It holds only `business` (8 subtitles: start/end, script task "framework · Authority", sub-process, parallel, error/timer/message events). Any item it does not name keeps the subtitle written in the palette (kept in `data-meta`), so the other lenses are byte-for-byte the HTML''s.'
    alternatives_rejected: ['putting the wording in the lens file: that file is AEF''s shared definition (T-4402) and its shape is theirs; a palette-wording key would need their agreement first.']
  - decision: '2026-10-23 — helper-text contrast (item 11)'
    chose: 'a new token `--text-hint: #80869a` for `.field-label .field-hint` and `.suggest-row .field-hint`.'
    rationale: 'measured `--text-faint` #5a6173 on the panel and details background `--surface` #161922 at **2.84:1**, below 4.5:1, for all 76 drawn hints per width (9 px and 11 px). With `--text-hint` it is **4.84:1**. A hint stays a step dimmer than its label (`--text-dim`, 5.58:1).'
    alternatives_rejected: ['raising `--text-faint` itself: 41 uses, including canvas glyph strokes and read-only fields, which would change shapes on the map that no item asked about.']

