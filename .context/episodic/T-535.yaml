# Summary (auto-generated from git commit messages)
summary: |
  file the trend detector that fires on stasis while labelled recurrence — measured, not fixed, because teeth written at 248K budget is the failure mode this session has spent all day documenting. Found by taking the audit's own advice: every run prints 'Repeated issues detected ... 3 Fabric: 36/40 cards have no edges (3 times)' while the SAME audit's body reports 37/56. audit.sh:5519-5535 reads each WARN/FAIL check string VERBATIM and aggregates with sort|uniq -c at count>=3, so the aggregation key is the rendered sentence and any check embedding its own measurement mints a new key every run. Measured over 41 daily audit records: the fabric COVERAGE warn appears in 37 audits, largest identical-string group 1, NEVER once reported as recurring; the fabric EDGES warn appears in 10 and is reported as 3 — and only because its counts held still for three consecutive days. Seven distinct strings for one issue, 37 for the other. THE INVERSION IS THE FINDING: the only issue this detector has ever promoted in this project crossed the threshold precisely BECAUSE it stopped moving, so an issue recurring daily while steadily worsening scores 1 forever and the detector is least sensitive exactly when a problem is progressing. Downstream, the framework's 'consider creating a practice' prompt is routed by STRING STABILITY rather than by persistence — a stable trivial WARN becomes a practice candidate, a worsening one never does. EXPLICITLY NOT CLAIMED because it is the tempting version and it is false: T-525 did not cause this. T-525 added a ratio and a direction note to the coverage line which makes the string vary more, but the pre-T-525 strings are ALSO one-per-run — the line never aggregated before or after. Same family as PL-222 one level up: there a moving quantity is baked into a METRIC, here into an IDENTITY KEY. ACs written so the fix cannot be graded on a pinned count (the corpus grows daily, so an exact expected number is the G-015 defect this tree keeps finding) and so over-merging is measured rather than assumed. Vendored, so G-008 applies and it goes upstream. Focus switched via fw context focus rather than FW_SWITCH_FOCUS — the drift gate fired correctly and its bypass is Tier 2

