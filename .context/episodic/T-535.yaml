# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-08-16 — how much to normalise'
    chose: 'fold only free-standing numbers; preserve identifier tokens matching `[A-Za-z]{1,6}-[0-9]+` (CTL-028, T-901, G-015, D2).'
    rationale: 'the two available errors are not symmetric. Under-merging leaves an issue counted per-subject, which is honest and merely conservative. Over-merging **fabricates** a recurrence across unrelated checks and prints it under one of their names while hiding the other — the measured red arm B output is `10 x CTL-029`, a number describing nothing real. A recurrence detector that invents recurrences is worse than one that misses them.'
    alternatives_rejected: ['naive `s/[0-9]+/N/` (fuses CTL-028 with CTL-029 — demonstrated, not theorised); and normalising prose as well as digits, which would have merged the pre- and post-T-525 coverage wordings. T-525 genuinely rewrote that sentence, so restarting its count is correct behaviour and its 8th occurrence legitimately sits under a separate key. That is a real residual limitation — a check that rewrites its own prose still resets its count — but it is a one-time reset on a deliberate wording change, not a per-run reset, and it is stated here rather than papered over.']
  - decision: '2026-08-16 — where the teeth get their corpus'
    chose: 'make `AUDITS_DIR` env-overridable and point the teeth at a temp dir.'
    rationale: 'it is the same idiom `lib/paths.sh` already uses for `TASKS_DIR`, it is one line, and it makes the probe hermetic in both directions — the real `.context/audits` is neither read nor written, and the audit''s own output file lands in the sandbox.'
    alternatives_rejected: ['re-implementing the aggregation in the test (would assert a copy, not the subject — the defect this project keeps finding); and overriding `CONTEXT_DIR`, which would have moved every other path the audit resolves.']

