'S CONSTRUCT AT RUNTIME RATHER THAN COPYING IT, which is what makes it the regression witness AC1 demands: a copied construct would keep reproducing the old behaviour out of a string literal long after update-task.sh stopped behaving that way — a false green about a false green. Teeth leg (a) proves the property by applying the proposed remedy and requiring the probe to go RED; legs (b)-(d) attack the probe's own scope (extraction guard, pipefail discriminator, negative control) rather than the subject. MEASURED, NOT REASONED: pipefail IS active and errexit is NOT, so the template's sentence 'runs each command under set -eo pipefail' is half true and the false half is the one that matters. Point of teaching fixed in-tree: .tasks/templates/default.md is the PROJECT's template (create-task.sh:447 resolves TASKS_DIR to the project, not the vendored copy), so it is agent-authority — it now leads with the errexit warning and promotes the '&&' file form over the capture form, with the '&&' claim itself asserted in the probe so the advice is measured rather than plausible. Gate change proposed and NOT applied (docs/reports/T-352-remedy.md): vendored, G-008 upstream, operator's ruling. RCA + Evolution + single-command verification block; member scan gains a static classifier and memoisation. THE VERIFICATION BLOCK IS DELIBERATELY ALL SINGLE COMMANDS — a task about 'a; b is judged on b alone' must not contain an instance of it (same discipline as T-351), and the gate's own sed extractor confirms 8 commands and 0 comment lines. Evolution records three corrections to my own work, all of which would have closed green: (1) the population number was wrong TWICE in opposite directions — 332 from a naive grep ';', then 26 from a parser that incremented depth on '$' AND again on the following '(' so $(...) never returned to depth 0; sound number is 322, meaning the crude instrument was roughly right and the sophisticated one was catastrophically wrong. A confident undercount reads exactly like a careful one and arrives with a story about rigour. Parser now self-tests in BOTH directions before emitting any number. (2) The static classifier generated negations by prefixing ('IN'+pat) and asked if pat was a substring of the result — always true, prefixing never removes the original — so it flagged everything; caught by its own self-test, replaced with an explicit vocabulary that UNDER-approximates (can miss, cannot invent). (3) The scan's runner used subprocess.run(timeout=) which kills only the direct child then blocks in communicate() on a stdout EOF the surviving grandchild subshell holds open — leaked runners for minutes, never finished; same stop-path-assumes-cooperation defect as T-351, in the instrument built after fixing it in the subject. Also: a waiter written as 'until ! pgrep -f _t352-member-scan' can never exit because its own argv contains the pattern — liveness variant of the byte-space collision that gave a false reading last window

