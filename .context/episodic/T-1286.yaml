decisions:
  - decision: '2026-10-24 — how the rehearsal is kept off the real repo'
    chose: 'two layers. (1) A guard: each check and step runs in a private mount namespace (`unshare --mount`), with the project and the real repo bind-mounted read-only and only the clone writable, so a write into the real repo fails inside the step. (2) The asked-for before/after assertion. With the guard, a difference is a loud WARN naming the files, since the rehearsal could not have made it. Without the guard (no unshare/root, or the test-only `RUNME_REHEARSE_NO_GUARD=1`), a difference FAILS the dry-run.'
    rationale: 'measured on the real repo, other sessions changed the tree during every one of 4 probe rehearsals: hook counters (`.context/working/.hook-counter`, `.loop-detect.json`, `.budget-status`), T-1290''s `loop.sh` edit, its new test file, its close commit (HEAD moved). An assertion-only design failed every dry-run here, and the compare alone cannot tell their writes from ours.'
    alternatives_rejected: ['assertion-only (fails every dry-run in this multi-session repo); excluding volatile paths (another session''s real edits still collide, and the exclusion list rots); a git worktree or /tmp clone (the brief rules them out).']

