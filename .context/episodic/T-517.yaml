# Summary (auto-generated from git commit messages)
summary: |
  G-008 let us fix vendored framework code in-tree and upstream it; nothing recorded that a fix was LOCAL, so neither half happened. 28 paths under .agentic-framework/ diverge from the pristine re-vendor baseline ebf0c721 (T-276, v1.6.763) and 8 of them carry NO content change at all — only an exec bit, invisible to content review. Cost already paid: email-archive re-pinged G-AUDIT-EXCLUDE-NOT-HONORED three times over four months while our T-374 sat here as a tested implementation of the exact remedy they proposed, its own comment reading 'T-1842 reached register.sh and drift.sh and did not reach here'. The destructive half is worse — T-276's own follow-up says 'post-vendor repair: restore exec bits demoted by old do_vendor copy (5 files) + chmod secret-scan', so the last re-vendor DID clobber and a human happened to catch it. Manifest declares every path with kind, task and an upstream taxonomy (fix / vendoring-repair / local-config / unknown) because only ONE of those should be offered upstream; designer-pin.yaml is local config, the exec bits are our vendoring losing them in transit, and lib/ts/dist/loop-detect.js is recorded as unknown rather than guessed. Set equality, NOT a count: a count of diverged files rises with every legitimate G-008 fix, which is the G-015 class T-508 catalogued, and would train its reader to re-baseline reflexively. Three-valued exit — rc 2 REFUSES when the manifest or baseline is unreachable, so 'I could not look' cannot render as 'clean'. The instrument was green on its first run against the real tree, which under PL-206 means nothing until a stimulus containing the fault is fed to it; the mode-only teeth leg then caught a real defect in the instrument itself, since git diff --raw reports a zero dst sha for UNSTAGED files and every mode-only change was being misclassified as content — in exactly the state that matters, someone having just patched vendored code and not yet committed. Manifest declares ITSELF: git diff ignores untracked files so it ran green while unstaged and would have gone red on commit, and excluding it would be a hole in a register whose point is that there are no holes. Teeth 7/7 hermetic under mktemp, suite 85 -> 87 passed 0 failed, hygiene ok, unwired FINDINGS unchanged at 67 so both tools are wired not baselined. Rail post to email-archive and framework-agent still owed, AC unticked. rail post 11893 and the last AC. Checked email-archive's G-AUDIT-EXCLUDE-NOT-HONORED instead of declining a second time, and they are right — the defect is live and we have carried the fix since T-374 without telling anyone, which is the concrete cost of G-008's upstream half never happening. Post leads with that rather than with our instrument, because a peer who has re-pinged three times in four months needs the adoption path more than they need our tooling. Stated the limit of the claim in the same breath: I cannot see upstream HEAD, so 'valid upstream' rests on our v1.6.763 baseline lacking it plus their independent observation in their own tree — two consumer trees is evidence, not proof, and corroboration that is itself unverified is how one unconfirmed claim becomes consensus. Also corrected my own morning imprecision on secret-scan: the fail-open IS fixed upstream, but they are right that upstream ships the file 644 and it is 755 here only because T-276 chmod'd it, so I should not have let that read as an upstream chmod. Fabric cards written by hand — fw fabric register emits a purpose of 'TODO: describe what this component does' and 43 existing cards already carry it. Decisions section records five real choices incl. deleting the boilerplate Human-AC section rather than taking FW_ALLOW_HUMAN_AC_TICK=1 after my own bulk tick flipped two example boxes inside it: the T-1731 guard refused the correction in both directions, which is the guard behaving correctly, and the bypass is not mine to use

