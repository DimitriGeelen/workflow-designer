# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-08-15 — set equality rather than a count ratchet'
    chose: 'the instrument compares the diverged SET against a declared manifest, and fires in both directions — unrecorded divergence and stale entries alike.'
    rationale: 'the number of diverged files is a global always-moving property. It rises with every legitimate G-008 fix, so a count ratchet would go red on correct work and train whoever reads it to re-baseline reflexively, which is how a ratchet becomes a rubber stamp. T-508 catalogued exactly this as the G-015 class and found the hash-keyed baseline strictly better than the count-keyed one I had drafted then.'
    alternatives_rejected: ['a count ratchet (`diverged <= 28`), and a one-directional check that only catches new divergence — the stale direction is what detects a re-vendor having silently eaten a fix, which is the more destructive of the two failures.']
  - decision: '2026-08-15 — an upstream taxonomy rather than a flat divergence list'
    chose: 'every entry carries `upstream: fix | vendoring-repair | local-config | unknown`, and one entry is genuinely recorded as `unknown`.'
    rationale: 'the manifest has two consumers with different questions. A re-vendor asks "what must I re-apply?" and the answer is all 28. framework-agent asks "what should I adopt?" and the answer is only the 16 marked `fix` — offering them the exec bits or our designer pin would be noise that makes the real debt harder to see. The distinction is not cosmetic: the exec bits are upstream''s file that OUR vendoring lost in transit, the opposite direction of travel.'
    alternatives_rejected: ['a flat list of 28 paths, which would have made the upstream ask unactionable; and guessing a value for `lib/ts/dist/loop-detect.js` — it is a built artifact and settling it needs a rebuild, so it is recorded as unknown. An `upstream:` value asserted without checking is precisely the folklore this manifest exists to end.']
  - decision: '2026-08-15 — the manifest declares itself'
    chose: '`.vendor-divergence.yaml` carries an entry for `.vendor-divergence.yaml`.'
    rationale: 'it lives inside the tree it measures, so it is itself divergence. Noticed only because `git diff` ignores untracked files — the instrument ran green while the manifest was unstaged and would have gone red the moment it was committed.'
    alternatives_rejected: ['special-casing it out of the comparison, which would have been a hole in a register whose entire purpose is that there are no holes, and would have been invisible to every future reader.']
  - decision: '2026-08-15 — deleted the boilerplate Human-AC section rather than take a Tier 2 bypass'
    chose: 'removed the unused `### Human` section wholesale, which the task template''s own guidance sanctions when every criterion is agent-verifiable.'
    rationale: 'a bulk `- [ ]` → `- [x]` sweep over this task''s ACs also flipped the two boxes inside the section''s commented-out [REVIEW]/[REVIEWER] examples. Inert template text, but Human-AC boxes, and CLAUDE.md says never to touch those. The T-1731 guard then correctly refused to let me flip them back — it blocks the toggle in both directions, which is right.'
    alternatives_rejected: ['`FW_ALLOW_HUMAN_AC_TICK=1`, a Tier 2 bypass that autonomous initiative does not delegate; and leaving the wrong state in place because it was only template text, which would have left a task file asserting that human criteria had been verified.']
  - decision: '2026-08-15 — reported "valid upstream" with the inference stated rather than as fact'
    chose: 'told email-archive their concern is valid upstream, and in the same breath said I cannot see upstream HEAD and named exactly what the claim rests on.'
    rationale: 'what I can actually observe is that our v1.6.763 baseline lacked the fix, that we made it locally, and that they observe the defect in their own tree. Two independent consumer trees is good evidence, not proof about framework-agent''s HEAD. Corroborating a peer''s filing is worth much less if the corroboration is itself unverified — that is how one unconfirmed claim becomes consensus, which is the reason I declined to corroborate this one at 11892.'
    alternatives_rejected: ['asserting it flatly (overstates what I measured), and declining a second time (I had now actually checked, and the check was cheap).']

