# Summary (auto-generated from git commit messages)
summary: |
  fw fabric enrich now reports the edges it discards — count unconditionally, targets by name under --verbose. A dict.get miss on loc_to_id meant 'not registered', and was being used to mean 'not a dependency'; the drop itself is correct (an edge needs two cards) but the silence was not, and on a sparse registry it is nearly every edge. Counter collects the UNREGISTERED arm only: resolve_edges drops for three reasons and T-342's 15 was a len(raw)-len(resolved) difference spanning all three — decomposed before writing anything, 17 unregistered / 0 self / 0 duplicate, so the original attribution was right only by occupancy. Naming the targets earns its keep immediately: 3 of 10 are DIRECTORIES that can never hold a card, so a bare count would have sent the operator to register ten things when seven are registerable. Teeth 7/7 — (a) registering a discarded target makes the count fall AND edges-added rise together, (b) a genuine zero still prints the line, (c) neutering the collector makes the counter read 0 while the independent T-342 probe still reads the drop, which is what makes the baseline agreement between them evidence rather than a shared constant, (d) making the line conditional turns a zero back into an absent line. Leg (d) first failed for the wrong reason — it ran the unmutated file — three lines below the docstring citing T-338 leg (d) as the mistake to avoid. Reporting-only proven by tools/_t343-write-equivalence.py, which asserts the property rather than diffing against git (that form goes vacuous at commit) and refuses to pass over an empty structure; its own teeth leg confirms it goes red when the collector changes writes. G-017 trigger clause (3) covered, status left at watching — clauses (1)/(2) untouched, the flip is the operator's. AC amended: it pinned the literal 15, which read 17 then 20 within a day with no regression among them — a G-015 subject error committed inside the window that registered G-015

