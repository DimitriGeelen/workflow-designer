# Summary (auto-generated from git commit messages)
summary: |
  the whole import-loss class is invisible to all three priced T-309 surfaces, and the surface that CAN show it is not on the list. Located from source: loss happens inside parseBpmnXml (src:9595+), and both sites that populate state — src:9124 import and src:6911 _restoreSnapshot/undo — are downstream of a parseBpmnXml call, so this is a property of every route into state rather than of import alone. A panel and a gutter render from state; a save-gate evaluates buildBpmnXml(state); content that never entered state cannot reach any of them, independently of IW-2 — porting rules to JS, calling a sidecar or sharing a spec all produce the same blindness, because the constraint is what the surface READS, not where the rules run. The 3 ERROR rules already recorded as repaired-inside-parseBpmnXml were not one rule family: T-337 tags, T-340 DI, T-347 5 content shapes and T-348 7 root shapes are the same shape, and it is the shape of the import path. THE COUNTER-EXAMPLE THE AC DEMANDED SUCCEEDED, WHICH IS THE USEFUL PART: adoptImportedXml(text, opts) at src:9101 holds the original text in scope and calls parseBpmnXml(text) on the next line, so an input-vs-re-export comparison at that instant would see every loss in the class — exactly what _t338-input-fidelity-cdp.mjs does out-of-band; the text is simply discarded when the function returns. So the class is not unreachable, it is reachable by an unbuilt FOURTH surface, an import-time fidelity report, architecturally unlike the other three (no rule engine, no port-to-JS decision, no severity model — it compares two documents rather than evaluating predicates). Without the counter-example AC this task would have concluded 'no surface can show it', which is false and would have removed the only option worth building. Written into T-309 where the pricing decision lives; no designer source modified

