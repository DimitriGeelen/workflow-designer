decisions:
  - decision: '2026-10-22 — how a long task name fits without the floor ellipsis'
    chose: 'a third fit-ladder step inside the same rect (`fitNodeLabels`, T-087): at the default size 9px / 10.5px line pitch, five lines in the 64px rect where step 2 (10px / 12px) had four. Its lines are wrapped by **measured** width rather than the char estimate, and a token wider than the rect breaks after a separator inside it (`/ | , ; > )`), the way CSS `overflow-wrap` does. Five of the 17 cut names were single tokens such as `(--host/--task/--agent/--summary/--result)`, which no font size or extra line could fit. The `s` and `l` sizes get the same step (8px / 9.5, 10px / 11.5). The floor (ellipsis + `<title>`) stays as the last resort for a pathological name; no corpus name reaches it.'
    rationale: 'this is the only candidate that touches nothing outside the rect, so it cannot add an overlap, a crossing or a lane-edge hit that the T-1256 legs count. It needs no new obstacle model, and it is a few lines in the one function that already owns the fit. Measured: 0.25.0 had 204 floor hits (17 names × 4 lenses × 3 widths; lifecycle 2 per lens); this source has 0. The smallest name font is 9px (≥ 8). Every line stays inside the rect (0 misfits). Name lines under an in-rect badge went from 51 to 42, every remaining one a short default-step name that already overlapped in 0.25.0.'
    alternatives_rejected: ['(a) growing the rendered rect downward: it needs free-space search against the flows, labels, id captions and lane edges below it, the flows'' endpoints would no longer meet the drawn edge, and a rect that differs from the DI misleads anyone reading the shape as the stored geometry. (b) The label strip below the rect: that is where the id caption and bottom-centre flows sit (T-1090), so it creates the same near/overlap pairs T-1256/T-1274 just removed. A name split between inside and below reads as two labels.']
  - decision: '2026-10-22 — flow-label contrast and canvas text size'
    chose: 'no colour change. Measured from computed styles (`tools/_t1276-name-fit-cdp.mjs` leg 2): flow-label fill `--text-dim` rgb(139,145,163) on its halo pad `--bg` rgb(13,15,19) = **6.1:1** in the one theme the designer ships (`:root`; the source styles no `data-theme` and no `prefers-color-scheme`). That is the same on 0.25.0, so the leg is green there: it is ≥ 4.5 and the instruction was to change the token only below AA.'
    rationale: 'the reviewer''s "low contrast" at 1920 is the fit zoom of a wide map. The 10px mono label renders at about 7px, and antialiasing thins it; the ratio itself is AA. Codex''s "canvas text small at 1920" is out of scope per Context §3: it is the fit zoom, and the user can zoom in.'
    alternatives_rejected: ['brightening `--text-dim` anyway: it is used by ~30 chrome controls, so it would shift the whole UI''s hierarchy to answer a size complaint, not a contrast failure.']
  - decision: '2026-10-22 — side effect on the opening zoom (orchestrator''s review)'
    chose: 'keep it. - It is T-1256''s designed behaviour: open readable, and Fit still shows the whole map. - It answers the other half of codex''s amber (canvas text too small at 1920) without a separate change.'
    alternatives_rejected: ['excluding the step-3 names from `openingZoom`''s minimum. The map would then open at fit, with those names drawn below 7px, exactly what T-1256 set out to prevent.']

