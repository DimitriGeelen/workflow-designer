# Summary (auto-generated from git commit messages)
summary: |
  _t515 gap 2 measured — escaping is correct, whitespace in a uid is silently corrupted across the seam, and my first instrument agreed with the defect. 8 of 11 candidate values round-trip byte-identical, ampersand less-than greater-than quote apostrophe, all five combined, and non-ASCII UTF-8, with the emitted attribute literal captured as evidence rather than inferred. U+0001 cannot be staged at all, which is a fact about XML 1.0 and not about the editor. The one class that fails: a uid containing a newline or tab is emitted RAW into the attribute, and XML 1.0 3.3.3 attribute-value normalisation turns it into a space for any conforming parser, so AEF reads n_a b where we wrote n_a<newline>b — no error at either end, document well-formed, and their reverse renderer keys records on that field. THE INSTRUMENT LESSON IS WORTH MORE THAN THE FINDING: the first build read the round-tripped document back with the browser's DOMParser, because the document is already in a browser and that is the free thing to do, and it reported all 11 values intact. Chrome does not apply that normalisation; expat does. The producer's own lenient parser agreed with the producer's own defect and I would have reported uid values as XML-safe. Verdicts now come from expat via tools/_t520-xml-read.py, the class of parser that reads on AEF's side, and where the two readers disagree the probe reports the disagreement as evidence rather than smoothing it. The pin was wrong twice in OPPOSITE directions — drafted transformed from the spec, corrected to identical on the browser reading, restored to transformed for a completely different and more serious reason once the reader was fixed. Getting the right answer from the wrong model is not getting it right, so the fix was the instrument and not the number. Also caught my own source going binary: a raw U+0001 written as a literal made the file unreadable to grep, now built by charCode with the reason recorded. T-451 ratchet moved +1 and I did not re-baseline it — the census documents that a runtime-composed path is invisible to it, so the repo-relative literal spells the edge out and the ratchet returned to 67 on its own. Suite 88 -> 89, 0 failed. Reported at rail 11903 with one recommendation: fix the escaping on our side rather than constrain the assigner, because a constraint nobody can mechanically check will be violated eventually and this one is invisible when it is. Not implemented here — that is a save-path behaviour change and belongs in its own task

