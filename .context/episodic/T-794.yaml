# Summary (auto-generated from git commit messages)
summary: |
  the value is not in exposing tools, it is in closing the loop that has no agent path — and I broke a pinned seam finding that out. THE MEASUREMENT THAT DECIDES IT: I wrote a workflow YAML from scratch with no template, the way an LLM naturally would, and ran it through the chain. yaml-to-bpmn CONVERTED IT CLEANLY at 2062 bytes and said nothing. validate-workflow then returned exit 1 with W-XML-UNREACHABLE on all three non-start nodes, because I had guessed the key 'flows:' where the schema says 'edges:'. One word. After the fix, exit 0 and zero findings. So the converter accepted a diagram whose every node was disconnected, and the mistake was the single most predictable one an LLM can make. THE PAIR IS THE UNIT, NOT TWO FEATURES: convert without validate is a silent broken-output generator, validate without convert is a judge with nothing of its own to judge. Together they are an agent's authoring path — agent drafts YAML, converts, validates, human opens it in the designer and refines — which is the yardstick's 'agent and human collaboration' in one sentence, entirely inside T-791's read-only fence. RANKING: 1) yaml_to_bpmn, highest value and near-zero cost since the tool exists and is stdlib+pyyaml. 2) describe_workflow, the only genuinely new code on the list, letting an agent reason about a diagram instead of parsing XML. 3) list_corpus/get_workflow, cheap but modest — our corpus is 5 of 6 fixtures with nothing saved since 2026-07-29. WHAT I BROKE, AND FIXED: probing bake-clean-layout.py with --help ran its real corpus-wide sweep instead of printing usage, rewriting 24 files under examples/aef-processes/rendered/ — the seam AEF pins against. Reverted with git checkout; the tree is byte-identical to HEAD and nothing was committed. Filed as OBS-373: --help is the first thing any agent reaches for, and here it triggers a destructive sweep. It also disqualifies auto-layout from the MCP surface twice over — a corpus mutator is not a pure function, which is exactly the case the scope fence exists to refuse. NOT WORTH BUILDING, stated so it is not rediscovered: do not re-expose the designer UI over MCP (the browser is the human's surface and it works), and do not build toward execution (upstream, T-788 at @1630). Co-Authored-By: Claude Opus 5 (1M context) <noreply@anthropic.com>

