# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-08-20 — carriage on `<aef:meta>`, not a wider `metaKeys`'
    chose: 'emit, on the existing `<aef:meta>` element, every scalar `node.aef` value that no other emitter in `aefExtensionXml` claims. `metaKeys` stays at 20.'
    rationale: 'widening the whitelist answers a standards question by shipping code. `metaKeys` is in ratified parity with the bridge''s `META_KEYS`, and whether any of these keys is promoted into the frozen v1 contract is the operator''s ruling. Carriage changes no contract: `<aef:meta>` is already a bag of scalar attributes, and this stops filtering the bag on the way out. Round trips become byte-identical instead of editing a document down to the subset we happen to name.'
    alternatives_rejected: ['adding `determinism`/`sideEffect` to `metaKeys` — this is mutant D in the teeth. It repairs every key the census found and none it did not, so the next producer key files this bug again. Also rejected: a new `<aef:carried>` element, which would add an `aef:` element to the wire format — the exact contract change this task refuses to make.']
  - decision: '2026-08-20 — the skip set is shape-derived, not a list of exceptions'
    chose: 'skip a key only when another emitter will ACTUALLY emit it for this node''s current value; scalars carry, objects and arrays belong to the structured emitters.'
    rationale: 'load-bearing for `emits`. The structured exporter fires on `Array.isArray(aef.emits)`, so a SCALAR `emits="ev.done"` — which is what `tests/fixtures/valid/investigate.bpmn` and the editor''s own seed template carry — falls through it silently. Filtering carriage by NAME would re-drop exactly that value; filtering by SHAPE carries the scalar and leaves the array its own channel. The two populations are disjoint by construction, so no coordination is needed. The kind-specific event binding (`errorStatus`/`timerSpec`/`busTopic`) is skipped conditionally for the same reason: `<aef:eventDef>` emits it only for a typed event node.'
    alternatives_rejected: ['a per-node `carried` side-list recorded at import. It has to survive every copy, duplicate and undo path that clones a node, and the first one that clones `.aef` without it loses the keys again — reintroducing the two-lists-with-nothing-holding-them-in-correspondence shape this task exists to remove. Deriving at export means carriage travels with `.aef` automatically.']
  - decision: '2026-08-20 — three defects, three tasks'
    chose: 'ship carriage here; file the subset-shaped parity guard as T-572 and the Emits scalar/array panel mismatch as T-573.'
    rationale: 'one bug, one task. T-572 is a guard defect with its own design question (a round-trip assertion, not a set comparison) and T-573 is a shape question whose data loss this commit already closes. Folding either in would bury a distinct root cause inside this one''s episodic.'

