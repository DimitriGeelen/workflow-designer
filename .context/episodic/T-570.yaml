# Summary (auto-generated from git commit messages)
summary: |
  the editor has been destroying keys our own bridge emits, and the guard named 'parity' asserts a SUBSET, which is why it stayed green the whole time. Import reads EVERY <aef:meta> attribute into node.aef (src:10255, unconditional); export enumerated the 20-entry metaKeys whitelist (src:9502). Two lists governing one value with nothing holding them in correspondence — the same shape as T-566 one layer down, except there it decided what was SEEN and here it decided what was KEPT. MEASURED BY A REAL ROUND TRIP, AND THE MEASUREMENT CHANGED THE ANSWER. Census over 91 bpmn / 823 aef:meta values: 4 keys sit outside metaKeys — determinism (16), endpoint (10), sideEffect (2), emits (1). Driving import→export→re-parse in the page then split those four in a way reading the whitelists CANNOT: determinism, sideEffect and emits are destroyed; endpoint SURVIVES, because it has its own element emitter and merely migrates from attribute form to element form. A two-list census reports four losses. Three is the true number. THE CENSUS MEASURED THE SAMPLE; THE PRODUCER'S VOCABULARY IS THE POPULATION. Using the parity test's own extractors: editor metaKeys = 20, bridge META_KEYS = 29, and NINE keys tools/yaml-to-bpmn.py can emit were absent from the editor's export whitelist — determinism, authority, endpoint, sideEffect, autoTriggerKind, restoresFrom, compensationSnapshot, compensatedBy, advisory. Blast radius was never '3 keys in 3 files'; it was 'up to 9 keys in any map our own producer writes', and today's corpus simply does not exercise six of them yet. All 9 now round-trip — 8 carried, endpoint on its element — measured, not inferred. CARRIAGE, NOT A WIDER CONTRACT. Export now emits every SCALAR node.aef value no other emitter claims, on the existing <aef:meta> element. metaKeys stays at 20, meta-parity and structured-parity green, no aef: key added, no standard bump. <aef:meta> is already a bag of scalar attributes; this stops filtering the bag on the way out. Whether any of these keys is PROMOTED INTO the frozen v1 contract remains the operator's ruling and is deliberately not answered by shipping a mechanism. Rejected a new <aef:carried> element for the same reason — it would be the contract change this task refuses to make. THE SKIP SET IS SHAPE-DERIVED, NOT A LIST OF EXCEPTIONS, and emits is why. The structured exporter fires on Array.isArray(aef.emits), so a SCALAR emits='ev.done' — the shape tests/fixtures/valid/investigate.bpmn AND the editor's own seed template (src:2083) carry — falls through it silently. Filtering carriage by NAME re-drops exactly that value; filtering by SHAPE carries the scalar and leaves the array its own channel, disjoint by construction. Same reasoning makes the typed-event binding skip CONDITIONAL: <aef:eventDef> emits it only for a typed event node. Rejected a per-node 'carried' side-list recorded at import: it must survive every copy/duplicate/undo path that clones a node, and the first one that clones .aef without it loses the keys again — reintroducing the very shape this removes. Deriving at export means carriage travels with .aef automatically. LEG 1 IS A CONTROL ARM AND IT IS NOT OPTIONAL. reproduce-drop reproduces the PRE-fix metaKeys.filter rule inside the page and requires it to LOSE what the shipped path keeps, so the repair is evidenced rather than asserted — without it, a corpus carrying no unlisted keys reports the same green (T-560). 8/8 legs in headless Chromium. TEETH 5/5 WITH THE SAMPLE/MECHANISM ARM PINNED. Control first. Mutant A is the shipping code. Mutant D is the TEMPTING NARROW FIX — widen metaKeys by the two keys the census found — which is why the fixture carries 'provenance', a key the census does NOT contain. D must leave carried-escaping GREEN where A reddens it, and that single-leg asymmetry is what separates repairing the sample from repairing the mechanism. B flattens an array into an attribute (two carriers for one value, which any 'did the key survive?' test waves through). C double-emits endpoint while the value still round-trips — invisible to a correctness-only test. Each mutant reddens exactly its own legs; more than that is reported as a failure. THE PROBE CAUGHT ME ANCHORING ON A REGENERATED ID: the block window matched id='T1', but export REBUILDS display ids from lane/index/name (T1 comes back as hum_1_carrier), so the window matched nothing and three legs reported a defect that was not there. Re-anchored on aef:uid, the one identifier export is obliged to preserve. Second task running where the probe's own instrument was the bug. T-566's 'They are not lost.' WAS FALSE WHEN I SHIPPED IT and this is what makes it true — it held for every metaKeys key and failed for exactly the keys that disclosure exists to surface. The disclosure filter and the carriage filter now select the same population by the SAME RULE, so what the panel says the document carries is what export writes back. WHY THE FRAMEWORK WAS BLIND: test_editor_bridge_meta_parity.py is NAMED parity and ASSERTS subset — check(editor,bridge) returns editor keys missing from the bridge and nothing else (its own self-test at :94 confirms it). It returned [] for the entire period the bridge emitted 9 keys the editor destroyed. Fifth instance this week of a stated property standing in for a checked one, and the first found inside a GUARD rather than in product code. Filed T-572, not fixed here: the repair is not 'assert equality' (the lists now legitimately differ, carriage being generic where the bridge enumerates) but a round-trip assertion, which is its own design. T-573 filed for the Emits panel field writing a scalar where the structured exporter needs an array — its data loss is closed by this commit, its SHAPE defect is not. Probe wired into the suite in the SAME commit (T-568's lesson). Suite 123 -> 124 passed, 0 failed. Staged by explicit path, not git add -A (T-571's lesson, one commit ago)

