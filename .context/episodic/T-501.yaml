summary: |
  Map ID remediation proposal — D1, D2, D3 + round-trip closure. the inception was carrying TWO recommendations that disagreed, and the one the operator would most likely have approved would have made the defect worse. The task said DEFER; docs/reports/T-501-map-id-remediation-proposal.md said GO. Both written 2026-08-14, neither citing the other, and the Human AC routes to 'fw task review T-501' which renders the TASK field while the report sits open beside it saying the opposite — so the answer depended on which pane was read. Filed as OBS-294 with a detector shape that is two greps and no judgement: for an active task with an unchecked decision AC, compare the verdict token in docs/reports/T-<id>-*.md against the task's. Sibling of OBS-291, which compares DATES; this compares the decision itself. It would have fired here for six days. THE PROPOSED D1 FIX IS A REGRESSION AND ONLY RUNNING IT SHOWED THAT. The proposal derives map identity via deriveSlug(procId). deriveSlug (src:1658) is named like a slugifier and is a SUMMARISER — first word longer than one character, truncated to 16. Measured over the 60-document corpus in examples/aef-processes/rendered + tests/fixtures/{aef-bpmn,third-party,lane-provenance}: 46 carry <aef:workflowMeta>, 14 do not and reach the fallback. TODAY all 14 of 14 derive an id the save validator rejects — the defect is TOTAL on that path, which is stronger than the proposal claimed. UNDER THE PROPOSED FIX those same 14 collapse to FOUR ids (process x8, proc x4, id x1, 009164cd x1) and every one of the four PASSES the validator. bizagi-nested-ns.bpmn becomes the literal string 'id'; the consumer's own reported map, name='Cash to Ecwid stock sync', becomes 'cash'. A loud total save-time failure would have become a silent near-total collision: this week's shape again, the failure rendering as health. Three of the four branches in the proposed || chain are also dead code — deriveSlug is total and can never return falsy, and procId is already ||'imported' at :9947. THE CORRECT TRANSFORM WAS ALREADY IN THE TREE, THREE LINES AWAY: createFromPendingRef at :9162 is exactly the sanitizeWorkflowId() the proposal budgets 30 minutes to author. Applied to the identifier it gives 10 distinct, 0 invalid over the same 14. The only surviving collision is honest — five third-party fixtures literally all declare <bpmn:process id='Process_1'>, Camunda's default, and no transform can separate them. That collision is ALREADY HANDLED at :9214, which appends _v<n> and writes it back. That policy sits DOWNSTREAM of the transform, which is the whole argument in one sentence: a lossy transform hands the disambiguator eight distinct documents already flattened into 'process', and the operator gets process_v2..process_v8 instead of process_0dp8lmr. D2 ALSO HAS THREE SITES, NOT TWO (:2685 renameActiveWorkflow, :5223, :9162); unifying two of three leaves the rename path still able to mint '-cash-sync'. RECOMMENDATION REVISED TO GO ON A NARROWED PACKAGE with D1's fix replaced, and the always-emit-workflowMeta item CARVED OUT as IW-0 — it is the only item that changes bytes the editor already writes correctly, and T-308/T-358 byte-identity gates live exactly there, so bundling it means a gate failure cannot be attributed. The 2026-08-14 DEFER is preserved verbatim rather than overwritten, and the report's GO is left standing under a §0 that says what it got wrong, because the operator was going to be asked to approve that sentence. FIVE VERIFICATION LEGS ON AN INCEPTION, which normally has none: the recommendation is a claim about source the operator has not read and a corpus nobody re-counts, and T-189 spent five weeks one signature from ruling on a delta the world had moved past. Every figure in Evidence is reproduced by leg 4's census in a single line, so the ruling goes red rather than landing quietly if the tree moves under it. 5/5 pass, and leg 2 was caught FAILING FIRST because a \[ in a BRE grep matched nothing while the count it guards is 3 — the leg was written from a pattern I had tested in a different quoting context and it silently counted zero; negative controls added for legs 2 and 4. WHAT WAS NOT MEASURED AND IS NOT CITED: the proposal's '126 of 145' and '145-file sweep' describe the 001-CashWeb tree behind the T-559 boundary and were not read. And my own first census used a regex instead of an XML parser and under-reported 14 invalid as 7 — recorded at §0 C-7 rather than deleted, because a measuring instrument that silently under-reports is the defect this task is about. No fw inception decide invoked; the ruling is the operator's. inception decision GO (via Watchtower). IW-0 disposed as DEFERRED, not answered, and the distinction is the whole reason the GO was narrowed. The disposition gate blocked completion on IW-0 carrying disposition: open, which is not one of answered|deferred|dissolved. The honest value is deferred: IW-0 is the item the GO narrowed OUT — should export always emit <aef:workflowMeta> — and it is carried forward undecided rather than resolved. Marking it answered would convert a carve-out into a ruling nobody made, which is precisely the substitution §0 of the report was written to undo, so the fix is to state the deferral rather than reach for --skip-disposition-gate. An exit condition is recorded so the deferral is not open-ended: measure whether always emitting the element changes the bytes of any of the 24 rendered maps and run T-308/T-358's byte-identity gates against the result. If nothing moves the carve-out's motivating risk is absent; if something moves the failure is attributable to this change alone, which is exactly the attribution bundling would have destroyed. Needs its own build task. AEF'S MEASUREMENT LANDED IN THE DOCUMENT AT LAST, as §0.0, and it is marked ADDED AFTER THE RULING because it was. The commit gate had T-501 at 2/2 exploration commits with no decision, so OBS-299's finding was live: evidence arriving while an inception waits cannot be written into the one artifact the operator reads. Recording the GO opened the gate. Marked as post-ruling rather than folded into §0 because a document that silently reads as though the operator had seen this would be the same class of quiet substitution the whole §0 exists to correct — they did not see it, and it would not have argued for a different decision. WHAT THEY MEASURED AND WHY IT SHARPENS C-4: asked whether their hand-authored documents carry distinct process ids or Camunda Process_1 defaults, AEF answered with something neither side had thought to check — all fifteen of their ids are semantic, distinct, and shaped Process_<name> — and then DECLINED to say what deriveSlug does with them, on the grounds that they lack the source and guessing would be the borrowed number this report struck from its own evidence. Their framing: 1 vs 15 on one unread character. Measured here it is 1. All five named ids yield process, distinct=1. The mechanism is NOT the split — the split class contains no underscore — it is the PRIOR character-class replace mapping every out-of-class character to a space, so underscore becomes whitespace and the split then eats it. Control separating that from the 16-char truncation they also suspected: deriveSlug of Process_zzzz is process, where a whitespace-only split leaves process_zzzz. So 14->4 UNDERSTATES it: the collapse is driven by a shared first token, not by short names, and any corpus prefixing ids by convention degrades toward one bucket — eight of our own fourteen already went to process that way. A consumer WITH a naming convention is more exposed than one without, which is the opposite of the intuition. THEIR CONCLUSION CARRIES A CAVEAT RATHER THAN BEING BANKED AS CONFIRMATION: they also reported 15 of 15 of their documents carry the extension element and zero reach the fallback, then declared the corrected :9162 transform sufficient for us. Those are different code paths — a present workflowMeta id is used directly, so their process ids are consulted only on a branch nothing of theirs reaches. Their exposure is zero today under EITHER transform and becomes non-zero only if an emitter can drop the element. Sound measurement of a currently-unreachable population, recorded that way. Told them so on the rail rather than taking the confirmation, because it is the fourth instance this week of a measurement whose defect was its SCOPE rather than its value and the first found in a peer's work rather than our own. Verification 5/5 unchanged. No task completed here — T-501 is owner: human

