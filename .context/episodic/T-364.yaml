# Summary (auto-generated from git commit messages)
summary: |
  G-023 prevention — the byte-identity gate now states its population and cannot silently range over less than it claims. _t308 exports each map TWICE in the same build; a document not byte-stable with itself is 'unusable' (never identical, never drifted) and FAILS the run, because for a document it cannot compare the gate has no answer and a green with a silent hole is exactly what G-023 records. JSON now names the source population, why it is comparable (it carries aef:uid), and what it does not cover. AC1 site named: generateUid() is Math.random()-based and parseBpmnXml falls back to it at || generateUid('n')/'e'. Teeth (_t364-t308-teeth.py, temp corpus via T308_CORPUS, real corpus untouched): control 24/24 unusable=0 rc=0; teeth 25 maps unusable=1 rc=1 with identical STILL 24 — the unstable doc is held out, not absorbed, and not silently dropped. flag the trap in AC3 before walking into it — making uids deterministic by deriving from the element id answers 'what value' but not the prior question, which is T-358's question in different clothes: should we emit aef:uid AT ALL for a node that arrived without one. Deterministic fabrication is still fabrication, it merely stops churning. Two candidates to MEASURE not choose: (a) derive from element id, (b) omit for nodes that arrived without one, with every downstream consumer of node.uid checked first since T-358's F1 was exactly a downstream guard disagreeing about what absent means. Deferred on purpose at 68% context — seam-visible emission change, not a small bounded unit. consumer enumeration reshapes candidate (b) before any probe — uid is the node's identity, not a decoration: imported nodes are {uid, id: uid}, so data-id is the uid, findNode/_displayIdCache key on it, and computeDisplayId SORTS by it. (b) therefore cannot mean 'no uid', only 'do not persist it' — the editor still mints one on open, so (b) does NOT fix identity churn, it only keeps our invented metadata out of the bytes. (a) fixes both halves; the options are not symmetric and I would have measured them as though they were. Latent hazard named: uid is the displayId tie-breaker and displayIds ARE emitted, so random uids could permute emitted ids for nodes tied on x in a lane — 10/10 identical with only aef:uid normalised is evidence no tie occurred in those fixtures, not that ties cannot occur. bound the defect — the determinism probe now classifies every differing line as aef:uid or other, because 'all differing lines are uid lines' is exactly the claim that confines this to uid values. Result: 5/5, 5/5, 7/7, 81/81 uid, ZERO non-uid drift. So the uid-only normaliser in _t358-byteid-thirdparty.mjs is justified rather than assumed and the 10/10 I put on RAIL-430 rests on a measured property. The probe prints the wider warning instead if a non-uid line ever moves, naming the normaliser insufficient and dependent claims as needing re-run. Residual stated not dropped: a property of these six documents, not a proof a displayId tie cannot permute emitted ids elsewhere. the residual was load-bearing and it inverts the (a)/(b) ranking. computeDisplayId sorts by (x, uid) and displayIdOf IS the emitted BPMN id, so a same-lane x tie between uid-less nodes permutes flowNodeRef/id=/sourceRef/targetRef/attachedToRef — the identity graph, not our metadata. Census: ties are ordinary (19 of 24 corpus maps, 306/306 nodes positioned), harmless only because aef:uid is in those bytes. Today's third-party fixtures cannot tie AT ALL — no aef:position, so the fallback layout gives strictly increasing x per lane — so the earlier '0 non-uid drift over 10 fixtures' was a capability zero, correct and unable to come out otherwise. Mechanism demonstrated end-to-end with discriminating controls: strip aef:uid from shipped maps and 4 tied maps PERMUTE while 2 tie-free maps hold STILL under the identical strip (first version had no genuine tie-free row — context-memory holds a tie — so it confirmed 4x and separated nothing until a census chose the controls). Therefore (b) mint-but-do-not-persist is not the conservative option but the destructive one: it creates identity churn in the 19/24 maps that are stable today, so (a) derive-from-element-id is the only candidate that does not regress the corpus. And T-357 sequencing: boundary-events (2 groups) and kitchen-sink (11 groups) already hold uid-less collision groups in their DI, so adopting DI as geometry supplies the missing ingredient and T-364's repair is a PREREQUISITE of T-357. Probe marked do-not-gate: it exits 0 when the defect is present and would go red when the fix lands. answer AEF's RAIL-432 question by round-trip — ALL 12 of their aef:* kinds survive an open->save; their worst case does not hold. Their worry was that if parseBpmnXml names only uid, a round-trip strips the whole governance overlay (state, lane authority, event typing, anchors) while node/flow/lane counts stay identical. Measured with a fixture carrying every kind in this build's own emitted shapes: uid/position/meta/anchors/laneMeta/workflowMeta/eventDef/link/routingHint/loopDetour/constituents/constituent all PRESERVED with attribute values intact, and the unknown-kind negative control DROPPED so the PRESERVEDs mean naming rather than blind passthrough. Two of my own errors caught before sending: (1) the grep form of this answer said 10 of 12 because constituents/constituent go through structItemList and never appear in a byAef(el,<literal>) call site — wrong by exactly the two kinds their question was sharpest about; (2) the first fixture put aef:link beside aef:eventDef on one node (mutually-exclusive typing extensions adoptImportedXml disambiguates) AND gave it a bare name= which linkAttrs never emits without workflowRef — that DROPPED was my fixture, and reporting it would have spent their attention on my bug. Also adopted their census counter: _t364-x-tie-census now computes the .bpmn population a second independent way and prints the unexamined space (34 examined of 141 in tree; 18 peer-authored under tests/fixtures/aef-bpmn never measured; .editor-versions is the dot-directory shape that bit them). record the RAIL-432 answer and the population debt on the task — all 12 aef:* kinds PRESERVED with a DROPPED negative control, both fixture defects named; census now prints 34-examined-of-141 with tests/fixtures/aef-bpmn (18 peer-authored maps) flagged as never measured for ties or uid coverage, recorded as a debt rather than closed. close the population debt the census recorded against itself — population 4 (18 peer-authored maps under tests/fixtures/aef-bpmn) measured, 149/149 uid-covered with 7 of 18 carrying same-lane x ties that are harmless for exactly the corpus reason. Corroborates AEF's RAIL-432 claim that their live corpus is 424/424 covered; our copies agree. Census now reports uid coverage on every population, because a tie count alone cannot tell a safe population from an exposed one — only tie AND uid-less together permute emitted ids, so reporting one ingredient invites reading a scary tie count as hazard or a clean one as safety. the third-party byte-identity tool now STATES and CHECKS the precondition its soundness rests on, with teeth. It normalises aef:uid alone, which is sound only while a uid cannot reach any other emitted byte — and it can, via the computeDisplayId tie-break into emitted element ids. The tool now measures same-lane x ties on state.nodes per fixture and refuses the run (rc=1, document named) when a tie coincides with a uid-less source; INDETERMINATE rather than a guess when uid coverage is partial. Current run: 10 identical, precondition HOLDS, and it says WHY it holds — none of these fixtures carries aef:position so the importer lays them out strictly increasing and a tie is unreachable, which T-357 would remove. Teeth (_t364-byteid-precondition-teeth.py, T358_FIXDIR override so the real set is untouched): control rc=0 HOLDS, teeth rc=1 VIOLATED on a crafted doc with two same-x uid-less nodes — the hazard bucket is proven fillable and proven NOT to fire on the real set. Over-strictness after repair (a) named in-place: derived uids would be stable, this predicate would refuse a sound run, and the correct edit then is to narrow it to 'nondeterministically minted', not to delete it — a guard that cries wolf after a repair looks identical to one that was always wrong, and removal is the cheap response to both. wire the three new instruments into P-011 so they gate rather than rot — byteid precondition HOLDS, its teeth, and the aef:* seam census (the RAIL-434 answer). _t364-tie-permutes-ids.mjs deliberately NOT wired: it exits 0 when the defect is present and would go red when the fix lands, which is a gate someone would 'repair' by breaking it. RETRACT the corroboration claim from RAIL-436 — the measurement was right and the noun was wrong. AEF reported tests/fixtures/aef-bpmn holds 5 files their side vs 18 ours, same path same name, with no deletions in their history. Checked the add-commit for all 18: every one arrived via an 832 task commit (T-183/192/204/208/214/215/219/235/308/310/311/312/313), three labelled pair-draft, the rest ours outright; session-lifecycle-d3 from their five is absent here. So the directory does not mean 'AEF's BPMN', it means 'BPMN fixtures about the AEF seam authored here' — the name asserts provenance it never had and I read it as provenance and told the peer '18 of your maps'. 149/149 stands as a fact about our own fixtures but is NOT independent confirmation of their 424/424, which ranges over 32 maps under .context/designer/projects. Two individually-correct numbers over populations neither side had checked were the same, one step from becoming a confirmation worth nothing that would have raised both sides' confidence. Also: T-364 P-011 block runs 7/7 PASS (verified as a block; an earlier ad-hoc extractor over-ran past ## Verification into template comments and reported 45 phantom failures — reimplementing the gate instead of using it). timestamp touch from the handover run. OPERATOR RULING — go with (a), derive aef:uid from the element id. Rejected (b) mint-but-do-not-persist as destructive rather than conservative: it produces exactly the documents that permute, and 19 of 24 corpus maps are stable only because their uids are in the bytes. Recorded with the three traps for the implementer: (1) the byteid precondition check becomes over-strict under (a) and must be NARROWED to 'nondeterministically minted', never deleted; (2) _t364-tie-permutes-ids is an experiment that goes red when the fix works and is deliberately not gating; (3) deterministic fabrication is still fabrication — (a) does not settle whether we write aef:uid into third-party bytes at all, and must not silently answer T-358's question. Not implemented this session: at 278K of a 300K ceiling with the source-edit gate at 285K, a half-applied change to the designer is the worst outcome. implement repair (a) — aef:uid derives from the BPMN element id, so a uid-less document no longer permutes its own identity graph. the mutation teeth caught the guard, not the code — verdict ordering and sampling power

