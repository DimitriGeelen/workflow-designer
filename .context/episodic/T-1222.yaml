  - decision: '2026-10-20 — reviewer amber (judge-t-1222-r?), shape amended'
    chose: 'restore the host — a third-party `boundaryEvent` imports as the designer''s boundary event with its `attachedToRef` (T-204 slice 2 already models boundary events natively), and keeps its definition. **Rejected:** carrying the whole element through the foreignTag passthrough: it would keep the bytes but leave the event uneditable and detached on the canvas. - **Typing is for catch hosts only (T-237):** the designer''s typed events export as `intermediateCatchEvent` (src ~12017-12019), so typing a third-party THROW or START event would flip it to a catch. Part 2 applies only to `intermediateCatchEvent` and `boundaryEvent` hosts (`_catchHost`, src ~13467); start events (8 timer/message/error in kitchen-sink) and throws keep their tag and definition untyped. (Second amber, 2026-10-20.) - **`aef:eventDef` on a typed third-party event (third amber, 2026-10-20):** aefExtensionXml always emits `<aef:eventDef>` for an EVENT_KIND node (src ~12157-12164). **Rule:** for a node that carries a native event definition, `aef:eventDef` is omitted while its binding (timerSpec / busTopic / errorStatus) is empty, so the native definition carries the type, and written once a binding is set, so a user''s binding edit is never dropped. An unedited open-and-save of a third-party map therefore adds no `aef:eventDef`; the guard checks that. - **An untyped boundary event** (a "plain catch" on a boundary host) exports as `bpmn:boundaryEvent` with its `attachedToRef` and `cancelActivity`: the boundary export condition (src ~12550) widens beyond EVENT_KIND to any node that came in as a boundary event. - **Open question, ruled by the reviewer:** an event whose definition the designer has no type for (signal, escalation, conditional, compensate, cancel, terminate; and any throw) renders as a plain catch or throw event, keeping its original tag and its verbatim definition, with no link semantics. Not a new generic type.'
