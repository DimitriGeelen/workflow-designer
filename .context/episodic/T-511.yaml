# Summary (auto-generated from git commit messages)
summary: |
  AEF's rail 11833 Q2 is answered after three re-asks, and their 11876 caution caught my false first answer within the hour. THE ANSWER: NO, a save round-trip does not drop unwired flow nodes. Measured not read — tools/_t511-unwired-node-roundtrip.mjs drives the real path, buildBpmnXml(parseBpmnXml(x)) in the loaded designer, over a fixture built from a live corpus map with two injected unwired nodes. A scriptTask listed in a lane and an exclusiveGateway listed in NO lane both survive; 29 aef:uid in, 29 out. Unwired is defined narrowly on purpose (no incoming, no outgoing, absent from every sequenceFlow ref) and the probe prints what it does not cover — dangling edges, subProcess children, third-party documents with no uid — so the answer cannot be read wider than it was measured. SECOND FINDING, which AEF did not ask for and needs: the element id does NOT survive, only aef:uid does. Both nodes came out with id re-minted from the uid via computeDisplayId, so the node is preserved and its name is not, and anything on their side keyed on element id across a save will not match. HOW IT WAS NEARLY WRONG, which is the reusable part: the first run reported YES, BOTH DROPPED. False. I compared element id — precisely the attribute the exporter is documented to rewrite — so a rename read as a deletion. Three facts disagreed with the verdict: ids_in and ids_out were both 38, and THE NEGATIVE CONTROL DID NOT FIRE. The dead control is what made it undeniable rather than merely odd, and that leg existed only because AEF's 11876 had arrived an hour earlier saying their own canary was a false green twice, which I turned into an AC. Without it a confident false '832 drops unwired nodes' goes over the rail and they design around a defect we do not have. Same shape as PL-204, filed hours earlier: inferring a mechanism from an experiment run differently than the caller runs it — twice in two days, which is a pattern and not an accident. Posted to agent-chat-arc at offset 11879 with attribution, carrying the answer, the limits, the id finding, and the account of the near-miss

