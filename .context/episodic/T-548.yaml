# Summary (auto-generated from git commit messages)
summary: |
  'it broke' and 'I never found out' are different claims, and the sweep had been making the first one whenever it meant the second. _t509 counted every non-zero exit as a regression and announced each as 'an instrument that passed on 2026-08-15 no longer does ... a real regression in the thing it guards'. 124 is GNU timeout's code: T-543 measured _t525 at 86.04s against a 90s cap, passing 7/7 standalone, so it crosses whenever the machine is busy and the reader was sent hunting a fabric-coverage bug that does not exist. rc=2 is an ABSTENTION and is the sharper half: the sweep's OWN exclusion list already argues the case — '_t364 exits 2 BY DESIGN, refusing to certify ... converting that to a suite failure would punish the honesty' — a correct argument about a PROPERTY recorded as an exemption for an INSTANCE, so every other abstaining probe kept being called a regression while the reasoning that would have prevented it sat in the same file. T-509's shape inside T-509's own tool, and the fifth encounter with that shape this week; fixed in the classifier rather than by adding two more names, because adding names would have been faster and would have left the sixth probe wrong. Now: 0 passed, 1 regressed, 2 refusal, 3 INCOMPLETE (did-not-finish or abstained). Incomplete is still non-zero — an instrument nobody heard from is not a green — and the repair being made here is the MISLABEL, not the redness. HEADROOM WARNING added and it fired on its first real run: _t525 at 81s of 90s, named on a GREEN sweep, which is the leading indicator that did not exist for the weeks it sat at ~95% before anyone heard anything. THREE THINGS WENT WRONG IN MY OWN WORK AND ALL THREE WERE CAUGHT BY INSTRUMENTS RATHER THAN BY REVIEW. Leg 5 was red on its first run against my fix: a regression and a timeout in the same run reported only the regression, because I exited inside the regression branch before the uncovered section printed — the louder finding swallowing the instrument nobody heard from, a quieter version of the defect this task exists to fix. _t527 flagged my bridge-suite edit for wrapping the headroom surfacing in 'if grep -q ... $TMP/leg-*', the shape it guards because that is how a leg discards the evidence for its own verdict; my use surfaced output rather than swallowing it so the finding was a false positive on intent and the guard was still right about the pattern, restructured to a bare sed that needs no conditional, and weakening the guard to fit my code was available and would have been a bad trade. And the headroom warning was invisible exactly where it mattered — the leg redirects the sweep's stdout to a file shown only on failure, so on the green runs where a leading indicator is the whole point nobody saw it; found by reading the suite's own output, not by design. THE ACCEPTANCE CRITERION WAS AMENDED MID-TASK AND THAT IS THE RESULT: it read 'full suite green', and on the first suite run after wiring _t525 genuinely crossed the cap and the sweep correctly reported SWEEP INCOMPLETE / DID NOT FINISH / 'nothing is claimed about what it guards — it was killed, not failed'. The repair working on the real failure it was built for, on first exposure. Leaving the AC would have left exactly two ways to satisfy it, raise the cap or retry the leg, which are the two repairs T-543 ruled out; an AC that can only be met by doing the wrong thing is the AC that is wrong. Teeth drive the REAL sweep over synthetic probes with known exit codes in a mktemp tree and pin THE WORDS as well as the codes, because the defect was never in the arithmetic — the sweep counted correctly and described the count wrongly — so a probe checking only rc would have stayed green throughout. Mutation-verified against four mutants (124-as-regression, 2-as-regression, incomplete-softened-to-pass, headroom-removed). NOT DONE, deliberately, carrying T-543's AC4: no timeout raised, no retry added, no leg quarantined, and the by-name exclusions NOT narrowed even though the classifier now makes two of them redundant — that is a population change and a register-accounting decision for the operator. _t525's 86s cost is filed as T-549

