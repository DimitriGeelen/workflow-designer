# Summary (auto-generated from git commit messages)
summary: |
  the BVP cost axis was a blind read wearing the cheapest value on the scale, and an HV/LC filter promotes on exactly that. Operator asked to focus on HV/HC and HV/LC; both quadrants printed 'No tasks match' because cost_estimate: is absent everywhere, so compute_cost returns source:absent and every quadrant renders '-'. The cause was not a missing capability. fw bvp estimate-cost {one,all,sweep,determinism} was fully built under T-1935 and correctly dispatched at lib/bvp.sh:1553 — it was simply never listed in fw bvp --help, so the only route to the cost half of the model was to already know it existed. T-540 concluded 'driver --init bootstraps the value half and silently not the cost half' and filed the cost half as missing; it was there. A capability nobody can find is indistinguishable from one nobody built, and the register recorded the wrong one. Measured before writing anything, because a cost whose dominant term is constant cannot sort: blast_radius carries weight 0.6 in F8 and took exactly TWO values across 59 tasks, 0 or 3, because it derived from components: alone and components: is empty on 59 of 59. The whole axis was 'inception ? 3.6 : 1.4' with 29 of 59 tied at the modal value. The 0 is the part that matters — it does not mean 'touches nothing', it means 'the fabric has never registered this task', and it renders as the CHEAPEST value on the scale. This failure does not render as health, it renders as attractiveness. AEF had already named this exact shape one population earlier: T-2189's own docstring says the count 'always returns 0, making inceptions look artificially cheap', and repaired inceptions only via target_blast_radius. The same sentence was true of 100% of the non-inception corpus and nothing re-asked — T-509's shape, an exemption granted to the case that prompted it and never generalised to the class. Fixed with a third evidence source (source paths named in the body AND PRESENT IN THE TREE, the existence check being what makes a rename stop counting) and, more importantly, by returning None when nothing is knowable: None propagates to an OMITTED blast_radius key, which compute_cost already reads as source:absent, so the task drops OUT of the ranking rather than entering it cheapest. No consumer change was needed — the honest state was already representable and unused. Declining to rank is honest; ranking cheapest is not. blast_radius 2 distinct values -> 5 plus absent on 14; F8 10 distinct -> 13; largest tie 29 -> 15; hv-lc 17 tasks, hv-hc 13. The new signal immediately scored the TASK TEMPLATE: the first estimate-cost all run scored T-542 ITSELF at blast_radius=5 with two of its four cited paths coming from templates/default.md's errexit warning, and 7 of 59 tasks had no signal except the template. That is T-541's D3 finding recurring in a second handler, and note those are SHELL-comment lines not HTML comments, so T-541's comment-stripping remedy would not have caught them — PL-239 stated properly is subtract what every member of the corpus shares. Third finding, reported and deliberately NOT patched: PROJECT_ROOT's fallback parents[3] is the repo root in AEF's layout and .agentic-framework in ours, landing on a directory that EXISTS with a plausible policy/ and .tasks/ so nothing errors and RUBRIC_PATH silently reads the framework's copy; found by a probe leg going red for the wrong reason, 5 real fixture paths scoring as 3 because policy/value-drivers.yaml exists under BOTH roots. All three declared as generic upstream debt in .vendor-divergence.yaml, which caught my undeclared lib/bvp.sh edit before I declared it. Probe is 8 legs and mutation-verified rather than asserted, PL-206 after T-541's probe passed against a broken mutant: removing the existence check, returning 0 for a blind read, disabling the fallback and removing the template subtraction are each killed by the leg that owns them. Honest about what did not improve — 15 tasks still share the modal composite and the top of the value ranking is still T-540's placeholder tie, 12 tasks at BVP 108 with 11 of them inceptions carrying voi_score 0.5. The cost axis sorts now; the value axis still does not, and no amount of cost work fixes that. Suite 102 -> 103 legs, 0 failed. cost_estimate: untouched — that field is the operator's. operator approved all three product drivers; register recalculated and the value axis moved for the first time. V_WORKFLOW_ROUTING, V_AEF_INTEGRATION and V_SDLC_ENABLEMENT are in at weight 9 each, dropping V_PROMPT_QUALITY, V_CONTEXT_FABRIC and F-AUTONOMY under M1 add-one-drop-one — the three measured weakest of the five free drivers (15/60, 16/60 and 23/60 non-zero). Adds were run by the operator, not by me: fw bvp driver --add is ACD-gated and the gate's own text describes --i-am-human as 'human typing into an agent session', so passing it would have been asserting the operator's sovereignty marker to defeat a control built to stop exactly that. What I did instead was compute the outcome first so the approval was informed rather than blind, and the simulation held — predicted T-344 to rank 1, T-358 2, T-189 3, T-423 5, and that is what landed. TWO ID HAZARDS CHECKED EMPIRICALLY RATHER THAN ASSUMED, both of which would have scored silently. First, the register assigns opaque ids: V_WORKFLOW_ROUTING came back as F4 while my handler is keyed on the canonical name, and a miss there falls through to score_free_driver, which substring-matches the driver's own id and returns 0 for everything. AEF's T-2343 alias resolver maps {id: name} for free drivers and carries it; confirmed by evidence string, T-423 returning 'prose:routing-structural' rather than the fallback's "no 'F4' mention". Second and sharper, the register RECYCLED ids: F3 had meant V_PROMPT_QUALITY minutes earlier and now means V_AEF_INTEGRATION, and F1 had meant V_CONTEXT_FABRIC and now means V_SDLC_ENABLEMENT. An id silently carrying its predecessor's meaning is T-538's shape and would have scored every task against the wrong axis while looking healthy. It does not happen here because the dispatch table keys on name, not id — verified by F3 returning 'seam-fixture-or-pin' (the AEF handler) and not score_v_prompt_quality's evidence. Recalculated: 543 tasks rescored, 0 errored, 33.7s. hv-lc 17, hv-hc 13. The top of hv-hc is now real build work rather than placeholder inceptions — T-344, T-358, T-189, T-423, T-101 — where before the driver change ranks 1-12 were the T-540 voi:0.50 tie. The mechanism is worth recording: inceptions route through _score_inception_voi and return the SAME score on every driver including the three new ones, so graded build tasks overtake flat inceptions as soon as any driver actually discriminates. The operator's own axes did the work the framework drivers could not. Combined product weight is 27 against the Constitutional chassis's 24, which was stated before approval rather than discovered after. Proposals P-bced1426/P-0b1db872/P-86588453 remain 'pending' — the CLI --add path does not consume the proposal queue, only the Watchtower route does, so three records now duplicate drivers that exist

