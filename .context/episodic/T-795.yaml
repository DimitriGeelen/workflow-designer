# Summary (auto-generated from git commit messages)
summary: |
  yaml_to_bpmn lands, and it validates its own output so T-794's silent failure cannot travel through this surface. THE DESIGN DECISION, and it comes straight from the measurement: T-794 showed the converter accepting a document whose every node was unreachable and saying nothing, because the author wrote flows: where the schema says edges:. Wrapping convert ALONE would have shipped that defect to every caller. So this tool converts and then validates its own output in the same call, returning verdict and findings alongside the bpmn bytes, plus a hint naming the flows:/edges: cause when nodes come back unreachable. The bytes are returned even on a bad verdict - the caller needs them to see what was built. PROVEN LOAD-BEARING, NOT DECORATIVE: replacing the self-validation with a stubbed exit_code 0 makes the broken document report valid and drops the probe to 31 passed, 4 failed. Restored, 38/38. That negative control is the difference between claiming the validation matters and showing it. BOTH DIRECTIONS IN ONE RUN: the probe converts the SAME document twice, once with edges: and once with flows:. Good gives valid with no hint; bad gives a non-valid verdict, W-XML-UNREACHABLE, a hint naming the cause, and the bytes anyway. A further leg asserts the two verdicts DIFFER so the tool cannot pass by being a constant. THE CHEAPEST FIX FOR THE MEASURED ERROR is the tool description itself - it states that the edge list key is edges: and NOT flows:, with the full top-level key list, and a probe leg pins that string so a later edit cannot quietly drop it. PYYAML HANDLED HONESTLY: the server stays stdlib-only but the converter it shells out to needs PyYAML. PyYAML is installed here, so the absence branch is EXECUTED rather than read - the probe imports the module and monkeypatches subprocess.run to simulate ModuleNotFoundError, then asserts the message names pip install pyyaml, says validate_workflow still works, and does NOT misreport the situation as the document being invalid. FENCE NOT WIDENED: tools/list is asserted as an EXACT two-element list rather than a subset check, so an accidentally added third tool fails there instead of passing unnoticed; traversal is refused for the new tool too. T-792's exact single-tool assertion correctly went red when the second tool landed and was updated rather than loosened. Co-Authored-By: Claude Opus 5 (1M context) <noreply@anthropic.com>

