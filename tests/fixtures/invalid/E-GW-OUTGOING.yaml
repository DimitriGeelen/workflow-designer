# exclusiveGateway n_g has only one outgoing edge; section 7.3 requires >= 2.
workflowMeta: {id: t, version: 1, schemaVersion: 2}
pool: {id: Pool_t, name: t}
lanes:
  - {id: agent, name: Agent, abbr: agt, authority: initiative, height: 320}
nodes:
  - {uid: n_a, type: startEvent, name: Start, lane: agent, x: 100, y: 100}
  - {uid: n_g, type: exclusiveGateway, name: Gate, lane: agent, x: 200, y: 100}
  - {uid: n_b, type: endEvent, name: End, lane: agent, x: 300, y: 100}
edges:
  - {uid: e_a, source: n_a, target: n_g}
  - {uid: e_b, source: n_g, target: n_b}
