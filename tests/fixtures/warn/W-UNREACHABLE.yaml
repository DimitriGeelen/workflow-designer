# n_orphan (a scriptTask) has no incoming edge and is not a start/linkEventCatch,
# so it is not reachable from any startEvent -> W-UNREACHABLE (WARN). It still
# flows into the end, so it is NOT a dead-end (W-DEADEND does not fire).
workflowMeta: {id: t, version: 1, schemaVersion: 2}
pool: {id: Pool_t, name: t}
lanes:
  - {id: agent, name: Agent, abbr: agt, authority: initiative, height: 320}
nodes:
  - {uid: n_s, type: startEvent, name: Start, lane: agent, x: 100, y: 100}
  - {uid: n_orphan, type: scriptTask, name: Orphan, lane: agent, x: 200, y: 200}
  - {uid: n_e, type: endEvent, name: End, lane: agent, x: 300, y: 100}
edges:
  - {uid: e_0, source: n_s, target: n_e}
  - {uid: e_1, source: n_orphan, target: n_e}
