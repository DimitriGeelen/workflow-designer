# T-993 (K1): a step and an end, no startEvent and no linkEventCatch. Reachability from a
# start cannot be assessed, so W-NO-START-EVENT fires once (it used to be silent). The end
# is reachable from n_x, so W-NO-END-EVENT does not fire.
workflowMeta: {id: t, version: 1, schemaVersion: 2}
pool: {id: Pool_t, name: t}
lanes:
  - {id: agent, name: Agent, abbr: agt, authority: initiative, height: 320}
nodes:
  - {uid: n_x, type: scriptTask, name: Step, lane: agent, x: 100, y: 100}
  - {uid: n_e, type: endEvent, name: End, lane: agent, x: 300, y: 100}
edges:
  - {uid: e_0, source: n_x, target: n_e}
