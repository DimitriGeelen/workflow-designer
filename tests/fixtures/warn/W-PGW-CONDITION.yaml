# parallelGateway fork n_f has a condition on one outgoing edge. A parallel fork
# takes ALL branches unconditionally, so the condition is silently ignored ->
# W-PGW-CONDITION (WARN). Balanced fork+join so W-PGW-UNBALANCED does not fire.
workflowMeta: {id: t, version: 1, schemaVersion: 2}
pool: {id: Pool_t, name: t}
lanes:
  - {id: agent, name: Agent, abbr: agt, authority: initiative, height: 320}
nodes:
  - {uid: n_s, type: startEvent, name: Start, lane: agent, x: 100, y: 100}
  - {uid: n_f, type: parallelGateway, name: Fork, lane: agent, x: 200, y: 100}
  - {uid: n_a, type: scriptTask, name: A, lane: agent, x: 300, y: 60}
  - {uid: n_b, type: scriptTask, name: B, lane: agent, x: 300, y: 160}
  - {uid: n_j, type: parallelGateway, name: Join, lane: agent, x: 400, y: 100}
  - {uid: n_e, type: endEvent, name: End, lane: agent, x: 500, y: 100}
edges:
  - {uid: e_0, source: n_s, target: n_f}
  - {uid: e_1, source: n_f, target: n_a, condition: "${x == true}"}
  - {uid: e_2, source: n_f, target: n_b}
  - {uid: e_3, source: n_a, target: n_j}
  - {uid: e_4, source: n_b, target: n_j}
  - {uid: e_5, source: n_j, target: n_e}
